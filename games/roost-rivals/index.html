/* Layout: one portrait stage. The canvas is the whole city; HUD, home and result float over it. */
:root{
 --ground:#211B3F; --block:#2C2552; --panel:#352C63; --panel2:#43387A; --ink:#FFF4E2; --muted:#BFB2DC; --line:rgba(255,244,226,.14);
 --lamp:#FFB84A; --lamp-ink:#2A1700; --you:#FFC53D; --teal:#43D9C8; --rose:#FF6F91; --peri:#8EA7FF; --neutral:#9A92B6; --bad:#FF7A6B; --good:#7BE0A0;
 --display:'Bowlby One','Arial Black',Impact,sans-serif; --body:'Nunito','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--ground)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}

/* match HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:10px 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#share{display:flex;height:22px;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#share i{display:flex;align-items:center;justify-content:center;min-width:0;font-style:normal;font-size:12px;font-weight:800;color:#1B1433;transition:flex-grow .5s ease;overflow:hidden;white-space:nowrap}
.hrow{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;background:rgba(27,20,51,.72);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;color:var(--lamp)}
#windChip span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#windArrow{transition:transform .6s ease}
#night.late{background:#7A2B3D}
.btn{pointer-events:auto;width:44px;height:44px;justify-content:center;padding:0;border-radius:22px}
.btn svg{width:20px;height:20px;color:var(--ink)}
#banner{position:absolute;left:16px;right:16px;top:27%;z-index:6;text-align:center;pointer-events:none;display:flex;flex-direction:column;gap:2px;animation:banIn .28s cubic-bezier(.2,1.5,.4,1) both}
#banner b{font-family:var(--display);font-weight:400;font-size:clamp(30px,10vw,46px);line-height:1;color:var(--lamp);text-shadow:0 3px 0 #1B1433,0 0 24px rgba(0,0,0,.5);letter-spacing:.02em}
#banner span{font-size:15px;font-weight:800;text-shadow:0 2px 0 #1B1433,0 0 10px #1B1433}
@keyframes banIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
#bubble{position:absolute;z-index:6;max-width:210px;padding:7px 11px;border-radius:14px 14px 14px 4px;background:var(--ink);color:#1B1433;font-size:14px;font-weight:800;line-height:1.2;pointer-events:none;transform:translate(8px,-100%);animation:banIn .2s ease-out both;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#bubble small{display:block;color:#1B1433;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 12px 10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#coach{align-self:center;max-width:340px;text-align:center;padding:9px 14px;border-radius:14px;background:var(--ink);color:#1B1433;font-weight:800;font-size:15px;line-height:1.25;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ratios{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:5px;border-radius:26px;background:rgba(27,20,51,.8)}
.ratios button{flex:1;height:42px;border-radius:21px;font-weight:800;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.ratios button.on{background:var(--you);color:var(--lamp-ink)}
.ratios .call{--fill:0%;flex:1.7;margin-left:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05;color:var(--muted);background:linear-gradient(90deg,var(--panel2) var(--fill),rgba(0,0,0,.4) var(--fill));min-width:0}
.ratios .call b{font-size:13px;font-weight:800;white-space:nowrap}

<script>
/* ===== ROOST RIVALS CORE: pure simulation + rival AI. No DOM in this file, so Node can run it (balance bot, replay referee). =====
   Built so online duels can be added without touching the rules:
   1. Fixed ticks. The world only moves in whole ticks of 1/30 s (step). Nothing depends on frame rate or the clock.
   2. Commands in, nothing else. Players change the world only through cmd() / cmdAt(): send, call, quit. The rival AI is
      just another source of orders. A human on another phone is one more.
   3. Deterministic. One seeded random stream kept in the state (S.rs); no Math.random, no dates, and no sin/cos/hypot/pow
      (those can differ between phones). Same setup + same commands = same match on every device. hash() proves it.
   4. Plain data. The whole match state is JSON: snapshot()/restore() give resume now, reconnect later.
   5. Replays. setup + command log replays any match exactly (replay). A server can referee a ranked duel that way. */
const RR = (function () {
  'use strict';
  const W = 1000, H = 1400, TICK_HZ = 30, DT = 1 / TICK_HZ, CORE_VERSION = 2;
  const RATIOS = [0.25, 0.5, 0.75, 1];

  // ---------- seeded random (state lives in the object passed in, so it is saved with the match) ----------
  function rnd(o) { const a = (o.rs = (o.rs + 0x6D2B79F5) | 0); let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function rng(seed) { const o = { rs: (seed | 0) || 1 }; return () => rnd(o); }
  const dist = (ax, ay, bx, by) => Math.sqrt((ax - bx) * (ax - bx) + (ay - by) * (ay - by));

  // ---------- birds: one modest edge and one call each. Tuned with the balance bot so none wins or loses by default ----------
  const BIRDS = {
    pigeon:   { name: 'Pigeon',   trait: 'Fast breeder', desc: 'Roosts hatch new birds 8% faster.',               hatch: 1.08, speed: 1,    atk: 1,    def: 1,    capBonus: 0, unlock: 0, call: { name: 'Brood',       desc: 'All your roosts hatch 30% faster for 6 seconds.', dur: 6 } },
    gull:     { name: 'Gull',     trait: 'Fast flyer',   desc: 'Flocks fly 40% faster. First to every scrap.',     hatch: 1,    speed: 1.4,  atk: 1,    def: 1,    capBonus: 0, unlock: 1, call: { name: 'Tailwind',    desc: 'Your flocks in the air fly two and a half times as fast for 6 seconds.', dur: 6 } },
    owl:      { name: 'Owl',      trait: 'Stubborn',     desc: 'Birds defending a roost fight 12% harder.',        hatch: 1,    speed: 1,    atk: 1,    def: 1.12, capBonus: 0, unlock: 2, call: { name: 'Hunker',      desc: 'Your roosts defend 30% harder for 6 seconds.', dur: 6 } },
    crow:     { name: 'Crow',     trait: 'Hard hitter',  desc: 'Birds storming a roost hit 10% harder.',           hatch: 1,    speed: 1,    atk: 1.1,  def: 1,    capBonus: 0, unlock: 3, call: { name: 'Mob',         desc: 'Your birds storming a roost hit 50% harder for 6 seconds.', dur: 6 } },
    starling: { name: 'Starling', trait: 'Swarm',        desc: 'Every roost you capture gains a bird at once.',    hatch: 1,    speed: 1,    atk: 1,    def: 1,    capBonus: 1, unlock: 4, call: { name: 'Murmuration', desc: 'Every roost you hold gains 2 birds at once.', dur: 0 } }
  };
  const BIRD_IDS = Object.keys(BIRDS);
  const CALL = { first: 14, cooldown: 32, brood: 1.3, tailwind: 2.5, hunker: 1.3, mob: 1.5, murmur: 2 };

  // ---------- roost kinds ----------
  const KIND = {
    roof:   { name: 'Rooftop',    prod: 1,    def: 1 },
    feeder: { name: 'Feeder',     prod: 1.5,  def: 1 },
    tower:  { name: 'Bell tower', prod: 0.85, def: 1.4 }
  };
  const SIZE = [null, { cap: 30, prod: 0.75, r: 44 }, { cap: 45, prod: 1, r: 54 }, { cap: 60, prod: 1.25, r: 64 }];
  const BASE_PROD = 0.8, BASE_SPEED = 128, EMIT_RATE = 14, CLASH_R = 17, NIGHTFALL = 270;

  // ---------- rival personalities ----------
  const PERS = {
    rusher:      { label: 'Rusher',      expand: 0.8, aggro: 1.6, caution: 0.3, antiLeader: 0.3, grudge: 0.6, tempo: 0.85 },
    turtle:      { label: 'Turtle',      expand: 1.1, aggro: 0.8, caution: 1.2, antiLeader: 0.5, grudge: 0.8, tempo: 1.1 },
    opportunist: { label: 'Opportunist', expand: 1.0, aggro: 1.25, caution: 0.7, antiLeader: 0.2, grudge: 0.3, tempo: 0.95 },
    schemer:     { label: 'Schemer',     expand: 0.9, aggro: 1.1, caution: 0.9, antiLeader: 1.5, grudge: 1.5, tempo: 1.0 },
    expander:    { label: 'Expander',    expand: 1.5, aggro: 0.8, caution: 0.8, antiLeader: 0.6, grudge: 0.5, tempo: 0.9 }
  };

  // ---------- map generation: symmetric, so nobody starts ahead ----------
  function genMap(seed, nPlayers) {
    const R = rng(seed), four = nPlayers > 2, pts = [];
    const mx = 95, my = 110, minD = 185, axisGap = 100;
    const want = four ? 3 + (R() < 0.5 ? 1 : 0) : 5 + Math.floor(R() * 3);
    const mirrors = (x, y) => four ? [[x, y], [W - x, y], [x, H - y], [W - x, H - y]] : [[x, y], [W - x, H - y]];
    let guard = 0;
    while (pts.length < want && guard++ < 4000) {
      const x = mx + R() * ((four ? W / 2 : W) - mx - (four ? axisGap : mx)), y = my + R() * (H / 2 - my - axisGap);
      if (!four && Math.abs(x - W / 2) < 60 && H / 2 - y < 160) continue;
      const ms = mirrors(x, y); let ok = true;
      for (let i = 1; i < ms.length && ok; i++) if (dist(ms[i][0], ms[i][1], x, y) < minD) ok = false;
      for (const p of pts) { for (const m of mirrors(p.x, p.y)) if (dist(m[0], m[1], x, y) < minD) { ok = false; break; } if (!ok) break; }
      if (ok) pts.push({ x, y });
    }
    let si = 0, sd = -1; pts.forEach((p, i) => { const d = dist(p.x, p.y, W / 2, H / 2); if (d > sd) { sd = d; si = i; } });   // start roost = furthest from the centre
    const nodes = []; let id = 0;
    pts.forEach((p, i) => {
      const start = i === si, size = start ? 2 : 1 + Math.floor(R() * 3), kr = R();

cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', () => { if (G) { G.sel = []; G.drag = null; G.tap = false; } });

// ---------- result + progression ----------
function award(id, list) { if (!save.badges[id]) { save.badges[id] = 1; list.push(BADGES.find(b => b.id === id)); } }
function finishMatch() {
  const S = G.S, rank = RR.ranking(S), place = rank.indexOf(SEAT), n = S.players.length, win = S.over.winner === SEAT, tierBefore = tierOf(save.rating), got = [];
  let delta = 0; const notes = [];
  const nemIdx = G.meta.findIndex(m => m && m.nem), dm = DAILY_MODS.find(d => d.id === G.dmId);
  if (win) { delta = 26 + 6 * (n - 1); if (S.over.t < 90) { delta += 6; notes.push('Quick win +6'); } if (nemIdx > 0) { delta += 10; notes.push('Revenge on ' + G.meta[nemIdx].name + ' +10'); } if (G.daily && !(save.daily.date === today() && save.daily.won)) { delta += 20; notes.push('Daily Flight +20'); } }
  else if (!G.daily && tierBefore > 0) delta = -Math.round(16 * place / (n - 1));
  const floor = tierOf(save.peak) * TIER_STEP;                        // once you reach a rank you keep it
  const before = save.rating; save.rating = Math.max(floor, save.rating + delta); save.peak = Math.max(save.peak, save.rating); delta = save.rating - before;
  save.matches++; if (save.tut === 0) save.tut = 1;
  for (let i = 1; i < n; i++) { const m = G.meta[i], rec = save.rivals[m.id] || (save.rivals[m.id] = { w: 0, l: 0 }); if (win) rec.l++; else if (S.over.winner === i) rec.w++; }
  if (win) { save.wins++; save.streak++; save.lstreak = 0; save.bestStreak = Math.max(save.bestStreak, save.streak); save.birdWins[S.players[SEAT].bird] = 1;
    award('first', got); if (!G.lostRoost) award('flawless', got); if (S.over.t < 75) award('swift', got); if (nemIdx > 0) { award('payback', got); save.nemesis = null; }
    if (save.streak >= 5) award('streak5', got); if (G.catHit) award('ninelives', got); if (n === 4) award('crowd', got); if (RR.BIRD_IDS.every(b => save.birdWins[b])) award('feather', got);
    if (G.daily) save.daily = { date: today(), won: true };
  } else { save.losses++; save.streak = 0; save.lstreak++; if (S.over.winner > 0) save.nemesis = G.meta[S.over.winner].id; }
  if (save.fries >= 10) award('chips', got); if (save.clashes >= 300) award('dogfight', got); if (save.calls >= 25) award('caller', got); if (tierOf(save.rating) >= TIERS.length - 1) award('apex', got);
  persist(); dropSavedMatch();
  LAST = { setup: S.setup, log: S.log, meta: G.meta, seat: SEAT };       // enough to replay the whole match
  const tierNow = tierOf(save.rating), up = tierNow > tierBefore, R = $('#result'); R.classList.toggle('lost', !win);
  $('#resKick').textContent = (G.daily && dm ? 'Daily Flight · ' : '') + (S.over.reason === 'nightfall' ? 'Nightfall' : S.over.reason === 'forfeit' ? 'Forfeit' : 'Match over') + ' · ' + Math.floor(S.over.t / 60) + ':' + String(Math.floor(S.over.t % 60)).padStart(2, '0');
  $('#resTitle').textContent = win ? (up ? 'Promoted!' : 'Rooftops are yours') : place === 1 && n > 2 ? 'So close' : 'Chased off';
  $('#resSub').textContent = win ? (up ? 'You are now a ' + TIERS[tierNow] + '.' + unlockLine(tierNow) : notes.join(' · ') || 'Clean sweep.') : S.over.winner > 0 ? S.players[S.over.winner].name + ' took the skyline. They will remember this.' : 'Nobody held the skyline.';
  if (win && up && notes.length) $('#resSub').textContent += ' ' + notes.join(' · ');
  $('#resTier').textContent = TIERS[tierNow]; $('#resDelta').textContent = (delta >= 0 ? '+' : '') + delta + ' feathers';
  const prog = tierNow >= TIERS.length - 1 ? 1 : (save.rating - tierNow * TIER_STEP) / TIER_STEP; $('#resFill').style.width = '0%'; setTimeout(() => { $('#resFill').style.width = (prog * 100).toFixed(1) + '%'; }, 60);
  $('#resNext').textContent = tierNow >= TIERS.length - 1 ? save.rating + ' feathers. Top of the Pecking Order.' : (TIER_STEP - (save.rating - tierNow * TIER_STEP)) + ' feathers to ' + TIERS[tierNow + 1] + (!win && delta === 0 && tierBefore === 0 ? '. Hatchlings lose nothing for a loss.' : '');
  const tot = RR.totals(S); $('#resList').innerHTML = rank.map((pi, k) => { const p = S.players[pi], m = G.meta[pi]; return `<li><i style="background:${colOf(pi)}"></i><span>${k + 1}. ${pi === SEAT ? 'You' : p.name} <em>${RR.BIRDS[p.bird].name}${m ? ' · ' + RR.PERS[m.pers].label : ''}</em></span><em>${p.alive ? Math.floor(tot[pi]) + ' birds' : 'out'}</em></li>`; }).join('');
  const q = $('#resQuote'); let qi = win ? rank[1] : S.over.winner; if (qi > 0 && G.meta[qi]) { const m = G.meta[qi], L = LINES[m.pers][win ? 'out' : 'win']; q.textContent = m.name + ': "' + L[0] + '"'; q.hidden = false; } else q.hidden = true;
  $('#resBadges').innerHTML = got.map(b => `<p>Badge earned: ${b.name}</p>`).join('');
  $('#againBtn').textContent = win ? 'Next match' : 'Rematch';
  showResult();
}
function showResult() { $('#hud').hidden = true; $('#bar').hidden = true; $('#banner').hidden = true; $('#bubble').hidden = true; $('#sheet').hidden = true; $('#result').hidden = false; mode = 'result'; G = null; SEAT = 0; }
function endReplay() { showResult(); }
function unlockLine(ti) { const b = RR.BIRD_IDS.find(id => RR.BIRDS[id].unlock === ti); return b && ti > 0 ? ' The ' + RR.BIRDS[b].name + ' joins your flock.' : ''; }
$('#againBtn').onclick = () => startMatch(false);
$('#replayBtn').onclick = () => watchReplay();
$('#homeBtn').onclick = () => { sfx('click'); showHome(); };

// ---------- home ----------
const BIRD_SVG = {
  pigeon: '<ellipse cx="17" cy="15" rx="10" ry="7"/><circle cx="27" cy="9" r="4.5"/><path d="M31 9l4 1.5-4 1.5zM8 13L1 9l2 8z"/>',
  gull: '<path d="M1 16C7 6 13 6 17 13 21 6 27 6 33 16 27 11 22 12 17 18 12 12 7 11 1 16z"/>',
  owl: '<path d="M8 6l4 4h10l4-4v12a9 7 0 0 1-18 0z"/><circle cx="13.5" cy="13" r="2.6" fill="#1B1433"/><circle cx="20.5" cy="13" r="2.6" fill="#1B1433"/>',
  crow: '<path d="M4 20l7-12c3-4 10-4 12 0l10 3-9 2c0 5-5 8-11 7z"/><path d="M4 20l-3 4 8-2z"/>',
  starling: '<ellipse cx="16" cy="15" rx="8" ry="5.5"/><circle cx="24" cy="11" r="3.4"/><path d="M27 11l5 .8-5 1.4zM9 14l-7-3 3 7z"/><circle cx="6" cy="5" r="1.4"/><circle cx="30" cy="20" r="1.4"/><circle cx="13" cy="4" r="1"/>'
};
function showHome() {
  mode = 'home'; G = null; SEAT = 0; $('#result').hidden = true; $('#hud').hidden = true; $('#bar').hidden = true; $('#banner').hidden = true; $('#bubble').hidden = true; $('#home').hidden = false;
  if (!birdOpen(save.bird)) save.bird = 'pigeon';
  const ti = tierOf(save.rating); $('#tierName').textContent = TIERS[ti]; $('#feathers').textContent = save.rating;
  const prog = ti >= TIERS.length - 1 ? 1 : (save.rating - ti * TIER_STEP) / TIER_STEP; $('#progFill').style.width = (prog * 100).toFixed(1) + '%';
  const nb = RR.BIRD_IDS.find(id => RR.BIRDS[id].unlock === ti + 1);
  $('#nextLine').textContent = ti >= TIERS.length - 1 ? 'You sit at the top of the Pecking Order. Rivals keep getting sharper.' : (TIER_STEP - (save.rating - ti * TIER_STEP)) + ' feathers to ' + TIERS[ti + 1] + (nb ? ', which unlocks the ' + RR.BIRDS[nb].name + '.' : '.');
  $('#birdRow').innerHTML = RR.BIRD_IDS.map(id => { const B = RR.BIRDS[id], open = birdOpen(id); return `<button role="radio" aria-checked="${save.bird === id}" data-b="${id}" class="${save.bird === id ? 'on' : ''}${open ? '' : ' lock'}"><svg viewBox="0 0 36 26" fill="${open ? INK : NEUTRAL}" aria-hidden="true">${BIRD_SVG[id]}</svg>${B.name}<small>${open ? B.trait : TIERS[B.unlock]}</small></button>`; }).join('');
  const describe = id => { const B = RR.BIRDS[id]; return `<b>${B.name}: ${B.trait}.</b> ${B.desc}<br><b>Call, ${B.call.name}:</b> ${B.call.desc}`; };
  document.querySelectorAll('#birdRow button').forEach(b => b.onclick = () => { const id = b.dataset.b; initAudio(); if (!birdOpen(id)) { sfx('deny'); $('#birdDesc').innerHTML = `Unlocks at ${TIERS[RR.BIRDS[id].unlock]}. ` + describe(id); return; } sfx('click'); save.bird = id; persist(); showHome(); });
  $('#birdDesc').innerHTML = describe(save.bird);
  const nl = $('#nemLine'), nm = RIVALS.find(r => r.id === save.nemesis); if (nm) { const rec = save.rivals[nm.id] || { w: 1, l: 0 }; nl.textContent = `${nm.name} the ${RR.BIRDS[nm.bird].name} beat you last time (${rec.w} wins to your ${rec.l}). They are in your next match, and sharper for it.`; nl.hidden = false; } else nl.hidden = true;
  const dm = dailyMod(), done = save.daily.date === today() && save.daily.won; $('#dailyMod').textContent = dm.name + ': ' + dm.desc.toLowerCase() + '. Losing costs nothing.'; $('#dailyState').textContent = done ? 'Won today' : '+20 feathers'; $('#dailyBtn').classList.toggle('done', done);
  const sm = savedMatch(); $('#playBtn').textContent = sm ? 'Resume match' : 'Take flight'; $('#dailyBtn').hidden = !!sm; $('#dropBtn').hidden = !sm;
  $('#verLbl').textContent = 'Roost Rivals v' + VERSION + ' beta' + (PREVIEW ? ' · preview: all birds open' : '') + ' · Zetato Studios';
}
$('#playBtn').onclick = () => { if (savedMatch()) resumeMatch(false); else startMatch(false); };
$('#dropBtn').onclick = () => resumeMatch(true);
$('#dailyBtn').onclick = () => startMatch(true);

// ---------- sheets ----------
function sheet(title, html) { $('#sheetT').textContent = title; $('#sheetB').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet() { $('#sheet').hidden = true; if (mode === 'match') paused = false; }
$('#sheetX').onclick = () => { sfx('click'); closeSheet(); };
$('#sheet').addEventListener('pointerdown', e => { if (e.target.id === 'sheet') closeSheet(); });
const HOWTO = `<p><b>Send birds.</b> Drag from your roost to any other roost. Drag across several of your roosts to send from all of them, or tap a roost and then tap a target. Double-tap a roost to pick every roost you own.</p>
<p><b>Take roosts.</b> Land more birds than a roost holds and it becomes yours. The label on your aim line shows your birds against theirs.</p>
<p><b>Roosts differ.</b> Round rooftops are standard. Roosts with seed dots are feeders and hatch 50% faster. Eight-sided bell towers defend 40% better.</p>
<p><b>Your call.</b> Every bird has one call, on the button beside the send sizes. It takes ${RR.CALL.cooldown} seconds to come back, so pick your moment. Rivals have calls too: their roosts pulse while one is in effect.</p>
<p><b>Mid-air.</b> Rival flocks that cross paths cancel out bird for bird. Wind speeds up flocks flying with it and slows flocks flying against it.</p>
<p><b>The cat</b> stalks the fullest roost and scatters 40% of it after 5 seconds. <b>Fries</b> give +14 birds to whoever holds that roost when the timer ends.</p>
<p><b>Winning.</b> Chase every rival off the rooftops, or hold the most birds at nightfall.</p>
<p><b>Fair fights.</b> Rivals hatch, fly and call by the same rules as you. Higher in the Pecking Order they react faster and plan further, nothing else.</p>`;
$('#pauseBtn').onclick = () => { if (mode !== 'match' || !G) return; sfx('click'); paused = true; if (G.watch) sheet('Replay paused', `<button class="sbtn pri" data-a="resume">Keep watching</button><button class="sbtn" data-a="stopreplay">Stop replay</button>`); else { saveMatch(); sheet('Paused', `<button class="sbtn pri" data-a="resume">Resume</button><button class="sbtn" data-a="how">How to play</button><button class="sbtn warn" data-a="forfeit">Forfeit match (counts as a loss)</button>`); } };
$('#rivalsBtn').onclick = () => { initAudio(); sfx('click'); sheet('Rivals', `<p>Every rival plays by your rules. What changes is how they think.</p>` + RIVALS.map(r => { const rec = save.rivals[r.id]; return `<div class="row${rec ? '' : ' dim'}"><span>${r.name}${save.nemesis === r.id ? ' · your nemesis' : ''}<small>${RR.BIRDS[r.bird].name} · ${RR.PERS[r.pers].label}</small></span><em>${rec ? 'You ' + rec.l + ' – ' + rec.w : 'Not met'}</em></div>`; }).join('')); };
$('#badgesBtn').onclick = () => { initAudio(); sfx('click'); const n = BADGES.filter(b => save.badges[b.id]).length; sheet('Badges ' + n + '/' + BADGES.length, `<p>Played ${save.matches} · Won ${save.wins} · Best streak ${save.bestStreak}</p>` + BADGES.map(b => `<div class="row${save.badges[b.id] ? '' : ' dim'}"><span>${b.name}<small>${b.how}</small></span><em>${save.badges[b.id] ? 'Earned' : ''}</em></div>`).join('')); };
function settingsSheet(armed) { sheet('Settings', `<div class="row"><span>Sound</span><button class="tog" data-a="sound" aria-pressed="${save.sound}" aria-label="Sound"></button></div><div class="row"><span>Vibration<small>On phones that support it</small></span><button class="tog" data-a="haptics" aria-pressed="${save.haptics}" aria-label="Vibration"></button></div><button class="sbtn" data-a="how">How to play</button><button class="sbtn warn" data-a="${armed ? 'reset2' : 'reset'}">${armed ? 'Tap again to erase all progress' : 'Reset progress'}</button><p>Your progress is saved on this device. No ads, no accounts, no tracking.</p>`); }
$('#setBtn').onclick = () => { initAudio(); sfx('click'); settingsSheet(false); };
$('#sheetB').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a; sfx('click');
  if (a === 'resume') closeSheet();
  else if (a === 'how') { const back = mode === 'match'; sheet('How to play', HOWTO + (back ? '<button class="sbtn pri" data-a="resume">Back to the match</button>' : '')); }
  else if (a === 'forfeit') { $('#sheet').hidden = true; paused = false; Session.send({ k: 'quit' }); }
  else if (a === 'stopreplay') { paused = false; endReplay(); }
  else if (a === 'sound') { save.sound = !save.sound; persist(); settingsSheet(false); }
  else if (a === 'haptics') { save.haptics = !save.haptics; persist(); buzz(20); settingsSheet(false); }
  else if (a === 'reset') settingsSheet(true);
  else if (a === 'reset2') { const keep = { sound: save.sound, haptics: save.haptics, pid: save.pid }; save = Object.assign({}, DEF, keep, { rivals: {}, badges: {}, birdWins: {}, daily: { date: '', won: false } }); persist(); dropSavedMatch(); closeSheet(); showHome(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'match' && G && !G.S.over) { saveMatch(); if ($('#sheet').hidden) $('#pauseBtn').onclick(); } });
window.addEventListener('pagehide', saveMatch);

// ---------- boot: Zetato Studios intro plays once (~1.5s), no tap needed; a tap just skips it ----------
window.addEventListener('resize', resize); resize();
if (document.fonts && document.fonts.load) { document.fonts.load('20px "Bowlby One"').catch(() => {}); }
(function () { const intro = $('#intro'); let done = false;
  const end = () => { if (done) return; done = true; intro.classList.add('out'); setTimeout(() => { intro.hidden = true; }, 380); };
  showHome(); setTimeout(end, 1500); intro.addEventListener('pointerdown', end);
})();
requestAnimationFrame(frame);
window.__rr = { get G() { return G; }, get save() { return save; }, get LAST() { return LAST; }, start: startMatch, home: showHome, Session, RR };
})();

<script>
/* Roost Rivals PWA: offline worker with silent updates, plus the install hint (same pattern as the other Zetato Studios games). */
(function(){
 var VERSION='0.2.0';
 // Silent updates: the worker fetches the newest game page whenever online, so the next open is always current.
 if('serviceWorker' in navigator && location.protocol!=='file:' && /(^|\.)zetatobi\.com$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)){
  window.addEventListener('load',function(){
   navigator.serviceWorker.register('sw.js').then(function(reg){
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update().catch(function(){}); });
   }).catch(function(){});
  });
 }
 // Install hint on the home screen, unless already installed or dismissed.
 var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 var KEY='roostrivals.installHint', box=document.getElementById('inst'), msg=document.getElementById('instMsg'), go=document.getElementById('instGo'), deferred=null;
 function dismissed(){ try{return localStorage.getItem(KEY)==='1'}catch(e){return false} }
 function hide(save){ box.hidden=true; if(save){ try{localStorage.setItem(KEY,'1')}catch(e){} } }
 document.getElementById('instX').onclick=function(e){ e.stopPropagation(); hide(true); };
 window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(!box.hidden){ msg.textContent='Full screen, works offline.'; go.hidden=false; } });
 go.onclick=function(e){ e.stopPropagation(); if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; hide(false); }); };
 window.addEventListener('appinstalled',function(){ hide(true); });
 if(standalone||dismissed()||location.protocol==='file:'||!/(^|\.)zetatobi\.com$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;   // preview links are not installable
 var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), iosOther=ios&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua), android=/Android/.test(ua);
 if(!ios&&!android&&!deferred) return;                       // desktop: only if the browser offers install
 setTimeout(function(){
  if(standalone) return;
  if(ios) msg.textContent=iosOther?'Open this page in Safari, then tap Share and Add to Home Screen.':'Tap Share, then Add to Home Screen.';
  else if(deferred){ msg.textContent='Full screen, works offline.'; go.hidden=false; }
  else msg.textContent='Open the browser menu (⋮), then Install app.';
  box.hidden=false;
 },2200);
})();
