نِي \". فَزَمَّلُوهُ حَتَّى ذَهَبَ عَنْهُ الرَّوْعُ، فَقَالَ لِخَدِيجَةَ وَأَخْبَرَهَا الْخَبَرَ \" لَقَدْ خَشِيتُ عَلَى نَفْسِي \". فَقَالَتْ خَدِيجَةُ كَلاَّ وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ، وَتَحْمِلُ الْكَلَّ، وَتَكْسِبُ الْمَعْدُومَ، وَتَقْرِي الضَّيْفَ، وَتُعِينُ عَلَى نَوَائِبِ الْحَقِّ. فَانْطَلَقَتْ بِهِ خَدِيجَةُ حَتَّى أَتَتْ بِهِ وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى ابْنَ عَمِّ خَدِيجَةَ ـ وَكَانَ امْرَأً تَنَصَّرَ فِي الْجَاهِلِيَّةِ، وَكَانَ يَكْتُبُ الْكِتَابَ الْعِبْرَانِيَّ، فَيَكْتُبُ مِنَ الإِنْجِيلِ بِالْعِبْرَانِيَّةِ مَا شَاءَ اللَّهُ أَنْ يَكْتُبَ، وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ ـ فَقَالَتْ لَهُ خَدِيجَةُ يَا ابْنَ عَمِّ اسْمَعْ مِنَ ابْنِ أَخِيكَ. فَقَالَ لَهُ وَرَقَةُ يَا ابْنَ أَخِي مَاذَا تَرَى فَأَخْبَرَهُ رَسُولُ اللَّهِ صلى الله عليه وسلم خَبَرَ مَا رَأَى. فَقَالَ لَهُ وَرَقَةُ هَذَا النَّامُوسُ الَّذِي نَزَّلَ اللَّهُ عَلَى مُوسَى صلى الله عليه وسلم يَا لَيْتَنِي فِيهَا جَذَعًا، لَيْتَنِي أَكُونُ حَيًّا إِذْ يُخْرِجُكَ قَوْمُكَ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" أَوَمُخْرِجِيَّ هُمْ \". قَالَ نَعَمْ، لَمْ يَأْتِ رَجُلٌ قَطُّ بِمِثْلِ مَا جِئْتَ بِهِ إِلاَّ عُودِيَ، وَإِنْ يُدْرِكْنِي يَوْمُكَ أَنْصُرْكَ نَصْرًا مُؤَزَّرًا. ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ وَفَتَرَ الْوَحْىُ.", "bukhari:8": "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، قَالَ أَخْبَرَنَا حَنْظَلَةُ بْنُ أَبِي سُفْيَانَ، عَنْ عِكْرِمَةَ بْنِ خَالِدٍ، عَنِ ابْنِ عُمَرَ ـ رضى الله عنهما ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" بُنِيَ الإِسْلاَمُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَالْحَجِّ، وَصَوْمِ رَمَضَانَ \".", "bukhari:10": "حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي السَّفَرِ، وَإِسْمَاعِيلَ، عَنِ الشَّعْبِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو ـ رضى الله عنهما ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ \" الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ \". قَالَ أَبُو عَبْدِ اللَّهِ وَقَالَ أَبُو مُعَاوِيَةَ حَدَّثَنَا دَاوُدُ عَنْ عَامِرٍ قَالَ سَمِعْتُ عَبْدَ اللَّهِ عَنِ النَّبِيِّ صلى الله عليه وسلم. وَقَالَ عَبْدُ الأَعْلَى عَنْ دَاوُدَ عَنْ عَامِرٍ عَنْ عَبْدِ اللَّهِ عَنِ النَّبِيِّ صلى الله عليه وسلم.", "bukhari:13": "حَدَّثَنَا مُسَدَّدٌ، قَالَ حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم. وَعَنْ حُسَيْنٍ الْمُعَلِّمِ، قَالَ حَدَّثَنَا قَتَادَةُ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ \" لا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ \".", "bukhari:40": "حَدَّثَنَا عَمْرُو بْنُ خَالِدٍ، قَالَ حَدَّثَنَا زُهَيْرٌ، قَالَ حَدَّثَنَا أَبُو إِسْحَاقَ، عَنِ الْبَرَاءِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم كَانَ أَوَّلَ مَا قَدِمَ الْمَدِينَةَ نَزَلَ عَلَى أَجْدَادِهِ ـ أَوْ قَالَ أَخْوَالِهِ ـ مِنَ الأَنْصَارِ، وَأَنَّهُ صَلَّى قِبَلَ بَيْتِ الْمَقْدِسِ سِتَّةَ عَشَرَ شَهْرًا، أَوْ سَبْعَةَ عَشَرَ شَهْرًا، وَكَانَ يُعْجِبُهُ أَنْ تَكُونَ قِبْلَتُهُ قِبَلَ الْبَيْتِ، وَأَنَّهُ صَلَّى أَوَّلَ صَلاَةٍ صَلاَّهَا صَلاَةَ الْعَصْرِ، وَصَلَّى مَعَهُ قَوْمٌ، فَخَرَجَ رَجُلٌ مِمَّنْ صَلَّى مَعَهُ، فَمَرَّ عَلَى أَهْلِ مَسْجِدٍ، وَهُمْ رَاكِعُونَ فَقَالَ أَشْهَدُ بِاللَّهِ لَقَدْ صَلَّيْتُ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم قِبَلَ مَكَّةَ، فَدَارُوا كَمَا هُمْ قِبَلَ الْبَيْتِ، وَكَانَتِ الْيَهُودُ قَدْ أَعْجَبَهُمْ إِذْ كَانَ يُصَلِّي قِبَلَ بَيْتِ الْمَقْدِسِ، وَأَهْلُ الْكِتَابِ، فَلَمَّا وَلَّى وَجْهَهُ قِبَلَ الْبَيْتِ أَنْكَرُوا ذَلِكَ. قَالَ زُهَيْرٌ حَدَّثَنَا أَبُو إِسْحَاقَ عَنِ الْبَرَاءِ فِي حَدِيثِهِ هَذَا أَنَّهُ مَاتَ عَلَى الْقِبْلَةِ قَبْلَ أَنْ تُحَوَّلَ رِجَالٌ وَقُتِلُوا، فَلَمْ نَدْرِ مَا نَقُولُ فِيهِمْ، فَأَنْزَلَ اللَّهُ تَعَالَى {وَمَا كَانَ اللَّهُ لِيُضِيعَ إِيمَانَكُمْ}", "bukhari:69": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنِي أَبُو التَّيَّاحِ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ \" يَسِّرُوا وَلاَ تُعَسِّرُوا، وَبَشِّرُوا وَلاَ تُنَفِّرُوا \".", "bukhari:1429": "حَدَّثَنَا أَبُو النُّعْمَانِ، قَالَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ ـ رضى الله عنهما ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم ح. وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ وَهُوَ عَلَى الْمِنْبَرِ، وَذَكَرَ الصَّدَقَةَ وَالتَّعَفُّفَ وَالْمَسْأَلَةَ \" الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى، فَالْيَدُ الْعُلْيَا هِيَ الْمُنْفِقَةُ، وَالسُّفْلَى هِيَ السَّائِلَةُ \".", "bukhari:2989": "حَدَّثَنِي إِسْحَاقُ، أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" كُلُّ سُلاَمَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ، يَعْدِلُ بَيْنَ الاِثْنَيْنِ صَدَقَةٌ، وَيُعِينُ الرَّجُلَ عَلَى دَابَّتِهِ، فَيَحْمِلُ عَلَيْهَا، أَوْ يَرْفَعُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَكُلُّ خَطْوَةٍ يَخْطُوهَا إِلَى الصَّلاَةِ صَدَقَةٌ، وَيُمِيطُ الأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ \".", "bukhari:3653": "حَدَّثَنَا مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا هَمَّامٌ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، عَنْ أَبِي بَكْرٍ ـ رضى الله عنه ـ قَالَ قُلْتُ لِلنَّبِيِّ صلى الله عليه وسلم وَأَنَا فِي الْغَارِ لَوْ أَنَّ أَحَدَهُمْ نَظَرَ تَحْتَ قَدَمَيْهِ لأَبْصَرَنَا. فَقَالَ \" مَا ظَنُّكَ يَا أَبَا بَكْرٍ بِاثْنَيْنِ اللَّهُ ثَالِثُهُمَا \".", "bukhari:3851": "حَدَّثَنَا أَحْمَدُ بْنُ أَبِي رَجَاءٍ، حَدَّثَنَا النَّضْرُ، عَنْ هِشَامٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ أُنْزِلَ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم وَهْوَ ابْنُ أَرْبَعِينَ، فَمَكَثَ ثَلاَثَ عَشْرَةَ سَنَةً، ثُمَّ أُمِرَ بِالْهِجْرَةِ، فَهَاجَرَ إِلَى الْمَدِينَةِ، فَمَكَثَ بِهَا عَشْرَ سِنِينَ، ثُمَّ تُوُفِّيَ صلى الله عليه وسلم.", "bukhari:5013": "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَبْدِ اللَّهِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبِي صَعْصَعَةَ، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ رَجُلاً، سَمِعَ رَجُلاً، يَقْرَأُ {قُلْ هُوَ اللَّهُ أَحَدٌ} يُرَدِّدُهَا فَلَمَّا أَصْبَحَ جَاءَ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَذَكَرَ ذَلِكَ لَهُ وَكَأَنَّ الرَّجُلَ يَتَقَالُّهَا فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" وَالَّذِي نَفْسِي بِيَدِهِ إِنَّهَا لَتَعْدِلُ ثُلُثَ الْقُرْآنِ \".", "bukhari:5027": "حَدَّثَنَا حَجَّاجُ بْنُ مِنْهَالٍ، حَدَّثَنَا شُعْبَةُ، قَالَ أَخْبَرَنِي عَلْقَمَةُ بْنُ مَرْثَدٍ، سَمِعْتُ سَعْدَ بْنَ عُبَيْدَةَ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ السُّلَمِيِّ، عَنْ عُثْمَانَ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ \" خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ \". قَالَ وَأَقْرَأَ أَبُو عَبْدِ الرَّحْمَنِ فِي إِمْرَةِ عُثْمَانَ حَتَّى كَانَ الْحَجَّاجُ، قَالَ وَذَاكَ الَّذِي أَقْعَدَنِي مَقْعَدِي هَذَا.", "bukhari:5971": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ بْنِ شُبْرُمَةَ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ بِحُسْنِ صَحَابَتِي قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" ثُمَّ أَبُوكَ \". وَقَالَ ابْنُ شُبْرُمَةَ وَيَحْيَى بْنُ أَيُّوبَ حَدَّثَنَا أَبُو زُرْعَةَ مِثْلَهُ.", "bukhari:5997": "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، حَدَّثَنَا أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَبَّلَ رَسُولُ اللَّهِ صلى الله عليه وسلم الْحَسَنَ بْنَ عَلِيٍّ وَعِنْدَهُ الأَقْرَعُ بْنُ حَابِسٍ التَّمِيمِيُّ جَالِسًا. فَقَالَ الأَقْرَعُ إِنَّ لِي عَشَرَةً مِنَ الْوَلَدِ مَا قَبَّلْتُ مِنْهُمْ أَحَدًا. فَنَظَرَ إِلَيْهِ رَسُولُ اللَّهِ صلى الله عليه وسلم ثُمَّ قَالَ \" مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ \".", "bukhari:6018": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ أَبِي حَصِينٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ \".", "bukhari:6114": "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ \" لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ \".", "bukhari:6116": "حَدَّثَنِي يَحْيَى بْنُ يُوسُفَ، أَخْبَرَنَا أَبُو بَكْرٍ ـ هُوَ ابْنُ عَيَّاشٍ ـ عَنْ أَبِي حَصِينٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَجُلاً، قَالَ لِلنَّبِيِّ صلى الله عليه وسلم أَوْصِنِي. قَالَ \" لاَ تَغْضَبْ \". فَرَدَّدَ مِرَارًا، قَالَ \" لاَ تَغْضَبْ \".", "bukhari:6464": "حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُلَيْمَانُ، عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ \" سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الْجَنَّةَ، وَأَنَّ أَحَبَّ الأَعْمَالِ أَدْوَمُهَا إِلَى اللَّهِ، وَإِنْ قَلَّ \"", "bukhari:7563": "حَدَّثَنِي أَحْمَدُ بْنُ إِشْكَابٍ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم \" كَلِمَتَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ، خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ \".", "muslim:8": "حَدَّثَنِي أَبُو خَيْثَمَةَ، زُهَيْرُ بْنُ حَرْبٍ حَدَّثَنَا وَكِيعٌ، عَنْ كَهْمَسٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ يَحْيَى بْنِ يَعْمَرَ، ح وَحَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ الْعَنْبَرِيُّ، - وَهَذَا حَدِيثُهُ - حَدَّثَنَا أَبِي، حَدَّثَنَا كَهْمَسٌ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ يَحْيَى بْنِ يَعْمَرَ، قَالَ كَانَ أَوَّلَ مَنْ قَالَ فِي الْقَدَرِ بِالْبَصْرَةِ مَعْبَدٌ الْجُهَنِيُّ فَانْطَلَقْتُ أَنَا وَحُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ الْحِمْيَرِيُّ حَاجَّيْنِ أَوْ مُعْتَمِرَيْنِ فَقُلْنَا لَوْ لَقِينَا أَحَدًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ صلى الله عليه وسلم فَسَأَلْنَاهُ عَمَّا يَقُولُ هَؤُلاَءِ فِي الْقَدَرِ فَوُفِّقَ لَنَا عَبْدُ اللَّهِ بْنُ عُمَرَ بْنِ الْخَطَّابِ دَاخِلاً الْمَسْجِدَ فَاكْتَنَفْتُهُ أَنَا وَصَاحِبِي أَحَدُنَا عَنْ يَمِينِهِ وَالآخَرُ عَنْ شِمَالِهِ فَظَنَنْتُ أَنَّ صَاحِبِي سَيَكِلُ الْكَلاَمَ إِلَىَّ فَقُلْتُ أَبَا عَبْدِ الرَّحْمَنِ إِنَّهُ قَدْ ظَهَرَ قِبَلَنَا نَاسٌ يَقْرَءُونَ الْقُرْآنَ وَيَتَقَفَّرُونَ الْعِلْمَ - وَذَكَرَ مِنْ شَأْنِهِمْ - وَأَنَّهُمْ يَزْعُمُونَ أَنْ لاَ قَدَرَ وَأَنَّ الأَمْرَ أُنُفٌ. قَالَ فَإِذَا لَقِيتَ أُولَئِكَ فَأَخْبِرْهُمْ أَنِّي بَرِيءٌ مِنْهُمْ وَأَنَّهُمْ بُرَآءُ مِنِّي وَالَّذِي يَحْلِفُ بِهِ عَبْدُ اللَّهِ بْنُ عُمَرَ لَوْ أَنَّ لأَحَدِهِمْ مِثْلَ أُحُدٍ ذَهَبًا فَأَنْفَقَهُ مَا قَبِلَ اللَّهُ مِنْهُ حَتَّى يُؤْمِنَ بِالْقَدَرِ ثُمَّ قَالَ حَدَّثَنِي أَبِي عُمَرُ بْنُ الْخَطَّابِ قَالَ بَيْنَمَا نَحْنُ عِنْدَ رَسُولِ اللَّهِ صلى الله عليه وسلم ذَاتَ يَوْمٍ إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ شَدِيدُ سَوَادِ الشَّعَرِ لاَ يُرَى عَلَيْهِ أَثَرُ السَّفَرِ وَلاَ يَعْرِفُهُ مِنَّا أَحَدٌ حَتَّى جَلَسَ إِلَى النَّبِيِّ صلى الله عليه وسلم فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ وَقَالَ يَا مُحَمَّدُ أَخْبِرْنِي عَنِ الإِسْلاَمِ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" الإِسْلاَمُ أَنْ تَشْهَدَ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ وَتُقِيمَ الصَّلاَةَ وَتُؤْتِيَ الزَّكَاةَ وَتَصُومَ رَمَضَانَ وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلاً. قَالَ صَدَقْتَ. قَالَ فَعَجِبْنَا لَهُ يَسْأَلُهُ وَيُصَدِّقُهُ. قَالَ فَأَخْبِرْنِي عَنِ الإِيمَانِ. قَالَ \" أَنْ تُؤْمِنَ بِاللَّهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ \". قَالَ صَدَقْتَ. قَالَ فَأَخْبِرْنِي عَنِ الإِحْسَانِ. قَالَ \" أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ \". قَالَ فَأَخْبِرْنِي عَنِ السَّاعَةِ. قَالَ \" مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ \". قَالَ فَأَخْبِرْنِي عَنْ أَمَارَتِهَا. قَالَ \" أَنْ تَلِدَ الأَمَةُ رَبَّتَهَا وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ \". قَالَ ثُمَّ انْطَلَقَ فَلَبِثْتُ مَلِيًّا ثُمَّ قَالَ لِي \" يَا عُمَرُ أَتَدْرِي مَنِ السَّائِلُ \". قُلْتُ اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ \".", "muslim:55": "حَدَّثَنَا مُحَمَّدُ بْنُ عَبَّادٍ الْمَكِّيُّ، حَدَّثَنَا سُفْيَانُ، قَالَ قُلْتُ لِسُهَيْلٍ إِنَّ عَمْرًا حَدَّثَنَا عَنِ الْقَعْقَاعِ، عَنْ أَبِيكَ، قَالَ وَرَجَوْتُ أَنْ يُسْقِطَ، عَنِّي رَجُلاً قَالَ فَقَالَ سَمِعْتُهُ مِنَ الَّذِي سَمِعَهُ مِنْهُ أَبِي كَانَ صَدِيقًا لَهُ بِالشَّامِ ثُمَّ حَدَّثَنَا سُفْيَانُ عَنْ سُهَيْلٍ عَنْ عَطَاءِ بْنِ يَزِيدَ عَنْ تَمِيمٍ الدَّارِيِّ أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ \" الدِّينُ النَّصِيحَةُ \" قُلْنَا لِمَنْ قَالَ \" لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ \".", "muslim:223": "حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا حَبَّانُ بْنُ هِلاَلٍ، حَدَّثَنَا أَبَانٌ، حَدَّثَنَا يَحْيَى، أَنَّ زَيْدًا، حَدَّثَهُ أَنَّ أَبَا سَلاَّمٍ حَدَّثَهُ عَنْ أَبِي مَالِكٍ الأَشْعَرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" الطُّهُورُ شَطْرُ الإِيمَانِ وَالْحَمْدُ لِلَّهِ تَمْلأُ الْمِيزَانَ. وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلآنِ - أَوْ تَمْلأُ - مَا بَيْنَ السَّمَوَاتِ وَالأَرْضِ وَالصَّلاَةُ نُورٌ وَالصَّدَقَةُ بُرْهَانٌ وَالصَّبْرُ ضِيَاءٌ وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ كُلُّ النَّاسِ يَغْدُو فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا \".", "muslim:2588": "حَدَّثَنَا يَحْيَى بْنُ أَيُّوبَ، وَقُتَيْبَةُ، وَابْنُ، حُجْرٍ قَالُوا حَدَّثَنَا إِسْمَاعِيلُ، - وَهُوَ ابْنُ جَعْفَرٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ \" مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ عِزًّا وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ رَفَعَهُ اللَّهُ \".", "muslim:2699": "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى التَّمِيمِيُّ، وَأَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ وَمُحَمَّدُ بْنُ الْعَلاَءِ الْهَمْدَانِيُّ - وَاللَّفْظُ لِيَحْيَى - قَالَ يَحْيَى أَخْبَرَنَا وَقَالَ الآخَرَانِ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالآخِرَةِ وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالآخِرَةِ وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلاَّ نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ وَحَفَّتْهُمُ الْمَلاَئِكَةُ وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ \".", "muslim:1033": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، فِيمَا قُرِئَ عَلَيْهِ عَنْ نَافِعٍ، عَنْ عَبْدِ، اللَّهِ بْنِ عُمَرَ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ وَهُوَ عَلَى الْمِنْبَرِ وَهُوَ يَذْكُرُ الصَّدَقَةَ وَالتَّعَفُّفَ عَنِ الْمَسْأَلَةِ \" الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى وَالْيَدُ الْعُلْيَا الْمُنْفِقَةُ وَالسُّفْلَى السَّائِلَةُ \".", "bukhari:52": "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا زَكَرِيَّاءُ، عَنْ عَامِرٍ، قَالَ سَمِعْتُ النُّعْمَانَ بْنَ بَشِيرٍ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ \" الْحَلاَلُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ، وَبَيْنَهُمَا مُشَبَّهَاتٌ لاَ يَعْلَمُهَا كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الْمُشَبَّهَاتِ اسْتَبْرَأَ لِدِيِنِهِ وَعِرْضِهِ، وَمَنْ وَقَعَ فِي الشُّبُهَاتِ كَرَاعٍ يَرْعَى حَوْلَ الْحِمَى، يُوشِكُ أَنْ يُوَاقِعَهُ. أَلاَ وَإِنَّ لِكُلِّ مَلِكٍ حِمًى، أَلاَ إِنَّ حِمَى اللَّهِ فِي أَرْضِهِ مَحَارِمُهُ، أَلاَ وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ، وَإِذَا فَسَدَتْ فَسَدَ الْجَسَدُ كُلُّهُ. أَلاَ وَهِيَ الْقَلْبُ \".", "bukhari:71": "حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، قَالَ قَالَ حُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ سَمِعْتُ مُعَاوِيَةَ، خَطِيبًا يَقُولُ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ \" مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ، وَإِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ يُعْطِي، وَلَنْ تَزَالَ هَذِهِ الأُمَّةُ قَائِمَةً عَلَى أَمْرِ اللَّهِ لاَ يَضُرُّهُمْ مَنْ خَالَفَهُمْ حَتَّى يَأْتِيَ أَمْرُ اللَّهِ \".", "bukhari:2442": "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، أَنَّ سَالِمًا، أَخْبَرَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ ـ رضى الله عنهما ـ أَخْبَرَهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ \" الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ \".", "bukhari:6011": "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا زَكَرِيَّاءُ، عَنْ عَامِرٍ، قَالَ سَمِعْتُهُ يَقُولُ سَمِعْتُ النُّعْمَانَ بْنَ بَشِيرٍ، يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" تَرَى الْمُؤْمِنِينَ فِي تَرَاحُمِهِمْ وَتَوَادِّهِمْ وَتَعَاطُفِهِمْ كَمَثَلِ الْجَسَدِ إِذَا اشْتَكَى عُضْوًا تَدَاعَى لَهُ سَائِرُ جَسَدِهِ بِالسَّهَرِ وَالْحُمَّى \".", "bukhari:6094": "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ، عَنْ أَبِي وَائِلٍ، عَنْ عَبْدِ اللَّهِ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ \" إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ، وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا، وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ، وَإِنَّ الْفُجُورَ يَهْدِي إِلَى النَّارِ، وَإِنَّ الرَّجُلَ لَيَكْذِبُ، حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا \".", "bukhari:6412": "حَدَّثَنَا الْمَكِّيُّ بْنُ إِبْرَاهِيمَ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ سَعِيدٍ ـ هُوَ ابْنُ أَبِي هِنْدٍ ـ عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم \" نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ، الصِّحَّةُ وَالْفَرَاغُ \". قَالَ عَبَّاسٌ الْعَنْبَرِيُّ حَدَّثَنَا صَفْوَانُ بْنُ عِيسَى، عَنْ عَبْدِ اللَّهِ بْنِ سَعِيدِ بْنِ أَبِي هِنْدٍ، عَنْ أَبِيهِ، سَمِعْتُ ابْنَ عَبَّاسٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم مِثْلَهُ.", "bukhari:6416": "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحْمَنِ أَبُو الْمُنْذِرِ الطُّفَاوِيُّ، عَنْ سُلَيْمَانَ الأَعْمَشِ، قَالَ حَدَّثَنِي مُجَاهِدٌ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ قَالَ أَخَذَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِمَنْكِبِي فَقَالَ \" كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ، أَوْ عَابِرُ سَبِيلٍ \". وَكَانَ ابْنُ عُمَرَ يَقُولُ إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ الْمَسَاءَ، وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ.", "bukhari:6502": "حَدَّثَنِي مُحَمَّدُ بْنُ عُثْمَانَ، حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، حَدَّثَنِي شَرِيكُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ عَطَاءٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" إِنَّ اللَّهَ قَالَ مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إِلَىَّ عَبْدِي بِشَىْءٍ أَحَبَّ إِلَىَّ مِمَّا افْتَرَضْتُ عَلَيْهِ، وَمَا يَزَالُ عَبْدِي يَتَقَرَّبُ إِلَىَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطُشُ بِهَا وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَإِنْ سَأَلَنِي لأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لأُعِيذَنَّهُ، وَمَا تَرَدَّدْتُ عَنْ شَىْءٍ أَنَا فَاعِلُهُ تَرَدُّدِي عَنْ نَفْسِ الْمُؤْمِنِ، يَكْرَهُ الْمَوْتَ وَأَنَا أَكْرَهُ مَسَاءَتَهُ \".", "bukhari:7405": "حَدَّثَنَا عُمَرُ بْنُ حَفْصٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا الأَعْمَشُ، سَمِعْتُ أَبَا صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم \" يَقُولُ اللَّهُ تَعَالَى أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي، فَإِنْ ذَكَرَنِي فِي نَفْسِهِ ذَكَرْتُهُ فِي نَفْسِي، وَإِنْ ذَكَرَنِي فِي مَلأٍ ذَكَرْتُهُ فِي مَلأٍ خَيْرٍ مِنْهُمْ، وَإِنْ تَقَرَّبَ إِلَىَّ بِشِبْرٍ تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا، وَإِنْ تَقَرَّبَ إِلَىَّ ذِرَاعًا تَقَرَّبْتُ إِلَيْهِ بَاعًا، وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً \".", "muslim:1631": "حَدَّثَنَا يَحْيَى بْنُ أَيُّوبَ، وَقُتَيْبَةُ، - يَعْنِي ابْنَ سَعِيدٍ - وَابْنُ حُجْرٍ قَالُوا حَدَّثَنَا إِسْمَاعِيلُ، - هُوَ ابْنُ جَعْفَرٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ \" إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةٍ إِلاَّ مِنْ صَدَقَةٍ جَارِيَةٍ أَوْ عِلْمٍ يُنْتَفَعُ بِهِ أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ \".", "muslim:2664": "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَابْنُ، نُمَيْرٍ قَالاَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ إِدْرِيسَ، عَنْ رَبِيعَةَ بْنِ عُثْمَانَ، عَنْ مُحَمَّدِ بْنِ يَحْيَى بْنِ حَبَّانَ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ وَفِي كُلٍّ خَيْرٌ احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجِزْ وَإِنْ أَصَابَكَ شَىْءٌ فَلاَ تَقُلْ لَوْ أَنِّي فَعَلْتُ كَانَ كَذَا وَكَذَا. وَلَكِنْ قُلْ قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ \".", "muslim:2999": "حَدَّثَنَا هَدَّابُ بْنُ خَالِدٍ الأَزْدِيُّ، وَشَيْبَانُ بْنُ فَرُّوخَ، جَمِيعًا عَنْ سُلَيْمَانَ بْنِ الْمُغِيرَةِ، - وَاللَّفْظُ لِشَيْبَانَ - حَدَّثَنَا سُلَيْمَانُ، حَدَّثَنَا ثَابِتٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ صُهَيْبٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم \" عَجَبًا لأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ وَلَيْسَ ذَاكَ لأَحَدٍ إِلاَّ لِلْمُؤْمِنِ إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ \"."};

aboutBody:`<h2>مصادر الأسئلة</h2><p>كل إجابة يظهر معها دليلها. الأسئلة مأخوذة من القرآن الكريم ومن الأحاديث الصحيحة والمتواترة، ولا يُستعمل الحسن إلا إذا لم يُختلف في تحسينه.</p><p>قصص الأنبياء مأخوذة من القرآن الكريم والسنة الصحيحة فقط. والمسائل التي اختلفت فيها المذاهب الفقهية تُترك أو يُذكر المذهب.</p><h2>لماذا هذا الحرص</h2><p>قال النبي {saw}: «مَن كذب عليّ متعمداً فليتبوأ مقعده من النار».<span class="ref">صحيح مسلم 3. حديث متواتر رواه جمع من الصحابة.</span></p><h2>نسخة تجريبية</h2><p>رُوجعت جميع مراجع الأحاديث على موقع sunnah.com، وجميع الأسئلة بانتظار مراجعة أهل العلم. إن وجدت خطأ فاضغط «أبلغ عن خطأ» تحت أي إجابة.</p><h2>النصوص</h2><p>نص القرآن الكريم هو نص تنزيل العثماني المطابق لمصحف المدينة.</p><h2>الخصوصية</h2><p>بلا إعلانات ولا حسابات، ويُحفظ تقدمك على هذا الجهاز. ولتحسين الأسئلة يرسل DeenDojo إحصاءات استخدام مجهولة: الأسئلة التي أُجيب عنها صواباً أو خطأً أو تُخطّيت أو أُبلغ عنها، ومدة اللعب، ولغة التطبيق، وسنة الميلاد إن أدخلتها. ولا يُرسل الاسم المستعار إلا لمن بلغ 13 سنة فأكثر، ويمكن إيقافه وحده. لا يُجمع شيء غير ذلك، ولا يُباع ولا يُشارك. ويمكنك إيقاف الإحصاءات من الإعدادات.</p>`}

const statsOn=()=>S.set.stats&&!!STATS_URL;
function age(){return S.by?new Date().getFullYear()-S.by:null}
function stat(e){if(!statsOn())return;e.ts=Date.now();e.sid=SID;SQ.push(e);if(SQ.length>3000)SQ=SQ.slice(-3000);persistQ()}
let sending=false,lastAct=Date.now(),activeAcc=0;
function flushActive(){if(activeAcc>0){stat({t:"a",secs:activeAcc});activeAcc=0}}
function flush(beacon){
  if(!statsOn()||!SQ.length||sending||navigator.onLine===false)return;
  const batch=SQ.slice(0,300);
  const body=JSON.stringify({pid:S.pid,v:VERSION,lang:S.set.lang,by:S.by||"",name:(S.set.shareName&&S.name&&age()!==null&&age()>=13)?S.name:"",ev:batch});
  if(beacon&&navigator.sendBeacon){if(navigator.sendBeacon(STATS_URL,new Blob([body],{type:"text/plain"}))){SQ=SQ.slice(batch.length);persistQ()}return}
  sending=true;
  fetch(STATS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body,keepalive:body.length<60000})
    .then(()=>{SQ=SQ.slice(batch.length);persistQ()}).catch(()=>{}).finally(()=>{sending=false});
}

function fx(s){ const h=HON[S.set.lang][S.set.hon];
  s=String(s).replace(/\{Q:(\d+):(\d+)(?::(\d+)(?:-(\d+))?)?\}/g,(m,su,a,w1,w2)=>`<span class="qa" dir="rtl" lang="ar">﴿${qword(su,a,w1&&+w1,w2&&+w2)}﴾</span>`);
  s=String(s).replace(/\{(saw|as2|as|raf|ra)\}/g,(m,k)=>h[k]);
  if(S.set.lang==="ar") s=s.replace(/«([^»]+)»/g,'<span class="qt">«$1»</span>');
  return s; }

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const liveLands = () => LANDS.filter(l=>l.live);
const beltQs = (l,v) => Q.filter(q=>q.l===l&&q.v===v).sort((a,b)=>a.id.localeCompare(b.id));
function score(l,v){const qs=beltQs(l,v);let r=0,w=0;for(const q of qs){if(S.res[q.id]===1)r++;else if(S.res[q.id]===0)w++}
  return{n:qs.length,r,w,need:Math.ceil(qs.length*PCT)}}
const has = (l,n) => {const c=score(l,n);return c.n>0&&c.r>=c.need};
const hi = l => {let m=0;for(let n=1;n<=TOP;n++)if(has(l,n))m=n;return m};
// overall rank: the highest belt n such that, for every belt up to n, every topic that has questions at that belt holds it
const overall = () => {let r=0;for(let n=1;n<=TOP;n++){let any=false,ok=true;for(const l of liveLands()){if(score(l.id,n).n){any=true;if(!has(l.id,n)){ok=false;break}}}if(!any||!ok)break;r=n}return r};

const esc = x => String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function beltTally(){let avail=0,got=0;for(const l of liveLands())for(let n=1;n<=TOP;n++){if(score(l.id,n).n){avail++;if(has(l.id,n))got++}}return{avail,got,all:avail>0&&got===avail}}
function curStreak(){const D=S.daily;if(!D.last)return 0;const g=dayDiff(D.last,today());
  if(g<=1)return D.streak; if(g===2&&(!D.grace||dayDiff(D.grace,today())>=7))return D.streak; return 0}
function updateStreak(){const tt=today(),D=S.daily;if(D.last===tt)return;
  if(!D.last)D.streak=1; else{const g=dayDiff(D.last,tt);
    if(g===1)D.streak++; else if(g===2&&(!D.grace||dayDiff(D.grace,tt)>=7)){D.streak++;D.grace=tt} else D.streak=1;}
  D.last=tt}

/* ===== Sound and haptics (no music: short chimes only) ===== */
let AC;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,delay,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
  o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.15,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){if(!S.set.sound)return;
  if(k==="ok"){tone(659,.55,"sine",0,.14);tone(988,.8,"sine",.09,.1)}
  else if(k==="bad"){tone(196,.4,"triangle",0,.13)}
  else if(k==="belt"){[523,659,784,1047].forEach((f,i)=>tone(f,1.1,"sine",i*.13,.12))}}
/* Ambient sound: gentle nature sounds generated in the browser. Off by default. */
let AMB=null;
function noiseBuf(a){const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function ambStop(){if(!AMB)return;AMB.timers.forEach(clearInterval);AMB.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});AMB=null}
function ambStart(){
  ambStop();if(S.set.amb==="off")return;const a=ac();if(!a)return;
  const nodes=[],timers=[],master=a.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(.55,a.currentTime+2.5);master.connect(a.destination);nodes.push(master);
  const src=()=>{const n=a.createBufferSource();n.buffer=noiseBuf(a);n.loop=true;n.start();nodes.push(n);return n};
  const filt=(type,f,q)=>{const x=a.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;nodes.push(x);return x};
  const gain=v=>{const g=a.createGain();g.gain.value=v;nodes.push(g);return g};
  if(S.set.amb==="garden"){
    // wind: low filtered noise that slowly swells and fades
    const w=src(),wl=filt("lowpass",420),wg=gain(.05);w.connect(wl).connect(wg).connect(master);
    const lfo=a.createOscillator(),lg=gain(220);lfo.frequency.value=.06;lfo.connect(lg).connect(wl.frequency);lfo.start();nodes.push(lfo);
    // water: a soft trickle
    const t=src(),tb=filt("bandpass",2600,1.1),tg=gain(.008);t.connect(tb).connect(tg).connect(master);
    timers.push(setInterval(()=>{tg.gain.setTargetAtTime(.004+Math.random()*.014,a.currentTime,.05);tb.frequency.setTargetAtTime(2200+Math.random()*900,a.currentTime,.1)},140));
    // an occasional bird
    const bird=()=>{const n=2+(Math.random()*3|0),base=2600+Math.random()*900;for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+i*.13;
      o.frequency.setValueAtTime(base,t0);o.frequency.exponentialRampToValueAtTime(base*1.35,t0+.07);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.022,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+.1);
      o.connect(g).connect(master);o.start(t0);o.stop(t0+.12)}};
    timers.push(setInterval(()=>{if(Math.random()<.35)bird()},4000));
  } else {
    // rain: steady soft hiss, distant rumble and scattered drops
    const r=src(),rh=filt("highpass",900),rl=filt("lowpass",6500),rg=gain(.06);r.connect(rh).connect(rl).connect(rg).connect(master);
    const d=src(),dl=filt("lowpass",220),dg=gain(.03);d.connect(dl).connect(dg).connect(master);
    const drop=()=>{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime,f=1800+Math.random()*2200;o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*.6,t0+.05);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.012,t0+.004);g.gain.exponentialRampToValueAtTime(.0001,t0+.06);o.connect(g).connect(master);o.start(t0);o.stop(t0+.07)};
    timers.push(setInterval(()=>{if(Math.random()<.6)drop()},120));
  }
  AMB={nodes,timers};
}

function landScr(){
  const l=LANDS.find(x=>x.id===V.l);let rungs="";
  for(let n=1;n<=TOP;n++){
    const c=score(l.id,n),live=n<=MAXLIVE&&c.n>0,got=live&&has(l.id,n);
    const st=got?"earned":(live?"open":"soon");
    const lab=got?t("earnedTag"):(live?`${c.r}/${c.n}`:t("soon"));
    const bar=live?`<span class="mbar" aria-hidden="true"><i style="width:${c.n?Math.round(100*c.r/c.n):0}%"></i><b style="inset-inline-start:${PCT*100}%"></b></span>`:"";
    rungs+=`<li><button class="rung ${st}" data-act="belt" data-v="${n}" ${live?"":"disabled"}>${beltSVG(n,56)}<span><b>${beltName(n)}</b><small>${ds(BELTS[n])}</small>${bar}</span><em>${lab}</em></button></li>`;
  }

function nextStep(l,v){for(let n=v+1;n<=TOP;n++)if(score(l,n).n)return{l,v:n};
  const L=liveLands(),i=L.findIndex(x=>x.id===l);for(let k=i+1;k<L.length;k++)for(let n=1;n<=TOP;n++)if(score(L[k].id,n).n)return{l:L[k].id,v:n};return null}
function nextLabel(ns,l){return ns.l===l?t("nextBelt",{belt:beltName(ns.v)}):t("nextTopic",{topic:nm(LANDS.find(x=>x.id===ns.l))})}
function pill(v){return `<span class="bn" style="background:${BELTS[v].c};color:${v<=2?"#1C1C1E":"#FFFFFF"};border-color:${v===1?"var(--bstroke)":BELTS[v].c}">${beltName(v)}</span>`}
function gridScr(){
  const l=LANDS.find(x=>x.id===V.l),v=V.v,qs=beltQs(l.id,v),c=score(l.id,v),got=has(l.id,v);
  const cells=qs.map((q,k)=>{const r=S.res[q.id];const cls=r===1?"ok":(r===0?"bad":"");const mark=r===1?"✓":(r===0?"✗":"");

  const firstOpen=qs.findIndex(q=>S.res[q.id]!==1);
  const status=got?t("holding",{need:c.need,n:c.n}):t("needX",{k:c.need-c.r});

  <div class="bigbar" aria-hidden="true"><i style="width:${c.n?Math.round(100*c.r/c.n):0}%;background:${got?"var(--ok)":"var(--gold)"}"></i><b style="inset-inline-start:${PCT*100}%"></b></div>

}

function quizScr(){

  <div class="qbody ${a?"answered":""}"><div class="qleft"><div class="meta">${beltSVG(q.v,34)}<span>${nm(land)}</span>${pill(q.v)}</div>${beltTrack(q.l,q.v)}

function surahName(n){const r=SURAH[+n-1];return S.set.lang==="ar"?"سورة "+r[0]:"Surah "+r[1]}
const arNum=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function infoHTML(q){let h="",hasQ=false;
  for(const x of q.s){
    if(x.q){hasQ=true;const [su,rg]=x.q.split(":");const [a0,a1]=rg.split("-").map(Number);let vs=[];for(let a=a0;a<=(a1||a0);a++)vs.push(`${QT[su+":"+a]||""} <span class="an">\u06DD${arNum(a)}</span>`);
      h+=`<section class="ib"><h3>${surahName(su)} <bdi dir="ltr">${x.q}</bdi></h3><p class="qa full" dir="rtl" lang="ar">﴿${vs.join(" ")}﴾</p><a href="https://quran.com/${su}/${rg}" target="_blank" rel="noopener">${t("openQuran")}</a></section>`}
    else if(x.b||x.m){const lk=x.b?`https://sunnah.com/bukhari:${x.b}`:(x.ml?`https://sunnah.com/${x.ml}`:"");
      h+=`<section class="ib"><h3>${[x.b?t("bukhari")+" "+x.b:"",x.m?t("muslim")+" "+x.m:""].filter(Boolean).join(" · ")}</h3><p>${x.b&&x.m?t("agreed"):t("sahih")}</p>${(()=>{const k=x.b&&HT["bukhari:"+x.b]?"bukhari:"+x.b:(x.m&&HT["muslim:"+x.m]?"muslim:"+x.m:"");return k?`<p class="ht" dir="rtl" lang="ar">${HT[k]}</p><p class="credit">${t("htCredit")} (${k.startsWith("bukhari")?t("bukhari"):t("muslim")} ${k.split(":")[1]})</p>`:`<p class="muted">${t("hadithSoon")}</p>`})()}${lk?`<a href="${lk}" target="_blank" rel="noopener">${t("openSunnah")}</a>`:""}</section>`}
    else if(x.n){h+=`<section class="ib"><h3>${t(x.n)}</h3><p class="muted">${t(x.n+"Info")}</p></section>`}
  }
  return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${t("info")}"><header><h2>${t("info")}</h2><button class="icon" data-act="closeInfo" aria-label="${t("close")}">${IC.x}</button></header><p>${fx(q.x[li()])}</p>${h}${hasQ?`<p class="credit">${t("tanzil")}</p>`:""}</div></div>`}
function srcHTML(s){return s.map(x=>{
  if(x.q){const [su,ay]=x.q.split(":");return `<a href="https://quran.com/${su}/${ay}" target="_blank" rel="noopener">${surahName(su)} <bdi dir="ltr">${x.q}</bdi></a>`}
  if(x.b||x.m){const parts=[];if(x.b)parts.push(`<a href="https://sunnah.com/bukhari:${x.b}" target="_blank" rel="noopener">${t("bukhari")} ${x.b}</a>`);
    if(x.m)parts.push(x.ml?`<a href="https://sunnah.com/${x.ml}" target="_blank" rel="noopener">${t("muslim")} ${x.m}</a>`:`<p>${t("muslim")} ${x.m}</p>`);
    return parts.join("")+`<p class="grade">${x.b&&x.m?t("agreed"):t("sahih")}</p>`}
  if(x.n)return `<p>${t(x.n)}</p>`;return ""}).join("")}

/* ===== Session mode: 10 adaptive questions across every topic ===== */
const SESSION=10;
function startLevel(){const a=age();if(a===null)return 1.8;if(a<20)return 1.0;if(a<=40)return 1.8;return 2.2}
function curLevel(){return S.lvl==null?startLevel():S.lvl}
function zoneName(L){const b=Math.min(TOP,Math.floor(L)),f=L-b;return (f>=.5&&b<TOP)?t("zoneUp",{a:beltName(b),b:beltName(b+1)}):beltName(b)}
function pickBelt(L,l){let b=Math.floor(L);if(b<TOP&&Math.random()<L-b)b++;b=Math.max(1,Math.min(TOP,b));while(b>1&&!score(l,b).n)b--;return b}
function drawQ(l,b,used){
  const rec=new Set(S.recent),pool=Q.filter(q=>q.l===l&&q.v===b&&!used.has(q.id));if(!pool.length)return null;
  const fresh=pool.filter(q=>!rec.has(q.id)),P=fresh.length?fresh:pool;
  const tier=q=>!(q.id in S.res)?0:(S.res[q.id]===0?1:2),best=Math.min(...P.map(tier)),c=P.filter(q=>tier(q)===best);
  return c[Math.random()*c.length|0]}
function runOf(v){let n=0;for(let k=R.hist.length-1;k>=0;k--){if(R.hist[k]===v)n++;else break}return n}
function sessionNext(){
  let L=curLevel();if(runOf(true)>=3)L+=.5;if(runOf(false)>=2)L-=.5;L=Math.max(1,Math.min(TOP,L));
  const l=R.plan[R.qs.length];let b=pickBelt(L,l),q=drawQ(l,b,R.used);
  for(let d=1;!q&&d<TOP;d++){q=drawQ(l,Math.max(1,b-d),R.used)||drawQ(l,Math.min(TOP,b+d),R.used)}
  if(!q){const any=Q.filter(x=>x.l===l&&!R.used.has(x.id));q=any[Math.random()*any.length|0]}
  R.used.add(q.id);R.qs.push(prep(q))}
function startSession(){
  const ids=liveLands().map(l=>l.id),plan=shuffle(ids.concat(shuffle(ids).slice(0,SESSION-ids.length)));
  R={mode:"session",total:SESSION,plan,used:new Set(),qs:[],i:0,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null,lvl0:curLevel()};
  sessionNext();stat({t:"journey",v:Math.round(curLevel()*10)});go("quiz")}
function endSession(){
  const base=curLevel(),c=R.c,d=c>=8?.4:(c>=5?.1:-.3);S.lvl=Math.max(1,Math.min(TOP,+(base+d).toFixed(2)));R.lvl1=S.lvl;
  S.recent=S.recent.concat(R.qs.map(x=>x.q.id)).slice(-40);updateStreak();stat({t:"journey_end",v:c})}

/* ===== Flow ===== */
function prep(q){return q.t==="tf"?{q,order:[0,1],correct:q.a}:{q,order:shuffle([0,1,2,3]),correct:0}}
function start(mode,pool,extra){if(!pool.length)return;R={mode,qs:shuffle(pool).slice(0,mode==="review"?10:ROUND).map(prep),i:0,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null,...extra};go("quiz")}
function openGrid(l,v){go("grid",{l,v})}
function pickQ(l,v,i){R={mode:"grid",l,v,qs:beltQs(l,v).map(prep),i,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null};go("quiz")}
function startDaily(){start("daily",Q.filter(q=>(LANDS.find(x=>x.id===q.l)||{}).live&&q.v<=MAXLIVE))}
function startReview(){start("review",missedIds().map(id=>QI[id]))}
function answer(k){
  if(R.ans)return;const it=R.qs[R.i],ok=it.order[k]===it.correct,id=it.q.id,l=it.q.l,v=it.q.v;
  stat({t:"q",qid:id,l,v,ok:ok?1:0,first:(id in S.res)?0:1,pick:it.order[k],ms:Date.now()-(R.t0||Date.now())});
  const before=has(l,v),obBefore=overall(),allBefore=beltTally().all;
  R.ans={k,ok};R.hist[R.i]=ok;S.res[id]=ok?1:0;
  if(ok)R.c++;S.stats.a++;if(ok)S.stats.c++;
  if(R.mode==="review"){if(ok){S.missed[id]=(S.missed[id]||0)+1;if(S.missed[id]>=2)delete S.missed[id]}else S.missed[id]=0}
  else if(!ok)S.missed[id]=0;
  const after=has(l,v);R.flash=null;
  if(before!==after){R.flash={type:after?"earned":"lost",l,v};R.changes.push(R.flash);stat({t:"b",l,v,got:after?1:0})}
  const obAfter=overall();R.newTitle=obAfter>obBefore?obAfter:0;
  if(!allBefore&&beltTally().all){R.celebrate=true;S.doneAt=today()}
  save();
  if(R.flash&&R.flash.type==="earned"){sfx("belt");buzz([30,40,30,40,80])}else{sfx(ok?"ok":"bad");buzz(ok?15:[40,50,40])}
  render();
  const c=document.getElementById("card");if(c)c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}
function next(){if(R.mode==="session"&&R.i===R.qs.length-1&&R.qs.length<R.total)sessionNext();if(R.i<R.qs.length-1){R.i++;R.ans=null;R.flash=null;R.newTitle=0;R.t0=Date.now();render();window.scrollTo(0,0);return}finish()}
function finish(){
  if(R.mode==="grid"){openGrid(R.l,R.v);return}
  if(R.mode==="daily")updateStreak();
  if(R.mode==="session")endSession();
  save();go("result");
}

function go(s,extra){V={s,...(extra||{})};render();window.scrollTo(0,0)}
function applySettings(){const h=document.documentElement,st=S.set;
  h.lang=st.lang;h.dir=st.lang==="ar"?"rtl":"ltr";
  if(st.theme==="auto")h.removeAttribute("data-theme");else h.setAttribute("data-theme",st.theme);
  h.setAttribute("data-size",st.size);document.title=T[st.lang].app}
function render(){applySettings();if(!S.onb&&V.s!=="about")V.s="welcome";document.getElementById("app").className="scr-"+V.s;const f={welcome:welcomeScr,home:homeScr,land:landScr,grid:gridScr,quiz:quizScr,result:resultScr,settings:settingsScr,about:aboutScr}[V.s]||homeScr;document.getElementById("app").innerHTML=f()}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&V.s==="welcome"&&e.target.id==="nick"){e.preventDefault();document.querySelector('[data-act="welcomeGo"]').click();return}if(e.key==="Enter"&&V.editName){e.preventDefault();document.querySelector('[data-act="saveName"]').click();return}if(e.key==="Escape"&&V.info){V.info=false;render()}});
document.addEventListener("click",e=>{
  const rp=e.target.closest("[data-rep]");if(rp){stat({t:"r",qid:rp.dataset.rep});flush()}
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const d=el.dataset;
  switch(d.act){
    case "home":go("home");break;
    case "go":go(d.to);break;
    case "land":go("land",{l:d.l});break;
    case "belt":openGrid(d.l||V.l,+d.v);break;
    case "pick":pickQ(V.l,V.v,+d.i);break;
    case "gotoBelt":V.info=false;openGrid(d.l,+d.v);break;
    case "toGrid":V.info=false;openGrid(R.l,R.v);break;
    case "toLand":go("land",{l:V.l});break;
    case "daily":startDaily();break;
    case "session":startSession();break;
    case "fun":{const it=R.qs[R.i],v=+d.v;S.fun[it.q.id]=v;save();stat({t:v>0?"fun_up":"fun_down",qid:it.q.id,l:it.q.l,v:it.q.v});render();toast(t("funThanks"))}break;
    case "review":startReview();break;
    case "ans":answer(+d.k);break;
    case "next":V.info=false;next();break;
    case "skip":{const it=R.qs[R.i];stat({t:"k",qid:it.q.id,l:it.q.l,v:it.q.v});if(R.mode==="session"&&R.i===R.qs.length-1&&R.qs.length<R.total)sessionNext();if(R.i<R.qs.length-1){R.i++;R.ans=null;R.t0=Date.now();render();window.scrollTo(0,0)}else if(R.mode==="grid")openGrid(R.l,R.v);else finish()}break;
    case "welcomeGo":{const n=document.getElementById("nick"),b=document.getElementById("by");S.name=(n?n.value:"").replace(/[<>]/g,"").trim().slice(0,20);S.by=b&&b.value?+b.value:null;S.onb=true;save();stat({t:"p"});flush();go("home")}break;
    case "welcomeSkip":S.onb=true;save();go("home");break;
    case "info":V.info=true;render();break;
    case "closeInfo":V.info=false;if(R)R.celebrate=false;render();break;
    case "scrim":if(e.target===el){V.info=false;if(R)R.celebrate=false;render()}break;
    case "editName":V.editName=true;render();{const i=document.getElementById("nick");if(i){i.focus();i.select()}}break;
    case "saveName":{const i=document.getElementById("nick"),yb=document.getElementById("by");S.name=(i?i.value:"").replace(/[<>]/g,"").trim().slice(0,20);S.by=yb&&yb.value?+yb.value:null;save();stat({t:"p"});flush();V.editName=false;render()}break;
    case "quit":R&&R.mode==="grid"?openGrid(R.l,R.v):go("home");break;
    case "lang":S.set.lang=S.set.lang==="ar"?"en":"ar";save();render();break;
    case "set":S.set[d.k]=d.v;save();render();if(d.k==="amb")ambStart();break;
    case "tog":S.set[d.k]=!S.set[d.k];if(d.k==="stats"&&!S.set.stats){SQ=[];persistQ()}save();render();if(d.k==="sound"&&S.set.sound)sfx("ok");break;
    case "reset":if(!V.confirm){V.confirm=true;render()}else{const keep=S.set;S=def();S.set=keep;save();go("settings");toast(t("resetDone"))}break;
  }
});

/* star-lattice pattern for the Daily panel */
(function(){const p=starPts(9,16,16);const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><polygon points='${p}' fill='none' stroke='%23E7B343' stroke-opacity='.22' stroke-width='1'/></svg>`;
  document.documentElement.style.setProperty("--star",`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='${starPts(15,16,16)}' fill='%23D9A53A'/></svg>")`);
  document.documentElement.style.setProperty("--pat",`url("data:image/svg+xml;utf8,${svg}")`)})();
render();
stat({t:"s"});setTimeout(()=>flush(),3000);
})();
</script>
