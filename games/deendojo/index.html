{"id":"SIR-2-18","l":"sir","v":2,"q":["After Hudaybiyyah, Surah Al-Fath promised the believers they would enter which place in safety?","بعد الحديبية، وعدت سورة الفتح المؤمنين بدخول أيّ مكانٍ آمنين؟"],"o":[["Al-Masjid al-Haram","Jerusalem","Khaybar","Taʾif"],["المسجد الحرام","بيت المقدس","خيبر","الطائف"]],"x":["The promise came true: the believers later entered it, heads shaved or hair shortened, just as the verse described.","قال تعالى: {Q:48:27:7-13}."],"s":[{"q":"48:27"}]},
{"id":"SIR-2-19","l":"sir","v":2,"q":["In Surah At-Tawbah, when told to go forth in the cause of Allah, what did some cling heavily to?","في سورة التوبة، إذا قيل لبعضهم انفروا في سبيل الله، إلى أيّ شيءٍ اثّاقلوا؟"],"o":[["The earth","Their horses","Their money","Their homes"],["الأرض","خيولهم","أموالهم","بيوتهم"]],"x":["﴾…you cling heavily to the earth? Are you satisfied with the life of this world rather than the Hereafter?﴿","قال تعالى: {Q:9:38:1-15}."],"s":[{"q":"9:38"}]},
{"id":"SIR-2-20","l":"sir","v":2,"q":["According to Surah Al-Israʾ, why was the Prophet {saw} taken on the Night Journey?","بحسب سورة الإسراء، لماذا أُسري بالنبي {saw}؟"],"o":[["To be shown some of Allah’s signs","To meet the kings","To trade in Jerusalem","To escape Quraysh"],["ليريه الله من آياته","ليلقى الملوك","ليتاجر في القدس","ليفرّ من قريش"]],"x":["The verse begins by glorifying Allah and ends: ﴾Indeed, He is the All-Hearing, the All-Seeing﴿.","قال تعالى: {Q:17:1:15-17}."],"s":[{"q":"17:1"}]},
{"id":"SIR-2-21","l":"sir","v":2,"q":["Before the qiblah changed, what did Allah see the Prophet {saw} doing?","قبل تحويل القبلة، ماذا رأى الله من النبي {saw}؟"],"o":[["Turning his face towards the sky","Weeping at night","Travelling to Jerusalem","Asking the Companions"],["تقلّب وجهه في السماء","البكاء بالليل","السفر إلى القدس","سؤال الصحابة"]],"x":["He hoped for a change, and Allah promised to turn him towards a qiblah that would please him.","قال تعالى: {Q:2:144:1-6}."],"s":[{"q":"2:144"}]},
{"id":"SIR-2-22","l":"sir","v":2,"q":["According to Surah Al-Baqarah, who would ask what turned the Muslims away from their former qiblah?","بحسب سورة البقرة، مَن سيقول: ما ولّاهم عن قبلتهم التي كانوا عليها؟"],"o":[["The foolish among the people","The angels","The Companions","The kings of Persia"],["السفهاء من الناس","الملائكة","الصحابة","ملوك فارس"]],"x":["The reply: to Allah belong the east and the west, and He guides whom He wills.","قال تعالى: {Q:2:142:1-11}."],"s":[{"q":"2:142"}]},
{"id":"SIR-2-23","l":"sir","v":2,"q":["According to Surah Al ʿImran, what would have happened had the Prophet {saw} been harsh and hard-hearted?","بحسب سورة آل عمران، ماذا كان سيحدث لو كان النبي {saw} فظّاً غليظ القلب؟"],"o":[["People would have dispersed from around him","He would have conquered faster","He would have been a king","Nothing would change"],["لانفضّوا من حوله","لفتح أسرع","لصار ملكاً","لا شيء يتغير"]],"x":["Allah praises the Prophet’s {saw} gentleness, which kept people close to him.","قال تعالى: {Q:3:159:1-14}."],"s":[{"q":"3:159"}]},
{"id":"SIR-3-01","l":"sir","v":3,"q":["What is the treaty made with Quraysh in 6 AH called?","ما اسم الصلح الذي عُقد مع قريش سنة 6 هـ؟"],"o":[["Hudaybiyyah","ʿAqabah","Taʾif","Tabuk"],["الحديبية","العقبة","الطائف","تبوك"]],"x":["On the way back, Allah revealed that it was ﴾a clear victory﴿, even though many had seen the terms as a setback.","نزلت سورة الفتح في طريق العودة منه."],"s":[{"n":"seerah"},{"q":"48:1"}]},
{"id":"SIR-3-02","l":"sir","v":3,"q":["Which mosque did the Prophet {saw} found first on reaching Madinah?","ما أول مسجد أسسه النبي {saw} عند وصوله إلى المدينة؟"],"o":[["Masjid Quba","Al-Masjid an-Nabawi","Masjid al-Qiblatayn","Masjid al-Jumuʿah"],["مسجد قباء","المسجد النبوي","مسجد القبلتين","مسجد الجمعة"]],"x":["He stayed at Quba on the outskirts of Madinah and founded its mosque before entering the city.","نزل بقباء في أطراف المدينة وأسس مسجدها قبل دخوله المدينة."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-03","l":"sir","v":3,"q":["In which year of the Hijrah was Makkah conquered?","في أي سنة هجرية كان فتح مكة؟"],"o":[["8 AH","2 AH","5 AH","10 AH"],["8 هـ","2 هـ","5 هـ","10 هـ"]],"x":["He entered Makkah almost without fighting and forgave its people, who had opposed him for years.","كان فتح مكة في رمضان سنة 8 هـ."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-04","l":"sir","v":3,"q":["In which year of the Hijrah was the Farewell Pilgrimage?","في أي سنة هجرية كانت حجة الوداع؟"],"o":[["10 AH","8 AH","6 AH","9 AH"],["10 هـ","8 هـ","6 هـ","9 هـ"]],"x":["It was his only Hajj after the Hijrah, a few months before his passing in 11 AH.","هي حجته الوحيدة بعد الهجرة، وكانت قبل وفاته سنة 11 هـ بأشهر."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-05","l":"sir","v":3,"q":["Which uncle raised and protected the Prophet {saw} after his grandfather died?","أي أعمام النبي {saw} كفله وحماه بعد وفاة جده؟"],"o":[["Abu Talib","Abu Lahab","Hamzah","Al-ʿAbbas"],["أبو طالب","أبو لهب","حمزة","العباس"]],"x":["Abu Talib took him in after the death of ʿAbd al-Muttalib and defended him against Quraysh for years.","كفله أبو طالب بعد وفاة عبد المطلب، ودافع عنه أمام قريش سنين."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-06","l":"sir","v":3,"q":["In which year of the Hijrah was the Battle of Badr?","في أي سنة هجرية كانت غزوة بدر؟"],"o":[["2 AH","1 AH","3 AH","5 AH"],["2 هـ","1 هـ","3 هـ","5 هـ"]],"x":["It fell in Ramadan of 2 AH. The Quran calls it the day the two armies met.","كانت غزوة بدر في رمضان سنة 2 هـ."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-07","l":"sir","v":3,"q":["Waraqah ibn Nawfal said the angel who came to the Prophet {saw} was the same one Allah had sent down to which prophet?","قال ورقة بن نوفل إن الذي جاء النبيَّ {saw} هو الناموس الذي أنزله الله على أيّ نبي؟"],"o":[["Musa","ʿIsa","Ibrahim","Nuh"],["موسى","عيسى","إبراهيم","نوح"]],"x":["Waraqah recognised the angel as the same one sent to earlier prophets.","قال ورقة: «هَذَا النَّامُوسُ الَّذِي نَزَّلَ اللَّهُ عَلَى مُوسَى»."],"s":[{"b":3}]},
{"id":"SIR-3-08","l":"sir","v":3,"q":["How does Surah Al-Ahzab describe the believers when the enemy came at them from above and below?","بماذا وصفت سورة الأحزاب حال المؤمنين حين جاءهم العدو من فوقهم ومن أسفل منهم؟"],"o":[["Eyes shifted and hearts reached the throats","They fled to the mountains","They sought a treaty","They were joyful and calm"],["زاغت الأبصار وبلغت القلوب الحناجر","فرّوا إلى الجبال","طلبوا الصلح","كانوا فرحين مطمئنين"]],"x":["The believers were shaken severely, and some began to have doubts about Allah.","قال تعالى: {Q:33:10:1-13}."],"s":[{"q":"33:10"}]},
{"id":"SIR-3-09","l":"sir","v":3,"q":["What did Khadijah {raf} say to reassure the Prophet {saw} after the first revelation?","بماذا طمأنت خديجة {raf} النبيَّ {saw} بعد أول الوحي؟"],"o":[["“By Allah, Allah will never disgrace you.”","“It was only a dream.”","“Let us leave Makkah.”","“Tell no one.”"],["«كلا والله ما يخزيك الله أبدا»","«إنما هو حلم»","«لنخرج من مكة»","«لا تخبر أحدا»"]],"x":["She reminded him that he kept family ties, carried others’ burdens, honoured guests and helped in times of need.","قالت: «كَلاَّ وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ»."],"s":[{"b":3}]},
{"id":"SIR-3-10","l":"sir","v":3,"q":["In Surah Al-Anfal, with how many angels did Allah say He would reinforce the believers at Badr?","في سورة الأنفال، بكم من الملائكة وعد الله أن يمدّ المؤمنين يوم بدر؟"],"o":[["A thousand","Three thousand","Five hundred","Ten thousand"],["ألف","ثلاثة آلاف","خمس مئة","عشرة آلاف"]],"x":["Allah answered their call for help with a thousand angels, one after another.","قال تعالى: {Q:8:9}."],"s":[{"q":"8:9"}]},
{"id":"SIR-3-11","l":"sir","v":3,"q":["Which was the first prayer the Prophet {saw} prayed facing the Kaʿbah?","ما أول صلاةٍ صلّاها النبي {saw} نحو الكعبة؟"],"o":[["ʿAsr","Fajr","Maghrib","Jumuʿah"],["العصر","الفجر","المغرب","الجمعة"]],"x":["The first prayer he prayed towards the Kaʿbah was the ʿAsr prayer, with people praying behind him.","«وَأَنَّهُ صَلَّى أَوَّلَ صَلاَةٍ صَلاَّهَا صَلاَةَ الْعَصْرِ»."],"s":[{"b":40}]},
{"id":"SIR-3-12","l":"sir","v":3,"q":["Before Badr, Allah promised the believers one of how many groups?","قبل بدر، وعد الله المؤمنين إحدى كم طائفة؟"],"o":[["Two","Three","Four","Seven"],["اثنتين","ثلاث","أربع","سبع"]],"x":["They wished the unarmed one would be theirs, but Allah willed to establish the truth.","قال تعالى: {Q:8:7:1-7}."],"s":[{"q":"8:7"}]},
{"id":"SIR-3-13","l":"sir","v":3,"q":["At Badr, where was the caravan in relation to the believers?","يوم بدر، أين كان الركب بالنسبة للمؤمنين؟"],"o":[["Below them","Behind the enemy","On the mountain","Inside Madinah"],["أسفل منهم","خلف العدو","على الجبل","داخل المدينة"]],"x":["The believers were on the near side of the valley, the enemy on the far side, and the caravan below them.","قال تعالى: {Q:8:42:1-10}."],"s":[{"q":"8:42"}]},
{"id":"SIR-3-14","l":"sir","v":3,"q":["When the armies met at Badr, how did Allah make the enemy appear in the believers’ eyes?","لمّا التقى الجمعان يوم بدر، كيف أرى الله المؤمنين عدوّهم؟"],"o":[["Few","Many","Invisible","Angelic"],["قليلاً","كثيراً","غير مرئيين","كالملائكة"]],"x":["And He made the believers appear few in their eyes, so that Allah would accomplish a matter already decreed.","قال تعالى: {Q:8:44:1-10}."],"s":[{"q":"8:44"}]},
{"id":"SIR-3-15","l":"sir","v":3,"q":["At Uhud, after Allah’s promise was fulfilled, what did some believers do, according to Surah Al ʿImran?","يوم أحد، بعد أن صدقهم الله وعده، ماذا فعل بعض المؤمنين بحسب سورة آل عمران؟"],"o":[["Lost heart, disputed and disobeyed","Asked for a treaty","Returned to Makkah","Fasted"],["فشلوا وتنازعوا وعصوا","طلبوا الصلح","رجعوا إلى مكة","صاموا"]],"x":["Some of them desired this world, and some desired the Hereafter; yet Allah pardoned them.","قال تعالى: {Q:3:152:1-20}."],"s":[{"q":"3:152"}]},
{"id":"SIR-3-16","l":"sir","v":3,"q":["As the believers fled up the hill at Uhud, where was the Messenger {saw}, according to Surah Al ʿImran?","لمّا صعد المؤمنون يوم أحد ولا يلوون على أحد، أين كان الرسول {saw}؟"],"o":[["Behind them, calling them back","Ahead of them","In Madinah","On a horse at the front"],["خلفهم يدعوهم في أخراهم","أمامهم","في المدينة","على فرس في المقدمة"]],"x":["Allah repaid them with distress upon distress, so they would not grieve over what they had missed.","قال تعالى: {Q:3:153:1-10}."],"s":[{"q":"3:153"}]},
{"id":"SIR-3-17","l":"sir","v":3,"q":["Which old name of Madinah appears in Surah Al-Ahzab?","ما الاسم القديم للمدينة الذي ورد في سورة الأحزاب؟"],"o":[["Yathrib","Bakkah","Taybah","Quba"],["يثرب","بكة","طيبة","قباء"]],"x":["A group said: O people of Yathrib, there is no stand for you, so go back.","قال تعالى: {Q:33:13:1-10}."],"s":[{"q":"33:13"}]},
{"id":"SIR-3-18","l":"sir","v":3,"q":["How did the Battle of the Confederates end, according to Surah Al-Ahzab?","كيف انتهت غزوة الأحزاب بحسب سورة الأحزاب؟"],"o":[["Allah turned them back in their rage, having gained nothing","The believers were defeated","A treaty was signed","The siege lasted a year"],["ردّهم الله بغيظهم لم ينالوا خيراً","هُزم المؤمنون","عُقد صلح","استمر الحصار سنة"]],"x":["Allah spared the believers the fighting. The verse ends: Allah is ever Powerful and Mighty.","قال تعالى: {Q:33:25}."],"s":[{"q":"33:25"}]},
{"id":"SIR-3-19","l":"sir","v":3,"q":["Where does Surah Al-Fath say Allah held back the hands of both sides from each other?","أين قالت سورة الفتح إن الله كفّ أيدي الفريقين عن بعضهما؟"],"o":[["In the valley of Makkah","At Badr","In Madinah","At Tabuk"],["ببطن مكة","ببدر","بالمدينة","بتبوك"]],"x":["﴾It is He who withheld their hands from you and your hands from them within Makkah.﴿","قال تعالى: {Q:48:24:1-9}."],"s":[{"q":"48:24"}]},
{"id":"SIR-3-20","l":"sir","v":3,"q":["How many were left behind until the earth, vast as it is, felt narrow to them, before Allah accepted their repentance?","كم كان الذين خُلّفوا حتى ضاقت عليهم الأرض بما رحبت ثم تاب الله عليهم؟"],"o":[["Three","Seven","Ten","Two"],["ثلاثة","سبعة","عشرة","اثنان"]],"x":["They had stayed behind without an excuse. They were accepted once they knew there was no refuge from Allah except in Him.","قال تعالى: {Q:9:118:1-11}."],"s":[{"q":"9:118"}]},
{"id":"SIR-3-21","l":"sir","v":3,"q":["In Surah At-Tawbah, what did some people build ﴾to cause harm and disbelief and division among the believers﴿?","في سورة التوبة، ماذا اتخذ بعضهم {Q:9:107:4-8}؟"],"o":[["A mosque","A fortress","A market","A wall"],["مسجداً","حصناً","سوقاً","جداراً"]],"x":["Allah told the Prophet {saw} never to pray in it, and praised instead a mosque founded on piety.","قال تعالى: {Q:9:107:1-8}."],"s":[{"q":"9:107"}]},
{"id":"SIR-3-22","l":"sir","v":3,"q":["Who said: ﴾If we return to Madinah, the more honourable will surely expel the more humble﴿?","مَن قالوا: {Q:63:8:2-9}؟"],"o":[["The hypocrites","The Ansar","The Muhajirun","The people of Taʾif"],["المنافقون","الأنصار","المهاجرون","أهل الطائف"]],"x":["Allah answered: honour belongs to Allah, His Messenger and the believers, but the hypocrites do not know.","قال تعالى: {Q:63:8}."],"s":[{"q":"63:8"}]},
{"id":"SIR-4-01","l":"sir","v":4,"q":["How many years did the Prophet {saw} stay in Makkah after revelation began?","كم سنة مكث النبي {saw} في مكة بعد بدء الوحي؟"],"o":[["13","10","23","7"],["13","10","23","7"]],"x":["Ibn ʿAbbas {ra}: he stayed thirteen years in Makkah, then was commanded to emigrate and stayed ten years in Madinah.","قال ابن عباس {ra}: مكث ثلاث عشرة سنة، ثم أُمر بالهجرة فمكث بالمدينة عشر سنين."],"s":[{"b":3851}]},
{"id":"SIR-4-02","l":"sir","v":4,"q":["Which Companion is the only one mentioned by name in the Quran?","من الصحابي الوحيد الذي ذُكر اسمه في القرآن؟"],"o":[["Zayd ibn Harithah","Abu Bakr","ʿUmar","Bilal"],["زيد بن حارثة","أبو بكر","عمر","بلال"]],"x":["Zayd {ra} is the only Companion named in the Quran.","ذُكر زيد {ra} باسمه في سورة الأحزاب."],"s":[{"q":"33:37"}]},
{"id":"SIR-4-03","l":"sir","v":4,"q":["The Pledges of al-ʿAqabah were made with people from which city?","مِن أيّ مدينةٍ كان الذين بايعوا النبي {saw} في العقبة؟"],"o":[["Yathrib (Madinah)","Taʾif","Yemen","Abyssinia"],["يثرب (المدينة)","الطائف","اليمن","الحبشة"]],"x":["Believers from Yathrib pledged at al-ʿAqabah to support the Prophet {saw}, which opened the way for his move to their city.","مهّدت هاتان البيعتان للهجرة إلى المدينة."],"s":[{"n":"seerah"}]},
{"id":"SIR-4-04","l":"sir","v":4,"q":["In which year of the Hijrah was the Battle of Uhud?","في أي سنة هجرية كانت غزوة أحد؟"],"o":[["3 AH","2 AH","5 AH","7 AH"],["3 هـ","2 هـ","5 هـ","7 هـ"]],"x":["Uhud was fought in Shawwal of 3 AH, beside the mountain north of Madinah.","كانت غزوة أحد في شوال سنة 3 هـ عند الجبل شمال المدينة."],"s":[{"n":"seerah"}]},
{"id":"SIR-4-05","l":"sir","v":4,"q":["The expedition to Tabuk in 9 AH set out against which power?","إلى مَن خرج النبي {saw} في غزوة تبوك سنة 9 هـ؟"],"o":[["The Byzantines","The Persians","Quraysh","Abyssinia"],["الروم","الفرس","قريش","الحبشة"]],"x":["It was his last military expedition, made in intense heat, and the Quran speaks of those who went and those who stayed behind.","كانت آخر غزواته، وتحدثت عنها سورة التوبة."],"s":[{"n":"seerah"}]},
{"id":"SIR-4-06","l":"sir","v":4,"q":["For how long did the Prophet {saw} pray towards Bayt al-Maqdis after arriving in Madinah?","كم صلّى النبي {saw} نحو بيت المقدس بعد قدومه المدينة؟"],"o":[["Sixteen or seventeen months","Three years","Six months","Ten years"],["ستة عشر أو سبعة عشر شهراً","ثلاث سنين","ستة أشهر","عشر سنين"]],"x":["Al-Baraʾ {ra} reported it, adding that the Prophet {saw} loved to face the Kaʿbah.","«وَأَنَّهُ صَلَّى قِبَلَ بَيْتِ الْمَقْدِسِ سِتَّةَ عَشَرَ شَهْرًا، أَوْ سَبْعَةَ عَشَرَ شَهْرًا»."],"s":[{"b":40}]},
{"id":"SIR-4-07","l":"sir","v":4,"q":["In the cave, what did Abu Bakr {ra} say would happen if one of the pursuers looked down at his feet?","في الغار، ماذا قال أبو بكر {ra} لو نظر أحد المشركين تحت قدميه؟"],"o":[["He would see us","He would hear us","He would call the others","He would leave"],["لأبصرنا","لسمعنا","لنادى أصحابه","لانصرف"]],"x":["The Prophet {saw} answered: what do you think of two, the third of whom is Allah?","قال: «لَوْ أَنَّ أَحَدَهُمْ نَظَرَ تَحْتَ قَدَمَيْهِ لأَبْصَرَنَا»."],"s":[{"b":3653,"m":2381}]},
{"id":"SIR-4-09","l":"sir","v":4,"q":["Before revelation began, what came to be beloved to the Prophet {saw}?","قبل نزول الوحي، ماذا حُبّب إلى النبي {saw}؟"],"o":[["Seclusion","Travel","Trade","Poetry"],["الخلاء","السفر","التجارة","الشعر"]],"x":["Seclusion became beloved to him, and he would worship in the Cave of Hiraʾ.","«ثُمَّ حُبِّبَ إِلَيْهِ الْخَلاَءُ»."],"s":[{"b":3}]},
{"id":"SIR-4-10","l":"sir","v":4,"q":["According to ʿAʾishah {raf}, how did revelation first begin?","كيف بدأ الوحي كما روت عائشة {raf}؟"],"o":[["With true dreams in sleep","With a voice from the sky","With a written tablet","With a visit to Jerusalem"],["بالرؤيا الصالحة في النوم","بصوت من السماء","بلوح مكتوب","برحلة إلى بيت المقدس"]],"x":["Every dream he saw came true like the light of daybreak.","«أَوَّلُ مَا بُدِئَ بِهِ رَسُولُ اللَّهِ صلى الله عليه وسلم مِنَ الْوَحْىِ الرُّؤْيَا الصَّالِحَةُ فِي النَّوْمِ»."],"s":[{"b":3}]},
{"id":"SIR-4-11","l":"sir","v":4,"q":["Waraqah ibn Nawfal wished he would be alive when what happened?","تمنّى ورقة بن نوفل أن يكون حياً حين يحدث ماذا؟"],"o":[["When the Prophet’s people drive him out","When the Kaʿbah is rebuilt","When Makkah is conquered","When the Prophet marries"],["حين يخرجه قومه","حين تُبنى الكعبة","حين تُفتح مكة","حين يتزوج النبي"]],"x":["The Prophet {saw} asked in surprise: will they drive me out? Waraqah said every man who brought such a message faced hostility.","قال ورقة: «لَيْتَنِي أَكُونُ حَيًّا إِذْ يُخْرِجُكَ قَوْمُكَ»."],"s":[{"b":3}]},
{"id":"SIR-4-12","l":"sir","v":4,"q":["According to Surah An-Najm, where did the Prophet {saw} see Jibril a second time?","بحسب سورة النجم، أين رأى النبي {saw} جبريل مرةً أخرى؟"],"o":[["At the Lote Tree of the Utmost Boundary","At the Kaʿbah","In the Cave of Hiraʾ","On Mount Uhud"],["عند سدرة المنتهى","عند الكعبة","في غار حراء","على جبل أحد"]],"x":["﴾And he certainly saw him in another descent, at the Lote Tree of the Utmost Boundary.﴿","قال تعالى: {Q:53:13} {Q:53:14}."],"s":[{"q":"53:13-14"}]},
{"id":"SIR-4-13","l":"sir","v":4,"q":["In Surah An-Najm, how close did the angel come?","في سورة النجم، كم كان قُرب الملَك؟"],"o":[["Two bow-lengths or nearer","A mile","Ten steps","An arm’s length"],["قاب قوسين أو أدنى","ميلاً","عشر خطوات","طول ذراع"]],"x":["So close that the angel came within two bow-lengths or nearer, and revealed to Allah’s servant what He revealed.","قال تعالى: {Q:53:9}."],"s":[{"q":"53:9"}]},
{"id":"SIR-4-14","l":"sir","v":4,"q":["What does Surah Al-Anfal call the day the two armies met at Badr?","بماذا سمّت سورة الأنفال يوم التقى الجمعان؟"],"o":[["The Day of the Criterion (al-Furqan)","The Day of Victory","The Day of the Trench","The Day of the Tree"],["يوم الفرقان","يوم النصر","يوم الخندق","يوم الشجرة"]],"x":["The day truth was distinguished from falsehood.","قال تعالى: {Q:8:41:24-28}."],"s":[{"q":"8:41"}]},
{"id":"SIR-4-15","l":"sir","v":4,"q":["Before Uhud, what was the Prophet {saw} doing when he left his family early in the morning?","قبل أحد، ماذا كان يفعل النبي {saw} حين غدا من أهله؟"],"o":[["Assigning the believers their battle positions","Leading the Fajr prayer in Quba","Visiting Makkah","Meeting a delegation"],["يبوّئ المؤمنين مقاعد للقتال","يصلي الفجر في قباء","يزور مكة","يستقبل وفداً"]],"x":["He left home early to place the believers in their positions, and Allah was hearing and knowing.","قال تعالى: {Q:3:121}."],"s":[{"q":"3:121"}]},
{"id":"SIR-4-16","l":"sir","v":4,"q":["What did Allah send against the Confederates, according to Surah Al-Ahzab?","بحسب سورة الأحزاب، ماذا أرسل الله على الأحزاب؟"],"o":[["A wind, and soldiers you did not see","A flood","An earthquake","Birds with stones"],["ريحاً وجنوداً لم تروها","طوفاناً","زلزالاً","طيراً بالحجارة"]],"x":["The verse reminds the believers to remember Allah’s favour when armies came against them.","قال تعالى: {Q:33:9:8-16}."],"s":[{"q":"33:9"}]},
{"id":"SIR-4-17","l":"sir","v":4,"q":["At Hudaybiyyah, what did the disbelievers put into their hearts, according to Surah Al-Fath?","في الحديبية، ماذا جعل الكفار في قلوبهم بحسب سورة الفتح؟"],"o":[["The zealotry of ignorance (hamiyyah)","Fear of the Muslims","Love of peace","Faith"],["حمية الجاهلية","الخوف من المسلمين","حب السلام","الإيمان"]],"x":["The believers held firm, and Allah made them keep to the word of piety.","قال تعالى: {Q:48:26:1-9}."],"s":[{"q":"48:26"}]},
{"id":"SIR-4-18","l":"sir","v":4,"q":["At Hudaybiyyah, what was held back from reaching its place of sacrifice?","في الحديبية، ما الذي مُنع أن يبلغ محلّه؟"],"o":[["The sacrificial animals (al-hady)","The Kaʿbah’s cover","The water supply","The caravan"],["الهدي","كسوة الكعبة","الماء","القافلة"]],"x":["The Muslims were prevented from reaching the Sacred Mosque, and the animals were held back from their place of sacrifice.","قال تعالى: {Q:48:25:1-12}."],"s":[{"q":"48:25"}]},
{"id":"SIR-4-19","l":"sir","v":4,"q":["Complete: ﴾Go forth, whether light or…﴿","أكمل: {Q:9:41:1-2} ..."],"o":[["heavy","young","rich","near"],["ثقالاً","شباباً","أغنياء","قريبين"]],"x":["The verse continues: and strive with your wealth and your lives in the cause of Allah.","قال تعالى: {Q:9:41:1-9}."],"s":[{"q":"9:41"}]},
{"id":"SIR-4-21","l":"sir","v":4,"q":["Complete: ﴾Among the believers are men who have been true to what they…﴿","أكمل: {Q:33:23:1-4} ..."],"o":[["promised Allah","owned","wrote down","inherited"],["عاهدوا الله عليه","ملكوه","كتبوه","ورثوه"]],"x":["Some have fulfilled their vow, and some are still waiting, and they have not changed in the least.","قال تعالى: {Q:33:23}."],"s":[{"q":"33:23"}]},
{"id":"SIR-4-22","l":"sir","v":4,"q":["In Surah Al-Hashr, whom did Allah expel from their homes ﴾at the first gathering﴿?","في سورة الحشر، مَن أخرج الله من ديارهم لأول الحشر؟"],"o":[["Those who disbelieved among the People of the Book","The hypocrites of Madinah","The Quraysh","The people of Taʾif"],["الذين كفروا من أهل الكتاب","منافقو المدينة","قريش","أهل الطائف"]],"x":["They thought their fortresses would protect them from Allah, but He came at them from where they did not expect.","قال تعالى: {Q:59:2:1-12}."],"s":[{"q":"59:2"}]},
{"id":"SIR-5-01","l":"sir","v":5,"q":["How many times did the angel press the Prophet {saw} tightly before revealing the first verses?","كم مرةً غطّ الملك النبيَّ {saw} قبل أن يقرأ عليه أوائل سورة العلق؟"],"o":[["Three","Once","Twice","Seven"],["ثلاث مرات","مرة واحدة","مرتين","سبع مرات"]],"x":["After the angel pressed him the final time, he recited the opening verses of Surah Al-ʿAlaq.","«فَأَخَذَنِي فَغَطَّنِي الثَّالِثَةَ، ثُمَّ أَرْسَلَنِي»."],"s":[{"b":3}]},
{"id":"SIR-5-02","l":"sir","v":5,"q":["Waraqah said that no man ever came with what the Prophet {saw} brought except that he was…","قال ورقة: لم يأتِ رجلٌ قط بمثل ما جئت به إلا..."],"o":[["treated with hostility","made a king","praised by all","given great wealth"],["عودي","مُلّك","مُدح","أُعطي مالاً"]],"x":["Waraqah said every messenger before him had faced hostility, and promised to support him if he lived.","«لَمْ يَأْتِ رَجُلٌ قَطُّ بِمِثْلِ مَا جِئْتَ بِهِ إِلاَّ عُودِيَ»."],"s":[{"b":3}]},
{"id":"SIR-5-03","l":"sir","v":5,"q":["What was Waraqah ibn Nawfal’s condition when Khadijah {raf} brought the Prophet {saw} to him?","ما حال ورقة بن نوفل حين جاءته خديجة {raf} بالنبي {saw}؟"],"o":[["An old man who had gone blind","A young scholar","A merchant returning from Syria","A leader of Quraysh"],["شيخ كبير قد عمي","عالم شاب","تاجر عائد من الشام","سيد من سادات قريش"]],"x":["He was an old man who had lost his sight, yet he recognised the truth at once.","«وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ»."],"s":[{"b":3}]},
{"id":"SIR-5-04","l":"sir","v":5,"q":["In which language did Waraqah write from the Injil?","بأيّ لغةٍ كان ورقة يكتب من الإنجيل؟"],"o":[["Hebrew","Arabic","Greek","Syriac"],["العبرانية","العربية","اليونانية","السريانية"]],"x":["He used to write the Hebrew scripture, writing from the Injil in Hebrew.","«وَكَانَ يَكْتُبُ الْكِتَابَ الْعِبْرَانِيَّ، فَيَكْتُبُ مِنَ الإِنْجِيلِ بِالْعِبْرَانِيَّةِ»."],"s":[{"b":3}]},
{"id":"SIR-5-05","l":"sir","v":5,"q":["What happened after Waraqah ibn Nawfal passed away?","ماذا حدث بعد وفاة ورقة بن نوفل؟"],"o":[["The revelation paused","The Hijrah began","Khadijah passed away","The qiblah changed"],["فتر الوحي","بدأت الهجرة","توفيت خديجة","حُوّلت القبلة"]],"x":["Waraqah passed away soon after, and revelation paused for a while.","«ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ وَفَتَرَ الْوَحْىُ»."],"s":[{"b":3}]},
{"id":"SIR-5-06","l":"sir","v":5,"q":["According to Ibn ʿAbbas {ra}, how many years did the Prophet {saw} live in Madinah?","كم سنةً عاش النبي {saw} في المدينة كما روى ابن عباس {ra}؟"],"o":[["10","13","8","12"],["10","13","8","12"]],"x":["He was commanded to emigrate, went to Madinah and stayed there ten years.","«ثُمَّ أُمِرَ بِالْهِجْرَةِ، فَهَاجَرَ إِلَى الْمَدِينَةِ، فَمَكَثَ بِهَا عَشْرَ سِنِينَ»."],"s":[{"b":3851}]},
{"id":"SIR-5-07","l":"sir","v":5,"q":["When the Prophet {saw} first arrived in Madinah, with whom did he stay, according to al-Baraʾ {ra}?","لمّا قدم النبي {saw} المدينة، على مَن نزل أولاً كما روى البراء {ra}؟"],"o":[["His grandfathers or maternal uncles from the Ansar","Abu Bakr’s family","The Jews of Madinah","The people of Quba only"],["أجداده أو أخواله من الأنصار","آل أبي بكر","يهود المدينة","أهل قباء وحدهم"]],"x":["Al-Baraʾ said he stayed with his grandfathers, or his maternal uncles, from the Ansar.","«نَزَلَ عَلَى أَجْدَادِهِ ـ أَوْ قَالَ أَخْوَالِهِ ـ مِنَ الأَنْصَارِ»."],"s":[{"b":40}]},
{"id":"SIR-5-08","l":"sir","v":5,"q":["In Surah Al ʿImran, how many angels were first promised to reinforce the believers?","في سورة آل عمران، بكم من الملائكة وُعد المؤمنون أولاً؟"],"o":[["Three thousand","One thousand","Five thousand","Ten thousand"],["ثلاثة آلاف","ألف","خمسة آلاف","عشرة آلاف"]],"x":["﴾Is it not enough that your Lord reinforces you with three thousand angels sent down?﴿","قال تعالى: {Q:3:124}."],"s":[{"q":"3:124"}]},
{"id":"SIR-5-09","l":"sir","v":5,"q":["In Surah Al ʿImran, if the believers were patient and mindful, how many marked angels were promised?","في سورة آل عمران، بكم من الملائكة المسوّمين وُعد المؤمنون إن صبروا واتقوا؟"],"o":[["Five thousand","Three thousand","One thousand","Seven thousand"],["خمسة آلاف","ثلاثة آلاف","ألف","سبعة آلاف"]],"x":["The promise came with a condition: patience and mindfulness of Allah.","قال تعالى: {Q:3:125}."],"s":[{"q":"3:125"}]},
{"id":"SIR-5-10","l":"sir","v":5,"q":["After the pledge under the tree, what did Allah reward the believers with, as Surah Al-Fath states?","بماذا أثاب الله المؤمنين بعد بيعة الشجرة كما في سورة الفتح؟"],"o":[["A near victory","Great wealth","Rain","A new qiblah"],["فتحاً قريباً","مالاً كثيراً","مطراً","قبلة جديدة"]],"x":["Allah knew what was in their hearts, and rewarded them with a near victory and much spoils.","قال تعالى: {Q:48:18:14-19}."],"s":[{"q":"48:18"}]},
{"id":"SIR-5-11","l":"sir","v":5,"q":["After the Muslims turned back at Hunayn, what did Allah send down, according to Surah At-Tawbah?","بعد أن ولّى المسلمون يوم حنين، ماذا أنزل الله كما في سورة التوبة؟"],"o":[["His tranquillity and soldiers you did not see","A strong wind","Rain from the sky","A new command to fight"],["سكينته وجنوداً لم تروها","ريحاً شديدة","مطراً من السماء","أمراً جديداً بالقتال"]],"x":["Allah sent down His tranquillity upon His Messenger and the believers, and soldiers they did not see.","قال تعالى: {Q:9:26:1-12}."],"s":[{"q":"9:25-26"}]},
{"id":"SIR-5-12","l":"sir","v":5,"q":["According to Surah Al-Israʾ, what has Allah done to the surroundings of al-Masjid al-Aqsa?","بحسب سورة الإسراء، ماذا فعل الله بما حول المسجد الأقصى؟"],"o":[["Blessed them","Protected them with walls","Made them a desert","Filled them with rivers"],["بارك حوله","حصّنه بالأسوار","جعله صحراء","ملأه بالأنهار"]],"x":["The verse describes the Night Journey, which ended at a mosque whose surroundings Allah blessed.","قال تعالى: {Q:17:1:10-14}."],"s":[{"q":"17:1"}]},
{"id":"SIR-5-13","l":"sir","v":5,"q":["Complete Surah An-Najm: ﴾He certainly saw of the greatest…﴿","أكمل من سورة النجم: {Q:53:18:1-3} ..."],"o":[["signs of his Lord","stars","angels","palaces"],["آيات ربه الكبرى","النجوم","الملائكة","القصور"]],"x":["During the Ascension, he saw some of the greatest signs of his Lord.","قال تعالى: {Q:53:18}."],"s":[{"q":"53:18"}]},
{"id":"SIR-5-14","l":"sir","v":5,"q":["In Surah Al-Anfal, twenty patient believers would overcome how many?","في سورة الأنفال، عشرون صابرون يغلبون كم؟"],"o":[["Two hundred","One hundred","One thousand","Forty"],["مئتين","مئة","ألفاً","أربعين"]],"x":["Allah told the Prophet {saw} to urge the believers on, promising that patient believers would overcome many times their number.","قال تعالى: {Q:8:65:7-13}."],"s":[{"q":"8:65"}]},
{"id":"SIR-5-15","l":"sir","v":5,"q":["After Allah lightened the burden, how many would a hundred patient believers overcome?","بعد أن خفّف الله عنهم، كم تغلب مئةٌ صابرة؟"],"o":[["Two hundred","One thousand","Five hundred","Three hundred"],["مئتين","ألفاً","خمس مئة","ثلاث مئة"]],"x":["The verse eased the earlier ruling, because Allah knew there was weakness among them.","قال تعالى: {Q:8:66:9-15}."],"s":[{"q":"8:66"}]},
{"id":"SIR-5-16","l":"sir","v":5,"q":["At the Trench, who said ﴾Allah and His Messenger promised us nothing but delusion﴿?","يوم الخندق، مَن قال: ما وعدنا الله ورسوله إلا غروراً؟"],"o":[["The hypocrites and those with disease in their hearts","The Ansar","The Confederates","The Jews of Khaybar"],["المنافقون والذين في قلوبهم مرض","الأنصار","الأحزاب","يهود خيبر"]],"x":["In the siege, the hypocrites’ doubts came out, while the believers’ faith only grew.","قال تعالى: {Q:33:12}."],"s":[{"q":"33:12"}]},
{"id":"SIR-5-17","l":"sir","v":5,"q":["Surah Al ʿImran praises believers who responded to Allah and the Messenger after what had struck them?","تُثني سورة آل عمران على الذين استجابوا لله والرسول من بعد ماذا؟"],"o":[["Injury","Victory","Hunger","Travel"],["ما أصابهم القرح","النصر","الجوع","السفر"]],"x":["Even after injury at Uhud, they answered the call, and for those who did good there is a great reward.","قال تعالى: {Q:3:172:1-9}."],"s":[{"q":"3:172"}]},
{"id":"SIR-5-18","l":"sir","v":5,"q":["When told ﴾the people have gathered against you, so fear them﴿, what did the believers say?","لمّا قيل للمؤمنين: إن الناس قد جمعوا لكم فاخشوهم، ماذا قالوا؟"],"o":[["Allah is sufficient for us, and He is the best disposer of affairs","Let us flee","Let us make peace","We have no power"],["حسبنا الله ونعم الوكيل","لنفرّ","لنصالحهم","لا طاقة لنا"]],"x":["It only increased them in faith, and they returned with Allah’s favour and bounty.","قال تعالى: {Q:3:173}."],"s":[{"q":"3:173"}]},
{"id":"SIR-5-19","l":"sir","v":5,"q":["Before Badr, how did Allah show the enemy to the Prophet {saw} in his dream?","قبل بدر، كيف أرى الله النبيَّ {saw} عدوّه في منامه؟"],"o":[["Few","Many","As animals","Fleeing"],["قليلاً","كثيراً","كالأنعام","فارّين"]],"x":["Had He shown them as many, the believers would have lost heart and disputed.","قال تعالى: {Q:8:43:1-6}."],"s":[{"q":"8:43"}]},
{"id":"SIR-5-20","l":"sir","v":5,"q":["How does Surah An-Nasr describe people entering the religion of Allah?","كيف وصفت سورة النصر دخول الناس في دين الله؟"],"o":[["In multitudes","One by one","In secret","By force"],["أفواجاً","فرادى","سرّاً","كرهاً"]],"x":["Revealed when victory came, the surah tells the Prophet {saw} to glorify his Lord and seek His forgiveness.","قال تعالى: {Q:110:2}."],"s":[{"q":"110:2"}]},
{"id":"SIR-5-21","l":"sir","v":5,"q":["According to Surah At-Tawbah, how many months are there with Allah, and how many of them are sacred?","بحسب سورة التوبة، كم عدة الشهور عند الله، وكم منها حُرُم؟"],"o":[["Twelve, four of them sacred","Twelve, three of them sacred","Ten, two of them sacred","Twelve, six of them sacred"],["اثنا عشر، منها أربعة حرم","اثنا عشر، منها ثلاثة حرم","عشرة، منها اثنان حرم","اثنا عشر، منها ستة حرم"]],"x":["The same verse says: do not wrong yourselves during them.","قال تعالى: {Q:9:36:1-18}."],"s":[{"q":"9:36"}]},
{"id":"SIR-5-22","l":"sir","v":5,"q":["Which sign does Surah Al-Qamar mention as the Hour drew near?","ما الآية التي ذكرتها سورة القمر حين اقتربت الساعة؟"],"o":[["The moon split","The sun darkened","The stars fell","The seas burst"],["انشقاق القمر","تكوير الشمس","انكدار النجوم","تفجير البحار"]],"x":["The next verse says that when they see a sign they turn away and call it passing magic.","قال تعالى: {Q:54:1}."],"s":[{"q":"54:1"}]},
{"id":"HAD-1-01","l":"had","v":1,"q":["Complete the hadith: “Actions are only by…”","أكمل الحديث: «إِنَّمَا الْأَعْمَالُ ...»"],"o":[["intentions","results","effort","appearances"],["بالنيات","بالنتائج","بالجهد","بالمظاهر"]],"x":["It is the very first hadith in Sahih al-Bukhari. Every deed is judged by its intention, and each person gets what they intended.","هو أول حديث في صحيح البخاري، وفيه: «وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»."],"s":[{"b":1,"m":1907}]},
{"id":"HAD-1-02","l":"had","v":1,"q":["On how many pillars is Islam built?","على كم رُكن بُني الإسلام؟"],"o":[["Five","Three","Six","Seven"],["خمسة","ثلاثة","ستة","سبعة"]],"x":["Islam rests on these five like a building on its pillars; everything else in a Muslim’s practice is built on them.","شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان."],"s":[{"b":8,"m":16}]},
{"id":"HAD-1-03","l":"had","v":1,"q":["Complete: “The strong person is not the one who wrestles others down. The strong one is he who…”","أكمل: «لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ، إِنَّمَا الشَّدِيدُ الَّذِي ...»"],"o":[["controls himself when angry","is never defeated","has many supporters","is feared by people"],["يملك نفسه عند الغضب","لا يُغلب أبداً","له أنصار كثيرون","يهابه الناس"]],"x":["Real strength is not physical: it is keeping control of yourself at the very moment anger rises.","القوة الحقيقية في ضبط النفس ساعة الغضب."],"s":[{"b":6114,"m":2609}]},
{"id":"HAD-1-04","l":"had","v":1,"q":["A man asked who most deserves his good companionship. Whom did the Prophet {saw} name three times?","سأل رجل عن أحق الناس بحسن صحابته، فمن ذكر النبي {saw} ثلاث مرات؟"],"o":[["His mother","His father","His teacher","His spouse"],["أمه","أبوه","معلمه","زوجه"]],"x":["He said “your mother” three times, and only then “your father”, showing the special right of mothers.","قال: «أُمُّكَ» ثلاثاً، ثم قال: «ثُمَّ أَبُوكَ»."],"s":[{"b":5971,"m":2548}]},
{"id":"HAD-1-05","l":"had","v":1,"q":["Complete: “The Muslim is the one from whose ___ the Muslims are safe.”","أكمل: «الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ ...»"],"o":[["tongue and hand","wealth and home","anger and pride","family and friends"],["لسانه ويده","ماله وبيته","غضبه وكبره","أهله وأصحابه"]],"x":["Harm done with words counts just as much as harm done with hands, so a true Muslim keeps both in check.","أذى اللسان كأذى اليد."],"s":[{"b":10}]},
{"id":"HAD-1-06","l":"had","v":1,"q":["Complete: “The best of you are those who learn the Quran and…”","أكمل: «خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَ ...»"],"o":[["teach it","recite it at night","memorise it","carry it"],["علّمه","قرأه بالليل","حفظه","حمله"]],"x":["Narrated by ʿUthman ibn ʿAffan {ra}. The best people are those who both learn the Quran and pass it on to others.","رواه عثمان بن عفان {ra}."],"s":[{"b":5027}]},
{"id":"HAD-1-07","l":"had","v":1,"q":["Complete: “A good word is…”","أكمل: «وَالْكَلِمَةُ الطَّيِّبَةُ ...»"],"o":[["charity","wisdom","light","a prayer"],["صدقة","حكمة","نور","دعاء"]],"x":["Part of a hadith listing everyday charity, like helping someone onto their mount and removing harm from the road.","جزء من حديث يعدد صور الصدقة اليومية، كإعانة الرجل على دابته وإماطة الأذى عن الطريق."],"s":[{"b":2989,"m":1009,"ml":"muslim:1009"}]},
{"id":"HAD-1-08","l":"had","v":1,"q":["At the end of the hadith about Islam, Iman and Ihsan, who did the Prophet {saw} say the questioner was?","في آخر حديث الإسلام والإيمان والإحسان، مَن قال النبي {saw} إن السائل كان؟"],"o":[["Jibril","A Companion from Madinah","A traveller from Yemen","Mikaʾil"],["جبريل","صحابي من المدينة","مسافر من اليمن","ميكائيل"]],"x":["This is the famous Hadith of Jibril: a stranger came to the Prophet {saw} and asked about the foundations of the religion and the Hour. Afterwards the Prophet {saw} revealed who he was.","هو حديث جبريل المشهور: جاء رجل غريب فسأل النبي {saw} عن أصول الدين وعن الساعة."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-1-09","l":"had","v":1,"q":["Complete: “And the emigrant (muhajir) is the one who leaves…”","أكمل: «وَالْمُهَاجِرُ مَنْ هَجَرَ ...»"],"o":[["what Allah has forbidden","his homeland","his wealth","his family"],["ما نهى الله عنه","وطنه","ماله","أهله"]],"x":["The true emigrant is not only the one who changes his home, but the one who leaves behind what Allah has forbidden.","قال {saw}: «وَالْمُهَاجِرُ مَنْ هَجَرَ مَا نَهَى اللَّهُ عَنْهُ»."],"s":[{"b":10}]},
{"id":"HAD-1-10","l":"had","v":1,"q":["Complete: “Whoever believes in Allah and the Last Day, let him not harm his…”","أكمل: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ ...»"],"o":[["neighbour","brother","teacher","servant"],["جاره","أخاه","معلمه","خادمه"]],"x":["Being a good neighbour is a sign of true faith in Allah and the Last Day.","قال {saw}: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يُؤْذِ جَارَهُ»."],"s":[{"b":6018}]},
{"id":"HAD-1-11","l":"had","v":1,"q":["Complete: “Whoever believes in Allah and the Last Day, let him honour his…”","أكمل: «وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ...»"],"o":[["guest","parents","scholars","elders"],["ضيفه","والديه","العلماء","كبار السن"]],"x":["Hospitality is part of faith itself, not just good manners.","قال {saw}: «وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيُكْرِمْ ضَيْفَهُ»."],"s":[{"b":6018}]},
{"id":"HAD-1-12","l":"had","v":1,"q":["Complete: “Allah helps the servant as long as the servant is helping his…”","أكمل: «وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ ...»"],"o":[["brother","parents","neighbour","community"],["أخيه","والديه","جاره","قومه"]],"x":["While you are busy helping someone, Allah is helping you.","قال {saw}: «وَاللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ»."],"s":[{"m":2699}]},
{"id":"HAD-1-13","l":"had","v":1,"q":["Complete: “The halal is clear and the haram is…”","أكمل: «الْحَلاَلُ بَيِّنٌ وَ ...»"],"o":[["clear","hidden","small","rare"],["الحرام بين","الحرام خفي","الحرام قليل","الحرام نادر"]],"x":["Between the clearly lawful and the clearly forbidden lie doubtful matters that many people do not know.","قال {saw}: «الْحَلاَلُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ، وَبَيْنَهُمَا مُشَبَّهَاتٌ لاَ يَعْلَمُهَا كَثِيرٌ مِنَ النَّاسِ»."],"s":[{"b":52}]},
{"id":"HAD-1-14","l":"had","v":1,"q":["Complete: “Whoever Allah wants good for, He gives him understanding of…”","أكمل: «مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي ...»"],"o":[["the religion","trade","poetry","the stars"],["الدين","التجارة","الشعر","النجوم"]],"x":["Understanding the religion is a sign that Allah wants good for a person. That is why learning it matters so much.","قال {saw}: «مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ»."],"s":[{"b":71}]},
{"id":"HAD-1-15","l":"had","v":1,"q":["Complete: “The Muslim is the brother of the Muslim; he does not wrong him, nor…”","أكمل: «الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ ...»"],"o":[["abandon him to harm","borrow from him","visit him","argue with him"],["يسلمه","يقترض منه","يزوره","يجادله"]],"x":["A Muslim never wrongs his brother or leaves him to harm. The same hadith promises: whoever meets his brother’s need, Allah will meet his.","قال {saw}: «الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ»."],"s":[{"b":2442}]},
{"id":"HAD-1-16","l":"had","v":1,"q":["The believers in their mercy, love and kindness to one another are like one…","مثل المؤمنين في تراحمهم وتوادّهم وتعاطفهم كمثل..."],"o":[["body","family","tree","building"],["الجسد","الأسرة","الشجرة","البنيان"]],"x":["When one part of the body hurts, the whole body feels it. That is how believers should feel one another’s pain.","قال {saw}: «تَرَى الْمُؤْمِنِينَ فِي تَرَاحُمِهِمْ وَتَوَادِّهِمْ وَتَعَاطُفِهِمْ كَمَثَلِ الْجَسَدِ»."],"s":[{"b":6011}]},
{"id":"HAD-1-17","l":"had","v":1,"q":["Complete: “Truthfulness leads to…”","أكمل: «إِنَّ الصِّدْقَ يَهْدِي إِلَى ...»"],"o":[["righteousness","wealth","fame","power"],["البر","الغنى","الشهرة","السلطة"]],"x":["Truthfulness leads to righteousness, and righteousness leads to Paradise. Small honest choices add up to a whole life.","قال {saw}: «إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ، وَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ»."],"s":[{"b":6094}]},
{"id":"HAD-1-18","l":"had","v":1,"q":["Two blessings many people are cheated of: health and…","نعمتان مغبونٌ فيهما كثيرٌ من الناس: الصحة و..."],"o":[["free time","wealth","children","sleep"],["الفراغ","المال","الأولاد","النوم"]],"x":["Health and free time are blessings that many people let slip away without using them well.","قال {saw}: «نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ، الصِّحَّةُ وَالْفَرَاغُ»."],"s":[{"b":6412}]},
{"id":"HAD-1-19","l":"had","v":1,"q":["Complete: “Be in this world as though you were a stranger or a…”","أكمل: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ، أَوْ ...»"],"o":[["traveller","king","guest of honour","prisoner"],["عابر سبيل","ملك","ضيف مكرم","سجين"]],"x":["A traveller only rests briefly on the road home. The advice is to live in this world the same way: lightly, and always heading onward.","قال {saw}: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ، أَوْ عَابِرُ سَبِيلٍ»."],"s":[{"b":6416}]},
{"id":"HAD-1-20","l":"had","v":1,"q":["The strong believer is better and more beloved to Allah than the…","المؤمن القوي خيرٌ وأحب إلى الله من..."],"o":[["weak believer","rich believer","old believer","silent believer"],["المؤمن الضعيف","المؤمن الغني","المؤمن الكبير","المؤمن الصامت"]],"x":["The hadith adds: “and in both there is good.” Strength is praised, but every believer has worth.","قال {saw}: «الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ وَفِي كُلٍّ خَيْرٌ»."],"s":[{"m":2664}]},
{"id":"HAD-1-21","l":"had","v":1,"q":["How wonderful is the affair of the believer! All of his affairs are…","عجباً لأمر المؤمن! إن أمره كله..."],"o":[["good","hard","hidden","unknown"],["خير","صعب","خفي","مجهول"]],"x":["Ease and hardship can both become good for the believer, depending on how he responds to them.","قال {saw}: «عَجَبًا لأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ»."],"s":[{"m":2999,"ml":"muslim:2999"}]},
{"id":"HAD-1-22","l":"had","v":1,"q":["When a person dies, their deeds come to an end except for how many things?","إذا مات الإنسان انقطع عنه عمله إلا من كم؟"],"o":[["Three","One","Five","Seven"],["ثلاثة","واحد","خمسة","سبعة"]],"x":["Most deeds stop at death, but three kinds of good keep bringing reward long after a person is gone.","قال {saw}: «إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةٍ»."],"s":[{"m":1631}]},
{"id":"HAD-1-23","l":"had","v":1,"q":["Allah says: “I am as My servant thinks of Me, and I am with him when he…”","يقول الله: «أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ...»"],"o":[["remembers Me","sleeps","travels","eats"],["ذكرني","نام","سافر","أكل"]],"x":["This is a hadith qudsi: words of Allah reported by the Prophet {saw}, outside the Quran. It invites us to think well of Allah and remember Him often.","«أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي»."],"s":[{"b":7405}]},
{"id":"HAD-2-01","l":"had","v":2,"q":["A man asked the Prophet {saw} for advice. What did he say, repeating it several times?","طلب رجل من النبي {saw} الوصية، فماذا قال له مكرراً؟"],"o":[["“Do not become angry”","“Pray at night”","“Give in charity”","“Stay silent”"],["«لا تغضب»","«صل بالليل»","«تصدق»","«اصمت»"]],"x":["The man asked again and again, and each time the answer was the same: “Do not become angry.”","ردّد الرجل مراراً، فقال في كل مرة: «لاَ تَغْضَبْ»."],"s":[{"b":6116}]},
{"id":"HAD-2-02","l":"had","v":2,"q":["Complete: “None of you truly believes until he loves for his brother what he…”","أكمل: «لا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لأَخِيهِ مَا ...»"],"o":[["loves for himself","has earned","owns","wishes for his parents"],["يحب لنفسه","كسبه","يملكه","يتمناه لوالديه"]],"x":["Wanting good for others as you want it for yourself is part of complete faith.","حب الخير للناس كما تحبه لنفسك من كمال الإيمان."],"s":[{"b":13,"m":45}]},
{"id":"HAD-2-03","l":"had","v":2,"q":["Complete: “Whoever believes in Allah and the Last Day, let him speak good or…”","أكمل: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ ...»"],"o":[["remain silent","speak softly","give charity","pray"],["ليصمت","ليخفض صوته","ليتصدق","ليصلِّ"]],"x":["Every word counts: if what you are about to say is not good, silence is better.","حفظ اللسان من علامات صدق الإيمان."],"s":[{"b":6018,"m":47}]},
{"id":"HAD-2-04","l":"had","v":2,"q":["Complete: “Make things easy and do not make them hard. Give glad tidings and do not…”","أكمل: «يَسِّرُوا وَلاَ تُعَسِّرُوا، وَبَشِّرُوا وَلاَ ...»"],"o":[["drive people away","stay quiet","delay","argue"],["تنفّروا","تسكتوا","تؤخّروا","تجادلوا"]],"x":["A guiding rule for teaching and inviting others: make the religion easy to love, never a burden.","قاعدة في التعليم والدعوة إلى الله."],"s":[{"b":69,"m":1734}]},
{"id":"HAD-2-05","l":"had","v":2,"q":["Complete: “Charity never decreases…”","أكمل: «مَا نَقَصَتْ صَدَقَةٌ مِنْ ...»"],"o":[["wealth","sins","one’s life","worries"],["مال","ذنب","عمر","همّ"]],"x":["Giving never truly reduces what you have. The Quran promises that whatever you spend, Allah will replace it.","ما يُنفق في الصدقة لا يضيع."],"s":[{"m":2588,"ml":"muslim:2588"}]},
{"id":"HAD-2-06","l":"had","v":2,"q":["A man said he had never kissed any of his ten children. The Prophet {saw} said: “Whoever does not show mercy…”","قال رجل إنه لم يقبّل أحداً من أولاده العشرة، فقال النبي {saw}: «مَنْ لاَ يَرْحَمُ ...»"],"o":[["will not be shown mercy","has no faith","will be left alone","loses his reward"],["لا يُرحم","لا إيمان له","يبقى وحيداً","يضيع أجره"]],"x":["He said it right after kissing his grandson: tenderness with children is part of mercy.","قالها بعد أن قبّل حفيده الحسن {ra}."],"s":[{"b":5997,"m":2318}]},
{"id":"HAD-2-07","l":"had","v":2,"q":["Complete: “Whoever travels a path seeking knowledge, Allah makes easy for him a path to…”","أكمل: «مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى ...»"],"o":[["Paradise","wealth","honour","wisdom"],["الجنة","الغنى","العزة","الحكمة"]],"x":["Every step taken to learn the religion is a step on the road to Paradise.","رواه أبو هريرة {ra}."],"s":[{"m":2699}]},
{"id":"HAD-2-08","l":"had","v":2,"q":["What does Allah do for a person who covers the faults of a Muslim?","ماذا يفعل الله بمن ستر مسلماً؟"],"o":[["Covers him in this world and the Hereafter","Doubles his wealth","Grants him long life","Makes him famous"],["يستره في الدنيا والآخرة","يضاعف ماله","يطيل عمره","يرفع ذكره بين الناس"]],"x":["“Whoever covers a Muslim, Allah will cover him in this world and the Hereafter.”","قال {saw}: «وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ فِي الدُّنْيَا وَالآخِرَةِ»."],"s":[{"m":2699}]},
{"id":"HAD-2-09","l":"had","v":2,"q":["Complete: “Allah does not increase a servant who forgives except in…”","أكمل: «وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ ...»"],"o":[["honour","wealth","children","years"],["عزاً","مالاً","ولداً","عمراً"]],"x":["Forgiving others can feel like losing face, but in Allah’s sight it is the very opposite.","قال {saw}: «وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلاَّ عِزًّا»."],"s":[{"m":2588,"ml":"muslim:2588"}]},
{"id":"HAD-2-10","l":"had","v":2,"q":["Complete: “And the Quran is a proof…”","أكمل: «وَالْقُرْآنُ حُجَّةٌ ...»"],"o":[["for you or against you","for the scholars","on the Day of Judgement only","for those who memorise it"],["لك أو عليك","للعلماء","يوم القيامة فقط","لمن حفظه"]],"x":["The Quran will speak either for a person or against them, depending on how they lived by it.","قال {saw}: «وَالْقُرْآنُ حُجَّةٌ لَكَ أَوْ عَلَيْكَ»."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-2-11","l":"had","v":2,"q":["In the hadith of intentions, whose emigration counts only for what he emigrated for?","في حديث النية، مَن كانت هجرته إلى ما هاجر إليه فقط؟"],"o":[["The one who emigrated for worldly gain or to marry","The one who emigrated for Allah","The one who emigrated with his family","The one who emigrated late"],["من هاجر لدنيا يصيبها أو امرأة ينكحها","من هاجر إلى الله ورسوله","من هاجر مع أهله","من تأخرت هجرته"]],"x":["Two people can do the same act: one for Allah and His Messenger, the other for worldly gain. Each gets only what he intended.","قال {saw}: «فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوْ إِلَى امْرَأَةٍ يَنْكِحُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ»."],"s":[{"b":1,"m":1907}]},
{"id":"HAD-2-12","l":"had","v":2,"q":["Whoever relieves a believer of a hardship of this world, Allah will relieve him of a hardship of…","من نفّس عن مؤمنٍ كربةً من كرب الدنيا، نفّس الله عنه كربةً من كرب..."],"o":[["the Day of Resurrection","this world","the grave","his old age"],["يوم القيامة","الدنيا","القبر","الكبر"]],"x":["“Whoever relieves a believer of a hardship of this world, Allah will relieve him of a hardship of the Day of Resurrection.”","قال {saw}: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ»."],"s":[{"m":2699}]},
{"id":"HAD-2-13","l":"had","v":2,"q":["Which of these continues to benefit a person after death?","أيٌّ مما يلي يبقى نفعه للإنسان بعد موته؟"],"o":[["Ongoing charity","A large house","A famous name","Stored gold"],["صدقة جارية","بيت كبير","اسم مشهور","ذهب مخزون"]],"x":["Ongoing charity keeps earning reward long after the giver has died.","«إِلاَّ مِنْ صَدَقَةٍ جَارِيَةٍ أَوْ عِلْمٍ يُنْتَفَعُ بِهِ أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»."],"s":[{"m":1631}]},
{"id":"HAD-2-14","l":"had","v":2,"q":["In the hadith of the three things, the righteous child benefits a parent by doing what?","في حديث الثلاثة، بماذا ينفع الولد الصالح والده بعد موته؟"],"o":[["Praying for him","Visiting his grave only","Keeping his wealth","Repeating his name"],["يدعو له","يزور قبره فقط","يحفظ ماله","يردد اسمه"]],"x":["A child’s prayers keep benefiting parents even after they have passed away.","«أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»."],"s":[{"m":1631}]},
{"id":"HAD-2-15","l":"had","v":2,"q":["When something good happens to the believer, what does he do, so it is good for him?","إن أصابت المؤمنَ سرّاء فماذا يفعل فيكون خيراً له؟"],"o":[["He is grateful","He boasts","He forgets","He hides it"],["شكر","تفاخر","نسي","أخفاها"]],"x":["Thanking Allah for a blessing turns the blessing itself into a reward.","«إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ»."],"s":[{"m":2999,"ml":"muslim:2999"}]},
{"id":"HAD-2-16","l":"had","v":2,"q":["When hardship befalls the believer, what does he do, so it is good for him?","إن أصابت المؤمنَ ضرّاء فماذا يفعل فيكون خيراً له؟"],"o":[["He is patient","He complains","He gives up","He blames others"],["صبر","اشتكى","يئس","لام غيره"]],"x":["Even hardship becomes good for the believer when he meets it the right way.","«وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ»."],"s":[{"m":2999,"ml":"muslim:2999"}]},
{"id":"HAD-2-17","l":"had","v":2,"q":["According to the hadith, what does lying lead to?","بحسب الحديث، إلى أين يهدي الكذب؟"],"o":[["Wickedness (al-fujur)","Wealth","Sadness only","Nothing"],["الفجور","الغنى","الحزن فقط","لا شيء"]],"x":["And wickedness leads to the Fire, just as honesty ultimately leads to Paradise.","«وَإِنَّ الْكَذِبَ يَهْدِي إِلَى الْفُجُورِ»."],"s":[{"b":6094}]},
{"id":"HAD-2-18","l":"had","v":2,"q":["In the “one body” hadith, when one part complains, how does the rest of the body respond?","في حديث الجسد الواحد، إذا اشتكى عضو فبماذا يتداعى له سائر الجسد؟"],"o":[["With sleeplessness and fever","With silence","With anger","With rest"],["بالسهر والحمى","بالسكوت","بالغضب","بالراحة"]],"x":["That is how believers should feel for one another: when one suffers, all feel it.","«إِذَا اشْتَكَى عُضْوًا تَدَاعَى لَهُ سَائِرُ جَسَدِهِ بِالسَّهَرِ وَالْحُمَّى»."],"s":[{"b":6011}]},
{"id":"HAD-2-19","l":"had","v":2,"q":["Whoever fulfils the need of his brother, Allah will fulfil…","من كان في حاجة أخيه كان الله في..."],"o":[["his need","his wealth only","his wish in this world only","nothing"],["حاجته","ماله فقط","أمنيته في الدنيا فقط","لا شيء"]],"x":["Helping others with their needs brings Allah’s help with yours.","«وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ»."],"s":[{"b":2442}]},
{"id":"HAD-2-20","l":"had","v":2,"q":["Whoever guards himself against doubtful matters has protected his religion and his…","من اتّقى المشبّهات فقد استبرأ لدينه و..."],"o":[["honour","wealth","health","time"],["عرضه","ماله","صحته","وقته"]],"x":["Doubtful matters lie between the clearly lawful and the clearly forbidden; staying away from them keeps a person safe.","«فَمَنِ اتَّقَى الْمُشَبَّهَاتِ اسْتَبْرَأَ لِدِيِنِهِ وَعِرْضِهِ»."],"s":[{"b":52}]},
{"id":"HAD-2-21","l":"had","v":2,"q":["If something befalls you, do not say “if only I had…”, because “if” opens the door to what?","إن أصابك شيء فلا تقل «لَوْ أَنِّي فَعَلْتُ»، فإن «لَوْ» تفتح ماذا؟"],"o":[["The work of Satan","Wisdom","Hope","Forgiveness"],["عمل الشيطان","الحكمة","الأمل","المغفرة"]],"x":["Regret over what cannot be changed only lets Shaytan in; the hadith teaches a better response instead.","«فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ»."],"s":[{"m":2664}]},
{"id":"HAD-2-22","l":"had","v":2,"q":["In the hadith qudsi, if the servant draws near to Allah by a hand’s span, Allah draws near to him by…","في الحديث القدسي: إن تقرّب العبد إلى الله شبراً، تقرّب الله إليه..."],"o":[["an arm’s length","a mile","a step","a day"],["ذراعا","ميلا","خطوة","يوما"]],"x":["The hadith pictures Allah’s generosity: whatever step the servant takes towards Him, Allah’s response is greater.","«وَإِنْ تَقَرَّبَ إِلَىَّ بِشِبْرٍ تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا»."],"s":[{"b":7405}]},
{"id":"HAD-2-23","l":"had","v":2,"q":["In the hadith qudsi, what is the most beloved way for a servant to draw near to Allah?","في الحديث القدسي، ما أحبّ ما يتقرّب به العبد إلى الله؟"],"o":[["What Allah has made obligatory","Voluntary fasting only","Travelling to Makkah","Giving gifts"],["ما افترضه الله عليه","صيام التطوع فقط","السفر إلى مكة","تقديم الهدايا"]],"x":["Then he keeps drawing near through voluntary deeds until Allah loves him.","«وَمَا تَقَرَّبَ إِلَىَّ عَبْدِي بِشَىْءٍ أَحَبَّ إِلَىَّ مِمَّا افْتَرَضْتُ عَلَيْهِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-01","l":"had","v":3,"q":["In the Hadith of Jibril, the levels of the religion are Islam, Iman and…","ذكر حديث جبريل مراتب الدين: الإسلام والإيمان و... فما الثالثة؟"],"o":[["Ihsan","Taqwa","Sabr","Jihad"],["الإحسان","التقوى","الصبر","الجهاد"]],"x":["Ihsan is to worship Allah as though you see Him, for though you do not see Him, He sees you. Narrated by ʿUmar {ra}.","«أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ». رواه عمر {ra}."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-02","l":"had","v":3,"q":["Complete: “The religion is…”","أكمل: «الدِّينُ ...»"],"o":[["sincere counsel (nasihah)","knowledge","patience","prayer"],["النصيحة","العلم","الصبر","الصلاة"]],"x":["When asked “to whom?”, he said: to Allah, His Book, His Messenger, the leaders of the Muslims and their common people.","قيل: لمن؟ قال: «لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ»."],"s":[{"m":55,"ml":"bulugh/16/96"}]},
{"id":"HAD-3-03","l":"had","v":3,"q":["Complete: “Purity is ___ of faith.”","أكمل: «الطُّهُورُ ... الإِيمَانِ»"],"o":[["half","a third","the key","the sign"],["شطر","ثلث","مفتاح","علامة"]],"x":["The same hadith goes on to the virtues of dhikr, prayer, charity and patience.","ويكمل الحديث بفضل الذكر والصلاة والصدقة والصبر."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-3-04","l":"had","v":3,"q":["Which deeds are most beloved to Allah?","ما أحب الأعمال إلى الله؟"],"o":[["The most consistent, even if small","The hardest ones","Those seen by many","Large deeds done once"],["أدومها وإن قلّ","أشقّها","ما يراه الناس","الكثير مرة واحدة"]],"x":["He {saw} said: “The most beloved of deeds to Allah are the most constant, even if little.”","قال {saw}: «أَحَبَّ الأَعْمَالِ أَدْوَمُهَا إِلَى اللَّهِ، وَإِنْ قَلَّ»."],"s":[{"b":6464,"m":783}]},
{"id":"HAD-3-05","l":"had","v":3,"q":["Which two phrases did the Prophet {saw} describe as “beloved to the Most Merciful, light on the tongue, heavy on the Scale”?","ما الكلمتان اللتان قال فيهما النبي {saw}: «حَبِيبَتَانِ إِلَى الرَّحْمَنِ، خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ»؟"],"o":[["SubhanAllahi wa bihamdihi, SubhanAllahil-ʿAzim","Alhamdulillah, Allahu Akbar","La ilaha illallah, Astaghfirullah","Bismillah, In shaʾ Allah"],["سبحان الله وبحمده، سبحان الله العظيم","الحمد لله، الله أكبر","لا إله إلا الله، أستغفر الله","بسم الله، إن شاء الله"]],"x":["The final hadith in Sahih al-Bukhari: two short phrases, light on the tongue but heavy on the Scale.","وهو آخر حديث في صحيح البخاري."],"s":[{"b":7563,"m":2694}]},
{"id":"HAD-3-06","l":"had","v":3,"q":["“The upper hand is better than the lower hand.” Which is the upper hand?","«الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى». ما اليد العليا؟"],"o":[["The one that gives","The one that asks","The ruler’s hand","The strongest hand"],["المنفقة","السائلة","يد الحاكم","اليد الأقوى"]],"x":["He said it from the minbar while speaking about charity and refraining from begging.","قالها على المنبر وهو يذكر الصدقة والتعفف عن المسألة."],"s":[{"b":1429,"m":1033,"ml":"muslim:1033"}]},
{"id":"HAD-3-07","l":"had","v":3,"q":["When Jibril asked about the Hour, what did the Prophet {saw} answer?","لمّا سأل جبريل عن الساعة، بماذا أجاب النبي {saw}؟"],"o":[["“The one asked knows no more than the one asking.”","“It will come in a hundred years.”","“It will come on a Friday.”","“Only the angels know.”"],["«ما المسئول عنها بأعلم من السائل»","«تأتي بعد مئة سنة»","«تقوم يوم الجمعة»","«لا يعلمها إلا الملائكة»"]],"x":["Jibril then asked about its signs, and the Prophet {saw} described some of them.","قال {saw}: «مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-08","l":"had","v":3,"q":["Among the signs of the Hour in the Hadith of Jibril, the barefoot, destitute shepherds compete in what?","من أمارات الساعة في حديث جبريل أن الحفاة العراة العالة رعاء الشاء يتطاولون في...؟"],"o":[["Constructing tall buildings","Raising horses","Digging wells","Collecting gold"],["البنيان","اقتناء الخيل","حفر الآبار","جمع الذهب"]],"x":["“…and that you see the barefoot, naked, destitute shepherds competing in constructing tall buildings.”","قال {saw}: «وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-09","l":"had","v":3,"q":["When the qiblah changed, a man passed by people who were praying. What position were they in?","لمّا حُوّلت القبلة مرّ رجلٌ على قومٍ يصلّون، فعلى أيّ حالٍ كانوا؟"],"o":[["Bowing (rukuʿ)","Prostrating","Sitting","Standing to recite"],["راكعون","ساجدون","جالسون","قائمون يقرؤون"]],"x":["The news reached them mid-prayer, and they turned towards the Kaʿbah right away.","«فَمَرَّ عَلَى أَهْلِ مَسْجِدٍ، وَهُمْ رَاكِعُونَ»، «فَدَارُوا كَمَا هُمْ قِبَلَ الْبَيْتِ»."],"s":[{"b":40}]},
{"id":"HAD-3-10","l":"had","v":3,"q":["A man heard someone repeating only “Say, He is Allah, the One” all night. What did he think of it?","سمع رجلٌ رجلاً يردّد «قُلْ هُوَ اللَّهُ أَحَدٌ» الليل كله، فماذا ظنّ فيها؟"],"o":[["That it was too little","That it was not allowed","That it was the best prayer","That it was a new practice"],["أنها قليلة","أنها لا تجوز","أنها أفضل الصلاة","أنها أمر محدث"]],"x":["He thought it was little, so the Prophet {saw} said it equals a third of the Quran.","«وَكَأَنَّ الرَّجُلَ يَتَقَالُّهَا»، فقال {saw}: «إِنَّهَا لَتَعْدِلُ ثُلُثَ الْقُرْآنِ»."],"s":[{"b":5013}]},
{"id":"HAD-3-11","l":"had","v":3,"q":["In “The religion is sincere counsel”, when asked “To whom?”, whom did the Prophet {saw} mention first?","في حديث «الدِّينُ النَّصِيحَةُ»، لمّا قيل: لمن؟ مَن ذكر النبي {saw} أولاً؟"],"o":[["Allah","His Messenger","The leaders of the Muslims","The common people"],["لله","لرسوله","لأئمة المسلمين","لعامتهم"]],"x":["To Allah, His Book, His Messenger, the leaders of the Muslims and their common people.","قال {saw}: «لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ»."],"s":[{"m":55,"ml":"bulugh/16/96"}]},
{"id":"HAD-3-12","l":"had","v":3,"q":["“In the body there is a piece of flesh; if it is sound, the whole body is sound.” What is it?","«أَلاَ وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ». ما هي؟"],"o":[["The heart","The mind","The tongue","The stomach"],["القلب","العقل","اللسان","المعدة"]],"x":["It is the heart: when it is sound, the whole body follows.","«أَلاَ وَهِيَ الْقَلْبُ»."],"s":[{"b":52}]},
{"id":"HAD-3-13","l":"had","v":3,"q":["Ibn ʿUmar {ra} advised: “When evening comes, do not wait for…”","قال ابن عمر {ra}: «إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ ...»"],"o":[["the morning","your friends","the rain","your reward"],["الصباح","أصحابك","المطر","الأجر"]],"x":["And when morning comes, do not wait for the evening.","«إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ الْمَسَاءَ»."],"s":[{"b":6416}]},
{"id":"HAD-3-14","l":"had","v":3,"q":["Ibn ʿUmar {ra} advised: “Take from your health for your…”","قال ابن عمر {ra}: «وَخُذْ مِنْ صِحَّتِكَ لِ ...»"],"o":[["sickness","old age","wealth","travels"],["مرضك","كبرك","مالك","أسفارك"]],"x":["And from your life for your death.","«وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ»."],"s":[{"b":6416}]},
{"id":"HAD-3-15","l":"had","v":3,"q":["In the hadith qudsi, what does Allah say about whoever shows enmity to a close friend (wali) of His?","في الحديث القدسي، ماذا قال الله فيمن عادى له وليّاً؟"],"o":[["I have declared war on him","I will forgive him","I will ignore him","I will test him"],["آذنته بالحرب","غفرت له","تركته","ابتليته"]],"x":["Showing hostility to Allah’s close friends is so serious that Allah Himself declares war.","«مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-16","l":"had","v":3,"q":["When Allah loves His servant, He becomes his hearing with which he hears, and his…","إذا أحبّ الله عبده كان سمعه الذي يسمع به و..."],"o":[["sight with which he sees","wealth with which he buys","voice with which he sings","sleep with which he rests"],["بصره الذي يبصر به","ماله الذي يشتري به","صوته الذي يغني به","نومه الذي يرتاح به"]],"x":["Allah guides every faculty of the servant He loves.","«كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-17","l":"had","v":3,"q":["In the hadith qudsi, if the servant remembers Allah in a gathering, where does Allah remember him?","في الحديث القدسي، إن ذكر العبدُ اللهَ في ملأ، أين يذكره الله؟"],"o":[["In a gathering better than it","In his dream","In his home","Nowhere"],["في ملأ خير منهم","في منامه","في بيته","لا يذكره"]],"x":["Remember Allah in company, and Allah mentions you in a far better company.","«وَإِنْ ذَكَرَنِي فِي مَلأٍ ذَكَرْتُهُ فِي مَلأٍ خَيْرٍ مِنْهُمْ»."],"s":[{"b":7405}]},
{"id":"HAD-3-19","l":"had","v":3,"q":["When something befalls you, what should you say instead of “if only”?","إن أصابك شيء فماذا تقول بدل «لَوْ»؟"],"o":[["Allah has decreed, and what He wills He does","I will do better next time","It was bad luck","Someone else is to blame"],["قدر الله وما شاء فعل","سأفعل أفضل في المرة القادمة","إنه سوء حظ","غيري هو المسؤول"]],"x":["Accepting Allah’s decree brings peace of heart, instead of endless regret.","«قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ»."],"s":[{"m":2664}]},
{"id":"HAD-3-20","l":"had","v":3,"q":["A man keeps telling the truth until he is recorded with Allah as what?","لا يزال الرجل يصدق حتى يُكتب عند الله..."],"o":[["A truthful one (siddiq)","A scholar","A king","A martyr"],["صديقا","عالما","ملكا","شهيدا"]],"x":["Truthfulness shapes character: keep choosing it, and it becomes who you are.","«وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا»."],"s":[{"b":6094}]},
{"id":"HAD-3-21","l":"had","v":3,"q":["In Sahih al-Bukhari 71, after “Whoever Allah wants good for…”, the Prophet {saw} said: “I am only a distributor, and Allah is the one who…”","في صحيح البخاري 71، قال {saw}: «وَإِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ ...»"],"o":[["gives","judges","forgives","hears"],["يعطي","يحكم","يغفر","يسمع"]],"x":["He described himself only as the one who distributes; the true Giver is Allah.","«وَإِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ يُعْطِي»."],"s":[{"b":71}]},
{"id":"HAD-3-22","l":"had","v":3,"q":["“Every king has a protected sanctuary.” What is Allah’s sanctuary on His earth?","«أَلاَ وَإِنَّ لِكُلِّ مَلِكٍ حِمًى». ما حمى الله في أرضه؟"],"o":[["What He has forbidden","The mosques","The mountains","The seas"],["محارمه","المساجد","الجبال","البحار"]],"x":["Every king has a protected area, and Allah’s is what He has forbidden: stay well away from its edges.","«أَلاَ إِنَّ حِمَى اللَّهِ فِي أَرْضِهِ مَحَارِمُهُ»."],"s":[{"b":52}]},
{"id":"HAD-4-02","l":"had","v":4,"q":["In the Hadith of Jibril, how many pillars of Iman are named?","في حديث جبريل، كم عدد أركان الإيمان المذكورة؟"],"o":[["Six","Five","Four","Seven"],["ستة","خمسة","أربعة","سبعة"]],"x":["They are matters of belief, beginning with belief in Allah.","الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر، والقدر خيره وشره."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-07","l":"had","v":4,"q":["Complete: “No one humbles himself for Allah except that Allah…”","أكمل: «وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ ...»"],"o":[["raises him","makes him rich","makes people love him","forgives him"],["رفعه الله","أغناه الله","حبّبه إلى الناس","غفر له"]],"x":["It is the end of the hadith that begins “Charity never decreases wealth.”","هو ختام الحديث الذي أوله: «مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ»."],"s":[{"m":2588,"ml":"muslim:2588"}]},
{"id":"HAD-4-08","l":"had","v":4,"q":["In the hadith “Purity is half of faith”, what is prayer described as?","في حديث «الطُّهُورُ شَطْرُ الإِيمَانِ»، بماذا وُصفت الصلاة؟"],"o":[["Light","Proof","Brightness","A shield"],["نور","برهان","ضياء","جُنّة"]],"x":["The same hadith describes charity as proof, and patience as brightness.","«وَالصَّلاَةُ نُورٌ وَالصَّدَقَةُ بُرْهَانٌ وَالصَّبْرُ ضِيَاءٌ»."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-4-09","l":"had","v":4,"q":["In the hadith listing everyday good deeds, what is every step taken towards the prayer described as?","في الحديث الذي عدّد أعمال الخير اليومية، بماذا وُصفت كل خطوةٍ يمشيها المرء إلى الصلاة؟"],"o":[["Charity","Light","A shield","A key"],["صدقة","نور","جُنّة","مفتاح"]],"x":["The same hadith counts a good word and removing harm from the road as charity too.","وعدّ الحديث نفسه الكلمة الطيبة وإماطة الأذى عن الطريق صدقة."],"s":[{"b":2989,"m":1009,"ml":"muslim:1009"}]},
{"id":"HAD-4-10","l":"had","v":4,"q":["Complete: “Whoever makes things easy for one in difficulty, Allah will make things easy for him…”","أكمل: «وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ …»"],"o":[["in this world and the Hereafter","in his wealth","on the Day of Judgement only","in his family"],["في الدنيا والآخرة","في ماله","يوم القيامة فقط","في أهله"]],"x":["From the same hadith as “Allah helps the servant as long as he helps his brother”.","قال {saw}: «وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالآخِرَةِ»."],"s":[{"m":2699}]},
{"id":"HAD-4-11","l":"had","v":4,"q":["Complete: “Whoever is held back by his deeds will not be hastened forward by his…”","أكمل: «وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ …»"],"o":[["lineage","wealth","knowledge","friends"],["نسبه","ماله","علمه","أصحابه"]],"x":["Nobility of family does not make up for a lack of good deeds.","قال {saw}: «وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ»."],"s":[{"m":2699}]},
{"id":"HAD-4-12","l":"had","v":4,"q":["When people gather in a house of Allah to recite and study His Book, what descends upon them first, as the hadith lists?","إذا اجتمع قومٌ في بيتٍ من بيوت الله يتلون كتاب الله ويتدارسونه، فما أول ما ذكر الحديث أنه ينزل عليهم؟"],"o":[["Tranquillity (sakinah)","Rain","Wealth","Angels with gifts"],["السكينة","المطر","الرزق","ملائكة بالهدايا"]],"x":["Tranquillity descends, mercy covers them, the angels surround them, and Allah mentions them among those with Him.","قال {saw}: «وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلاَّ نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ»."],"s":[{"m":2699}]},
{"id":"HAD-4-13","l":"had","v":4,"q":["Complete the Prophet’s {saw} words: “Be moderate and draw near, and know that…”","أكمل قوله {saw}: «سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ …»"],"o":[["no one’s deeds alone will admit him to Paradise","every deed is written twice","the reward is doubled on Fridays","the night prayer is best"],["لن يدخل أحدكم عمله الجنة","كل عمل يُكتب مرتين","الأجر يُضاعف يوم الجمعة","صلاة الليل أفضل الأعمال"]],"x":["Entry to Paradise is by Allah’s mercy; the same hadith adds that the most beloved deeds are the most constant, even if little.","قال {saw}: «سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الْجَنَّةَ»."],"s":[{"b":6464}]},
{"id":"HAD-4-14","l":"had","v":4,"q":["In the Hadith of Jibril, how is the stranger who came described?","في حديث جبريل، كيف وُصف الرجل الذي طلع عليهم؟"],"o":[["Very white clothes and very black hair","Dusty from a long journey","Wearing armour","An old man with a white beard"],["شديد بياض الثياب شديد سواد الشعر","عليه غبار السفر","يلبس درعاً","شيخ أبيض اللحية"]],"x":["No sign of travel was seen on him, and none of them knew him.","«شَدِيدُ بَيَاضِ الثِّيَابِ شَدِيدُ سَوَادِ الشَّعَرِ لاَ يُرَى عَلَيْهِ أَثَرُ السَّفَرِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-15","l":"had","v":4,"q":["In the Hadith of Jibril, how did the stranger sit before the Prophet {saw}?","في حديث جبريل، كيف جلس الرجل أمام النبي {saw}؟"],"o":[["Knees to his knees, palms on his thighs","Cross-legged at a distance","Standing, leaning on a staff","Behind the Companions"],["أسند ركبتيه إلى ركبتيه ووضع كفيه على فخذيه","متربّعاً بعيداً عنه","واقفاً متكئاً على عصا","خلف الصحابة"]],"x":["He sat close, as a student sits before a teacher, before asking his questions.","«فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-16","l":"had","v":4,"q":["When the Prophet {saw} told Ibn ʿUmar “Be in this world as though you were a stranger”, what did he take hold of?","حين قال النبي {saw} لابن عمر «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ»، بماذا أخذ؟"],"o":[["His shoulder","His hand","His cloak","His staff"],["بمنكبه","بيده","بردائه","بعصاه"]],"x":["He took Ibn ʿUmar {ra} by the shoulder, a gesture of closeness, as he gave the advice.","«أَخَذَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِمَنْكِبِي»."],"s":[{"b":6416}]},
{"id":"HAD-4-17","l":"had","v":4,"q":["In the hadith qudsi, when Allah loves His servant, He becomes his hand with which he strikes and his foot with which he…","في الحديث القدسي: إذا أحبّ الله عبده كان يده التي يبطش بها ورجله التي..."],"o":[["walks","stands","runs","travels"],["يمشي بها","يقف بها","يجري بها","يسافر بها"]],"x":["Everything such a servant does is guided by the One who loves him.","«وَيَدَهُ الَّتِي يَبْطُشُ بِهَا وَرِجْلَهُ الَّتِي يَمْشِي بِهَا»."],"s":[{"b":6502}]},
{"id":"HAD-4-18","l":"had","v":4,"q":["In the hadith qudsi, what does Allah say if the servant He loves asks Him?","في الحديث القدسي، ماذا قال الله إن سأله عبده الذي أحبّه؟"],"o":[["I will surely give him","I will test him first","I will delay it","I will ask the angels"],["لأعطينه","لأبتلينه أولا","لأؤخرنه","لأسألن الملائكة"]],"x":["And if he seeks refuge in Me, I will surely grant him refuge.","«وَإِنْ سَأَلَنِي لأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لأُعِيذَنَّهُ»."],"s":[{"b":6502}]},
{"id":"HAD-4-19","l":"had","v":4,"q":["In the hadith qudsi, if the servant comes to Allah walking, how does Allah come to him?","في الحديث القدسي، إن أتى العبد إلى الله يمشي، كيف يأتيه الله؟"],"o":[["Running","Walking","Slowly","Not at all"],["هرولة","مشيا","ببطء","لا يأتيه"]],"x":["The hadith pictures Allah’s generosity: whatever effort the servant makes towards Him, Allah’s response is greater.","«وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً»."],"s":[{"b":7405}]},
{"id":"HAD-4-20","l":"had","v":4,"q":["Whoever falls into doubtful matters is like a shepherd grazing around a sanctuary, about to…","من وقع في الشبهات كراعٍ يرعى حول الحمى يوشك أن..."],"o":[["fall into it","leave it","guard it","sell it"],["يواقعه","يتركه","يحرسه","يبيعه"]],"x":["Whoever keeps going near the edge of what is forbidden may end up falling in.","«كَرَاعٍ يَرْعَى حَوْلَ الْحِمَى، يُوشِكُ أَنْ يُوَاقِعَهُ»."],"s":[{"b":52}]},
{"id":"HAD-4-23","l":"had","v":4,"q":["After “Be keen on what benefits you and seek help from Allah”, what did the Prophet {saw} say?","بعد «احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ»، ماذا قال النبي {saw}؟"],"o":[["And do not give up (la taʿjiz)","And rest","And wait","And stay silent"],["ولا تعجز","واسترح","وانتظر","واسكت"]],"x":["Effort, reliance on Allah and persistence go together in this hadith.","«وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجِزْ»."],"s":[{"m":2664}]},
{"id":"HAD-4-25","l":"had","v":4,"q":["The believer’s affair is all good. For whom else is this true?","أمر المؤمن كله خير. لمن غيره يكون ذلك؟"],"o":[["For no one except the believer","For every person","For the wealthy","For the scholars"],["ليس ذاك لأحد إلا للمؤمن","لكل إنسان","للأغنياء","للعلماء"]],"x":["Whatever happens to the believer, ease or hardship, can become good for him.","«وَلَيْسَ ذَاكَ لأَحَدٍ إِلاَّ لِلْمُؤْمِنِ»."],"s":[{"m":2999,"ml":"muslim:2999"}]},
{"id":"HAD-4-26","l":"had","v":4,"q":["Among the three things that continue after death is knowledge that is…","من الثلاثة التي لا ينقطع أجرها بعد الموت: علمٌ..."],"o":[["benefited from","written in books only","kept secret","taught once"],["ينتفع به","مكتوب في الكتب فقط","محفوظ في السر","علم مرة"]],"x":["Teaching others something beneficial keeps earning reward long after you are gone.","«أَوْ عِلْمٍ يُنْتَفَعُ بِهِ»."],"s":[{"m":1631}]},
{"id":"HAD-5-19","l":"had","v":5,"q":["In the hadith of the wali, what does Allah say the believer dislikes?","في حديث الولي، ماذا قال الله إن المؤمن يكرهه؟"],"o":[["Death","Poverty","Illness","Travel"],["الموت","الفقر","المرض","السفر"]],"x":["Allah dislikes hurting the believer, even at death.","«يَكْرَهُ الْمَوْتَ وَأَنَا أَكْرَهُ مَسَاءَتَهُ»."],"s":[{"b":6502}]},
{"id":"HAD-5-23","l":"had","v":5,"q":["In the Prophet’s {saw} parable, the believer who recites the Quran is like which fruit, good in taste and good in scent?","في مثل النبي {saw}، المؤمن الذي يقرأ القرآن كأيّ ثمرة، طعمها طيب وريحها طيب؟"],"o":[["The citron (utrujjah)","The date","The pomegranate","The fig"],["الأترجة","التمرة","الرمانة","التينة"]],"x":["The one who does not recite is like a date: sweet, but without scent.","قال {saw}: «مَثَلُ الَّذِي يَقْرَأُ الْقُرْآنَ كَالأُتْرُجَّةِ طَعْمُهَا طَيِّبٌ وَرِيحُهَا طَيِّبٌ»."],"s":[{"b":5020}]},
{"id":"HAD-5-24","l":"had","v":5,"q":["In the same parable, the wicked person who recites the Quran is like which plant: pleasant scent, bitter taste?","في المثل نفسه، الفاجر الذي يقرأ القرآن كمثل أيّ نبتة، ريحها طيب وطعمها مر؟"],"o":[["Basil (rayhanah)","The colocynth","The rose","Mint"],["الريحانة","الحنظلة","الوردة","النعناع"]],"x":["And the wicked person who does not recite is like the colocynth: bitter, with no scent at all.","قال {saw}: «وَمَثَلُ الْفَاجِرِ الَّذِي يَقْرَأُ الْقُرْآنَ كَمَثَلِ الرَّيْحَانَةِ رِيحُهَا طَيِّبٌ وَطَعْمُهَا مُرٌّ»."],"s":[{"b":5020}]},
{"id":"HAD-5-25","l":"had","v":5,"q":["The Prophet {saw} likened a good companion to someone carrying musk. What did he liken a bad companion to?","شبّه النبي {saw} الجليس الصالح بحامل المسك، فبماذا شبّه جليس السوء؟"],"o":[["A blacksmith blowing his bellows","A butcher","A tanner","A fisherman"],["نافخ الكير","الجزار","الدباغ","الصياد"]],"x":["With the musk-carrier you gain either way: a gift, a purchase, or at least a pleasant scent. The bellows may burn your clothes, or at least leave you with a foul smell.","قال {saw}: «وَنَافِخُ الْكِيرِ إِمَّا أَنْ يُحْرِقَ ثِيَابَكَ، وَإِمَّا أَنْ تَجِدَ رِيحًا خَبِيثَةً»."],"s":[{"b":5534}]},
{"id":"HAD-5-26","l":"had","v":5,"q":["The Prophet {saw} said the one who remembers his Lord, compared with the one who does not, is like…","قال النبي {saw}: مثل الذي يذكر ربه والذي لا يذكر مثل..."],"o":[["the living and the dead","light and darkness","the seeing and the blind","day and night"],["الحي والميت","النور والظلمة","البصير والأعمى","النهار والليل"]],"x":["A short hadith with a big meaning: remembering Allah is what keeps the heart alive.","قال {saw}: «مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لاَ يَذْكُرُ مَثَلُ الْحَىِّ وَالْمَيِّتِ»."],"s":[{"b":6407}]},
{"id":"HAD-5-27","l":"had","v":5,"q":["Complete: “Paradise is closer to each of you than the strap of his…”","أكمل: «الْجَنَّةُ أَقْرَبُ إِلَى أَحَدِكُمْ مِنْ شِرَاكِ...»"],"o":[["sandal","belt","sword","turban"],["نعله","حزامه","سيفه","عمامته"]],"x":["The hadith continues: “and the Fire is just the same.” Both are only a few deeds away.","قال {saw}: «الْجَنَّةُ أَقْرَبُ إِلَى أَحَدِكُمْ مِنْ شِرَاكِ نَعْلِهِ، وَالنَّارُ مِثْلُ ذَلِكَ»."],"s":[{"b":6488}]},
{"id":"AQD-1-01","l":"aqd","v":1,"q":["Which of these is one of the pillars of Iman named in the Hadith of Jibril?","أيٌّ مما يلي من أركان الإيمان المذكورة في حديث جبريل؟"],"o":[["Belief in the angels","Fasting in Ramadan","Giving zakah","Performing Hajj"],["الإيمان بالملائكة","صوم رمضان","إيتاء الزكاة","حج البيت"]],"x":["Fasting, zakah and Hajj are pillars of Islam. The pillars of Iman, as listed in the Hadith of Jibril, are matters of belief: in Allah, His angels, and more.","الصوم والزكاة والحج من أركان الإسلام، أما أركان الإيمان في حديث جبريل فأمور اعتقادية، منها الإيمان بالله وملائكته."],"s":[{"m":8,"ml":"nawawi40/2"}]},

{"id":"AQD-1-04","l":"aqd","v":1,"q":["In Ayat al-Kursi, which two names of Allah follow ﴾there is no god but Him﴿?","في آية الكرسي، ما الاسمان اللذان يأتيان بعد {Q:2:255:2-5}؟"],"o":[["The Ever-Living, the Sustainer","The Most Merciful, the Most Kind","The King, the Holy","The First, the Last"],["الحي القيوم","الرحمن الرحيم","الملك القدوس","الأول الآخر"]],"x":["Ayat al-Kursi opens with these two names: the Ever-Living, and the Sustainer of all that exists. The rest of the verse unfolds what they mean.","قال تعالى: {Q:2:255:1-7}."],"s":[{"q":"2:255"}]},

{"id":"COM-2-02","l":"com","v":2,"q":["In Surah Al-Hashr, the Ansar are praised for preferring others over themselves even though they were…","في سورة الحشر أُثني على الأنصار بأنهم يؤثرون على أنفسهم ولو كان بهم..."],"o":[["in need","wealthy","travelling","few in number"],["خصاصة","غنى","سفر","قلة"]],"x":["The Ansar shared their homes and wealth with the emigrants, even when they themselves had little.","قال تعالى: {Q:59:9:18-24}."],"s":[{"q":"59:9"}]},
