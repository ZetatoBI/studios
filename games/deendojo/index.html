<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeenDojo</title>
<meta name="description" content="DeenDojo: Islamic Trivia. Learn the Quran, Prophets, Seerah and Hadith, with the evidence behind every answer.">
<meta name="theme-color" content="#1B3565">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeenDojo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B3565'/%3E%3Cpolygon points='50,10 60.6,24.4 78.3,21.7 75.6,39.4 90,50 75.6,60.6 78.3,78.3 60.6,75.6 50,90 39.4,75.6 21.7,78.3 24.4,60.6 10,50 24.4,39.4 21.7,21.7 39.4,24.4' fill='%23E7B343'/%3E%3Crect x='24' y='46' width='52' height='9' rx='2' fill='%231C1C1E'/%3E%3Crect x='44' y='42' width='12' height='17' rx='3' fill='%231C1C1E'/%3E%3Cpath d='M46 58 L40 74 L47 74 L50 60 Z M54 58 L60 74 L53 74 L50 60 Z' fill='%231C1C1E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Figtree:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Montserrat:wght@500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF5;--surface:#FFFFFF;--surface2:#F2F5F9;--ink:#152238;--muted:#56647C;--line:#D3DCE7;
  --lapis:#1F3F7A;--panel:#1F3F7A;--gold:#B7800F;--goldb:#E7B343;
  --ok:#1E7F52;--okbg:#E1F2E8;--bad:#A93B32;--badbg:#F8E4E1;--bstroke:rgba(21,34,56,.38);
  --display:"Reem Kufi","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --classic:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
    --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
    --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
  --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
  --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:18px}
html[data-size="xl"]{font-size:20px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;min-height:100%}
html[lang="ar"] body{--body:"IBM Plex Sans Arabic","Figtree",system-ui,sans-serif;line-height:1.7}
#app{max-width:34rem;margin:0 auto;padding:.75rem 1.1rem 2.5rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--goldb);outline-offset:2px;border-radius:.5rem}
a{color:var(--lapis)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.2;margin:0}
.qt{font-family:var(--classic);font-size:1.12em;line-height:1.9}
.qa{font-family:"Amiri Quran","Amiri",serif;font-size:1.15em;line-height:2.2;font-weight:400}
.info-btn{width:2.2rem;height:2.2rem;border-radius:50%;border:1.5px solid var(--line);color:var(--lapis);font-weight:700;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;flex:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:34rem;max-height:85vh;overflow:auto;border-radius:1.2rem 1.2rem 0 0;padding:1rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-1rem;background:var(--surface);padding-top:.2rem}
.sheet h2{font-size:1.2rem}
.ib{border-top:1px solid var(--line);padding:.8rem 0}
.ib h3{font-size:1rem;margin:0 0 .4rem;font-family:var(--display)}
.ib .full{font-size:1.45rem;text-align:right;margin:.2rem 0 .6rem}
.an{font-family:"Amiri Quran","Amiri",serif;font-size:.8em;color:var(--gold)}
.ht{font-family:var(--classic);font-size:1.2rem;line-height:2.1;text-align:right;margin:.3rem 0}
.ib .muted,.credit{color:var(--muted);font-size:.85rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:3rem;gap:.5rem}
.top h1{font-size:1.25rem;flex:1;text-align:center}
.icon{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.lang{min-height:2.75rem;min-width:2.75rem;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--lapis)}
.lang[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.icon:active{background:var(--surface2)}
.icon svg{width:1.4rem;height:1.4rem}
[dir="rtl"] .flip svg{transform:scaleX(-1)}

/* hero */
.hero{text-align:center;padding:.25rem 0 1.25rem}
.spark{display:inline-block;animation:spark 1.6s ease-out 1}
.spark svg{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--goldb) 45%,transparent))}
@keyframes spark{0%{transform:scale(.6) rotate(-22.5deg);opacity:0}60%{transform:scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
.brand{font-size:2.5rem;letter-spacing:.01em;margin-top:.35rem}
.tag{margin:.1rem 0 .9rem;color:var(--muted);font-family:var(--display);font-size:1.05rem}
.overall{display:inline-flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem .3rem .6rem;font-weight:600}
.hint{color:var(--muted);font-size:.85rem;margin:.5rem auto 0;max-width:22rem}

/* daily panel: the pattern band */
.daily{display:block;width:100%;background-color:var(--panel);background-image:var(--pat);color:#fff;border-radius:1.25rem;padding:1.15rem 1.25rem 1rem;margin-top:.25rem;position:relative;overflow:hidden}
.daily-t{display:block;font-family:var(--display);font-size:1.6rem;font-weight:700}
.daily-s{display:block;opacity:.88;font-size:.95rem;margin-top:.1rem;max-width:18rem}
.streak{display:inline-flex;align-items:center;gap:.35rem;margin-top:.8rem;background:rgba(255,255,255,.13);border-radius:999px;padding:.2rem .7rem .2rem .45rem;font-weight:600;font-size:.9rem}
.daily .go{position:absolute;inset-inline-end:1.1rem;top:50%;transform:translateY(-50%);width:3.1rem;height:3.1rem;border-radius:50%;background:#E7B343;color:#1F2A3F;display:grid;place-items:center}
.daily .go svg{width:1.5rem;height:1.5rem}
[dir="rtl"] .daily .go svg{transform:scaleX(-1)}

.row{display:flex;align-items:center;gap:.85rem;width:100%;padding:.9rem 1rem;margin-top:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.row svg{width:1.6rem;height:1.6rem;color:var(--lapis);flex:none}
.row b{display:block}
.row small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.row:disabled{opacity:.65}

.sec{font-size:1.2rem;margin:1.6rem 0 .7rem}
.grid{display:grid;gap:.6rem}
.tile{display:flex;align-items:center;gap:.9rem;width:100%;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.tile b{font-size:1.05rem;display:block}
.tile small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.tile .star{flex:none}
.tile.soon{opacity:.55;border-style:dashed;background:transparent}
.track{display:flex;gap:4px;margin-top:.5rem}
.track i{height:6px;flex:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.track i.next{border-color:var(--gold)}
.track i.none{border-style:dashed;background:transparent}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2rem}

/* land */
.lead{color:var(--muted);margin:.2rem 0 .3rem}
.rule{font-size:.9rem;margin:0 0 1rem;padding:.6rem .85rem;background:var(--surface2);border-radius:.75rem}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.rung{display:flex;align-items:center;gap:.9rem;width:100%;padding:.7rem .95rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.rung span{flex:1}
.rung b{display:block}
.rung small{display:block;color:var(--muted);font-size:.85rem}
.rung em{font-style:normal;font-weight:700;font-size:.85rem;padding:.3rem .7rem;border-radius:999px;white-space:nowrap}
.rung.open{border:2px solid var(--gold)}
.rung.open em{background:var(--goldb);color:#1F2A3F}
.rung.earned em{background:var(--okbg);color:var(--ok)}
.rung.locked,.rung.soon{opacity:.55}
.rung.soon{border-style:dashed;background:transparent}
.rung.locked em,.rung.soon em{color:var(--muted)}

/* quiz */
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--gold)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.meta{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.88rem;font-weight:600;margin:.6rem 0 .5rem}
.bn{font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.meta .bn{margin-inline-start:auto;font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qtext{font-family:var(--body);font-size:1.35rem;font-weight:700;line-height:1.4;margin:0 0 1.1rem}
.opts{display:grid;gap:.55rem}
.opt{display:block;width:100%;padding:.95rem 1.05rem;background:var(--surface);border:2px solid var(--line);border-radius:.9rem;font-weight:600;line-height:1.4;transition:transform .08s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.5}
.card{margin-top:1rem;padding:1.05rem 1.1rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ok);animation:up .25s ease-out}
.card.bad{border-top-color:var(--bad)}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.verdict{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;color:var(--ok)}
.card.bad .verdict{color:var(--bad)}
.ansline{margin:.3rem 0 0}
.x{margin:.55rem 0 .8rem}
.src{font-size:.88rem;border-top:1px solid var(--line);padding-top:.65rem}
.src>span{display:block;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.src a,.src p{display:block;margin:.1rem 0}
.src .grade{color:var(--muted)}
.beta{font-size:.8rem;color:var(--muted);margin:.55rem 0 0}
.card-act{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
.report{font-size:.85rem;color:var(--muted)}
.primary{background:var(--lapis);color:var(--surface);font-weight:700;padding:.8rem 1.3rem;border-radius:.8rem}
:root[data-theme="dark"] .primary{color:#0C1628}
.ghost{border:2px solid var(--line);font-weight:700;padding:.75rem 1.2rem;border-radius:.8rem}
.btns{display:grid;gap:.6rem;margin-top:1.5rem}
.btns>*{text-align:center;width:100%}

/* result */
.result{text-align:center;padding:2rem 0 .5rem}
.score{font-size:2.2rem}
.result p{color:var(--muted);max-width:24rem;margin:.6rem auto 0}
.earned .belt-big{animation:belt 1.1s cubic-bezier(.2,1.4,.4,1) 1}
.earned .belt-big svg{filter:drop-shadow(0 0 24px color-mix(in srgb,var(--goldb) 55%,transparent))}
@keyframes belt{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.lost{display:flex;align-items:center;gap:.8rem;text-align:start;margin:1.2rem auto 0;max-width:24rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface)}
.lost svg{opacity:.45;filter:grayscale(.3)}
.lost p{margin:0!important;color:var(--ink)!important}
.qnum{flex:1;text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}
.mbar{display:block;position:relative;height:5px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);margin-top:.4rem}
.mbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ok);border-radius:3px}
.mbar b,.bigbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bhead{display:flex;align-items:center;gap:1rem;margin:.4rem 0 1rem}
.bhead .bn{font-size:.95rem;padding:.3rem .8rem;border-radius:999px;font-weight:700;border:1px solid}
.bprog{margin:.5rem 0 0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.bigbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.bigbar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.bstat{color:var(--muted);font-size:.92rem;margin:.6rem 0 1rem}
.bstat.held{color:var(--ok);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.cell{aspect-ratio:1;border-radius:.8rem;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;position:relative;font-weight:700;font-size:1.1rem}
.cell small{position:absolute;top:.15rem;inset-inline-end:.35rem;font-size:.75rem}
.cell.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.flash{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;margin:-.2rem 0 .8rem;border-radius:.8rem;background:var(--okbg);font-weight:700;color:var(--ok)}
.flash.lost{background:var(--badbg);color:var(--bad)}
.flash p{margin:0}
.flash.earned svg{animation:belt 1s cubic-bezier(.2,1.4,.4,1) 1}
.card-act{flex-wrap:wrap}
.card-act>button{flex:1;white-space:nowrap;text-align:center}
.card-act .report{order:3;width:100%;text-align:center;padding-top:.2rem}
.profile{display:flex;align-items:center;gap:.9rem;width:100%;max-width:24rem;margin:0 auto;padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;text-align:start}
.profile .pinfo{flex:1;display:flex;flex-direction:column;line-height:1.3}
.profile b{font-size:1.1rem}
.ptitle{font-family:var(--display);font-weight:700;color:var(--gold);font-size:1rem}
.ptitle.big{font-size:1.6rem;margin:.2rem 0 1rem}
.profile small{color:var(--muted);font-size:.8rem}
.profile.edit{flex-direction:column;align-items:stretch;gap:.5rem}
.profile.edit label{font-weight:700}
.profile.edit input{font:inherit;font-size:1.05rem;padding:.7rem .8rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.nobelt{display:grid;place-items:center;width:64px}
.mcount{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:600}
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.3rem .8rem}
.mrow{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mname{flex:1;font-weight:600;font-size:.92rem}
.mbelts{display:flex;gap:.3rem}
.mcell{display:grid;place-items:center;width:34px;height:20px}
.mcell svg{opacity:.2;filter:grayscale(.6)}
.mcell.got svg{opacity:1;filter:none}
.mcell.none{border:1.5px dashed var(--line);border-radius:4px;height:14px;width:28px;margin:0 3px}
.qtrack{display:flex;flex-direction:column;gap:.3rem;margin:-.1rem 0 .8rem}
.bigbar.thin{height:7px}
.qtrack span{font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap}
.cele-wrap{align-items:center;overflow:hidden}
.cele{border-radius:1.2rem;text-align:center;max-width:22rem;margin:1rem}
.cele h2{font-size:1.7rem;margin-top:.6rem}
.cele-star{animation:spark 1.6s ease-out 1;display:inline-block;filter:drop-shadow(0 0 22px #E7B343)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.8s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.ttl-star{display:grid;place-items:center}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,#FBFAF6,#E9F1FB);transition:opacity .25s}
#intro .zlogo{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,24px);animation:zin .35s ease-out both;direction:ltr}
#intro .zmark{height:clamp(64px,19vw,112px);width:auto;flex:none}
#intro .zword{display:flex;flex-direction:column;align-items:stretch;font-family:Montserrat,"Segoe UI",Arial,sans-serif;line-height:1}
#intro .z1{font-weight:600;font-size:clamp(34px,10.5vw,62px);letter-spacing:.1em;color:#1F3A68;margin-right:-.1em}
#intro .z2{font-weight:500;font-size:clamp(11px,3.3vw,19px);letter-spacing:.62em;color:#1275EC;margin-top:.55em;margin-right:-.62em}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#intro.out{opacity:0;pointer-events:none}
.hero.dojo{position:relative;margin:.2rem 0 0;padding:2.6rem 1rem 2.3rem;border-radius:9rem 9rem 1.2rem 1.2rem;background-color:#16294F;background-image:var(--pat),radial-gradient(120% 80% at 50% 0%,#24457F 0%,#16294F 70%);color:#F5E9CF;overflow:hidden;text-align:center}
.hero.dojo .arch{position:absolute;inset:.6rem .6rem 0;width:calc(100% - 1.2rem);height:calc(100% - .6rem)}
.hero.dojo .brand{color:#F5E9CF;position:relative}
.hero.dojo .tag{color:#D9A53A;position:relative;margin-bottom:.2rem}
.hero.dojo .spark{position:relative}
.lantern{position:absolute;top:0;width:34px;height:102px;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.lantern.l1{inset-inline-start:13%}.lantern.l2{inset-inline-end:13%;animation-delay:-2.5s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.beltband{position:relative;display:flex;justify-content:center;align-items:center;margin:-.35rem 0 1rem}
.beltband .bb{display:flex;width:100%;height:12px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bstroke)}
.beltband .bb i{flex:1}
.bknot{position:absolute;width:40px;height:34px;top:-7px}
.hero-under{text-align:center;padding:.4rem 0 .6rem}
.sec{display:flex;align-items:center;gap:.5rem}
.sec::before{content:"";width:16px;height:16px;flex:none;background:var(--star) center/contain no-repeat}
.emb{position:relative;display:grid;place-items:center;flex:none;width:46px;height:46px}
.emb .gl{position:absolute;width:21px;height:21px}
.welcome{display:flex;flex-direction:column;gap:.35rem;padding:.4rem 0 1rem}
.welcome .spark{align-self:center}
.welcome h1{text-align:center;font-size:1.8rem;margin:.4rem 0 0}
.welcome .lead{text-align:center;margin:0 0 .8rem}
.welcome label,.profile.edit label{font-weight:700;margin-top:.5rem}
.welcome input,.welcome select,.profile.edit select{font:inherit;font-size:1.05rem;padding:.7rem .8rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.welcome small{color:var(--muted);font-size:.82rem}
.welcome .hint{text-align:center;margin-top:1rem}
.setnote{display:block;color:var(--muted);font-size:.8rem;margin-top:.35rem}
.qv{color:var(--qv,#0F6B4F);font-style:italic}
[data-theme="dark"] .qv{--qv:#7FD3AE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qv{--qv:#7FD3AE}}
.chal{font-size:.78rem;font-weight:800;color:#8A5A00;background:#FFF1C9;border:1px solid #E7B343;border-radius:999px;padding:.1rem .5rem;margin-inline-start:auto;margin-inline-end:.4rem}
.flash.stripe{border-color:var(--gold)}
.funrow{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;font-size:.85rem;color:var(--muted)}
.funrow span{flex:1}
.funb{width:2.4rem;height:2.2rem;border-radius:.6rem;border:1.5px solid var(--line);font-size:1.05rem;display:grid;place-items:center}
.funb.on{border-color:var(--gold);background:var(--gold-soft,rgba(231,179,67,.18))}
.daily .zone{display:inline-block;margin-top:.35rem;font-weight:700;color:#E7B343}
.skipq{display:block;margin:.8rem auto 0;color:var(--muted);font-weight:600;font-size:.92rem;padding:.5rem 1rem;border-radius:.6rem}
.skipq:active{background:var(--surface2)}
.earned h1{font-size:1.8rem;margin-top:.8rem}

/* settings */
.set{margin:1.2rem 0}
.set>label,.set>.lbl{display:block;font-weight:700;margin-bottom:.45rem}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:.8rem;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:.6rem .4rem;border-radius:.6rem;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--lapis)}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.85rem 0;border-bottom:1px solid var(--line)}
.tgl small{display:block;color:var(--muted);font-size:.8rem}
.sw{width:3rem;height:1.7rem;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(1.7rem - 6px);height:calc(1.7rem - 6px);border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl[aria-pressed="true"] .sw{background:var(--ok)}
.tgl[aria-pressed="true"] .sw::after{inset-inline-start:calc(100% - 1.7rem + 3px)}
.link-row{display:block;width:100%;padding:.95rem 0;border-bottom:1px solid var(--line);font-weight:600}
.danger{color:var(--bad)}
.about h2{font-size:1.1rem;margin:1.4rem 0 .35rem}
.about p{margin:.35rem 0}
.about .ref{display:block;color:var(--muted);font-size:.85rem}
.ver{color:var(--muted);font-size:.8rem;margin-top:1.5rem}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.7rem;font-weight:600;font-size:.9rem;z-index:9}

/* layout containers: invisible in portrait, columns in landscape */
.qbody{display:flex;flex-direction:column}
.qleft,.qright,.hleft,.hright{display:contents}
.qbody .meta{order:1}.qbody .qtrack{order:2}.qbody .qtext{order:3}.qbody .opts{order:4}.qbody .skipq{order:5}.qbody .card{order:6}
@media (orientation:landscape) and (min-width:700px){
  html{font-size:clamp(14px,calc(.9vw + .5vh),26px)}
  html[data-size="l"]{font-size:clamp(15px,calc(1vw + .56vh),29px)}
  html[data-size="xl"]{font-size:clamp(16px,calc(1.1vw + .62vh),32px)}
  #app{max-width:46rem}
  #app.scr-quiz,#app.scr-home{max-width:min(96vw,82rem)}
  #app.scr-quiz{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:.5rem}
  .scr-quiz>.top{flex:none}
  .scr-quiz .qbody{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(1rem,3vw,3rem);align-items:center}
  .scr-quiz .qleft,.scr-quiz .qright{display:block;max-height:100%;overflow:auto;padding:.2rem .2rem .5rem}
  .scr-quiz .qtext{font-size:1.5rem}
  .scr-quiz .skipq{margin-inline-start:0}
  .scr-quiz .card{margin-top:.7rem}
  .scr-quiz .card-act{flex-wrap:nowrap}
  .scr-quiz .card-act .report{order:0;width:auto;padding:0}
  #app.scr-home{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);column-gap:clamp(1rem,3vw,3rem);align-items:start}
  .scr-home>.top{grid-column:1/-1}
  .scr-home .hleft{display:block;position:sticky;top:.5rem}
  .scr-home .hright{display:block}
  .scr-home .hright>.daily{margin-top:0}
  .scr-home .grid{grid-template-columns:1fr 1fr}
  .cells{grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr))}
}
@media (orientation:landscape) and (min-width:700px) and (max-height:500px){
  .scr-quiz>.top{min-height:2.3rem}
  .scr-quiz .meta{margin:.1rem 0 .3rem}
  .scr-quiz .qtrack{margin-bottom:.4rem}
  .scr-quiz .qtext{font-size:1.15rem;margin-bottom:.3rem}
  .scr-quiz .opts{gap:.4rem}
  .scr-quiz .opt{padding:.55rem .8rem}
  .scr-quiz .card{padding:.6rem .8rem;margin-top:.4rem}
  .scr-quiz .x{margin:.25rem 0 .4rem}
  .scr-quiz .src{padding-top:.3rem}
  .scr-quiz .beta{display:none}
  .scr-quiz .qbody.answered .meta,.scr-quiz .qbody.answered .qtrack{display:none}
  .scr-quiz .funrow{margin-top:.3rem}
  .scr-quiz .card-act{margin-top:.5rem}
  .scr-quiz .card-act .primary,.scr-quiz .card-act .ghost{padding:.5rem .9rem}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

{"id":"QUR-1-01","l":"qur","v":1,"q":["How many surahs are in the Quran?","كم عدد سور القرآن الكريم؟"],"o":[["114","99","120","110"],["114","99","120","110"]],"x":["The Mushaf holds 114 surahs, opening with Al-Fatihah. After it, the surahs run roughly from the longest to the shortest, so the last pages hold the short surahs many of us memorize first.","يضمّ المصحف 114 سورة، أولها الفاتحة، ثم تترتب السور في الغالب من الطوال إلى القصار، ففي آخره السور القصيرة التي يحفظها كثيرون أولاً."],"s":[{"n":"mushaf"}]},

{"id":"QUR-1-18","l":"qur","v":1,"q":["Complete: ﴾By time! Indeed, mankind is in…﴿","أكمل: {Q:103:1} {Q:103:2:1-2} ..."],"o":[["loss","ease","hardship","doubt"],["خسر","يسر","عسر","ريب"]],"x":["Allah swears by time that every human being is in loss, except those with four qualities named in the next verse. It is one of the shortest surahs, yet it holds a whole way of life.","أقسم الله بالعصر أن الإنسان في خسر، إلا من اتصف بأربع صفات تذكرها الآية التالية. سورة قصيرة، لكنها منهج حياة كامل."],"s":[{"q":"103:1-2"}]},
{"id":"QUR-1-19","l":"qur","v":1,"q":["In which surah does Allah say: ﴾Indeed, your enemy is the one cut off﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:108:3}؟"],"o":[["Al-Kawthar","Al-Ma'un","Quraysh","An-Nasr"],["الكوثر","الماعون","قريش","النصر"]],"x":["Al-Kawthar opens with a gift from Allah: ﴾Indeed, We have given you al-Kawthar.﴿ It then assures the Prophet {saw} that it is his enemy, not he, who is cut off.","تبدأ السورة بالعطاء: {Q:108:1}، وتُختم بطمأنة النبي {saw}: {Q:108:3}."],"s":[{"q":"108:1-3"}]},
{"id":"QUR-1-20","l":"qur","v":1,"q":["Complete Surah Al-ʿAsr: ﴾…and advise one another to truth, and advise one another to…﴿","أكمل من سورة العصر: {Q:103:3:6-8} ..."],"o":[["patience","charity","prayer","knowledge"],["بالصبر","بالصدقة","بالصلاة","بالعلم"]],"x":["Four qualities save a person: faith, good deeds, advising one another to truth, and advising one another to patience. The whole surah is only three verses long.","أربع صفات تنجي صاحبها: الإيمان، والعمل الصالح، والتواصي بالحق، والتواصي بالصبر. والسورة كلها ثلاث آيات فقط."],"s":[{"q":"103:3"}]},
{"id":"QUR-1-21","l":"qur","v":1,"q":["In which surah does Allah say: ﴾Your Lord has not forsaken you, nor is He displeased﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:93:3}؟"],"o":[["Ad-Duhaa","Ash-Sharh","Ash-Shams","Al-Layl"],["الضحى","الشرح","الشمس","الليل"]],"x":["Allah swears by the morning brightness and the still night, then comforts the Prophet {saw}: your Lord has not abandoned you. The next verse adds: ﴾And the Hereafter is better for you than the first life.﴿","أقسم الله بالضحى والليل، ثم طمأن نبيه {saw}، ثم قال: {Q:93:4}."],"s":[{"q":"93:1-4"}]},
{"id":"QUR-1-22","l":"qur","v":1,"q":["Complete: ﴾All praise is for Allah, Lord of the…﴿","أكمل: {Q:1:2:1-3} ..."],"o":[["worlds","heavens","prophets","believers"],["العالمين","السماوات","الأنبياء","المؤمنين"]],"x":["The Quran’s first words of praise: Allah is Lord of all the worlds, every part of creation. The next verse calls Him ﴾the Most Merciful, the Especially Merciful.﴿","أول حمد في المصحف: الله رب العالمين جميعاً، ثم قال: {Q:1:3}."],"s":[{"q":"1:2-3"}]},
{"id":"QUR-1-23","l":"qur","v":1,"q":["Complete: ﴾Did We not expand for you your…﴿","أكمل: {Q:94:1:1-3} ..."],"o":[["chest","wealth","family","path"],["صدرك","مالك","أهلك","طريقك"]],"x":["This surah comforts the Prophet {saw}: Allah expanded his chest, lifted his burden, and raised his mention.","هذه السورة تسلية للنبي {saw}: شرح الله صدره، ووضع عنه وزره، ورفع له ذكره: {Q:94:4}."],"s":[{"q":"94:1-4"}]},
{"id":"QUR-2-01","l":"qur","v":2,"q":["Which is the longest surah in the Quran?","ما أطول سورة في القرآن الكريم؟"],"o":[["Al-Baqarah","Al ʿImran","An-Nisaʾ","Al-Kahf"],["البقرة","آل عمران","النساء","الكهف"]],"x":["Al-Baqarah has 286 verses, and it ends with some of the most beloved duʿas in the Quran.","سورة البقرة، وعدد آياتها 286 آية."],"s":[{"n":"mushaf"}]},
{"id":"QUR-2-02","l":"qur","v":2,"q":["Which surah does not begin with “Bismillah”?","ما السورة التي لا تبدأ بالبسملة؟"],"o":[["At-Tawbah","Al-Anfal","Ya-Sin","Al-Mulk"],["التوبة","الأنفال","يس","الملك"]],"x":["At-Tawbah (Surah 9) is the only surah that does not open with Bismillah.","سورة التوبة هي السورة الوحيدة التي لا تُفتتح بالبسملة."],"s":[{"n":"mushaf"}]},
{"id":"QUR-2-03","l":"qur","v":2,"q":["Ayat al-Kursi is found in which surah?","في أي سورة تقع آية الكرسي؟"],"o":[["Al-Baqarah","Al ʿImran","Al-Kahf","Ya-Sin"],["البقرة","آل عمران","الكهف","يس"]],"x":["It is verse 255 of Al-Baqarah: a single verse about Allah’s life, knowledge and power, ending ﴾and He is the Most High, the Most Great﴿.","آية الكرسي هي الآية 255 من سورة البقرة."],"s":[{"q":"2:255"}]},
{"id":"QUR-2-04","l":"qur","v":2,"q":["Who is the only woman mentioned by name in the Quran?","من المرأة الوحيدة التي ذُكر اسمها صراحةً في القرآن؟"],"o":[["Maryam","Khadijah","Asiyah","Hawwaʾ"],["مريم","خديجة","آسية","حواء"]],"x":["Maryam, the mother of ʿIsa {as}. Allah says He chose her and purified her above the women of the worlds, and a whole surah carries her name.","مريم أم عيسى {as}، وقد سُمّيت سورةٌ باسمها."],"s":[{"q":"19:16"}]},
{"id":"QUR-2-05","l":"qur","v":2,"q":["Laylat al-Qadr is better than how many months?","ليلةُ القدر خيرٌ من كم شهر؟"],"o":[["A thousand","A hundred","Seventy","Twelve"],["ألف شهر","مئة شهر","سبعين شهراً","اثني عشر شهراً"]],"x":["One night better than a thousand months, more than eighty years of worship. The surah ends: it is peace until the rise of dawn.","قال تعالى: {Q:97:3}."],"s":[{"q":"97:3"}]},
{"id":"QUR-2-06","l":"qur","v":2,"q":["Which surah tells one prophet’s story from beginning to end, and opens with ﴾We relate to you the best of stories﴿?","أيّ سورةٍ تقصّ قصة نبيٍّ واحد من أولها إلى آخرها، وفي مطلعها: {Q:12:3:1-5}؟"],"o":[["Yusuf","Maryam","Ta-Ha","Al-Qasas"],["يوسف","مريم","طه","القصص"]],"x":["The surah follows Yusuf {as} from a boy’s dream to the day his family bowed before him in Egypt.","السورة كلها في قصة يوسف {as}."],"s":[{"q":"12:3"}]},
{"id":"QUR-2-07","l":"qur","v":2,"q":["In which surah does Allah say: ﴾Striking them with stones of baked clay﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:105:4}؟"],"o":[["Al-Fil","Quraysh","Al-Maʿun","Al-Kawthar"],["الفيل","قريش","الماعون","الكوثر"]],"x":["Al-Fil recalls the Companions of the Elephant: Allah foiled their plot and sent birds in flocks against them.","سورة الفيل، الآية 4."],"s":[{"q":"105:4"}]},
{"id":"QUR-2-08","l":"qur","v":2,"q":["Which surah is named after a metal that Allah says has great strength and benefits for people?","ما السورة التي سُمّيت باسم معدنٍ ذكر الله أن فيه بأساً شديداً ومنافع للناس؟"],"o":[["Al-Hadid","Az-Zukhruf","Al-Fajr","Al-ʿAdiyat"],["الحديد","الزخرف","الفجر","العاديات"]],"x":["Al-Hadid means “iron”. Allah says He sent down iron, with great strength and benefits for people.","قال تعالى: {Q:57:25:12-18}."],"s":[{"q":"57:25"}]},
{"id":"QUR-2-09","l":"qur","v":2,"q":["In which surah does Allah say: ﴾He who created death and life to test you, which of you is best in deed﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:67:2:1-8}؟"],"o":[["Al-Mulk","Al-Furqan","Al-Hashr","Al-Waqiʿah"],["الملك","الفرقان","الحشر","الواقعة"]],"x":["The surah opens by praising Allah, in whose hand is all dominion. Life and death are a test of who does best.","سورة الملك، الآية 2."],"s":[{"q":"67:2"}]},
{"id":"QUR-2-10","l":"qur","v":2,"q":["Which surah is named after the creature Allah inspired to make homes in the mountains?","أيّ سورةٍ سُمّيت باسم مخلوقٍ أوحى الله إليه أن يتخذ من الجبال بيوتاً؟"],"o":[["An-Nahl (the bee)","An-Naml (the ant)","Al-ʿAnkabut (the spider)","Al-Fil (the elephant)"],["النحل","النمل","العنكبوت","الفيل"]],"x":["Allah inspired the bee to make homes in the mountains, in the trees and in what people build.","قال تعالى: {Q:16:68}."],"s":[{"q":"16:68"}]},
{"id":"QUR-2-11","l":"qur","v":2,"q":["In which surah is a birth by the trunk of a palm tree described?","في أي سورةٍ جاء قوله تعالى: {Q:19:23:1-5}؟"],"o":[["Maryam","Al ʿImran","Yusuf","Ta-Ha"],["مريم","آل عمران","يوسف","طه"]],"x":["The birth of ʿIsa {as} by the palm tree is told in Surah Maryam.","تُروى ولادة عيسى {as} عند جذع النخلة في سورة مريم."],"s":[{"q":"19:23"}]},
{"id":"QUR-2-12","l":"qur","v":2,"q":["Which surah mentions the journeys of winter and summer?","ما السورة التي تذكر {Q:106:2:2-4}؟"],"o":[["Quraysh","Al-Fil","Al-Maʿun","Al-Kawthar"],["قريش","الفيل","الماعون","الكوثر"]],"x":["Allah reminds Quraysh of their safe trade journeys, so they should worship the Lord of this House, who fed them and gave them security.","تذكّر سورة قريش قريشاً برحلتيهم في الشتاء والصيف."],"s":[{"q":"106:1-2"}]},
{"id":"QUR-2-14","l":"qur","v":2,"q":["Which surah begins ﴾Have you seen the one who denies the Recompense?﴿?","ما السورة التي تبدأ بقوله تعالى: {Q:107:1}؟"],"o":[["Al-Ma'un","Quraysh","Al-Kawthar","Al-Humazah"],["الماعون","قريش","الكوثر","الهمزة"]],"x":["The surah describes the one who denies the Recompense: he drives away the orphan and does not urge feeding the poor.","هي سورة الماعون، السورة رقم 107 في المصحف."],"s":[{"q":"107:1"}]},
{"id":"QUR-2-15","l":"qur","v":2,"q":["In which surah does Allah say: ﴾Then you will surely be asked that Day about the pleasures﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:102:8}؟"],"o":[["At-Takathur","Al-Qari'ah","Al-'Asr","Al-'Adiyat"],["التكاثر","القارعة","العصر","العاديات"]],"x":["The surah warns against being distracted by competing for more, until people reach the graves.","سورة التكاثر، الآية 8."],"s":[{"q":"102:8"}]},
{"id":"QUR-2-16","l":"qur","v":2,"q":["In which surah does Allah say: ﴾The Day people will be like scattered moths﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:101:4}؟"],"o":[["Al-Qari'ah","Az-Zalzalah","Al-'Adiyat","At-Takathur"],["القارعة","الزلزلة","العاديات","التكاثر"]],"x":["The surah describes the Striking Day: people like scattered moths, and mountains like tufts of carded wool.","سورة القارعة، الآية 4."],"s":[{"q":"101:4"}]},
{"id":"QUR-2-17","l":"qur","v":2,"q":["In which surah does Allah say: ﴾So whoever does an atom’s weight of good will see it﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:99:7}؟"],"o":[["Az-Zalzalah","Al-Qari'ah","Al-Inshiqaq","Al-Infitar"],["الزلزلة","القارعة","الإنشقاق","الإنفطار"]],"x":["On the Day the earth shakes, even an atom’s weight of good will be seen, and an atom’s weight of evil too.","سورة الزلزلة، الآية 7."],"s":[{"q":"99:7"}]},
{"id":"QUR-2-18","l":"qur","v":2,"q":["In which surah does Allah say: ﴾The angels and the Spirit descend therein by permission of their Lord﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:97:4}؟"],"o":[["Al-Qadr","Ad-Dukhan","Al-'Alaq","Al-Bayyinah"],["القدر","الدخان","العلق","البينة"]],"x":["On that night the angels descend by their Lord’s permission, and it is peace until the rise of dawn.","سورة القدر، الآية 4."],"s":[{"q":"97:4"}]},
{"id":"QUR-2-19","l":"qur","v":2,"q":["In which surah does Allah say: ﴾Who gathers wealth and counts it﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:104:2}؟"],"o":[["Al-Humazah","Al-Mutaffifin","Al-Ma'un","Al-Masad"],["الهمزة","المطففين","الماعون","المسد"]],"x":["The surah warns the slanderer who hoards and counts his wealth, thinking it will make him last forever.","سورة الهمزة، الآية 2."],"s":[{"q":"104:2"}]},
{"id":"QUR-2-20","l":"qur","v":2,"q":["In which surah does Allah say: ﴾He has succeeded who purifies it﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:91:9}؟"],"o":[["Ash-Shams","Ad-Duhaa","Al-Layl","Al-Fajr"],["الشمس","الضحى","الليل","الفجر"]],"x":["After eleven oaths, by the sun, the moon, the day, the night and more, Allah declares: whoever purifies his soul succeeds, and whoever corrupts it fails.","سورة الشمس، الآية 9."],"s":[{"q":"91:9"}]},
{"id":"QUR-2-21","l":"qur","v":2,"q":["In which surah does Allah say: ﴾Indeed, your efforts are diverse﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:92:4}؟"],"o":[["Al-Layl","Ash-Shams","Ad-Duhaa","Al-Fajr"],["الليل","الشمس","الضحى","الفجر"]],"x":["People strive in different ways. Whoever gives and is mindful of Allah, and believes in the best, Allah eases his way to ease.","سورة الليل، الآية 4."],"s":[{"q":"92:4"}]},
{"id":"QUR-2-22","l":"qur","v":2,"q":["In which surah does Allah say: ﴾We will make you recite, and you will not forget﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:87:6}؟"],"o":[["Al-A'la","Al-Ghashiyah","Al-Waqi'ah","Al-Haqqah"],["الأعلى","الغاشية","الواقعة","الحاقة"]],"x":["A promise to the Prophet {saw} that he would not forget the Quran, except what Allah wills.","سورة الأعلى، الآية 6."],"s":[{"q":"87:6"}]},
{"id":"QUR-2-23","l":"qur","v":2,"q":["In which surah does Allah say: ﴾Do they not look at the camels, how they were created?﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:88:17}؟"],"o":[["Al-Ghashiyah","Al-A'la","An-Naba","Al-Buruj"],["الغاشية","الأعلى","النبإ","البروج"]],"x":["The surah invites reflection on creation: the camels, the sky raised high, the mountains set firm, the earth spread out.","سورة الغاشية، الآية 17."],"s":[{"q":"88:17"}]},
{"id":"QUR-3-01","l":"qur","v":3,"q":["In which surah does “Bismillah” appear twice?","في أي سورة تتكرر البسملة مرتين؟"],"o":[["An-Naml","Al-Fatihah","Yusuf","Maryam"],["النمل","الفاتحة","يوسف","مريم"]],"x":["Once at its start, and again in the letter of Sulayman {as} to the Queen of Sheba.","في أولها، وفي كتاب سليمان {as} إلى ملكة سبأ."],"s":[{"q":"27:30"}]},
{"id":"QUR-3-02","l":"qur","v":3,"q":["Which surah closes the Mushaf?","ما آخر سورة في المصحف؟"],"o":[["An-Nas","Al-Falaq","Al-Ikhlas","Al-Kawthar"],["الناس","الفلق","الإخلاص","الكوثر"]],"x":["An-Nas closes the Mushaf, just as Al-Fatihah opens it: both are prayers addressed to Allah.","سورة الناس هي السورة 114، وفيها الاستعاذة بالله."],"s":[{"q":"114:1-6"}]},
{"id":"QUR-3-04","l":"qur","v":3,"q":["What were the first verses of the Quran to be revealed?","ما أول ما نزل من القرآن؟"],"o":[["“Read in the name of your Lord who created”","“In the name of Allah, the Most Merciful”","“All praise is for Allah, Lord of the worlds”","“Say, He is Allah, the One”"],["{Q:96:1}","{Q:1:1}","{Q:1:2}","{Q:112:1}"]],"x":["The opening verses of Surah Al-ʿAlaq came to him in the Cave of Hiraʾ.","نزلت أوائل سورة العلق عليه في غار حراء."],"s":[{"q":"96:1-5"},{"b":3}]},
{"id":"QUR-3-05","l":"qur","v":3,"q":["Which prophet is named most often in the Quran?","أي نبي ذُكر اسمه في القرآن أكثر من غيره؟"],"o":[["Musa","Ibrahim","ʿIsa","Nuh"],["موسى","إبراهيم","عيسى","نوح"]],"x":["Musa {as} is named more than 130 times, and his story with Firʿawn is retold across many surahs.","ذُكر اسم موسى {as} أكثر من 130 مرة."],"s":[{"n":"mushaf"}]},
{"id":"QUR-3-06","l":"qur","v":3,"q":["Besides the People of the Cave, Surah Al-Kahf tells of which ruler who travelled to the east and the west?","إلى جانب أصحاب الكهف، تروي سورة الكهف قصة أي حاكم بلغ مغرب الشمس ومطلعها؟"],"o":[["Dhul-Qarnayn","Talut","Firʿawn","Sulayman"],["ذو القرنين","طالوت","فرعون","سليمان"]],"x":["He travelled to where the sun sets and where it rises, and built a barrier of iron and molten copper against Yaʾjuj and Maʾjuj.","بنى ذو القرنين سداً في وجه يأجوج ومأجوج."],"s":[{"q":"18:83-98"}]},
{"id":"QUR-3-07","l":"qur","v":3,"q":["Which surah begins ﴾Alif Lam Mim. That is the Book, about which there is no doubt﴿?","ما السورة التي تبدأ بقوله تعالى: {Q:2:1} {Q:2:2:1-5}؟"],"o":[["Al-Baqarah","Al ʿImran","Luqman","As-Sajdah"],["البقرة","آل عمران","لقمان","السجدة"]],"x":["Several surahs open with Alif Lam Mim, but only Al-Baqarah continues ﴾That is the Book, about which there is no doubt.﴿","تبدأ عدة سور بـ«الم»، ولكن سورة البقرة وحدها تليها: {Q:2:2:1-5}."],"s":[{"q":"2:1-2"}]},
{"id":"QUR-3-08","l":"qur","v":3,"q":["In which surah does ʿIsa {as} give glad tidings of a messenger to come after him, named Ahmad?","في أي سورةٍ بشّر عيسى {as} برسولٍ يأتي من بعده {Q:61:6:23-24}؟"],"o":[["As-Saff","Maryam","Al-Maʾidah","Al ʿImran"],["الصف","مريم","المائدة","آل عمران"]],"x":["ʿIsa {as} told the Children of Israel he brings glad tidings of a messenger after him whose name is Ahmad.","قال تعالى: {Q:61:6:1-24}."],"s":[{"q":"61:6"}]},
{"id":"QUR-3-09","l":"qur","v":3,"q":["In which surah does Allah say: ﴾When you are told to make room in gatherings, make room; Allah will make room for you﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:58:11:4-13}؟"],"o":[["Al-Mujadilah","At-Talaq","An-Nisaʾ","At-Tahrim"],["المجادلة","الطلاق","النساء","التحريم"]],"x":["The same verse promises that Allah raises by degrees those who believe and those given knowledge.","سورة المجادلة، الآية 11."],"s":[{"q":"58:11"}]},
{"id":"QUR-3-10","l":"qur","v":3,"q":["Surah Al-Ahqaf is named after the sand dunes where ﴾the brother of ʿAd﴿ warned his people. Who was he?","سُمّيت سورة الأحقاف بالرمال التي أنذر عندها نبيٌّ قومه، وجاء ذكره فيها: {Q:46:21:1-3}. فمن هو؟"],"o":[["Hud","Salih","Shuʿayb","Lut"],["هود","صالح","شعيب","لوط"]],"x":["The brother of ʿAd is Hud {as}, as Allah says elsewhere: ﴾And to ʿAd, their brother Hud.﴿","أخو عاد هو هود {as}، كما قال تعالى: {Q:7:65:1-4}."],"s":[{"q":"46:21"},{"q":"7:65"}]},
{"id":"QUR-3-11","l":"qur","v":3,"q":["In which surah does Allah say: ﴾We have certainly created man in the best of stature﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:95:4}؟"],"o":[["At-Tin","Ash-Shams","Al-Fajr","Al-Layl"],["التين","الشمس","الفجر","الليل"]],"x":["The surah swears by the fig and the olive, then says man was made in the best form, yet can fall to the lowest of the low.","سورة التين، الآية 4."],"s":[{"q":"95:4"}]},
{"id":"QUR-3-12","l":"qur","v":3,"q":["In which surah does Allah say: ﴾He created man from clay like pottery﴿?","في أيّ سورةٍ جاء قوله تعالى: {Q:55:14}؟"],"o":[["Ar-Rahman","Al-Waqi'ah","Al-Fatihah","Al-Isra"],["الرحمن","الواقعة","الفاتحة","الإسراء"]],"x":["Man’s origin: dry clay that rings like pottery, fashioned by the Most Merciful.","سورة الرحمن، الآية 14."],"s":[{"q":"55:14"}]},

{"id":"QUR-5-23","l":"qur","v":5,"q":["Allah says He is not shy to strike a parable of even which tiny creature, or anything above it?","يقول الله إنه لا يستحيي أن يضرب مثلاً ما... فما فوقها. ما هو؟"],"o":[["A mosquito","An ant","A bee","A spider"],["بعوضة","نملة","نحلة","عنكبوت"]],"x":["Believers know such parables are the truth from their Lord, while those who disbelieve ask what Allah could possibly mean by them.","قال تعالى: {Q:2:26:1-19}."],"s":[{"q":"2:26"}]},
{"id":"QUR-5-24","l":"qur","v":5,"q":["According to Surah Al-Hajj, those invoked besides Allah could never create even a…, even if they all gathered together for it.","بحسب سورة الحج، لن يخلق الذين يُدعون من دون الله... ولو اجتمعوا له."],"o":[["fly","grain of sand","drop of water","feather"],["ذباباً","حبة رمل","قطرة ماء","ريشة"]],"x":["And if the fly snatched something away from them, they could not even take it back: ﴾Weak are the pursuer and the pursued.﴿","قال تعالى: {Q:22:73}."],"s":[{"q":"22:73"}]},
{"id":"QUR-5-25","l":"qur","v":5,"q":["Surah Al-Jumuʿah likens those given the Tawrah who did not live by it to a donkey carrying…","شبّهت سورة الجمعة الذين حُمّلوا التوراة ثم لم يحملوها بالحمار يحمل..."],"o":[["books","water","gold","stones"],["أسفاراً","ماءً","ذهباً","حجارة"]],"x":["The load it carries is precious, yet the donkey gains nothing from it.","قال تعالى: {Q:62:5:1-11}."],"s":[{"q":"62:5"}]},
{"id":"QUR-5-26","l":"qur","v":5,"q":["In Surah Al-Baqarah, spending in Allah’s cause is like a grain that sprouts how many ears, each holding a hundred grains?","في سورة البقرة، مثل الإنفاق في سبيل الله كمثل حبة أنبتت كم سنبلة، في كل سنبلة مئة حبة؟"],"o":[["Seven","Three","Ten","Forty"],["سبع","ثلاث","عشر","أربعون"]],"x":["One grain becomes seven hundred. The verse adds: ﴾and Allah multiplies for whom He wills﴿.","قال تعالى: {Q:2:261}."],"s":[{"q":"2:261"}]},
{"id":"QUR-5-27","l":"qur","v":5,"q":["In the Verse of Light, Allah’s light is likened to a niche containing what?","في آية النور، مُثّل نور الله بمشكاة فيها ماذا؟"],"o":[["A lamp","A star","A pearl","A mirror"],["مصباح","كوكب","لؤلؤة","مرآة"]],"x":["The lamp is in a glass shining like a brilliant star, lit from a blessed olive tree: ﴾light upon light﴿.","قال تعالى: {Q:24:35:5-21}… {Q:24:35:33-35}."],"s":[{"q":"24:35"}]},
{"id":"PRO-1-01","l":"pro","v":1,"q":["Who was the first human Allah created?","من أول إنسان خلقه الله؟"],"o":[["Adam","Nuh","Ibrahim","Idris"],["آدم","نوح","إبراهيم","إدريس"]],"x":["Allah told the angels He would place a successor on earth, then created Adam {as} and taught him the names of all things. He commanded the angels to prostrate to Adam, and all did, except Iblis.","أخبر الله الملائكة أنه جاعل في الأرض خليفة، وخلق آدم {as} وعلّمه الأسماء كلها، ثم قال: {Q:2:34:1-10}."],"s":[{"q":"2:30-34"}]},
{"id":"PRO-1-02","l":"pro","v":1,"q":["Which prophet built the Ark?","أي نبي صنع السفينة؟"],"o":[["Nuh","Musa","Yunus","Hud"],["نوح","موسى","يونس","هود"]],"x":["Allah told Nuh {as} to build the Ark under His watch and by His revelation. Every time a group of his people passed by, they mocked him.","قال تعالى لنوح {as}: {Q:11:37:1-4}، وكان قومه يسخرون منه: {Q:11:38:1-10}."],"s":[{"q":"11:37-38"}]},
{"id":"PRO-1-03","l":"pro","v":1,"q":["Which prophet was swallowed by a great fish?","أي نبي التقمه الحوت؟"],"o":[["Yunus","Yusuf","Ayyub","Ilyas"],["يونس","يوسف","أيوب","إلياس"]],"x":["In the darkness inside the fish, Yunus {as} called out: ﴾There is no god but You, glory be to You; I was among the wrongdoers.﴿ Allah answered him and saved him from his distress.","نادى يونس {as} في الظلمات: {Q:21:87:15-23}، فاستجاب الله له ونجّاه من الغم."],"s":[{"q":"21:87-88"}]},
{"id":"PRO-1-04","l":"pro","v":1,"q":["Who is the final prophet?","من خاتم الأنبياء؟"],"o":[["Muhammad","ʿIsa","Musa","Ibrahim"],["محمد","عيسى","موسى","إبراهيم"]],"x":["The Quran says Muhammad {saw} is the Messenger of Allah and ﴾the Seal of the Prophets﴿: the last in the line of prophets.","قال تعالى: {Q:33:40:8-12}."],"s":[{"q":"33:40"}]},
{"id":"PRO-1-05","l":"pro","v":1,"q":["Which prophet raised the foundations of the Kaʿbah with his son?","أي نبي رفع قواعد الكعبة مع ابنه؟"],"o":[["Ibrahim","Nuh","Adam","Dawud"],["إبراهيم","نوح","آدم","داود"]],"x":["Ibrahim and his son Ismaʿil {as2} raised the foundations of the House together, praying: ﴾Our Lord, accept this from us.﴿","رفع إبراهيم وإسماعيل {as2} القواعد من البيت وهما يدعوان: {Q:2:127:8-10}."],"s":[{"q":"2:127"}]},
{"id":"PRO-1-06","l":"pro","v":1,"q":["Which prophet struck the sea with his staff so that it parted?","أي نبي ضرب البحر بعصاه فانفلق؟"],"o":[["Musa","Nuh","Ibrahim","Yunus"],["موسى","نوح","إبراهيم","يونس"]],"x":["Allah told Musa {as} to strike the sea with his staff, and it split in two, each side like a great mountain. Musa’s people crossed safely, and Firʿawn’s army that followed was drowned.","قال تعالى: {Q:26:63}، فأنجى الله موسى ومن معه، وأغرق فرعون وجنده."],"s":[{"q":"26:63-66"}]},
{"id":"PRO-1-07","l":"pro","v":1,"q":["Who was the mother of ʿIsa {as}?","مَن أمُّ عيسى {as}؟"],"o":[["Maryam","Asiyah","Sarah","Hajar"],["مريم","آسية","سارة","هاجر"]],"x":["ʿIsa {as} is called “the son of Maryam” throughout the Quran, and a whole surah carries her name.","يُسمّى عيسى {as} في القرآن {Q:19:34:3-4}، ومريم هي المرأة الوحيدة المذكورة باسمها في القرآن، وسُمّيت باسمها سورة كاملة."],"s":[{"q":"19:34"}]},
{"id":"PRO-1-08","l":"pro","v":1,"q":["Which prophet did his brothers throw into the bottom of a well?","أيّ نبيٍّ ألقاه إخوته في غيابة الجب؟"],"o":[["Yusuf","Musa","Yunus","Ishaq"],["يوسف","موسى","يونس","إسحاق"]],"x":["His brothers were jealous because their father loved Yusuf more. Years later, Yusuf rose to high office in Egypt, and those same brothers came to him for food.","حسد إخوةُ يوسف أخاهم لأن أباهم كان يحبه أكثر، ثم صار يوسف على خزائن مصر، وجاءه إخوته يطلبون الطعام: {Q:12:58}."],"s":[{"q":"12:8-15"},{"q":"12:55-58"}]},
{"id":"PRO-1-09","l":"pro","v":1,"q":["Which prophet was given the Injil?","أيّ نبيٍّ آتاه الله الإنجيل؟"],"o":[["ʿIsa","Musa","Dawud","Yahya"],["عيسى","موسى","داود","يحيى"]],"x":["Allah gave ʿIsa {as} the Injil, containing guidance and light, confirming the Tawrah that came before it.","قال تعالى: {Q:5:46:13-23}."],"s":[{"q":"5:46"}]},
{"id":"PRO-1-10","l":"pro","v":1,"q":["Which prophet did Allah take as a close friend (khalil)?","أيّ نبيٍّ اتخذه الله خليلاً؟"],"o":[["Ibrahim","Nuh","Musa","Adam"],["إبراهيم","نوح","موسى","آدم"]],"x":["Allah took Ibrahim {as} as His close friend (khalil). The same verse praises following ﴾the way of Ibrahim, inclining to truth.﴿","قال تعالى: {Q:4:125:14-17}، وفي الآية نفسها: {Q:4:125:10-13}."],"s":[{"q":"4:125"}]},
{"id":"PRO-1-12","l":"pro","v":1,"t":"tf","a":0,"q":["ʿIsa {as} was born to Maryam without a father.","وُلد عيسى {as} من مريم من غير أب."],"x":["True. Maryam asked how she could have a son when no man had touched her. Allah compares ʿIsa to Adam: He said to him ﴾Be﴿, and he was.","صح. قالت مريم: {Q:3:47:2-9}، وقال تعالى: {Q:3:59:1-7}… {Q:3:59:11-15}."],"s":[{"q":"3:47"},{"q":"3:59"}]},
{"id":"PRO-1-13","l":"pro","v":1,"q":["Which prophet’s people were overtaken by the flood?","أيّ نبيٍّ أخذ الطوفانُ قومَه؟"],"o":[["Nuh","Hud","Salih","Lut"],["نوح","هود","صالح","لوط"]],"x":["Nuh {as} called his people to Allah for a very long time, yet only a few believed with him. Then the flood overtook those who did wrong.","دعا نوح {as} قومه زمناً طويلاً: {Q:11:40:22-26}، ثم أخذهم الطوفان وهم ظالمون."],"s":[{"q":"29:14"},{"q":"11:40"}]},
{"id":"PRO-1-14","l":"pro","v":1,"q":["Which prophet was sent to Firʿawn?","أيّ نبيٍّ أُرسل إلى فرعون؟"],"o":[["Musa","Ibrahim","Yusuf","Nuh"],["موسى","إبراهيم","يوسف","نوح"]],"x":["Allah sent Musa {as} to Firʿawn with a surprising instruction: ﴾Speak to him gently, that perhaps he may remember or fear.﴿","أرسل الله موسى {as} إلى فرعون، وقال: {Q:20:44}."],"s":[{"q":"20:24"},{"q":"20:43-44"}]},
{"id":"PRO-1-15","l":"pro","v":1,"q":["Which prophet was Musa’s brother, also made a prophet?","مَن أخو موسى الذي جعله الله نبيّاً؟"],"o":[["Harun","Yusha","Shuʿayb","Yusuf"],["هارون","يوشع","شعيب","يوسف"]],"x":["Allah granted Musa {as} his brother Harun as a prophet, out of His mercy, and sent the two of them together to Firʿawn.","قال تعالى: {Q:19:53}، ثم أرسلهما معاً إلى فرعون."],"s":[{"q":"19:53"}]},
{"id":"PRO-1-16","l":"pro","v":1,"q":["Which prophet inherited from Dawud {as}?","أيّ نبيٍّ ورث داود {as}؟"],"o":[["Sulayman","Yahya","Harun","Ismaʿil"],["سليمان","يحيى","هارون","إسماعيل"]],"x":["Sulayman {as} inherited from his father Dawud, and said: ﴾O people, we have been given from everything. Indeed, this is the evident bounty.﴿","قال تعالى: {Q:27:16}."],"s":[{"q":"27:16"}]},
{"id":"PRO-1-17","l":"pro","v":1,"q":["Zakariyya {as} was given glad tidings of a son. What was his name?","بُشّر زكريا {as} بغلام، فما اسمه؟"],"o":[["Yahya","ʿIsa","Ismaʿil","Ishaq"],["يحيى","عيسى","إسماعيل","إسحاق"]],"x":["In old age, Zakariyya {as} prayed for an heir. Allah answered with glad tidings of a son named Yahya, a name given to no one before him.","دعا زكريا {as} ربه على كبر سنه أن يهبه وليّاً، فبشّره الله: {Q:19:7}."],"s":[{"q":"19:4-7"}]},
{"id":"PRO-1-18","l":"pro","v":1,"q":["In his old age, Allah granted Ibrahim {as} two sons. Who were they?","وهب الله لإبراهيم {as} على الكبر ولدين، فمن هما؟"],"o":[["Ismaʿil and Ishaq","Yaʿqub and Yusuf","Musa and Harun","Dawud and Sulayman"],["إسماعيل وإسحاق","يعقوب ويوسف","موسى وهارون","داود وسليمان"]],"x":["Ibrahim {as} thanked Allah: ﴾Praise be to Allah, who granted me in old age Ismaʿil and Ishaq. Indeed, my Lord is the Hearer of supplication.﴿","قال تعالى: {Q:14:39}."],"s":[{"q":"14:39"}]},
{"id":"PRO-1-19","l":"pro","v":1,"q":["According to the Quran, what happened to ʿIsa {as}?","ماذا حدث لعيسى {as} كما جاء في القرآن؟"],"o":[["Allah raised him up to Himself","He was killed","He was crucified","He died in battle"],["رفعه الله إليه","قُتل","صُلب","مات في معركة"]],"x":["The Quran says they did not kill him or crucify him; it was only made to appear so to them. Rather, Allah raised him up to Himself.","قال تعالى: {Q:4:157:10-16}… {Q:4:158:1-4}."],"s":[{"q":"4:157-158"}]},
{"id":"PRO-1-20","l":"pro","v":1,"q":["Which prophet’s hand came out shining white, without harm, as a sign?","أيّ نبيٍّ خرجت يده بيضاء من غير سوء آيةً؟"],"o":[["Musa","ʿIsa","Sulayman","Ibrahim"],["موسى","عيسى","سليمان","إبراهيم"]],"x":["At the valley of Tuwa, Allah gave Musa {as} two signs: his staff became a moving snake, and his hand came out shining white, without any harm.","آتى الله موسى {as} آيتين: العصا التي صارت حية تسعى، واليد التي خرجت بيضاء: {Q:20:22}."],"s":[{"q":"20:12"},{"q":"20:17-22"}]},
{"id":"PRO-1-21","l":"pro","v":1,"q":["Which prophet was taught the speech of birds?","أيّ نبيٍّ عُلّم منطق الطير؟"],"o":[["Sulayman","Nuh","Hud","Yunus"],["سليمان","نوح","هود","يونس"]],"x":["Sulayman {as} said: ﴾We have been taught the speech of birds.﴿ Allah gathered for him armies of jinn, people and birds, marching in orderly ranks.","قال تعالى: {Q:27:16:4-9}، و{Q:27:17}."],"s":[{"q":"27:16-17"}]},
{"id":"PRO-1-22","l":"pro","v":1,"t":"tf","a":0,"q":["Allah told the angels He would create a human being from clay.","أخبر الله الملائكة أنه خالقٌ بشراً من طين."],"x":["True. Allah told the angels He would create a human from clay: ﴾When I have proportioned him and breathed into him of My spirit, fall down to him in prostration.﴿","صح. قال تعالى: {Q:38:71} {Q:38:72}."],"s":[{"q":"38:71-72"}]},
{"id":"PRO-1-23","l":"pro","v":1,"q":["As a baby, which prophet was taken into the house of Firʿawn?","أيّ نبيٍّ رُبّي رضيعاً في بيت فرعون؟"],"o":[["Musa","Yusuf","Harun","Ibrahim"],["موسى","يوسف","هارون","إبراهيم"]],"x":["Allah inspired Musa’s mother to place him in the river, and Firʿawn’s family picked him up. Later Allah returned him to his mother, so that she would be comforted and not grieve.","أوحى الله إلى أم موسى أن تلقيه في اليم، فالتقطه آل فرعون، ثم ردّه إليها: {Q:28:13:1-8}."],"s":[{"q":"28:7-13"}]},
{"id":"PRO-1-24","l":"pro","v":1,"q":["Which prophet does the Quran describe as ﴾true to his promise﴿?","أيّ نبيٍّ وصفه القرآن بأنه {Q:19:54:7-8}؟"],"o":[["Ismaʿil","Idris","Yunus","Lut"],["إسماعيل","إدريس","يونس","لوط"]],"x":["Allah says of Ismaʿil {as}: he was true to his promise, and a messenger and prophet. He used to command his family to pray and give zakah, and his Lord was pleased with him.","قال تعالى: {Q:19:54} {Q:19:55}."],"s":[{"q":"19:54-55"}]},
{"id":"PRO-2-01","l":"pro","v":2,"q":["Which prophet was thrown into a fire that Allah made cool and safe?","أي نبي أُلقي في النار فجعلها الله برداً وسلاماً؟"],"o":[["Ibrahim","Musa","ʿIsa","Salih"],["إبراهيم","موسى","عيسى","صالح"]],"x":["His people decided to burn him, but Allah said: ﴾O fire, be coolness and safety upon Ibrahim﴿.","قال تعالى: {Q:21:69}."],"s":[{"q":"21:68-69"}]},
{"id":"PRO-2-02","l":"pro","v":2,"q":["Which prophet spoke as a baby in the cradle?","أي نبي تكلّم في المهد؟"],"o":[["ʿIsa","Yahya","Musa","Sulayman"],["عيسى","يحيى","موسى","سليمان"]],"x":["ʿIsa {as} spoke from the cradle in defence of his mother Maryam, declaring that he was a servant of Allah.","تكلّم عيسى {as} في المهد مبرّئاً أمه مريم: {Q:19:30:1-4}."],"s":[{"q":"19:29-33"}]},
{"id":"PRO-2-03","l":"pro","v":2,"q":["Which prophet was given the Zabur (Psalms)?","أي نبي أُوتي الزبور؟"],"o":[["Dawud","Sulayman","Musa","Harun"],["داود","سليمان","موسى","هارون"]],"x":["The Zabur is one of the revealed scriptures, alongside the Tawrah, the Injil and the Quran.","قال تعالى: {Q:4:163:23-25}."],"s":[{"q":"4:163"}]},
{"id":"PRO-2-04","l":"pro","v":2,"q":["Which prophet interpreted the king’s dream of seven fat and seven lean cows?","أي نبي فسّر رؤيا الملك عن سبع بقرات سمان وسبع عجاف؟"],"o":[["Yusuf","Yaʿqub","Musa","Ishaq"],["يوسف","يعقوب","موسى","إسحاق"]],"x":["Yusuf {as} explained it as seven years of plenty followed by seven years of hardship.","فسّرها يوسف {as} بسبع سنين خصب تتبعها سبع شداد."],"s":[{"q":"12:43-49"}]},
{"id":"PRO-2-05","l":"pro","v":2,"q":["Which prophet heard an ant warn its colony to take cover?","أي نبي سمع نملة تحذّر قومها؟"],"o":[["Sulayman","Dawud","Nuh","Shuʿayb"],["سليمان","داود","نوح","شعيب"]],"x":["The ant told the others to go into their homes so Sulayman’s army would not crush them without noticing. He smiled at her words and thanked Allah.","تبسّم سليمان {as} ضاحكاً من قولها وشكر نعمة الله عليه."],"s":[{"q":"27:18-19"}]},
{"id":"PRO-2-07","l":"pro","v":2,"q":["Who was the father of Yusuf {as}?","مَن والد يوسف {as}؟"],"o":[["Yaʿqub","Ibrahim","Ishaq","Ismaʿil"],["يعقوب","إبراهيم","إسحاق","إسماعيل"]],"x":["Yusuf {as} named his forefathers: Ibrahim, Ishaq and Yaʿqub.","ذكر يوسف {as} آباءه: إبراهيم وإسحاق ويعقوب."],"s":[{"q":"12:38"}]},
{"id":"PRO-2-08","l":"pro","v":2,"q":["As a baby, which prophet was placed by his mother in a chest and cast into the river?","أيّ نبيٍّ وضعته أمه وهو رضيع في تابوت وألقته في اليمّ؟"],"o":[["Musa","Yusuf","Yahya","ʿIsa"],["موسى","يوسف","يحيى","عيسى"]],"x":["Allah inspired Musa’s mother to put him in a chest and cast it into the river.","قال تعالى: {Q:20:39:1-7}."],"s":[{"q":"20:38-39"}]},
{"id":"PRO-2-09","l":"pro","v":2,"q":["To which prophet did Allah speak directly?","أيّ نبيٍّ كلّمه الله تكليماً؟"],"o":[["Musa","Ibrahim","Nuh","Harun"],["موسى","إبراهيم","نوح","هارون"]],"x":["The Quran stresses it: ﴾and Allah spoke to Musa with direct speech﴿.","قال تعالى: {Q:4:164:11-14}."],"s":[{"q":"4:164"}]},
{"id":"PRO-2-10","l":"pro","v":2,"q":["Which prophet asked Allah to show him how He gives life to the dead, and was told to take four birds?","أيّ نبيٍّ سأل ربه أن يريه كيف يحيي الموتى، فأُمر أن يأخذ أربعة من الطير؟"],"o":[["Ibrahim","Yunus","Musa","Zakariyya"],["إبراهيم","يونس","موسى","زكريا"]],"x":["Ibrahim {as} asked so that his heart would be at rest, and Allah told him to take four birds.","قال تعالى: {Q:2:260:1-8} ... {Q:2:260:18-21}."],"s":[{"q":"2:260"}]},
{"id":"PRO-2-11","l":"pro","v":2,"q":["Which prophet’s son refused to board the Ark, saying he would take refuge on a mountain?","أيّ نبيٍّ أبى ابنه أن يركب معه السفينة وقال سآوي إلى جبل؟"],"o":[["Nuh","Ibrahim","Yaʿqub","Lut"],["نوح","إبراهيم","يعقوب","لوط"]],"x":["Nuh {as} called his son to board, and he answered that a mountain would protect him from the water.","قال تعالى: {Q:11:42:7-15}، {Q:11:43:1-7}."],"s":[{"q":"11:42-43"}]},
{"id":"PRO-2-12","l":"pro","v":2,"q":["Which prophet was put in prison even after the signs of his innocence were clear?","أيّ نبيٍّ سُجن بعد أن ظهرت آيات براءته؟"],"o":[["Yusuf","Musa","Yunus","Shuʿayb"],["يوسف","موسى","يونس","شعيب"]],"x":["After they had seen the signs, it seemed best to them to imprison him for a time.","قال تعالى: {Q:12:35}."],"s":[{"q":"12:35"}]},
{"id":"PRO-2-13","l":"pro","v":2,"q":["Whose wife prayed: ﴾My Lord, build for me a house near You in Paradise﴿?","امرأةُ مَن قالت: {Q:66:11:10-16}؟"],"o":[["Firʿawn","Nuh","Lut","ʿImran"],["فرعون","نوح","لوط","عمران"]],"x":["Her husband claimed to be a god, yet she believed and asked Allah to save her from Firʿawn and his deeds.","قال تعالى: {Q:66:11:1-16}."],"s":[{"q":"66:11"}]},

{"id":"PRO-2-16","l":"pro","v":2,"q":["Who said ﴾We are the helpers of Allah﴿ when ʿIsa {as} asked who would support him?","مَن قالوا {Q:3:52:13-15} حين سأل عيسى {as} عن أنصاره؟"],"o":[["The disciples (al-Hawariyyun)","The angels","The Children of Israel","The Romans"],["الحواريون","الملائكة","بنو إسرائيل","الروم"]],"x":["The disciples answered: we believe in Allah; bear witness that we are Muslims.","قال تعالى: {Q:3:52:6-20}."],"s":[{"q":"3:52"}]},

{"id":"PRO-5-18","l":"pro","v":5,"q":["In Surah Al ʿImran, for how many days would Zakariyya {as} not speak to people except by gestures, as a sign?","في سورة آل عمران، كم يوماً كانت آية زكريا {as} ألّا يكلّم الناس إلا رمزاً؟"],"o":[["Three","Seven","Forty","Ten"],["ثلاثة","سبعة","أربعين","عشرة"]],"x":["His sign was that he would not speak to people for three days except by gestures.","قال تعالى: {Q:3:41:6-14}."],"s":[{"q":"3:41"}]},

{"id":"PRO-5-20","l":"pro","v":5,"q":["For how many years did the people of Musa {as} wander in the land after refusing to enter it?","كم سنةً تاه قوم موسى {as} في الأرض بعد أن أبوا دخولها؟"],"o":[["Forty","Seventy","Twelve","Ten"],["أربعين","سبعين","اثنتي عشرة","عشر"]],"x":["The land was forbidden to them for forty years; they would wander in the earth.","قال تعالى: {Q:5:26:1-9}."],"s":[{"q":"5:26"}]},
{"id":"PRO-5-21","l":"pro","v":5,"q":["After asking the freed prisoner to mention him to the king, how long did Yusuf {as} remain in prison?","بعد أن قال يوسف {as} للناجي {Q:12:42:7-9}، كم لبث في السجن؟"],"o":[["A few years (bidʿ sinin)","Forty days","One year","Twelve years"],["بضع سنين","أربعين يوماً","سنة واحدة","اثنتي عشرة سنة"]],"x":["Satan made the man forget to mention him, so Yusuf remained in prison a few years.","قال تعالى: {Q:12:42:10-18}."],"s":[{"q":"12:42"}]},
{"id":"PRO-5-22","l":"pro","v":5,"q":["In Surah Al-Kahf, what was the third act of the righteous servant that Musa {as} questioned?","في سورة الكهف، ما الفعل الثالث للعبد الصالح الذي سأل عنه موسى {as}؟"],"o":[["He rebuilt a wall about to collapse","He made a hole in a boat","He killed a boy","He fed the villagers"],["أقام جداراً يريد أن ينقضّ","خرق السفينة","قتل الغلام","أطعم أهل القرية"]],"x":["After the boat and the boy, they found a wall about to collapse in a town that refused them hospitality, and he set it straight.","قال تعالى: {Q:18:77:12-18}."],"s":[{"q":"18:71-77"}]},
{"id":"SIR-1-01","l":"sir","v":1,"t":"tf","a":1,"q":["The Prophet {saw} was born in Madinah.","وُلد النبي {saw} في المدينة المنورة."],"x":["False. He was born and grew up in Makkah. Madinah became his home only after he emigrated there, and he is buried there.","خطأ. وُلد في مكة ونشأ فيها، ولم تصبح المدينة داره إلا بعد هجرته إليها، وفيها دُفن."],"s":[{"n":"seerah"}]},
{"id":"SIR-1-02","l":"sir","v":1,"q":["Where did the first revelation come to the Prophet {saw}?","أين نزل الوحي أول مرة على النبي {saw}؟"],"o":[["The Cave of Hiraʾ","The Cave of Thawr","Mount Uhud","Al-Masjid al-Haram"],["غار حراء","غار ثور","جبل أحد","المسجد الحرام"]],"x":["Before revelation, he used to go to the Cave of Hiraʾ to worship alone for many nights. It was there that the angel came to him with the first verses of the Quran.","كان {saw} يخلو بغار حراء يتعبّد فيه الليالي ذوات العدد، وفيه جاءه الملك بأول ما نزل من القرآن."],"s":[{"b":3}]},
{"id":"SIR-1-03","l":"sir","v":1,"q":["Which angel brought the revelation?","أي ملك نزل بالوحي؟"],"o":[["Jibril","Mikaʾil","Israfil","Malik"],["جبريل","ميكائيل","إسرافيل","مالك"]],"x":["Allah says Jibril brought the Quran down upon the Prophet’s heart, by Allah’s permission. Elsewhere the Quran calls him ﴾the Trustworthy Spirit﴿.","قال تعالى: {Q:2:97:1-11}، وقال: {Q:26:193}."],"s":[{"q":"2:97"},{"q":"26:193"}]},
{"id":"SIR-1-04","l":"sir","v":1,"q":["What is the Prophet’s {saw} migration from Makkah to Madinah called?","بماذا يُعرف خروج النبي {saw} من مكة إلى المدينة؟"],"o":[["The Hijrah","The Israʾ","The Fath","The ʿUmrah"],["الهجرة","الإسراء","الفتح","العمرة"]],"x":["The Islamic calendar counts its years from the Hijrah, the Prophet’s migration from Makkah to Madinah. Dates in it are marked AH, “after the Hijrah”.","يبدأ التقويم الهجري من هجرة النبي {saw} من مكة إلى المدينة، ومنها سُمّي هجرياً."],"s":[{"n":"seerah"}]},
{"id":"SIR-1-05","l":"sir","v":1,"q":["Who was the Prophet’s {saw} first wife?","من أول زوجات النبي {saw}؟"],"o":[["Khadijah","ʿAʾishah","Hafsah","Sawdah"],["خديجة","عائشة","حفصة","سودة"]],"x":["When he came home shaken after the first revelation, Khadijah {raf} comforted him: Allah would never disgrace him, for he kept family ties and supported the weak.","لما رجع {saw} من غار حراء يرجف فؤاده، طمأنته خديجة {raf} فقالت: «كَلاَّ وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ»."],"s":[{"b":3}]},
{"id":"SIR-1-06","l":"sir","v":1,"q":["What is the Prophet’s {saw} mosque in Madinah called?","ما اسم مسجد النبي {saw} في المدينة؟"],"o":[["Al-Masjid an-Nabawi","Al-Masjid al-Haram","Al-Masjid al-Aqsa","Masjid Quba"],["المسجد النبوي","المسجد الحرام","المسجد الأقصى","مسجد قباء"]],"x":["Building this mosque was one of the first things he did with his Companions after arriving in Madinah. It became the heart of the community: for prayer, learning and gathering.","كان بناؤه من أول ما قام به {saw} مع أصحابه بعد وصوله إلى المدينة، فصار قلب المجتمع: للصلاة والتعلّم والاجتماع."],"s":[{"n":"seerah"}]},
{"id":"SIR-1-07","l":"sir","v":1,"q":["How old was the Prophet {saw} when revelation began?","كم كان عمر النبي {saw} حين بدأ الوحي؟"],"o":[["40","25","30","63"],["40","25","30","63"]],"x":["Revelation came to him at forty, the age at which it began.","نزل عليه الوحي وهو ابن أربعين، وكانت بدايته في غار حراء."],"s":[{"b":3851}]},
{"id":"SIR-1-08","l":"sir","v":1,"q":["In the Cave of Hiraʾ, what was the angel’s first command to the Prophet {saw}?","في غار حراء، بماذا أمر الملكُ النبيَّ {saw} أولاً؟"],"o":[["“Read!”","“Listen!”","“Go out and preach!”","“Write!”"],["«اقرأ»","«اسمع»","«اخرج فادع الناس»","«اكتب»"]],"x":["The angel appeared to him in the cave and gave this single command. It was the very beginning of the Quran’s revelation.","جاءه الملك في الغار فقال: «اقْرَأْ»، فكانت بداية نزول القرآن."],"s":[{"b":3},{"q":"96:1-5"}]},
{"id":"SIR-1-09","l":"sir","v":1,"q":["When the angel said “Read!”, what did the Prophet {saw} reply?","لمّا قال الملك «اقْرَأْ»، بماذا أجاب النبي {saw}؟"],"o":[["“I am not a reader.”","“What shall I read?”","“Who are you?”","“I will read.”"],["«ما أنا بقارئ»","«ماذا أقرأ؟»","«من أنت؟»","«سأقرأ»"]],"x":["He meant that he did not know how to read. The angel pressed him tightly and repeated the command, and then the first verses of the Quran were revealed.","قال: «مَا أَنَا بِقَارِئٍ»، أي لا أحسن القراءة، فغطّه الملك وكرّر الأمر، ثم نزلت أولى آيات القرآن."],"s":[{"b":3}]},
{"id":"SIR-1-10","l":"sir","v":1,"q":["Since the qiblah was changed, Muslims turn in prayer towards which mosque?","بعد تحويل القبلة، نحو أيّ مسجدٍ يتوجه المسلمون في صلاتهم؟"],"o":[["Al-Masjid al-Haram","Al-Masjid an-Nabawi","Al-Masjid al-Aqsa","Masjid Quba"],["المسجد الحرام","المسجد النبوي","المسجد الأقصى","مسجد قباء"]],"x":["Allah commanded the Prophet {saw} to turn his face towards al-Masjid al-Haram, and told the believers: ﴾wherever you are, turn your faces towards it﴿.","قال تعالى: {Q:2:144:10-20}."],"s":[{"q":"2:144"}]},
{"id":"SIR-1-12","l":"sir","v":1,"q":["During the Hijrah, which cave did the Prophet {saw} and Abu Bakr {ra} hide in?","في الهجرة، في أيّ غارٍ اختبأ النبي {saw} وأبو بكر {ra}؟"],"o":[["The Cave of Thawr","The Cave of Hiraʾ","The Cave of Uhud","The Cave of Badr"],["غار ثور","غار حراء","غار أحد","غار بدر"]],"x":["They hid in the Cave of Thawr, south of Makkah, for several days while Quraysh searched for them.","اختبآ في غار ثور جنوب مكة أياماً وقريش تطلبهما."],"s":[{"n":"seerah"}]},
{"id":"SIR-1-13","l":"sir","v":1,"q":["Which city was the Prophet {saw} and his Companions based in, whose people the Quran says should not hold back from him?","ما المدينة التي قال القرآن إنه ما كان لأهلها أن يتخلّفوا عن رسول الله {saw}؟"],"o":[["Madinah","Makkah","Taʾif","Jerusalem"],["المدينة","مكة","الطائف","القدس"]],"x":["Surah At-Tawbah names the people of Madinah.","قال تعالى: {Q:9:120:1-13}."],"s":[{"q":"9:120"}]},
{"id":"SIR-1-14","l":"sir","v":1,"q":["Surah Al-Ahzab says that in the Messenger of Allah {saw} you have…","تقول سورة الأحزاب: لقد كان لكم في رسول الله {saw}..."],"o":[["an excellent example","a king","a judge only","a poet"],["أسوة حسنة","ملِك","قاضٍ فقط","شاعر"]],"x":["He is an excellent example for whoever hopes in Allah and the Last Day and remembers Allah often. The verse comes in the passage about the Confederates, when the believers were under siege.","قال تعالى: {Q:33:21}، وجاءت الآية في سياق غزوة الأحزاب حين حوصر المسلمون."],"s":[{"q":"33:21"}]},
{"id":"SIR-1-15","l":"sir","v":1,"q":["Complete: ﴾Muhammad is not but a…﴿","أكمل: {Q:3:144:1-3} ..."],"o":[["messenger","king","angel","scholar"],["رسول","ملِك","ملَك","عالِم"]],"x":["Messengers passed away before him. The verse continues: if he were to die or be killed, would you turn back on your heels?","قال تعالى: {Q:3:144:1-16}."],"s":[{"q":"3:144"}]},
{"id":"SIR-1-16","l":"sir","v":1,"q":["The first House established for mankind is at which place, according to Surah Al ʿImran?","بحسب سورة آل عمران، أين أول بيتٍ وُضع للناس؟"],"o":[["Bakkah (Makkah)","Jerusalem","Madinah","Taʾif"],["بكة (مكة)","القدس","المدينة","الطائف"]],"x":["Bakkah is another name for Makkah. Allah calls this first House ﴾blessed and a guidance for the worlds﴿, and says whoever enters it is safe.","قال تعالى: {Q:3:96}، وقال: {Q:3:97:6-9}."],"s":[{"q":"3:96-97"}]},
{"id":"SIR-1-17","l":"sir","v":1,"q":["Surah Ad-Duha reminds the Prophet {saw} that Allah found him as what, and gave him refuge?","تذكّر سورة الضحى النبيَّ {saw} بأن الله وجده على أيّ حال فآواه؟"],"o":[["An orphan","A traveller","A shepherd","A merchant"],["يتيماً","مسافراً","راعياً","تاجراً"]],"x":["Allah reminds him of His care from the very start. The surah then teaches: so do not mistreat the orphan, and do not turn away the one who asks.","ذكّره الله برعايته له منذ البداية، ثم قال: {Q:93:9} {Q:93:10}."],"s":[{"q":"93:6-10"}]},
{"id":"SIR-1-18","l":"sir","v":1,"q":["Surah Ad-Duha says Allah found the Prophet {saw} in need, and then…","تقول سورة الضحى إن الله وجد النبي {saw} عائلاً، ثم..."],"o":[["made him self-sufficient","made him a king","sent him to Syria","gave him a palace"],["أغناه","ملّكه","أرسله إلى الشام","أعطاه قصراً"]],"x":["The surah lists Allah’s gifts to him, and then closes: ﴾And as for the favour of your Lord, proclaim it.﴿","عدّدت السورة نعم الله عليه، ثم خُتمت بقوله: {Q:93:11}."],"s":[{"q":"93:8-11"}]},
{"id":"SIR-1-20","l":"sir","v":1,"q":["Before the Hijrah, the disbelievers plotted to restrain the Prophet {saw}, kill him, or…","قبل الهجرة، مكر الكفار بالنبي {saw} ليُثبتوه أو يقتلوه أو..."],"o":[["drive him out","make him king","send him away with gifts","make peace with him"],["يُخرجوه","يملّكوه","يرسلوه بالهدايا","يصالحوه"]],"x":["Quraysh plotted to imprison him, kill him or drive him out. But Allah protected him: ﴾they plan, and Allah plans, and Allah is the best of planners﴿.","قال تعالى: {Q:8:30}."],"s":[{"q":"8:30"}]},
{"id":"SIR-1-21","l":"sir","v":1,"q":["To whom was the Prophet {saw} sent, according to Surah Al-Aʿraf?","إلى مَن أُرسل النبي {saw} بحسب سورة الأعراف؟"],"o":[["All of mankind","The Arabs only","Quraysh only","The people of Madinah only"],["الناس جميعاً","العرب فقط","قريش فقط","أهل المدينة فقط"]],"x":["His message was for everyone, everywhere: ﴾Say: O mankind, I am the Messenger of Allah to you all﴿, the Messenger of the One to whom the heavens and earth belong.","قال تعالى: {Q:7:158:1-13}."],"s":[{"q":"7:158"}]},
{"id":"SIR-1-22","l":"sir","v":1,"q":["Complete: ﴾O Prophet, We have sent you as a witness, a bringer of good tidings and a…﴿","أكمل: {Q:33:45:1-6} ..."],"o":[["warner","ruler","judge","guard"],["نذيراً","حاكماً","قاضياً","حارساً"]],"x":["The next verse continues: ﴾and one who invites to Allah by His permission, and an illuminating lamp﴿.","قال تعالى: {Q:33:45} {Q:33:46}."],"s":[{"q":"33:45-46"}]},
{"id":"SIR-1-23","l":"sir","v":1,"q":["Whom was the Prophet {saw} commanded to warn first, according to Surah Ash-Shuʿaraʾ?","بحسب سورة الشعراء، مَن أُمر النبي {saw} أن ينذرهم؟"],"o":[["His closest kin","The Romans","The Persians","The people of Yemen"],["عشيرته الأقربين","الروم","الفرس","أهل اليمن"]],"x":["He was told to begin with his own family and tribe, and the next verse adds: ﴾and lower your wing to the believers who follow you﴿.","قال تعالى: {Q:26:214} {Q:26:215}."],"s":[{"q":"26:214-215"}]},
{"id":"SIR-2-02","l":"sir","v":2,"q":["Which battle, named in the Quran, was the first major victory of the Muslims?","ما المعركة المذكورة في القرآن التي كانت أول نصر كبير للمسلمين؟"],"o":[["Badr","Uhud","The Trench","Hunayn"],["بدر","أحد","الخندق","حنين"]],"x":["Allah reminds the believers that He gave them victory at Badr when they were weak and few, and supported them with angels.","قال تعالى: {Q:3:123:1-6}."],"s":[{"q":"3:123"}]},
{"id":"SIR-2-03","l":"sir","v":2,"q":["The Battle of the Trench is also known by what name?","بأيّ اسمٍ آخر تُعرف غزوة الخندق؟"],"o":[["Al-Ahzab","Tabuk","Muʾtah","Khaybar"],["الأحزاب","تبوك","مؤتة","خيبر"]],"x":["Al-Ahzab means “the Confederates”: several tribes joined forces against Madinah, and the believers dug a trench to defend the city.","الأحزاب هم القبائل المتحالفة، وباسمهم سُمّيت السورة الثالثة والثلاثون."],"s":[{"q":"33:9-10"}]},
{"id":"SIR-2-04","l":"sir","v":2,"q":["Before the qiblah was changed to the Kaʿbah, which direction did the Muslims face in prayer?","إلى أي قبلةٍ كان المسلمون يصلّون قبل تحويلها إلى الكعبة؟"],"o":[["Bayt al-Maqdis (Jerusalem)","Madinah","Taʾif","Yemen"],["بيت المقدس","المدينة","الطائف","اليمن"]],"x":["They faced Bayt al-Maqdis for a time after arriving in Madinah, until Allah turned them towards the Kaʿbah.","صلّوا نحو بيت المقدس ستة عشر أو سبعة عشر شهراً بعد الهجرة، ثم حُوّلت القبلة."],"s":[{"b":40,"m":525,"ml":"muslim:525b"},{"q":"2:144"}]},
{"id":"SIR-2-05","l":"sir","v":2,"q":["The Night Journey took the Prophet {saw} from Al-Masjid al-Haram to which mosque?","أُسري بالنبي {saw} من المسجد الحرام إلى أي مسجد؟"],"o":[["Al-Masjid al-Aqsa","Masjid Quba","Al-Masjid an-Nabawi","Masjid al-Qiblatayn"],["المسجد الأقصى","مسجد قباء","المسجد النبوي","مسجد القبلتين"]],"x":["The journey is told in the opening verse of a surah that begins by glorifying Allah, who took His servant by night.","ذُكر ذلك في مطلع سورة الإسراء."],"s":[{"q":"17:1"}]},
{"id":"SIR-2-06","l":"sir","v":2,"q":["What was the name of the Prophet’s {saw} mother?","ما اسم أم النبي {saw}؟"],"o":[["Aminah","Halimah","Fatimah","Khadijah"],["آمنة","حليمة","فاطمة","خديجة"]],"x":["Aminah bint Wahb died when he was a young boy; his father ʿAbdullah had died before he was born.","آمنة بنت وهب، وتوفيت وهو طفل صغير."],"s":[{"n":"seerah"}]},
{"id":"SIR-2-07","l":"sir","v":2,"q":["Which uncle of the Prophet {saw} was martyred at the Battle of Uhud?","أي أعمام النبي {saw} استُشهد في غزوة أحد؟"],"o":[["Hamzah","Abu Talib","Al-ʿAbbas","Abu Lahab"],["حمزة","أبو طالب","العباس","أبو لهب"]],"x":["Hamzah ibn ʿAbd al-Muttalib {ra}, who had defended the Prophet {saw} since the early days in Makkah, was among the martyrs of Uhud.","كان حمزة بن عبد المطلب {ra} من شهداء أحد."],"s":[{"n":"seerah"}]},
{"id":"SIR-2-08","l":"sir","v":2,"q":["After the first revelation, what did the Prophet {saw} say when he returned home trembling?","لمّا رجع النبي {saw} إلى بيته بعد أول الوحي يرجف فؤاده، ماذا قال؟"],"o":[["“Cover me! Cover me!”","“Bring me water!”","“Call Abu Bakr!”","“Leave me alone!”"],["«زملوني زملوني»","«اسقوني ماء»","«ادعوا أبا بكر»","«دعوني وحدي»"]],"x":["He went to Khadijah {raf} and said “Cover me!”, and they covered him until his fear left him.","دخل على خديجة {raf} فقال: «زَمِّلُونِي زَمِّلُونِي»، فزمّلوه حتى ذهب عنه الروع."],"s":[{"b":3}]},
{"id":"SIR-2-09","l":"sir","v":2,"q":["Khadijah {raf} took the Prophet {saw} to her cousin, who knew the earlier scriptures. Who was he?","انطلقت خديجة {raf} بالنبي {saw} إلى ابن عمها العالم بالكتب السابقة. مَن هو؟"],"o":[["Waraqah ibn Nawfal","Abu Talib","Zayd ibn Harithah","Abu Bakr"],["ورقة بن نوفل","أبو طالب","زيد بن حارثة","أبو بكر"]],"x":["She took him to Waraqah ibn Nawfal, her cousin, who had become a Christian and wrote from the Injil.","انطلقت به إلى «وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى ابْنَ عَمِّ خَدِيجَةَ»."],"s":[{"b":3}]},
{"id":"SIR-2-10","l":"sir","v":2,"q":["At the Battle of Hunayn, what did the Quran say made the Muslims overconfident?","في غزوة حنين، ما الذي قال القرآن إنه أعجب المسلمين؟"],"o":[["Their great numbers","Their weapons","Their earlier victories","Their horses"],["كثرتهم","سلاحهم","انتصاراتهم السابقة","خيلهم"]],"x":["The earth, vast as it was, felt narrow to them, and they turned back.","قال تعالى: {Q:9:25:7-15}."],"s":[{"q":"9:25"}]},
{"id":"SIR-2-11","l":"sir","v":2,"q":["At Hudaybiyyah, under what did the believers pledge allegiance to the Prophet {saw}, earning Allah’s pleasure?","في الحديبية، تحت ماذا بايع المؤمنون النبيَّ {saw} فرضي الله عنهم؟"],"o":[["A tree","A tent","The walls of Makkah","A mountain"],["الشجرة","خيمة","أسوار مكة","جبل"]],"x":["Allah was pleased with the believers when they pledged allegiance under the tree.","قال تعالى: {Q:48:18:1-9}."],"s":[{"q":"48:18"}]},
{"id":"SIR-2-12","l":"sir","v":2,"q":["In the cave during the Hijrah, what did the Prophet {saw} say to his companion, as the Quran records?","في الغار أثناء الهجرة، ماذا قال النبي {saw} لصاحبه كما حكى القرآن؟"],"o":[["“Do not grieve; indeed Allah is with us.”","“Be patient; help is near.”","“We will leave at dawn.”","“Say nothing until night.”"],["«لا تحزن إن الله معنا»","«اصبر فإن النصر قريب»","«سنخرج عند الفجر»","«لا تتكلم حتى الليل»"]],"x":["Allah made the word of the disbelievers the lowest, while Allah’s word is the highest.","قال تعالى: {Q:9:40:16-23}."],"s":[{"q":"9:40"}]},
{"id":"SIR-2-13","l":"sir","v":2,"q":["Before Badr, what did Allah send down from the sky to purify the believers?","قبل بدر، ماذا أنزل الله من السماء ليطهّر المؤمنين؟"],"o":[["Water (rain)","Manna","A table of food","Snow"],["ماءً","المنّ","مائدة","ثلجاً"]],"x":["Allah sent down water to purify them and to make their feet firm.","قال تعالى: {Q:8:11:6-12}."],"s":[{"q":"8:11"}]},
{"id":"SIR-2-14","l":"sir","v":2,"q":["Before Badr, what did Allah cover the believers with, as a reassurance from Him?","قبل بدر، بماذا غشّى الله المؤمنين أمنةً منه؟"],"o":[["Drowsiness","A cloud","Darkness","Dust"],["النعاس","غمامة","ظلمة","غبار"]],"x":["In the tension before battle, a calm drowsiness came over them, a sign of security from Allah.","قال تعالى: {Q:8:11:1-5}."],"s":[{"q":"8:11"}]},
{"id":"SIR-2-15","l":"sir","v":2,"q":["Complete: ﴾And you did not throw when you threw, but…﴿","أكمل: {Q:8:17:6-10} ..."],"o":[["Allah threw","the angels threw","the wind threw","the believers threw"],["الله رمى","الملائكة رمت","الريح رمت","المؤمنون رموا"]],"x":["Every success came from Allah. The same verse calls the battle a test from Him, a good test.","قال تعالى: {Q:8:17:1-12}."],"s":[{"q":"8:17"}]},
{"id":"SIR-2-16","l":"sir","v":2,"q":["At Uhud, how many groups among the believers almost lost courage?","يوم أحد، كم طائفةً من المؤمنين همّت أن تفشل؟"],"o":[["Two","Three","One","Four"],["طائفتان","ثلاث","واحدة","أربع"]],"x":["Allah was their protector, and they held firm. The verse ends: upon Allah let the believers rely.","قال تعالى: {Q:3:122}."],"s":[{"q":"3:121-122"}]},
{"id":"SIR-2-17","l":"sir","v":2,"q":["When the believers saw the Confederates, what did they say?","لمّا رأى المؤمنون الأحزاب، ماذا قالوا؟"],"o":[["This is what Allah and His Messenger promised us","Let us return home","Let us make peace","We cannot face them"],["هذا ما وعدنا الله ورسوله","لنرجع إلى بيوتنا","لنصالحهم","لا طاقة لنا بهم"]],"x":["It only increased them in faith and submission.","قال تعالى: {Q:33:22}."],"s":[{"q":"33:22"}]},
