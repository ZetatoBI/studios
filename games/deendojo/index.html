<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeenDojo</title>
<meta name="description" content="DeenDojo: Islamic Trivia. Learn the Quran, Prophets, Seerah and Hadith, with the evidence behind every answer.">
<meta name="theme-color" content="#1B3565">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeenDojo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B3565'/%3E%3Cpolygon points='50,10 60.6,24.4 78.3,21.7 75.6,39.4 90,50 75.6,60.6 78.3,78.3 60.6,75.6 50,90 39.4,75.6 21.7,78.3 24.4,60.6 10,50 24.4,39.4 21.7,21.7 39.4,24.4' fill='%23E7B343'/%3E%3Crect x='24' y='46' width='52' height='9' rx='2' fill='%231C1C1E'/%3E%3Crect x='44' y='42' width='12' height='17' rx='3' fill='%231C1C1E'/%3E%3Cpath d='M46 58 L40 74 L47 74 L50 60 Z M54 58 L60 74 L53 74 L50 60 Z' fill='%231C1C1E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Figtree:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Montserrat:wght@500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF5;--surface:#FFFFFF;--surface2:#F2F5F9;--ink:#152238;--muted:#56647C;--line:#D3DCE7;
  --lapis:#1F3F7A;--panel:#1F3F7A;--gold:#B7800F;--goldb:#E7B343;
  --ok:#1E7F52;--okbg:#E1F2E8;--bad:#A93B32;--badbg:#F8E4E1;--bstroke:rgba(21,34,56,.38);
  --display:"Reem Kufi","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --classic:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
    --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
    --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
  --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
  --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:18px}
html[data-size="xl"]{font-size:20px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;min-height:100%}
html[lang="ar"] body{--body:"IBM Plex Sans Arabic","Figtree",system-ui,sans-serif;line-height:1.7}
#app{max-width:34rem;margin:0 auto;padding:.75rem 1.1rem 2.5rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--goldb);outline-offset:2px;border-radius:.5rem}
a{color:var(--lapis)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.2;margin:0}
.qt{font-family:var(--classic);font-size:1.12em;line-height:1.9}
.qa{font-family:"Amiri Quran","Amiri",serif;font-size:1.15em;line-height:2.2;font-weight:400}
.info-btn{width:2.2rem;height:2.2rem;border-radius:50%;border:1.5px solid var(--line);color:var(--lapis);font-weight:700;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;flex:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:34rem;max-height:85vh;overflow:auto;border-radius:1.2rem 1.2rem 0 0;padding:1rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-1rem;background:var(--surface);padding-top:.2rem}
.sheet h2{font-size:1.2rem}
.ib{border-top:1px solid var(--line);padding:.8rem 0}
.ib h3{font-size:1rem;margin:0 0 .4rem;font-family:var(--display)}
.ib .full{font-size:1.45rem;text-align:right;margin:.2rem 0 .6rem}
.an{font-family:"Amiri Quran","Amiri",serif;font-size:.8em;color:var(--gold)}
.ht{font-family:var(--classic);font-size:1.2rem;line-height:2.1;text-align:right;margin:.3rem 0}
.ib .muted,.credit{color:var(--muted);font-size:.85rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:3rem;gap:.5rem}
.top h1{font-size:1.25rem;flex:1;text-align:center}
.icon{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.lang{min-height:2.75rem;min-width:2.75rem;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--lapis)}
.lang[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.icon:active{background:var(--surface2)}
.icon svg{width:1.4rem;height:1.4rem}
[dir="rtl"] .flip svg{transform:scaleX(-1)}

/* hero */
.hero{text-align:center;padding:.25rem 0 1.25rem}
.spark{display:inline-block;animation:spark 1.6s ease-out 1}
.spark svg{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--goldb) 45%,transparent))}
@keyframes spark{0%{transform:scale(.6) rotate(-22.5deg);opacity:0}60%{transform:scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
.brand{font-size:2.5rem;letter-spacing:.01em;margin-top:.35rem}
.tag{margin:.1rem 0 .9rem;color:var(--muted);font-family:var(--display);font-size:1.05rem}
.overall{display:inline-flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem .3rem .6rem;font-weight:600}
.hint{color:var(--muted);font-size:.85rem;margin:.5rem auto 0;max-width:22rem}

/* daily panel: the pattern band */
.daily{display:block;width:100%;background-color:var(--panel);background-image:var(--pat);color:#fff;border-radius:1.25rem;padding:1.15rem 1.25rem 1rem;margin-top:.25rem;position:relative;overflow:hidden}
.daily-t{display:block;font-family:var(--display);font-size:1.6rem;font-weight:700}
.daily-s{display:block;opacity:.88;font-size:.95rem;margin-top:.1rem;max-width:18rem}
.streak{display:inline-flex;align-items:center;gap:.35rem;margin-top:.8rem;background:rgba(255,255,255,.13);border-radius:999px;padding:.2rem .7rem .2rem .45rem;font-weight:600;font-size:.9rem}
.daily .go{position:absolute;inset-inline-end:1.1rem;top:50%;transform:translateY(-50%);width:3.1rem;height:3.1rem;border-radius:50%;background:#E7B343;color:#1F2A3F;display:grid;place-items:center}
.daily .go svg{width:1.5rem;height:1.5rem}
[dir="rtl"] .daily .go svg{transform:scaleX(-1)}

.row{display:flex;align-items:center;gap:.85rem;width:100%;padding:.9rem 1rem;margin-top:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.row svg{width:1.6rem;height:1.6rem;color:var(--lapis);flex:none}
.row b{display:block}
.row small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.row small.sbest{color:var(--lapis);margin-top:.2rem;font-weight:600}
.stories{padding:0 1rem 2rem;max-width:40rem;margin:0 auto}
.storyin{padding:1rem 1.25rem;max-width:36rem;margin:0 auto;text-align:center}
.storyin p{font-size:1.08rem;line-height:1.7}
.storyin .snote{color:var(--muted);font-size:.9rem}
.storyico svg{width:3rem;height:3rem;color:var(--lapis)}
.row:disabled{opacity:.65}

.sec{font-size:1.2rem;margin:1.6rem 0 .7rem}
.grid{display:grid;gap:.6rem}
.tile{display:flex;align-items:center;gap:.9rem;width:100%;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.tile b{font-size:1.05rem;display:block}
.tile small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.tile .star{flex:none}
.tile.soon{opacity:.55;border-style:dashed;background:transparent}
.track{display:flex;gap:4px;margin-top:.5rem}
.track i{height:6px;flex:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.track i.next{border-color:var(--gold)}
.track i.none{border-style:dashed;background:transparent}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2rem}

/* land */
.lead{color:var(--muted);margin:.2rem 0 .3rem}
.rule{font-size:.9rem;margin:0 0 1rem;padding:.6rem .85rem;background:var(--surface2);border-radius:.75rem}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.rung{display:flex;align-items:center;gap:.9rem;width:100%;padding:.7rem .95rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.rung span{flex:1}
.rung b{display:block}
.rung small{display:block;color:var(--muted);font-size:.85rem}
.rung em{font-style:normal;font-weight:700;font-size:.85rem;padding:.3rem .7rem;border-radius:999px;white-space:nowrap}
.rung.open{border:2px solid var(--gold)}
.rung.open em{background:var(--goldb);color:#1F2A3F}
.rung.earned em{background:var(--okbg);color:var(--ok)}
.rung.locked,.rung.soon{opacity:.55}
.rung.soon{border-style:dashed;background:transparent}
.rung.locked em,.rung.soon em{color:var(--muted)}

/* quiz */
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--gold)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.meta{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.88rem;font-weight:600;margin:.6rem 0 .5rem}
.bn{font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.meta .bn{margin-inline-start:auto;font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qtext{font-family:var(--body);font-size:1.35rem;font-weight:700;line-height:1.4;margin:0 0 1.1rem}
.opts{display:grid;gap:.55rem}
.opt{display:block;width:100%;padding:.95rem 1.05rem;background:var(--surface);border:2px solid var(--line);border-radius:.9rem;font-weight:600;line-height:1.4;transition:transform .08s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.5}
.card{margin-top:1rem;padding:1.05rem 1.1rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ok);animation:up .25s ease-out}
.card.bad{border-top-color:var(--bad)}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.verdict{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;color:var(--ok)}
.card.bad .verdict{color:var(--bad)}
.ansline{margin:.3rem 0 0}
.x{margin:.55rem 0 .8rem}
.src{font-size:.88rem;border-top:1px solid var(--line);padding-top:.65rem}
.src>span{display:block;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.src a,.src p{display:block;margin:.1rem 0}
.src .grade{color:var(--muted)}
.beta{font-size:.8rem;color:var(--muted);margin:.55rem 0 0}
.card-act{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
.report{font-size:.85rem;color:var(--muted)}
.primary{background:var(--lapis);color:var(--surface);font-weight:700;padding:.8rem 1.3rem;border-radius:.8rem}
:root[data-theme="dark"] .primary{color:#0C1628}
.ghost{border:2px solid var(--line);font-weight:700;padding:.75rem 1.2rem;border-radius:.8rem}
.btns{display:grid;gap:.6rem;margin-top:1.5rem}
.btns>*{text-align:center;width:100%}

/* result */
.result{text-align:center;padding:2rem 0 .5rem}
.score{font-size:2.2rem}
.result p{color:var(--muted);max-width:24rem;margin:.6rem auto 0}
.earned .belt-big{animation:belt 1.1s cubic-bezier(.2,1.4,.4,1) 1}
.earned .belt-big svg{filter:drop-shadow(0 0 24px color-mix(in srgb,var(--goldb) 55%,transparent))}
@keyframes belt{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.lost{display:flex;align-items:center;gap:.8rem;text-align:start;margin:1.2rem auto 0;max-width:24rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface)}
.lost svg{opacity:.45;filter:grayscale(.3)}
.lost p{margin:0!important;color:var(--ink)!important}
.qnum{flex:1;text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}
.mbar{display:block;position:relative;height:5px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);margin-top:.4rem}
.mbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ok);border-radius:3px}
.mbar b,.bigbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bhead{display:flex;align-items:center;gap:1rem;margin:.4rem 0 1rem}
.bhead .bn{font-size:.95rem;padding:.3rem .8rem;border-radius:999px;font-weight:700;border:1px solid}
.bprog{margin:.5rem 0 0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.bigbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.bigbar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.bstat{color:var(--muted);font-size:.92rem;margin:.6rem 0 1rem}
.bstat.held{color:var(--ok);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.cell{aspect-ratio:1;border-radius:.8rem;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;position:relative;font-weight:700;font-size:1.1rem}
.cell small{position:absolute;top:.15rem;inset-inline-end:.35rem;font-size:.75rem}
.cell.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.flash{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;margin:-.2rem 0 .8rem;border-radius:.8rem;background:var(--okbg);font-weight:700;color:var(--ok)}
.flash.lost{background:var(--badbg);color:var(--bad)}
.flash p{margin:0}
.flash.earned svg{animation:belt 1s cubic-bezier(.2,1.4,.4,1) 1}
.card-act{flex-wrap:wrap}
.card-act>button{flex:1;white-space:nowrap;text-align:center}
.card-act .report{order:3;width:100%;text-align:center;padding-top:.2rem}
.profile{display:flex;align-items:center;gap:.9rem;width:100%;max-width:24rem;margin:0 auto;padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;text-align:start}
.profile .pinfo{flex:1;display:flex;flex-direction:column;line-height:1.3}
.profile b{font-size:1.1rem}
.ptitle{font-family:var(--display);font-weight:700;color:var(--gold);font-size:1rem}
.ptitle.big{font-size:1.6rem;margin:.2rem 0 1rem}
.profile small{color:var(--muted);font-size:.8rem}
.profile.edit{flex-direction:column;align-items:stretch;gap:.5rem}
.profile.edit label{font-weight:700}
.profile.edit input{font:inherit;font-size:1.05rem;padding:.7rem .8rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.nobelt{display:grid;place-items:center;width:64px}
.mcount{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:600}
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.3rem .8rem}
.mrow{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mname{flex:1;font-weight:600;font-size:.92rem}
.mbelts{display:flex;gap:.3rem}
.mcell{display:grid;place-items:center;width:34px;height:20px}
.mcell svg{opacity:.2;filter:grayscale(.6)}
.mcell.got svg{opacity:1;filter:none}
.mcell.none{border:1.5px dashed var(--line);border-radius:4px;height:14px;width:28px;margin:0 3px}
.qtrack{display:flex;flex-direction:column;gap:.3rem;margin:-.1rem 0 .8rem}
.bigbar.thin{height:7px}
.qtrack span{font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap}
.cele-wrap{align-items:center;overflow:hidden}
.cele{border-radius:1.2rem;text-align:center;max-width:22rem;margin:1rem}
.cele h2{font-size:1.7rem;margin-top:.6rem}
.cele-star{animation:spark 1.6s ease-out 1;display:inline-block;filter:drop-shadow(0 0 22px #E7B343)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.8s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.ttl-star{display:grid;place-items:center}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,#FBFAF6,#E9F1FB);transition:opacity .25s}
#intro .zlogo{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,24px);animation:zin .35s ease-out both;direction:ltr}
#intro .zmark{height:clamp(64px,19vw,112px);width:auto;flex:none}
#intro .zword{display:flex;flex-direction:column;align-items:stretch;font-family:Montserrat,"Segoe UI",Arial,sans-serif;line-height:1}
#intro .z1{font-weight:600;font-size:clamp(34px,10.5vw,62px);letter-spacing:.1em;color:#1F3A68;margin-right:-.1em}
#intro .z2{font-weight:500;font-size:clamp(11px,3.3vw,19px);letter-spacing:.62em;color:#1275EC;margin-top:.55em;margin-right:-.62em}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#intro.out{opacity:0;pointer-events:none}
.hero.dojo{position:relative;margin:.2rem 0 0;padding:2.6rem 1rem 2.3rem;border-radius:9rem 9rem 1.2rem 1.2rem;background-color:#16294F;background-image:var(--pat),radial-gradient(120% 80% at 50% 0%,#24457F 0%,#16294F 70%);color:#F5E9CF;overflow:hidden;text-align:center}
.hero.dojo .arch{position:absolute;inset:.6rem .6rem 0;width:calc(100% - 1.2rem);height:calc(100% - .6rem)}
.hero.dojo .brand{color:#F5E9CF;position:relative}
.hero.dojo .tag{color:#D9A53A;position:relative;margin-bottom:.2rem}
.hero.dojo .spark{position:relative}
.lantern{position:absolute;top:0;width:34px;height:102px;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.lantern.l1{inset-inline-start:13%}.lantern.l2{inset-inline-end:13%;animation-delay:-2.5s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.beltband{position:relative;display:flex;justify-content:center;align-items:center;margin:-.35rem 0 1rem}
.beltband .bb{display:flex;width:100%;height:12px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bstroke)}
.beltband .bb i{flex:1}
.bknot{position:absolute;width:40px;height:34px;top:-7px}
.hero-under{text-align:center;padding:.4rem 0 .6rem}
.sec{display:flex;align-items:center;gap:.5rem}
.sec::before{content:"";width:16px;height:16px;flex:none;background:var(--star) center/contain no-repeat}
.emb{position:relative;display:grid;place-items:center;flex:none;width:46px;height:46px}
.emb .gl{position:absolute;width:21px;height:21px}
.welcome{display:flex;flex-direction:column;gap:.35rem;padding:.4rem 0 1rem}

aboutBody:`<h2>How questions are sourced</h2><p>Every answer shows its evidence. Questions come from the Quran and from hadith graded sahih or mutawatir. Hasan hadith are used only where the grading is not disputed.</p><p>Stories of the prophets come only from the Quran and authentic hadith. Matters where the schools of fiqh differ are left out, or the school is named.</p><h2>Why so careful</h2><p>The Prophet {saw} said: “Whoever lies about me deliberately, let him take his seat in the Fire.”<span class="ref">Sahih Muslim 3. Mutawatir: narrated by many Companions.</span></p><h2>Beta</h2><p>Every hadith reference has been checked against sunnah.com. All questions are awaiting review by a qualified scholar. If you find a mistake, tap “Report a mistake” under any answer.</p><h2>Text and wording</h2><p>Arabic Quran text is the Tanzil Uthmani text, verified against the Madinah Mushaf. English wording of verses and hadith is a paraphrase of meaning, not a translation.</p><h2>Privacy</h2><p>No ads and no accounts. Your progress is stored on this device. To improve the questions, DeenDojo sends anonymous usage stats: which questions are answered right or wrong, skipped or reported, play time, app language, and the year of birth if you give it. Your nickname is sent only if you are 13 or older, and you can turn that off separately. Nothing else is collected, and it is never sold or shared. You can turn stats off in Settings.</p>`},

aboutBody:`<h2>مصادر الأسئلة</h2><p>كل إجابة يظهر معها دليلها. الأسئلة مأخوذة من القرآن الكريم ومن الأحاديث الصحيحة والمتواترة، ولا يُستعمل الحسن إلا إذا لم يُختلف في تحسينه.</p><p>قصص الأنبياء مأخوذة من القرآن الكريم والسنة الصحيحة فقط. والمسائل التي اختلفت فيها المذاهب الفقهية تُترك أو يُذكر المذهب.</p><h2>لماذا هذا الحرص</h2><p>قال النبي {saw}: «مَن كذب عليّ متعمداً فليتبوأ مقعده من النار».<span class="ref">صحيح مسلم 3. حديث متواتر رواه جمع من الصحابة.</span></p><h2>نسخة تجريبية</h2><p>رُوجعت جميع مراجع الأحاديث على موقع sunnah.com، وجميع الأسئلة بانتظار مراجعة أهل العلم. إن وجدت خطأ فاضغط «أبلغ عن خطأ» تحت أي إجابة.</p><h2>النصوص</h2><p>نص القرآن الكريم هو نص تنزيل العثماني المطابق لمصحف المدينة.</p><h2>الخصوصية</h2><p>بلا إعلانات ولا حسابات، ويُحفظ تقدمك على هذا الجهاز. ولتحسين الأسئلة يرسل DeenDojo إحصاءات استخدام مجهولة: الأسئلة التي أُجيب عنها صواباً أو خطأً أو تُخطّيت أو أُبلغ عنها، ومدة اللعب، ولغة التطبيق، وسنة الميلاد إن أدخلتها. ولا يُرسل الاسم المستعار إلا لمن بلغ 13 سنة فأكثر، ويمكن إيقافه وحده. لا يُجمع شيء غير ذلك، ولا يُباع ولا يُشارك. ويمكنك إيقاف الإحصاءات من الإعدادات.</p>`}
};
const HON = {
  en:{sym:{saw:"ﷺ",as:"(AS)",as2:"(AS)",ra:"(RA)",raf:"(RA)"},
      full:{saw:"(peace and blessings be upon him)",as:"(peace be upon him)",as2:"(peace be upon them)",ra:"(may Allah be pleased with him)",raf:"(may Allah be pleased with her)"}},
  ar:{sym:{saw:"ﷺ",as:"عليه السلام",as2:"عليهما السلام",ra:"رضي الله عنه",raf:"رضي الله عنها"},
      full:{saw:"صلى الله عليه وسلم",as:"عليه السلام",as2:"عليهما السلام",ra:"رضي الله عنه",raf:"رضي الله عنها"}}
};

/* ===== State ===== */
function newId(){let x="";const a=new Uint8Array(12);(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0));a.forEach(b=>x+=b.toString(16).padStart(2,"0"));return x}
function def(){return{set:{lang:(navigator.language||"").toLowerCase().startsWith("ar")?"ar":"en",theme:"auto",size:"m",hon:"sym",sound:true,vib:true,stats:true,shareName:true,amb:"off",tash:"full"},
  name:"",by:null,onb:false,fam:null,nickAsked:false,jr:{},lvl:null,tl:{},recent:[],fun:{},pid:newId(),doneAt:null,res:{},missed:{},daily:{last:null,streak:0,grace:null},stats:{a:0,c:0}}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return def();const d=JSON.parse(r),b=def();
  return{...b,...d,set:{...b.set,...(d.set||{})},daily:{...b.daily,...(d.daily||{})},name:d.name||"",by:d.by||null,onb:!!d.onb,fam:(typeof d.fam==="number"?d.fam:null),nickAsked:!!d.nickAsked,jr:d.jr||{},lvl:(typeof d.lvl==="number"?d.lvl:null),tl:d.tl||{},recent:d.recent||[],fun:d.fun||{},pid:d.pid||newId(),doneAt:d.doneAt||null,res:d.res||{},missed:d.missed||{},stats:d.stats||b.stats}}catch(e){return def()}}
function migrate(b){const g={};for(const k in (b||{}))g[k]=Array.from({length:b[k]},(_,i)=>i+1);return g}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S = load(), V = {s:"home"}, R = null;

/* ===== Usage stats: queued on the device, sent when online ===== */
const QKEY="deendojo.q", SID=newId().slice(0,8);
let SQ=[];try{SQ=JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){SQ=[]}
const persistQ=()=>{try{localStorage.setItem(QKEY,JSON.stringify(SQ))}catch(e){}};
const statsOn=()=>S.set.stats&&!!STATS_URL;
function age(){return S.by?new Date().getFullYear()-S.by:null}
function stat(e){if(!statsOn())return;e.ts=Date.now();e.sid=SID;SQ.push(e);if(SQ.length>3000)SQ=SQ.slice(-3000);persistQ()}
let sending=false,lastAct=Date.now(),activeAcc=0;
function flushActive(){if(activeAcc>0){stat({t:"a",secs:activeAcc});activeAcc=0}}
function flush(beacon){
  if(!statsOn()||!SQ.length||sending||navigator.onLine===false)return;
  const batch=SQ.slice(0,300);
  const body=JSON.stringify({pid:S.pid,v:VERSION,lang:S.set.lang,by:S.by||"",name:(S.set.shareName&&S.name&&age()!==null&&age()>=13)?S.name:"",ev:batch});
  if(beacon&&navigator.sendBeacon){if(navigator.sendBeacon(STATS_URL,new Blob([body],{type:"text/plain"}))){SQ=SQ.slice(batch.length);persistQ()}return}
  sending=true;
  fetch(STATS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body,keepalive:body.length<60000})
    .then(()=>{SQ=SQ.slice(batch.length);persistQ()}).catch(()=>{}).finally(()=>{sending=false});
}
["pointerdown","keydown","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(document.visibilityState==="visible"&&Date.now()-lastAct<60000)activeAcc+=5},5000);
setInterval(()=>{flushActive();flush()},60000);
addEventListener("online",()=>flush());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){flushActive();flush(true)}});

/* ===== Helpers ===== */
const li = () => S.set.lang==="ar"?1:0;
const t = (k,vars) => { let s=(T[S.set.lang]||T.en)[k]??T.en[k]??k; if(vars) for(const n in vars) s=s.replaceAll("{"+n+"}",vars[n]); return fx(s); };
function qword(su,a,w1,w2){const v=QT[su+":"+a];if(!v)return "";const w=v.split(" ");return w1?w.slice(w1-1,w2||w1).join(" "):v}
/* Tashkeel switch: strips harakat from our own Arabic prose only; Quran ({Q:..}) and hadith («..») quotes always keep theirs. */
const HARAKAT=/[\u064B-\u0652\u0670]/g;
function untash(s){return String(s).split(/(\{Q:[^}]+\}|«[^»]*»)/).map((p,i)=>i%2?p:p.replace(HARAKAT,"")).join("")}
function fx(s){ const h=HON[S.set.lang][S.set.hon];
  if(S.set.lang==="ar"&&S.set.tash==="none") s=untash(s);
  s=String(s).replace(/\{Q:(\d+):(\d+)(?::(\d+)(?:-(\d+))?)?\}/g,(m,su,a,w1,w2)=>`<span class="qa" dir="rtl" lang="ar">﴿${qword(su,a,w1&&+w1,w2&&+w2)}﴾</span>`);
  s=String(s).replace(/\{(saw|as2|as|raf|ra)\}/g,(m,k)=>h[k]);
  if(S.set.lang==="ar") s=s.replace(/«([^»]+)»/g,'<span class="qt">«$1»</span>');
  else s=s.replace(/\uFD3E([^\uFD3F]+)\uFD3F/g,'<span class="qv">\uFD3E$1\uFD3F</span>');
  return s; }
const nm = o => fx(S.set.lang==="ar"?o.ar:o.en);
const ds = o => fx(S.set.lang==="ar"?(o.dar||""):(o.den||""));
const beltName = n => t("beltN",{c:S.set.lang==="ar"?BELTS[n].ar:BELTS[n].en});
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const dayDiff = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const liveLands = () => LANDS.filter(l=>l.live);
const beltQs = (l,v) => Q.filter(q=>q.l===l&&q.v===v).sort((a,b)=>a.id.localeCompare(b.id));
function score(l,v){const qs=beltQs(l,v);let r=0,w=0;for(const q of qs){if(S.res[q.id]===1)r++;else if(S.res[q.id]===0)w++}
  return{n:qs.length,r,w,need:Math.ceil(qs.length*PCT)}}
const has = (l,n) => {const c=score(l,n);return c.n>0&&c.r>=c.need};
const STRIPE=[.8,.9,1];
const stripes = (l,n) => {const c=score(l,n);if(!c.n||c.r<c.need)return 0;const p=c.r/c.n;return p>=1?3:p>=.9?2:p>=.8?1:0};
const crown = l => score(l,TOP).n>0&&stripes(l,TOP)===3;
const nextStripe = (l,n) => {const c=score(l,n),s=stripes(l,n);if(!c.n||s>=3||c.r<c.need)return 0;return Math.max(1,Math.ceil(c.n*STRIPE[s])-c.r)};
const hi = l => {let m=0;for(let n=1;n<=TOP;n++)if(has(l,n))m=n;return m};
// overall rank: the highest belt n such that, for every belt up to n, every topic that has questions at that belt holds it

/* ===== Sound and haptics (no music: short chimes only) ===== */
let AC;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,delay,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
  o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.15,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){if(!S.set.sound)return;
  if(k==="ok"){tone(659,.55,"sine",0,.14);tone(988,.8,"sine",.09,.1)}
  else if(k==="bad"){tone(196,.4,"triangle",0,.13)}
  else if(k==="belt"){[523,659,784,1047].forEach((f,i)=>tone(f,1.1,"sine",i*.13,.12))}}
/* Ambient sound: gentle nature sounds generated in the browser. Off by default. */
let AMB=null;
function noiseBuf(a){const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function ambStop(){if(!AMB)return;AMB.timers.forEach(clearInterval);AMB.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});AMB=null}
function ambStart(){
  ambStop();if(S.set.amb==="off")return;const a=ac();if(!a)return;
  const nodes=[],timers=[],master=a.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(.55,a.currentTime+2.5);master.connect(a.destination);nodes.push(master);
  const src=()=>{const n=a.createBufferSource();n.buffer=noiseBuf(a);n.loop=true;n.start();nodes.push(n);return n};
  const filt=(type,f,q)=>{const x=a.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;nodes.push(x);return x};
  const gain=v=>{const g=a.createGain();g.gain.value=v;nodes.push(g);return g};
  if(S.set.amb==="garden"){
    // wind: low filtered noise that slowly swells and fades
    const w=src(),wl=filt("lowpass",420),wg=gain(.05);w.connect(wl).connect(wg).connect(master);
    const lfo=a.createOscillator(),lg=gain(220);lfo.frequency.value=.06;lfo.connect(lg).connect(wl.frequency);lfo.start();nodes.push(lfo);
    // water: a soft trickle
    const t=src(),tb=filt("bandpass",2600,1.1),tg=gain(.008);t.connect(tb).connect(tg).connect(master);
    timers.push(setInterval(()=>{tg.gain.setTargetAtTime(.004+Math.random()*.014,a.currentTime,.05);tb.frequency.setTargetAtTime(2200+Math.random()*900,a.currentTime,.1)},140));
    // an occasional bird
    const bird=()=>{const n=2+(Math.random()*3|0),base=2600+Math.random()*900;for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+i*.13;
      o.frequency.setValueAtTime(base,t0);o.frequency.exponentialRampToValueAtTime(base*1.35,t0+.07);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.022,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+.1);
      o.connect(g).connect(master);o.start(t0);o.stop(t0+.12)}};
    timers.push(setInterval(()=>{if(Math.random()<.35)bird()},4000));
  } else {
    // rain: steady soft hiss, distant rumble and scattered drops
    const r=src(),rh=filt("highpass",900),rl=filt("lowpass",6500),rg=gain(.06);r.connect(rh).connect(rl).connect(rg).connect(master);
    const d=src(),dl=filt("lowpass",220),dg=gain(.03);d.connect(dl).connect(dg).connect(master);
    const drop=()=>{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime,f=1800+Math.random()*2200;o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*.6,t0+.05);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.012,t0+.004);g.gain.exponentialRampToValueAtTime(.0001,t0+.06);o.connect(g).connect(master);o.start(t0);o.stop(t0+.07)};
    timers.push(setInterval(()=>{if(Math.random()<.6)drop()},120));
  }
  AMB={nodes,timers};
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){ambStop()}else if(S.set.amb!=="off"&&AC){ambStart()}});
addEventListener("pointerdown",function first(){if(S.set.amb!=="off"&&!AMB)ambStart();removeEventListener("pointerdown",first)},{passive:true});
function buzz(p){if(S.set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

    const bar=live?`<span class="mbar" aria-hidden="true"><i style="width:${c.n?Math.round(100*c.r/c.n):0}%"></i><b style="inset-inline-start:${PCT*100}%"></b></span>`:"";

function nextStep(l,v){for(let n=v+1;n<=TOP;n++)if(score(l,n).n)return{l,v:n};
  const L=liveLands(),i=L.findIndex(x=>x.id===l);for(let k=i+1;k<L.length;k++)for(let n=1;n<=TOP;n++)if(score(L[k].id,n).n)return{l:L[k].id,v:n};return null}
function nextLabel(ns,l){return ns.l===l?t("nextBelt",{belt:beltName(ns.v)}):t("nextTopic",{topic:nm(LANDS.find(x=>x.id===ns.l))})}
function pill(v){return `<span class="bn" style="background:${BELTS[v].c};color:${v<=2?"#1C1C1E":"#FFFFFF"};border-color:${v===1?"var(--bstroke)":BELTS[v].c}">${beltName(v)}</span>`}
function gridScr(){
  const l=LANDS.find(x=>x.id===V.l),v=V.v,qs=beltQs(l.id,v),c=score(l.id,v),got=has(l.id,v);
  const cells=qs.map((q,k)=>{const r=S.res[q.id];const cls=r===1?"ok":(r===0?"bad":"");const mark=r===1?"✓":(r===0?"✗":"");
    return `<button class="cell ${cls}" data-act="pick" data-i="${k}" aria-label="${t("qOf",{i:k+1,n:qs.length})}${r===1?", "+t("correct"):(r===0?", "+t("notQuite"):"")}"><span>${k+1}</span>${mark?`<small>${mark}</small>`:""}</button>`}).join("");
  const firstOpen=qs.findIndex(q=>S.res[q.id]!==1);
  const status=got?t("holding",{need:c.need,n:c.n}):t("needX",{k:c.need-c.r});
  return `${topBar(nm(l),"toLand","back")}
  <section class="bhead">${beltSVG(v,120)}<div>${pill(v)}<p class="bprog">${t("beltProg",{r:c.r,n:c.n})}</p></div></section>
  <div class="bigbar" aria-hidden="true"><i style="width:${c.n?Math.round(100*c.r/c.n):0}%;background:${got?"var(--ok)":"var(--gold)"}"></i><b style="inset-inline-start:${PCT*100}%"></b></div>
  <p class="bstat ${got?"held":""}">${status}</p>
  <div class="cells">${cells}</div>
  ${(()=>{const ns=nextStep(l.id,v);const nb=ns?`<button class="${firstOpen<0?"primary":"ghost"}" data-act="gotoBelt" data-l="${ns.l}" data-v="${ns.v}">${nextLabel(ns,l.id)}</button>`:"";
    return `<div class="btns">${firstOpen>=0?`<button class="primary" data-act="pick" data-i="${firstOpen}">${c.r+c.w?t("continue"):t("open")}</button>`:""}${nb}</div>`})()}`;
}

  const land=LANDS.find(x=>x.id===q.l);

function surahName(n){const r=SURAH[+n-1];return S.set.lang==="ar"?"سورة "+r[0]:"Surah "+r[1]}
const arNum=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const REP_WHY=[["ar","repAr"],["en","repEn"],["ans","repAns"],["opt","repOpt"],["src","repSrc"],["easy","repEasy"],["hard","repHard"],["oth","repOth"]];
function repHTML(q){

  const mail=`mailto:${REPORT_EMAIL}?subject=${encodeURIComponent("DeenDojo report: "+q.id)}&body=${encodeURIComponent("Question "+q.id+"\nIssue: "+sel.map(w=>t(REP_WHY.find(x=>x[0]===w)[1])).join(", ")+"\n\nDetails:\n")}`;

function infoHTML(q){let h="",hasQ=false;
  for(const x of q.s){

      h+=`<section class="ib"><h3>${surahName(su)} <bdi dir="ltr">${x.q}</bdi></h3><p class="qa full" dir="rtl" lang="ar">﴿${vs.join(" ")}﴾</p><a href="https://quran.com/${su}/${rg}" target="_blank" rel="noopener">${t("openQuran")}</a></section>`}
    else if(x.b||x.m){const lk=x.b?`https://sunnah.com/bukhari:${x.b}`:(x.ml?`https://sunnah.com/${x.ml}`:"");
      h+=`<section class="ib"><h3>${[x.b?t("bukhari")+" "+x.b:"",x.m?t("muslim")+" "+x.m:""].filter(Boolean).join(" · ")}</h3><p>${x.b&&x.m?t("agreed"):t("sahih")}</p>${(()=>{const k=x.b&&HT["bukhari:"+x.b]?"bukhari:"+x.b:(x.m&&HT["muslim:"+x.m]?"muslim:"+x.m:"");return k?`<p class="ht" dir="rtl" lang="ar">${HT[k]}</p><p class="credit">${t("htCredit")} (${k.startsWith("bukhari")?t("bukhari"):t("muslim")} ${k.split(":")[1]})</p>`:`<p class="muted">${t("hadithSoon")}</p>`})()}${lk?`<a href="${lk}" target="_blank" rel="noopener">${t("openSunnah")}</a>`:""}</section>`}
    else if(x.n){h+=`<section class="ib"><h3>${t(x.n)}</h3><p class="muted">${t(x.n+"Info")}</p></section>`}
  }

function srcHTML(s){return s.map(x=>{
  if(x.q){const [su,ay]=x.q.split(":");return `<a href="https://quran.com/${su}/${ay}" target="_blank" rel="noopener">${surahName(su)} <bdi dir="ltr">${x.q}</bdi></a>`}
  if(x.b||x.m){const parts=[];if(x.b)parts.push(`<a href="https://sunnah.com/bukhari:${x.b}" target="_blank" rel="noopener">${t("bukhari")} ${x.b}</a>`);
    if(x.m)parts.push(x.ml?`<a href="https://sunnah.com/${x.ml}" target="_blank" rel="noopener">${t("muslim")} ${x.m}</a>`:`<p>${t("muslim")} ${x.m}</p>`);
    return parts.join("")+`<p class="grade">${x.b&&x.m?t("agreed"):t("sahih")}</p>`}
  if(x.n)return `<p>${t(x.n)}</p>`;return ""}).join("")}

/* ===== Session mode: 10 adaptive questions across every topic ===== */
const SESSION=10;
function startLevel(){if(typeof S.fam==="number")return S.fam;const a=age();if(a===null)return 1.8;if(a<20)return 1.0;if(a<=40)return 1.8;return 2.2}
function curLevel(){return S.lvl==null?startLevel():S.lvl}
function zoneName(L){const b=Math.min(TOP,Math.floor(L)),f=L-b;return (f>=.5&&b<TOP)?t("zoneUp",{a:beltName(b),b:beltName(b+1)}):beltName(b)}
function pickBelt(L,l){let b=Math.floor(L);if(b<TOP&&Math.random()<L-b)b++;b=Math.max(1,Math.min(TOP,b));while(b>1&&!score(l,b).n)b--;return b}
let QBY=null;
function blockedBy(used){QBY=QBY||Object.fromEntries(Q.map(q=>[q.id,q]));const B=new Set(used);used.forEach(id=>{const q=QBY[id];if(q&&q.rel)q.rel.forEach(r=>B.add(r))});return B}
function drawQ(l,b,used){
  const blk=blockedBy(used),rec=new Set(S.recent),pool=Q.filter(q=>q.l===l&&q.v===b&&!blk.has(q.id));if(!pool.length)return null;
  const fresh=pool.filter(q=>!rec.has(q.id)),P=fresh.length?fresh:pool;
  const tier=q=>!(q.id in S.res)?0:(S.res[q.id]===0?1:2),best=Math.min(...P.map(tier)),c=P.filter(q=>tier(q)===best);
  return c[Math.random()*c.length|0]}
function runOf(v){let n=0;for(let k=R.hist.length-1;k>=0;k--){if(R.hist[k]===v)n++;else break}return n}
function sessionNext(){
  const k=R.qs.length,l0=R.plan[k];let L=curLevel()+(S.tl[l0]||0);
  if(k<2)L-=.6;                               // warm-up
  if(k===R.total-1){L+=1;R.chal=k}            // challenge finale
  L=Math.max(1,Math.min(TOP,L));
  const l=R.plan[R.qs.length];let b=pickBelt(L,l),q=drawQ(l,b,R.used);
  for(let d=1;!q&&d<TOP;d++){q=drawQ(l,Math.max(1,b-d),R.used)||drawQ(l,Math.min(TOP,b+d),R.used)}
  if(!q){const blk=blockedBy(R.used);let any=Q.filter(x=>x.l===l&&!blk.has(x.id));if(!any.length)any=Q.filter(x=>x.l===l&&!R.used.has(x.id));q=any[Math.random()*any.length|0]}
  R.used.add(q.id);R.qs.push(prep(q))}
function startSession(){
  const ids=liveLands().map(l=>l.id),plan=shuffle(ids.concat(shuffle(ids).slice(0,SESSION-ids.length)));
  R={mode:"session",total:SESSION,chal:-1,plan,used:new Set(),qs:[],i:0,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null,lvl0:curLevel()};
  sessionNext();stat({t:"journey",v:Math.round(curLevel()*10)});go("quiz")}
function endSession(){
  const c=R.c;R.lvl1=curLevel();
  S.recent=S.recent.concat(R.qs.map(x=>x.q.id)).slice(-40);updateStreak();stat({t:"journey_end",v:c})}

/* ===== Flow ===== */
function prep(q){return q.t==="tf"?{q,order:[0,1],correct:q.a}:{q,order:shuffle([0,1,2,3]),correct:0}}
function start(mode,pool,extra){if(!pool.length)return;R={mode,qs:shuffle(pool).slice(0,mode==="review"?10:ROUND).map(prep),i:0,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null,...extra};go("quiz")}
function openGrid(l,v){go("grid",{l,v})}
function pickQ(l,v,i){R={mode:"grid",l,v,qs:beltQs(l,v).map(prep),i,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null};go("quiz")}
function startDaily(){start("daily",Q.filter(q=>(LANDS.find(x=>x.id===q.l)||{}).live&&q.v<=MAXLIVE))}
function startStory(id){const j=JOURNEYS.find(x=>x.id===id);if(!j)return;R={mode:"story",jid:id,qs:j.qs.map(x=>prep(QI[x])),i:0,t0:Date.now(),c:0,ans:null,hist:[],changes:[],flash:null};stat({t:"story",v:JOURNEYS.indexOf(j)});go("quiz")}
function startReview(){start("review",missedIds().map(id=>QI[id]))}
function answer(k){
  if(R.ans)return;const it=R.qs[R.i],ok=it.order[k]===it.correct,id=it.q.id,l=it.q.l,v=it.q.v;
  stat({t:"q",qid:id,l,v,ok:ok?1:0,first:(id in S.res)?0:1,pick:it.order[k],ms:Date.now()-(R.t0||Date.now())});
  const before=has(l,v),stBefore=stripes(l,v),obBefore=overall(),allBefore=beltTally().all;
  R.ans={k,ok};R.hist[R.i]=ok;S.res[id]=ok?1:0;
  if(ok)R.c++;S.stats.a++;if(ok)S.stats.c++;
  if(R.mode==="review"){if(ok){S.missed[id]=(S.missed[id]||0)+1;if(S.missed[id]>=2)delete S.missed[id]}else S.missed[id]=0}
  else if(!ok)S.missed[id]=0;
  const after=has(l,v);R.flash=null;
  if(before!==after){R.flash={type:after?"earned":"lost",l,v};R.changes.push(R.flash);stat({t:"b",l,v,got:after?1:0})}
  else if(after&&stripes(l,v)>stBefore){R.flash={type:"stripe",l,v,s:stripes(l,v)};R.changes.push(R.flash);stat({t:"stripe",l,v,got:stripes(l,v)})}
  if(R.mode==="session"){S.lvl=Math.max(1,Math.min(TOP,+(curLevel()+(ok?.05:-.12)).toFixed(3)));S.tl[l]=Math.max(-1,Math.min(1,+((S.tl[l]||0)+(ok?.04:-.08)).toFixed(3)));
    if(R.i===R.chal&&ok)toast(t("chalWin"))}
  const obAfter=overall();R.newTitle=obAfter>obBefore?obAfter:0;
  if(!allBefore&&beltTally().all){R.celebrate=true;S.doneAt=today()}
  save();
  if(R.flash&&(R.flash.type==="earned"||R.flash.type==="stripe")){sfx("belt");buzz([30,40,30,40,80])}else{sfx(ok?"ok":"bad");buzz(ok?15:[40,50,40])}
  render();
  const c=document.getElementById("card");if(c)c.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}
function next(){if(R.mode==="session"&&R.i===R.qs.length-1&&R.qs.length<R.total)sessionNext();if(R.i<R.qs.length-1){R.i++;R.ans=null;R.flash=null;R.newTitle=0;R.t0=Date.now();render();window.scrollTo(0,0);return}finish()}
function finish(){
  if(R.mode==="grid"){openGrid(R.l,R.v);return}
  if(R.mode==="daily")updateStreak();
  if(R.mode==="session")endSession();
  if(R.mode==="story"){S.jr[R.jid]=Math.max(S.jr[R.jid]||0,R.c);stat({t:"story_end",v:R.c})}
  save();go("result");
}

function go(s,extra){V={s,...(extra||{})};render();window.scrollTo(0,0)}
function applySettings(){const h=document.documentElement,st=S.set;
  h.lang=st.lang;h.dir=st.lang==="ar"?"rtl":"ltr";
  if(st.theme==="auto")h.removeAttribute("data-theme");else h.setAttribute("data-theme",st.theme);
  h.setAttribute("data-size",st.size);document.title=T[st.lang].app}
function render(){applySettings();if(!S.onb&&V.s!=="about")V.s="welcome";document.getElementById("app").className="scr-"+V.s;const f={welcome:welcomeScr,home:homeScr,land:landScr,grid:gridScr,quiz:quizScr,result:resultScr,stories:storiesScr,story:storyScr,settings:settingsScr,about:aboutScr}[V.s]||homeScr;document.getElementById("app").innerHTML=f()}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nick2"){e.preventDefault();document.querySelector('[data-act="nickSave"]').click();return}if(e.key==="Enter"&&V.editName){e.preventDefault();document.querySelector('[data-act="saveName"]').click();return}if(e.key==="Escape"&&V.info){V.info=false;render()}});
document.addEventListener("click",e=>{
  const rm=e.target.closest(".repmail");if(rm){const it=R&&R.qs[R.i];if(it){stat({t:"rp_mail",qid:it.q.id});flush()}}
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const d=el.dataset;
  switch(d.act){
    case "home":go("home");break;
    case "go":go(d.to);break;
    case "land":go("land",{l:d.l});break;
    case "belt":openGrid(d.l||V.l,+d.v);break;
    case "pick":pickQ(V.l,V.v,+d.i);break;
    case "gotoBelt":V.info=false;openGrid(d.l,+d.v);break;
    case "toGrid":V.info=false;openGrid(R.l,R.v);break;
    case "toLand":go("land",{l:V.l});break;
    case "daily":startDaily();break;
    case "session":startSession();break;
    case "repOpen":V.rep=true;V.repWhy=[];render();break;
    case "repClose":V.rep=false;render();break;
    case "repScrim":if(e.target.classList.contains("scrim")){V.rep=false;render()}break;
    case "repWhy":{const w=d.v,a=V.repWhy||[];V.repWhy=a.includes(w)?a.filter(x=>x!==w):a.concat(w);render()}break;
    case "repSend":{const it=R.qs[R.i];(V.repWhy||[]).forEach(w=>stat({t:"rp_"+w,qid:it.q.id,l:it.q.l,v:it.q.v}));stat({t:"r",qid:it.q.id,l:it.q.l,v:it.q.v});flush();
      S.reported=(S.reported||{});S.reported[it.q.id]=V.repWhy;save();V.rep=false;render();toast(t("repThanks"))}break;
    case "fun":{const it=R.qs[R.i],v=+d.v;S.fun[it.q.id]=v;save();stat({t:v>0?"fun_up":"fun_down",qid:it.q.id,l:it.q.l,v:it.q.v});render();toast(t("funThanks"))}break;
    case "review":startReview();break;
    case "storyOpen":go("story",{j:d.j});break;
    case "storyGo":startStory(d.j);break;
    case "ans":answer(+d.k);break;
    case "next":V.info=false;next();break;
    case "skip":{const it=R.qs[R.i];stat({t:"k",qid:it.q.id,l:it.q.l,v:it.q.v});if(R.mode==="session"&&R.i===R.qs.length-1&&R.qs.length<R.total)sessionNext();if(R.i<R.qs.length-1){R.i++;R.ans=null;R.t0=Date.now();render();window.scrollTo(0,0)}else if(R.mode==="grid")openGrid(R.l,R.v);else finish()}break;
    case "welcomeGo":{const n=document.getElementById("nick"),b=document.getElementById("by");S.name=(n?n.value:"").replace(/[<>]/g,"").trim().slice(0,20);S.by=b&&b.value?+b.value:null;S.onb=true;save();stat({t:"p"});flush();go("home")}break;
    case "welcomeSkip":case "obSkip":S.onb=true;save();stat({t:"ob",v:0});go("home");break;
    case "famPick":S.fam=+d.v;S.onb=true;save();stat({t:"ob",v:Math.round(S.fam*10)});startSession();break;
    case "nickSave":{const n=document.getElementById("nick2"),yb=document.getElementById("by");S.name=(n?n.value:"").replace(/[<>]/g,"").trim().slice(0,20);if(yb&&yb.value)S.by=+yb.value;S.nickAsked=true;save();stat({t:"p"});flush();render();if(S.name)toast(t("nickThanks",{n:S.name}))}break;
    case "nickLater":S.nickAsked=true;save();render();break;
    case "info":V.info=true;render();break;
    case "closeInfo":V.info=false;if(R)R.celebrate=false;render();break;
    case "scrim":if(e.target===el){V.info=false;if(R)R.celebrate=false;render()}break;
    case "editName":V.editName=true;render();{const i=document.getElementById("nick");if(i){i.focus();i.select()}}break;
    case "saveName":{const i=document.getElementById("nick"),yb=document.getElementById("by");S.name=(i?i.value:"").replace(/[<>]/g,"").trim().slice(0,20);S.by=yb&&yb.value?+yb.value:null;save();stat({t:"p"});flush();V.editName=false;render()}break;
    case "quit":R&&R.mode==="grid"?openGrid(R.l,R.v):go(R&&R.mode==="story"?"stories":"home");break;
    case "lang":S.set.lang=S.set.lang==="ar"?"en":"ar";save();render();break;
    case "set":S.set[d.k]=d.v;save();render();if(d.k==="amb")ambStart();break;
    case "tog":S.set[d.k]=!S.set[d.k];if(d.k==="stats"&&!S.set.stats){SQ=[];persistQ()}save();render();if(d.k==="sound"&&S.set.sound)sfx("ok");break;
    case "reset":if(!V.confirm){V.confirm=true;render()}else{const keep=S.set;S=def();S.set=keep;save();go("settings");toast(t("resetDone"))}break;
  }
});
