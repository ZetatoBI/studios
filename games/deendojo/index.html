<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeenDojo</title>
<meta name="description" content="DeenDojo: Islamic Trivia. Learn the Quran, Prophets, Seerah and Hadith, with the evidence behind every answer.">
<meta name="theme-color" content="#1B3565">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeenDojo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B3565'/%3E%3Cpolygon points='50,10 60.6,24.4 78.3,21.7 75.6,39.4 90,50 75.6,60.6 78.3,78.3 60.6,75.6 50,90 39.4,75.6 21.7,78.3 24.4,60.6 10,50 24.4,39.4 21.7,21.7 39.4,24.4' fill='%23E7B343'/%3E%3Crect x='24' y='46' width='52' height='9' rx='2' fill='%231C1C1E'/%3E%3Crect x='44' y='42' width='12' height='17' rx='3' fill='%231C1C1E'/%3E%3Cpath d='M46 58 L40 74 L47 74 L50 60 Z M54 58 L60 74 L53 74 L50 60 Z' fill='%231C1C1E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Figtree:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Montserrat:wght@500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF5;--surface:#FFFFFF;--surface2:#F2F5F9;--ink:#152238;--muted:#56647C;--line:#D3DCE7;
  --lapis:#1F3F7A;--panel:#1F3F7A;--gold:#B7800F;--goldb:#E7B343;
  --ok:#1E7F52;--okbg:#E1F2E8;--bad:#A93B32;--badbg:#F8E4E1;--bstroke:rgba(21,34,56,.38);
  --display:"Reem Kufi","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --classic:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
    --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
    --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1628;--surface:#14223B;--surface2:#1A2B48;--ink:#E8EEF7;--muted:#9DAAC2;--line:#26385C;
  --lapis:#9DBBF2;--panel:#1B3565;--gold:#F0BD4F;--goldb:#F0BD4F;
  --ok:#5CC790;--okbg:#12342A;--bad:#EF8579;--badbg:#3B1D20;--bstroke:rgba(255,255,255,.35);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;-webkit-text-size-adjust:100%}
html[data-size="l"]{font-size:18px}
html[data-size="xl"]{font-size:20px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;min-height:100%}
html[lang="ar"] body{--body:"IBM Plex Sans Arabic","Figtree",system-ui,sans-serif;line-height:1.7}
#app{max-width:34rem;margin:0 auto;padding:.75rem 1.1rem 2.5rem}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--goldb);outline-offset:2px;border-radius:.5rem}
a{color:var(--lapis)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.2;margin:0}
.qt{font-family:var(--classic);font-size:1.12em;line-height:1.9}
.qa{font-family:"Amiri Quran","Amiri",serif;font-size:1.15em;line-height:2.2;font-weight:400}
.info-btn{width:2.2rem;height:2.2rem;border-radius:50%;border:1.5px solid var(--line);color:var(--lapis);font-weight:700;font-family:Georgia,serif;font-style:italic;display:grid;place-items:center;flex:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:34rem;max-height:85vh;overflow:auto;border-radius:1.2rem 1.2rem 0 0;padding:1rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-1rem;background:var(--surface);padding-top:.2rem}
.sheet h2{font-size:1.2rem}
.ib{border-top:1px solid var(--line);padding:.8rem 0}
.ib h3{font-size:1rem;margin:0 0 .4rem;font-family:var(--display)}
.ib .full{font-size:1.45rem;text-align:right;margin:.2rem 0 .6rem}
.an{font-family:"Amiri Quran","Amiri",serif;font-size:.8em;color:var(--gold)}
.ht{font-family:var(--classic);font-size:1.2rem;line-height:2.1;text-align:right;margin:.3rem 0}
.ib .muted,.credit{color:var(--muted);font-size:.85rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;min-height:3rem;gap:.5rem}
.top h1{font-size:1.25rem;flex:1;text-align:center}
.icon{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.lang{min-height:2.75rem;min-width:2.75rem;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;color:var(--lapis)}
.lang[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.icon:active{background:var(--surface2)}
.icon svg{width:1.4rem;height:1.4rem}
[dir="rtl"] .flip svg{transform:scaleX(-1)}

/* hero */
.hero{text-align:center;padding:.25rem 0 1.25rem}
.spark{display:inline-block;animation:spark 1.6s ease-out 1}
.spark svg{filter:drop-shadow(0 0 18px color-mix(in srgb,var(--goldb) 45%,transparent))}
@keyframes spark{0%{transform:scale(.6) rotate(-22.5deg);opacity:0}60%{transform:scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
.brand{font-size:2.5rem;letter-spacing:.01em;margin-top:.35rem}
.tag{margin:.1rem 0 .9rem;color:var(--muted);font-family:var(--display);font-size:1.05rem}
.overall{display:inline-flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3rem .95rem .3rem .6rem;font-weight:600}
.hint{color:var(--muted);font-size:.85rem;margin:.5rem auto 0;max-width:22rem}

/* daily panel: the pattern band */
.daily{display:block;width:100%;background-color:var(--panel);background-image:var(--pat);color:#fff;border-radius:1.25rem;padding:1.15rem 1.25rem 1rem;margin-top:.25rem;position:relative;overflow:hidden}
.daily-t{display:block;font-family:var(--display);font-size:1.6rem;font-weight:700}
.daily-s{display:block;opacity:.88;font-size:.95rem;margin-top:.1rem;max-width:18rem}
.streak{display:inline-flex;align-items:center;gap:.35rem;margin-top:.8rem;background:rgba(255,255,255,.13);border-radius:999px;padding:.2rem .7rem .2rem .45rem;font-weight:600;font-size:.9rem}
.daily .go{position:absolute;inset-inline-end:1.1rem;top:50%;transform:translateY(-50%);width:3.1rem;height:3.1rem;border-radius:50%;background:#E7B343;color:#1F2A3F;display:grid;place-items:center}
.daily .go svg{width:1.5rem;height:1.5rem}
[dir="rtl"] .daily .go svg{transform:scaleX(-1)}

.row{display:flex;align-items:center;gap:.85rem;width:100%;padding:.9rem 1rem;margin-top:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.row svg{width:1.6rem;height:1.6rem;color:var(--lapis);flex:none}
.row b{display:block}
.row small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.row:disabled{opacity:.65}

.sec{font-size:1.2rem;margin:1.6rem 0 .7rem}
.grid{display:grid;gap:.6rem}
.tile{display:flex;align-items:center;gap:.9rem;width:100%;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.tile b{font-size:1.05rem;display:block}
.tile small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.tile .star{flex:none}
.tile.soon{opacity:.55;border-style:dashed;background:transparent}
.track{display:flex;gap:4px;margin-top:.5rem}
.track i{height:6px;flex:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.track i.next{border-color:var(--gold)}
.track i.none{border-style:dashed;background:transparent}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:2rem}

/* land */
.lead{color:var(--muted);margin:.2rem 0 .3rem}
.rule{font-size:.9rem;margin:0 0 1rem;padding:.6rem .85rem;background:var(--surface2);border-radius:.75rem}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.rung{display:flex;align-items:center;gap:.9rem;width:100%;padding:.7rem .95rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem}
.rung span{flex:1}
.rung b{display:block}
.rung small{display:block;color:var(--muted);font-size:.85rem}
.rung em{font-style:normal;font-weight:700;font-size:.85rem;padding:.3rem .7rem;border-radius:999px;white-space:nowrap}
.rung.open{border:2px solid var(--gold)}
.rung.open em{background:var(--goldb);color:#1F2A3F}
.rung.earned em{background:var(--okbg);color:var(--ok)}
.rung.locked,.rung.soon{opacity:.55}
.rung.soon{border-style:dashed;background:transparent}
.rung.locked em,.rung.soon em{color:var(--muted)}

/* quiz */
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--gold)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.meta{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.88rem;font-weight:600;margin:.6rem 0 .5rem}
.bn{font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.meta .bn{margin-inline-start:auto;font-weight:600;font-size:.8rem;padding:.15rem .6rem;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qtext{font-family:var(--body);font-size:1.35rem;font-weight:700;line-height:1.4;margin:0 0 1.1rem}
.opts{display:grid;gap:.55rem}
.opt{display:block;width:100%;padding:.95rem 1.05rem;background:var(--surface);border:2px solid var(--line);border-radius:.9rem;font-weight:600;line-height:1.4;transition:transform .08s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.5}
.card{margin-top:1rem;padding:1.05rem 1.1rem;border-radius:1rem;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ok);animation:up .25s ease-out}
.card.bad{border-top-color:var(--bad)}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.verdict{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;color:var(--ok)}
.card.bad .verdict{color:var(--bad)}
.ansline{margin:.3rem 0 0}
.x{margin:.55rem 0 .8rem}
.src{font-size:.88rem;border-top:1px solid var(--line);padding-top:.65rem}
.src>span{display:block;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.src a,.src p{display:block;margin:.1rem 0}
.src .grade{color:var(--muted)}
.beta{font-size:.8rem;color:var(--muted);margin:.55rem 0 0}
.card-act{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1rem}
.report{font-size:.85rem;color:var(--muted)}
.primary{background:var(--lapis);color:var(--surface);font-weight:700;padding:.8rem 1.3rem;border-radius:.8rem}
:root[data-theme="dark"] .primary{color:#0C1628}
.ghost{border:2px solid var(--line);font-weight:700;padding:.75rem 1.2rem;border-radius:.8rem}
.btns{display:grid;gap:.6rem;margin-top:1.5rem}
.btns>*{text-align:center;width:100%}

/* result */
.result{text-align:center;padding:2rem 0 .5rem}
.score{font-size:2.2rem}
.result p{color:var(--muted);max-width:24rem;margin:.6rem auto 0}
.earned .belt-big{animation:belt 1.1s cubic-bezier(.2,1.4,.4,1) 1}
.earned .belt-big svg{filter:drop-shadow(0 0 24px color-mix(in srgb,var(--goldb) 55%,transparent))}
@keyframes belt{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.lost{display:flex;align-items:center;gap:.8rem;text-align:start;margin:1.2rem auto 0;max-width:24rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1rem;background:var(--surface)}
.lost svg{opacity:.45;filter:grayscale(.3)}
.lost p{margin:0!important;color:var(--ink)!important}
.qnum{flex:1;text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}
.mbar{display:block;position:relative;height:5px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);margin-top:.4rem}
.mbar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ok);border-radius:3px}
.mbar b,.bigbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.bhead{display:flex;align-items:center;gap:1rem;margin:.4rem 0 1rem}
.bhead .bn{font-size:.95rem;padding:.3rem .8rem;border-radius:999px;font-weight:700;border:1px solid}
.bprog{margin:.5rem 0 0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.bigbar{position:relative;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.bigbar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px}
.bstat{color:var(--muted);font-size:.92rem;margin:.6rem 0 1rem}
.bstat.held{color:var(--ok);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.cell{aspect-ratio:1;border-radius:.8rem;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;position:relative;font-weight:700;font-size:1.1rem}
.cell small{position:absolute;top:.15rem;inset-inline-end:.35rem;font-size:.75rem}
.cell.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cell.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.flash{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;margin:-.2rem 0 .8rem;border-radius:.8rem;background:var(--okbg);font-weight:700;color:var(--ok)}
.flash.lost{background:var(--badbg);color:var(--bad)}
.flash p{margin:0}
.flash.earned svg{animation:belt 1s cubic-bezier(.2,1.4,.4,1) 1}
.card-act{flex-wrap:wrap}
.card-act>button{flex:1;white-space:nowrap;text-align:center}
.card-act .report{order:3;width:100%;text-align:center;padding-top:.2rem}
.profile{display:flex;align-items:center;gap:.9rem;width:100%;max-width:24rem;margin:0 auto;padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;text-align:start}
.profile .pinfo{flex:1;display:flex;flex-direction:column;line-height:1.3}
.profile b{font-size:1.1rem}
.ptitle{font-family:var(--display);font-weight:700;color:var(--gold);font-size:1rem}
.ptitle.big{font-size:1.6rem;margin:.2rem 0 1rem}
.profile small{color:var(--muted);font-size:.8rem}
.profile.edit{flex-direction:column;align-items:stretch;gap:.5rem}
.profile.edit label{font-weight:700}
.profile.edit input{font:inherit;font-size:1.05rem;padding:.7rem .8rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.nobelt{display:grid;place-items:center;width:64px}
.mcount{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:600}
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.3rem .8rem}
.mrow{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mname{flex:1;font-weight:600;font-size:.92rem}
.mbelts{display:flex;gap:.3rem}
.mcell{display:grid;place-items:center;width:34px;height:20px}
.mcell svg{opacity:.2;filter:grayscale(.6)}
.mcell.got svg{opacity:1;filter:none}
.mcell.none{border:1.5px dashed var(--line);border-radius:4px;height:14px;width:28px;margin:0 3px}
.qtrack{display:flex;flex-direction:column;gap:.3rem;margin:-.1rem 0 .8rem}
.bigbar.thin{height:7px}
.qtrack span{font-size:.78rem;color:var(--muted);font-weight:600;white-space:nowrap}
.cele-wrap{align-items:center;overflow:hidden}
.cele{border-radius:1.2rem;text-align:center;max-width:22rem;margin:1rem}
.cele h2{font-size:1.7rem;margin-top:.6rem}
.cele-star{animation:spark 1.6s ease-out 1;display:inline-block;filter:drop-shadow(0 0 22px #E7B343)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.8s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.ttl-star{display:grid;place-items:center}
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,#FBFAF6,#E9F1FB);transition:opacity .25s}
#intro .zlogo{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,24px);animation:zin .35s ease-out both;direction:ltr}
#intro .zmark{height:clamp(64px,19vw,112px);width:auto;flex:none}
#intro .zword{display:flex;flex-direction:column;align-items:stretch;font-family:Montserrat,"Segoe UI",Arial,sans-serif;line-height:1}
#intro .z1{font-weight:600;font-size:clamp(34px,10.5vw,62px);letter-spacing:.1em;color:#1F3A68;margin-right:-.1em}
#intro .z2{font-weight:500;font-size:clamp(11px,3.3vw,19px);letter-spacing:.62em;color:#1275EC;margin-top:.55em;margin-right:-.62em}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#intro.out{opacity:0;pointer-events:none}
.hero.dojo{position:relative;margin:.2rem 0 0;padding:2.6rem 1rem 2.3rem;border-radius:9rem 9rem 1.2rem 1.2rem;background-color:#16294F;background-image:var(--pat),radial-gradient(120% 80% at 50% 0%,#24457F 0%,#16294F 70%);color:#F5E9CF;overflow:hidden;text-align:center}
.hero.dojo .arch{position:absolute;inset:.6rem .6rem 0;width:calc(100% - 1.2rem);height:calc(100% - .6rem)}
.hero.dojo .brand{color:#F5E9CF;position:relative}
.hero.dojo .tag{color:#D9A53A;position:relative;margin-bottom:.2rem}
.hero.dojo .spark{position:relative}
.lantern{position:absolute;top:0;width:34px;height:102px;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.lantern.l1{inset-inline-start:13%}.lantern.l2{inset-inline-end:13%;animation-delay:-2.5s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.beltband{position:relative;display:flex;justify-content:center;align-items:center;margin:-.35rem 0 1rem}
.beltband .bb{display:flex;width:100%;height:12px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bstroke)}
.beltband .bb i{flex:1}
.bknot{position:absolute;width:40px;height:34px;top:-7px}
.hero-under{text-align:center;padding:.4rem 0 .6rem}
.sec{display:flex;align-items:center;gap:.5rem}
.sec::before{content:"";width:16px;height:16px;flex:none;background:var(--star) center/contain no-repeat}
.emb{position:relative;display:grid;place-items:center;flex:none;width:46px;height:46px}
.emb .gl{position:absolute;width:21px;height:21px}
.welcome{display:flex;flex-direction:column;gap:.35rem;padding:.4rem 0 1rem}
.welcome .spark{align-self:center}
.welcome h1{text-align:center;font-size:1.8rem;margin:.4rem 0 0}
.welcome .lead{text-align:center;margin:0 0 .8rem}
.welcome label,.profile.edit label{font-weight:700;margin-top:.5rem}
.welcome input,.welcome select,.profile.edit select{font:inherit;font-size:1.05rem;padding:.7rem .8rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.welcome small{color:var(--muted);font-size:.82rem}
.welcome .hint{text-align:center;margin-top:1rem}
.setnote{display:block;color:var(--muted);font-size:.8rem;margin-top:.35rem}
.funrow{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;font-size:.85rem;color:var(--muted)}
.funrow span{flex:1}
.funb{width:2.4rem;height:2.2rem;border-radius:.6rem;border:1.5px solid var(--line);font-size:1.05rem;display:grid;place-items:center}
.funb.on{border-color:var(--gold);background:var(--gold-soft,rgba(231,179,67,.18))}
.daily .zone{display:inline-block;margin-top:.35rem;font-weight:700;color:#E7B343}
.skipq{display:block;margin:.8rem auto 0;color:var(--muted);font-weight:600;font-size:.92rem;padding:.5rem 1rem;border-radius:.6rem}
.skipq:active{background:var(--surface2)}
.earned h1{font-size:1.8rem;margin-top:.8rem}

/* settings */
.set{margin:1.2rem 0}
.set>label,.set>.lbl{display:block;font-weight:700;margin-bottom:.45rem}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:.8rem;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;padding:.6rem .4rem;border-radius:.6rem;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--lapis)}
.tgl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.85rem 0;border-bottom:1px solid var(--line)}
.tgl small{display:block;color:var(--muted);font-size:.8rem}
.sw{width:3rem;height:1.7rem;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(1.7rem - 6px);height:calc(1.7rem - 6px);border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl[aria-pressed="true"] .sw{background:var(--ok)}
.tgl[aria-pressed="true"] .sw::after{inset-inline-start:calc(100% - 1.7rem + 3px)}
.link-row{display:block;width:100%;padding:.95rem 0;border-bottom:1px solid var(--line);font-weight:600}
.danger{color:var(--bad)}
.about h2{font-size:1.1rem;margin:1.4rem 0 .35rem}
.about p{margin:.35rem 0}
.about .ref{display:block;color:var(--muted);font-size:.85rem}
.ver{color:var(--muted);font-size:.8rem;margin-top:1.5rem}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.7rem;font-weight:600;font-size:.9rem;z-index:9}

/* layout containers: invisible in portrait, columns in landscape */
.qbody{display:flex;flex-direction:column}
.qleft,.qright,.hleft,.hright{display:contents}
.qbody .meta{order:1}.qbody .qtrack{order:2}.qbody .qtext{order:3}.qbody .opts{order:4}.qbody .skipq{order:5}.qbody .card{order:6}
@media (orientation:landscape) and (min-width:700px){
  html{font-size:clamp(14px,calc(.9vw + .5vh),26px)}
  html[data-size="l"]{font-size:clamp(15px,calc(1vw + .56vh),29px)}
  html[data-size="xl"]{font-size:clamp(16px,calc(1.1vw + .62vh),32px)}
  #app{max-width:46rem}
  #app.scr-quiz,#app.scr-home{max-width:min(96vw,82rem)}
  #app.scr-quiz{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:.5rem}
  .scr-quiz>.top{flex:none}
  .scr-quiz .qbody{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(1rem,3vw,3rem);align-items:center}
  .scr-quiz .qleft,.scr-quiz .qright{display:block;max-height:100%;overflow:auto;padding:.2rem .2rem .5rem}
  .scr-quiz .qtext{font-size:1.5rem}
  .scr-quiz .skipq{margin-inline-start:0}
  .scr-quiz .card{margin-top:.7rem}
  .scr-quiz .card-act{flex-wrap:nowrap}
  .scr-quiz .card-act .report{order:0;width:auto;padding:0}
  #app.scr-home{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);column-gap:clamp(1rem,3vw,3rem);align-items:start}
  .scr-home>.top{grid-column:1/-1}
  .scr-home .hleft{display:block;position:sticky;top:.5rem}
  .scr-home .hright{display:block}
  .scr-home .hright>.daily{margin-top:0}
  .scr-home .grid{grid-template-columns:1fr 1fr}
  .cells{grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr))}
}
@media (orientation:landscape) and (min-width:700px) and (max-height:500px){
  .scr-quiz>.top{min-height:2.3rem}
  .scr-quiz .meta{margin:.1rem 0 .3rem}
  .scr-quiz .qtrack{margin-bottom:.4rem}
  .scr-quiz .qtext{font-size:1.15rem;margin-bottom:.3rem}
  .scr-quiz .opts{gap:.4rem}
  .scr-quiz .opt{padding:.55rem .8rem}
  .scr-quiz .card{padding:.6rem .8rem;margin-top:.4rem}
  .scr-quiz .x{margin:.25rem 0 .4rem}
  .scr-quiz .src{padding-top:.3rem}
  .scr-quiz .beta{display:none}
  .scr-quiz .qbody.answered .meta,.scr-quiz .qbody.answered .qtrack{display:none}
  .scr-quiz .funrow{margin-top:.3rem}
  .scr-quiz .card-act{margin-top:.5rem}
  .scr-quiz .card-act .primary,.scr-quiz .card-act .ghost{padding:.5rem .9rem}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

{"id":"SIR-2-01","l":"sir","v":2,"q":["Who was with the Prophet {saw} in the cave during the Hijrah?","من كان مع النبي {saw} في الغار أثناء الهجرة؟"],"o":[["Abu Bakr","ʿUmar","ʿAli","ʿUthman"],["أبو بكر","عمر","علي","عثمان"]],"x":["The Quran calls him “the second of two, when they were in the cave,” and Abu Bakr {ra} himself described that moment.","قال تعالى: {Q:9:40:10-15}، وحدّث أبو بكر {ra} عن تلك اللحظة."],"s":[{"q":"9:40"},{"b":3653,"m":2381}]},
{"id":"SIR-2-02","l":"sir","v":2,"q":["Which battle, named in the Quran, was the first major victory of the Muslims?","ما المعركة المذكورة في القرآن التي كانت أول نصر كبير للمسلمين؟"],"o":[["Badr","Uhud","The Trench","Hunayn"],["بدر","أحد","الخندق","حنين"]],"x":["Allah says He gave them victory at Badr while they were weak.","قال تعالى: {Q:3:123:1-6}."],"s":[{"q":"3:123"}]},
{"id":"SIR-2-03","l":"sir","v":2,"q":["The Battle of the Trench is also known by what name?","بأيّ اسمٍ آخر تُعرف غزوة الخندق؟"],"o":[["Al-Ahzab","Tabuk","Muʾtah","Khaybar"],["الأحزاب","تبوك","مؤتة","خيبر"]],"x":["Al-Ahzab means “the Confederates,” and Surah 33 is named after them.","الأحزاب هم القبائل المتحالفة، وباسمهم سُمّيت السورة الثالثة والثلاثون."],"s":[{"q":"33:9-10"}]},
{"id":"SIR-2-04","l":"sir","v":2,"q":["Before the qiblah was changed to the Kaʿbah, which direction did the Muslims face in prayer?","إلى أي قبلةٍ كان المسلمون يصلّون قبل تحويلها إلى الكعبة؟"],"o":[["Bayt al-Maqdis (Jerusalem)","Madinah","Taʾif","Yemen"],["بيت المقدس","المدينة","الطائف","اليمن"]],"x":["They faced Bayt al-Maqdis for sixteen or seventeen months after the Hijrah, until the qiblah was changed.","صلّوا نحو بيت المقدس ستة عشر أو سبعة عشر شهراً بعد الهجرة، ثم حُوّلت القبلة."],"s":[{"b":40,"m":525,"ml":"muslim:525b"},{"q":"2:144"}]},
{"id":"SIR-2-05","l":"sir","v":2,"q":["The Night Journey took the Prophet {saw} from Al-Masjid al-Haram to which mosque?","أُسري بالنبي {saw} من المسجد الحرام إلى أي مسجد؟"],"o":[["Al-Masjid al-Aqsa","Masjid Quba","Al-Masjid an-Nabawi","Masjid al-Qiblatayn"],["المسجد الأقصى","مسجد قباء","المسجد النبوي","مسجد القبلتين"]],"x":["It is described in the opening verse of Surah Al-Israʾ.","ذُكر ذلك في مطلع سورة الإسراء."],"s":[{"q":"17:1"}]},
{"id":"SIR-2-06","l":"sir","v":2,"q":["What was the name of the Prophet’s {saw} mother?","ما اسم أم النبي {saw}؟"],"o":[["Aminah","Halimah","Fatimah","Khadijah"],["آمنة","حليمة","فاطمة","خديجة"]],"x":["Aminah bint Wahb passed away when he was a young child.","آمنة بنت وهب، وتوفيت وهو طفل صغير."],"s":[{"n":"seerah"}]},
{"id":"SIR-2-07","l":"sir","v":2,"q":["Which uncle of the Prophet {saw} was martyred at the Battle of Uhud?","أي أعمام النبي {saw} استُشهد في غزوة أحد؟"],"o":[["Hamzah","Abu Talib","Al-ʿAbbas","Abu Lahab"],["حمزة","أبو طالب","العباس","أبو لهب"]],"x":["Hamzah ibn ʿAbd al-Muttalib {ra} was among the martyrs of Uhud.","كان حمزة بن عبد المطلب {ra} من شهداء أحد."],"s":[{"n":"seerah"}]},
{"id":"SIR-2-08","l":"sir","v":2,"q":["After the first revelation, what did the Prophet {saw} say when he returned home trembling?","لمّا رجع النبي {saw} إلى بيته بعد أول الوحي يرجف فؤاده، ماذا قال؟"],"o":[["“Cover me! Cover me!”","“Bring me water!”","“Call Abu Bakr!”","“Leave me alone!”"],["«زملوني زملوني»","«اسقوني ماء»","«ادعوا أبا بكر»","«دعوني وحدي»"]],"x":["He went to Khadijah {raf} and said “Cover me!”, and they covered him until his fear left him.","دخل على خديجة {raf} فقال: «زَمِّلُونِي زَمِّلُونِي»، فزمّلوه حتى ذهب عنه الروع."],"s":[{"b":3}]},
{"id":"SIR-2-09","l":"sir","v":2,"q":["Khadijah {raf} took the Prophet {saw} to her cousin, who knew the earlier scriptures. Who was he?","انطلقت خديجة {raf} بالنبي {saw} إلى ابن عمها العالم بالكتب السابقة. مَن هو؟"],"o":[["Waraqah ibn Nawfal","Abu Talib","Zayd ibn Harithah","Abu Bakr"],["ورقة بن نوفل","أبو طالب","زيد بن حارثة","أبو بكر"]],"x":["She took him to Waraqah ibn Nawfal, her cousin, who had become a Christian and wrote from the Injil.","انطلقت به إلى «وَرَقَةَ بْنَ نَوْفَلِ بْنِ أَسَدِ بْنِ عَبْدِ الْعُزَّى ابْنَ عَمِّ خَدِيجَةَ»."],"s":[{"b":3}]},
{"id":"SIR-2-10","l":"sir","v":2,"q":["At the Battle of Hunayn, what did the Quran say made the Muslims overconfident?","في غزوة حنين، ما الذي قال القرآن إنه أعجب المسلمين؟"],"o":[["Their great numbers","Their weapons","Their earlier victories","Their horses"],["كثرتهم","سلاحهم","انتصاراتهم السابقة","خيلهم"]],"x":["Their great numbers pleased them, but availed them nothing.","قال تعالى: {Q:9:25:7-15}."],"s":[{"q":"9:25"}]},
{"id":"SIR-2-11","l":"sir","v":2,"q":["At Hudaybiyyah, under what did the believers pledge allegiance to the Prophet {saw}, earning Allah’s pleasure?","في الحديبية، تحت ماذا بايع المؤمنون النبيَّ {saw} فرضي الله عنهم؟"],"o":[["A tree","A tent","The walls of Makkah","A mountain"],["الشجرة","خيمة","أسوار مكة","جبل"]],"x":["Allah was pleased with the believers when they pledged allegiance under the tree.","قال تعالى: {Q:48:18:1-9}."],"s":[{"q":"48:18"}]},
{"id":"SIR-2-12","l":"sir","v":2,"q":["In the cave during the Hijrah, what did the Prophet {saw} say to his companion, as the Quran records?","في الغار أثناء الهجرة، ماذا قال النبي {saw} لصاحبه كما حكى القرآن؟"],"o":[["“Do not grieve; indeed Allah is with us.”","“Be patient; help is near.”","“We will leave at dawn.”","“Say nothing until night.”"],["«لا تحزن إن الله معنا»","«اصبر فإن النصر قريب»","«سنخرج عند الفجر»","«لا تتكلم حتى الليل»"]],"x":["Allah then sent down His tranquillity upon him.","قال تعالى: {Q:9:40:16-23}."],"s":[{"q":"9:40"}]},
{"id":"SIR-2-13","l":"sir","v":2,"q":["Before Badr, what did Allah send down from the sky to purify the believers?","قبل بدر، ماذا أنزل الله من السماء ليطهّر المؤمنين؟"],"o":[["Water (rain)","Manna","A table of food","Snow"],["ماءً","المنّ","مائدة","ثلجاً"]],"x":["Allah sent down water to purify them and to make their feet firm.","قال تعالى: {Q:8:11:6-12}."],"s":[{"q":"8:11"}]},
{"id":"SIR-2-14","l":"sir","v":2,"q":["Before Badr, what did Allah cover the believers with, as a reassurance from Him?","قبل بدر، بماذا غشّى الله المؤمنين أمنةً منه؟"],"o":[["Drowsiness","A cloud","Darkness","Dust"],["النعاس","غمامة","ظلمة","غبار"]],"x":["“When He covered you with drowsiness, as security from Him.”","قال تعالى: {Q:8:11:1-5}."],"s":[{"q":"8:11"}]},

{"id":"SIR-2-16","l":"sir","v":2,"q":["At Uhud, how many groups among the believers almost lost courage?","يوم أحد، كم طائفةً من المؤمنين همّت أن تفشل؟"],"o":[["Two","Three","One","Four"],["طائفتان","ثلاث","واحدة","أربع"]],"x":["Allah was their protector, and upon Allah the believers rely.","قال تعالى: {Q:3:122}."],"s":[{"q":"3:121-122"}]},

{"id":"SIR-2-19","l":"sir","v":2,"q":["In Surah At-Tawbah, when told to go forth in the cause of Allah, what did some cling heavily to?","في سورة التوبة، إذا قيل لبعضهم انفروا في سبيل الله، إلى أيّ شيءٍ اثّاقلوا؟"],"o":[["The earth","Their horses","Their money","Their homes"],["الأرض","خيولهم","أموالهم","بيوتهم"]],"x":["“…you cling heavily to the earth? Are you satisfied with the life of this world rather than the Hereafter?”","قال تعالى: {Q:9:38:1-15}."],"s":[{"q":"9:38"}]},

{"id":"SIR-3-01","l":"sir","v":3,"q":["What is the treaty made with Quraysh in 6 AH called?","ما اسم الصلح الذي عُقد مع قريش سنة 6 هـ؟"],"o":[["Hudaybiyyah","ʿAqabah","Taʾif","Tabuk"],["الحديبية","العقبة","الطائف","تبوك"]],"x":["Surah Al-Fath (The Victory) was revealed on the journey back from it.","نزلت سورة الفتح في طريق العودة منه."],"s":[{"n":"seerah"},{"q":"48:1"}]},
{"id":"SIR-3-02","l":"sir","v":3,"q":["Which mosque did the Prophet {saw} found first on reaching Madinah?","ما أول مسجد أسسه النبي {saw} عند وصوله إلى المدينة؟"],"o":[["Masjid Quba","Al-Masjid an-Nabawi","Masjid al-Qiblatayn","Masjid al-Jumuʿah"],["مسجد قباء","المسجد النبوي","مسجد القبلتين","مسجد الجمعة"]],"x":["He stayed at Quba on the outskirts of Madinah and founded its mosque before entering the city.","نزل بقباء في أطراف المدينة وأسس مسجدها قبل دخوله المدينة."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-03","l":"sir","v":3,"q":["In which year of the Hijrah was Makkah conquered?","في أي سنة هجرية كان فتح مكة؟"],"o":[["8 AH","2 AH","5 AH","10 AH"],["8 هـ","2 هـ","5 هـ","10 هـ"]],"x":["Makkah was opened in Ramadan of 8 AH.","كان فتح مكة في رمضان سنة 8 هـ."],"s":[{"n":"seerah"}]},
{"id":"SIR-3-04","l":"sir","v":3,"q":["In which year of the Hijrah was the Farewell Pilgrimage?","في أي سنة هجرية كانت حجة الوداع؟"],"o":[["10 AH","8 AH","6 AH","9 AH"],["10 هـ","8 هـ","6 هـ","9 هـ"]],"x":["It was his only Hajj after the Hijrah, a few months before his passing in 11 AH.","هي حجته الوحيدة بعد الهجرة، وكانت قبل وفاته سنة 11 هـ بأشهر."],"s":[{"n":"seerah"}]},

{"id":"HAD-2-21","l":"had","v":2,"q":["If something befalls you, do not say “if only I had…”, because “if” opens the door to what?","إن أصابك شيء فلا تقل «لَوْ أَنِّي فَعَلْتُ»، فإن «لَوْ» تفتح ماذا؟"],"o":[["The work of Satan","Wisdom","Hope","Forgiveness"],["عمل الشيطان","الحكمة","الأمل","المغفرة"]],"x":["Sahih Muslim 2664.","«فَإِنَّ لَوْ تَفْتَحُ عَمَلَ الشَّيْطَانِ»."],"s":[{"m":2664}]},
{"id":"HAD-2-22","l":"had","v":2,"q":["In the hadith qudsi, if the servant draws near to Allah by a hand’s span, Allah draws near to him by…","في الحديث القدسي: إن تقرّب العبد إلى الله شبراً، تقرّب الله إليه..."],"o":[["an arm’s length","a mile","a step","a day"],["ذراعا","ميلا","خطوة","يوما"]],"x":["And if he comes walking, Allah comes to him running.","«وَإِنْ تَقَرَّبَ إِلَىَّ بِشِبْرٍ تَقَرَّبْتُ إِلَيْهِ ذِرَاعًا»."],"s":[{"b":7405}]},
{"id":"HAD-2-23","l":"had","v":2,"q":["In the hadith qudsi, what is the most beloved way for a servant to draw near to Allah?","في الحديث القدسي، ما أحبّ ما يتقرّب به العبد إلى الله؟"],"o":[["What Allah has made obligatory","Voluntary fasting only","Travelling to Makkah","Giving gifts"],["ما افترضه الله عليه","صيام التطوع فقط","السفر إلى مكة","تقديم الهدايا"]],"x":["Then he keeps drawing near through voluntary deeds until Allah loves him.","«وَمَا تَقَرَّبَ إِلَىَّ عَبْدِي بِشَىْءٍ أَحَبَّ إِلَىَّ مِمَّا افْتَرَضْتُ عَلَيْهِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-01","l":"had","v":3,"q":["In the Hadith of Jibril, the levels of the religion are Islam, Iman and…","ذكر حديث جبريل مراتب الدين: الإسلام والإيمان و... فما الثالثة؟"],"o":[["Ihsan","Taqwa","Sabr","Jihad"],["الإحسان","التقوى","الصبر","الجهاد"]],"x":["Ihsan is to worship Allah as though you see Him, for though you do not see Him, He sees you. Narrated by ʿUmar {ra}.","«أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ». رواه عمر {ra}."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-02","l":"had","v":3,"q":["Complete: “The religion is…”","أكمل: «الدِّينُ ...»"],"o":[["sincere counsel (nasihah)","knowledge","patience","prayer"],["النصيحة","العلم","الصبر","الصلاة"]],"x":["When asked “to whom?”, he said: to Allah, His Book, His Messenger, the leaders of the Muslims and their common people.","قيل: لمن؟ قال: «لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ»."],"s":[{"m":55,"ml":"bulugh/16/96"}]},
{"id":"HAD-3-03","l":"had","v":3,"q":["Complete: “Purity is ___ of faith.”","أكمل: «الطُّهُورُ ... الإِيمَانِ»"],"o":[["half","a third","the key","the sign"],["شطر","ثلث","مفتاح","علامة"]],"x":["The same hadith goes on to the virtues of dhikr, prayer, charity and patience.","ويكمل الحديث بفضل الذكر والصلاة والصدقة والصبر."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-3-04","l":"had","v":3,"q":["Which deeds are most beloved to Allah?","ما أحب الأعمال إلى الله؟"],"o":[["The most consistent, even if small","The hardest ones","Those seen by many","Large deeds done once"],["أدومها وإن قلّ","أشقّها","ما يراه الناس","الكثير مرة واحدة"]],"x":["He {saw} said: “The most beloved of deeds to Allah are the most constant, even if little.”","قال {saw}: «أَحَبَّ الأَعْمَالِ أَدْوَمُهَا إِلَى اللَّهِ، وَإِنْ قَلَّ»."],"s":[{"b":6464,"m":783}]},
{"id":"HAD-3-05","l":"had","v":3,"q":["Which two phrases did the Prophet {saw} describe as “beloved to the Most Merciful, light on the tongue, heavy on the Scale”?","ما الكلمتان اللتان قال فيهما النبي {saw}: «حَبِيبَتَانِ إِلَى الرَّحْمَنِ، خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ»؟"],"o":[["SubhanAllahi wa bihamdihi, SubhanAllahil-ʿAzim","Alhamdulillah, Allahu Akbar","La ilaha illallah, Astaghfirullah","Bismillah, In shaʾ Allah"],["سبحان الله وبحمده، سبحان الله العظيم","الحمد لله، الله أكبر","لا إله إلا الله، أستغفر الله","بسم الله، إن شاء الله"]],"x":["This is the final hadith in Sahih al-Bukhari.","وهو آخر حديث في صحيح البخاري."],"s":[{"b":7563,"m":2694}]},
{"id":"HAD-3-06","l":"had","v":3,"q":["“The upper hand is better than the lower hand.” Which is the upper hand?","«الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى». ما اليد العليا؟"],"o":[["The one that gives","The one that asks","The ruler’s hand","The strongest hand"],["المنفقة","السائلة","يد الحاكم","اليد الأقوى"]],"x":["He said it from the minbar while speaking about charity and refraining from begging.","قالها على المنبر وهو يذكر الصدقة والتعفف عن المسألة."],"s":[{"b":1429,"m":1033,"ml":"muslim:1033"}]},
{"id":"HAD-3-07","l":"had","v":3,"q":["When Jibril asked about the Hour, what did the Prophet {saw} answer?","لمّا سأل جبريل عن الساعة، بماذا أجاب النبي {saw}؟"],"o":[["“The one asked knows no more than the one asking.”","“It will come in a hundred years.”","“It will come on a Friday.”","“Only the angels know.”"],["«ما المسئول عنها بأعلم من السائل»","«تأتي بعد مئة سنة»","«تقوم يوم الجمعة»","«لا يعلمها إلا الملائكة»"]],"x":["Knowledge of the Hour belongs to Allah alone.","قال {saw}: «مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-08","l":"had","v":3,"q":["Among the signs of the Hour in the Hadith of Jibril, the barefoot, destitute shepherds compete in what?","من أمارات الساعة في حديث جبريل أن الحفاة العراة العالة رعاء الشاء يتطاولون في...؟"],"o":[["Constructing tall buildings","Raising horses","Digging wells","Collecting gold"],["البنيان","اقتناء الخيل","حفر الآبار","جمع الذهب"]],"x":["“…and that you see the barefoot, naked, destitute shepherds competing in constructing tall buildings.”","قال {saw}: «وَأَنْ تَرَى الْحُفَاةَ الْعُرَاةَ الْعَالَةَ رِعَاءَ الشَّاءِ يَتَطَاوَلُونَ فِي الْبُنْيَانِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-3-09","l":"had","v":3,"q":["When the qiblah changed, a man passed by people who were praying. What position were they in?","لمّا حُوّلت القبلة مرّ رجلٌ على قومٍ يصلّون، فعلى أيّ حالٍ كانوا؟"],"o":[["Bowing (rukuʿ)","Prostrating","Sitting","Standing to recite"],["راكعون","ساجدون","جالسون","قائمون يقرؤون"]],"x":["They turned towards the Kaʿbah in the middle of their prayer.","«فَمَرَّ عَلَى أَهْلِ مَسْجِدٍ، وَهُمْ رَاكِعُونَ»، «فَدَارُوا كَمَا هُمْ قِبَلَ الْبَيْتِ»."],"s":[{"b":40}]},
{"id":"HAD-3-10","l":"had","v":3,"q":["A man heard someone repeating only “Say, He is Allah, the One” all night. What did he think of it?","سمع رجلٌ رجلاً يردّد «قُلْ هُوَ اللَّهُ أَحَدٌ» الليل كله، فماذا ظنّ فيها؟"],"o":[["That it was too little","That it was not allowed","That it was the best prayer","That it was a new practice"],["أنها قليلة","أنها لا تجوز","أنها أفضل الصلاة","أنها أمر محدث"]],"x":["He thought it was little, so the Prophet {saw} said it equals a third of the Quran.","«وَكَأَنَّ الرَّجُلَ يَتَقَالُّهَا»، فقال {saw}: «إِنَّهَا لَتَعْدِلُ ثُلُثَ الْقُرْآنِ»."],"s":[{"b":5013}]},
{"id":"HAD-3-11","l":"had","v":3,"q":["In “The religion is sincere counsel”, when asked “To whom?”, whom did the Prophet {saw} mention first?","في حديث «الدِّينُ النَّصِيحَةُ»، لمّا قيل: لمن؟ مَن ذكر النبي {saw} أولاً؟"],"o":[["Allah","His Messenger","The leaders of the Muslims","The common people"],["لله","لرسوله","لأئمة المسلمين","لعامتهم"]],"x":["To Allah, His Book, His Messenger, the leaders of the Muslims and their common people.","قال {saw}: «لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ»."],"s":[{"m":55,"ml":"bulugh/16/96"}]},
{"id":"HAD-3-12","l":"had","v":3,"q":["“In the body there is a piece of flesh; if it is sound, the whole body is sound.” What is it?","«أَلاَ وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ». ما هي؟"],"o":[["The heart","The mind","The tongue","The stomach"],["القلب","العقل","اللسان","المعدة"]],"x":["Sahih al-Bukhari 52.","«أَلاَ وَهِيَ الْقَلْبُ»."],"s":[{"b":52}]},
{"id":"HAD-3-13","l":"had","v":3,"q":["Ibn ʿUmar {ra} advised: “When evening comes, do not wait for…”","قال ابن عمر {ra}: «إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ ...»"],"o":[["the morning","your friends","the rain","your reward"],["الصباح","أصحابك","المطر","الأجر"]],"x":["And when morning comes, do not wait for the evening.","«إِذَا أَمْسَيْتَ فَلاَ تَنْتَظِرِ الصَّبَاحَ، وَإِذَا أَصْبَحْتَ فَلاَ تَنْتَظِرِ الْمَسَاءَ»."],"s":[{"b":6416}]},
{"id":"HAD-3-14","l":"had","v":3,"q":["Ibn ʿUmar {ra} advised: “Take from your health for your…”","قال ابن عمر {ra}: «وَخُذْ مِنْ صِحَّتِكَ لِ ...»"],"o":[["sickness","old age","wealth","travels"],["مرضك","كبرك","مالك","أسفارك"]],"x":["And from your life for your death.","«وَخُذْ مِنْ صِحَّتِكَ لِمَرَضِكَ، وَمِنْ حَيَاتِكَ لِمَوْتِكَ»."],"s":[{"b":6416}]},
{"id":"HAD-3-15","l":"had","v":3,"q":["In the hadith qudsi, what does Allah say about whoever shows enmity to a close friend (wali) of His?","في الحديث القدسي، ماذا قال الله فيمن عادى له وليّاً؟"],"o":[["I have declared war on him","I will forgive him","I will ignore him","I will test him"],["آذنته بالحرب","غفرت له","تركته","ابتليته"]],"x":["Sahih al-Bukhari 6502.","«مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-16","l":"had","v":3,"q":["When Allah loves His servant, He becomes his hearing with which he hears, and his…","إذا أحبّ الله عبده كان سمعه الذي يسمع به و..."],"o":[["sight with which he sees","wealth with which he buys","voice with which he sings","sleep with which he rests"],["بصره الذي يبصر به","ماله الذي يشتري به","صوته الذي يغني به","نومه الذي يرتاح به"]],"x":["Sahih al-Bukhari 6502.","«كُنْتُ سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ»."],"s":[{"b":6502}]},
{"id":"HAD-3-17","l":"had","v":3,"q":["In the hadith qudsi, if the servant remembers Allah in a gathering, where does Allah remember him?","في الحديث القدسي، إن ذكر العبدُ اللهَ في ملأ، أين يذكره الله؟"],"o":[["In a gathering better than it","In his dream","In his home","Nowhere"],["في ملأ خير منهم","في منامه","في بيته","لا يذكره"]],"x":["Sahih al-Bukhari 7405.","«وَإِنْ ذَكَرَنِي فِي مَلأٍ ذَكَرْتُهُ فِي مَلأٍ خَيْرٍ مِنْهُمْ»."],"s":[{"b":7405}]},
{"id":"HAD-3-18","l":"had","v":3,"q":["In Sahih al-Bukhari 2442, whoever covers a Muslim, Allah will cover him when?","في صحيح البخاري 2442، من ستر مسلماً ستره الله متى؟"],"o":[["On the Day of Resurrection","In this world only","In the grave","During Ramadan"],["يوم القيامة","في الدنيا فقط","في القبر","في رمضان"]],"x":["Sahih al-Bukhari 2442.","«وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ»."],"s":[{"b":2442}]},
{"id":"HAD-3-19","l":"had","v":3,"q":["When something befalls you, what should you say instead of “if only”?","إن أصابك شيء فماذا تقول بدل «لَوْ»؟"],"o":[["Allah has decreed, and what He wills He does","I will do better next time","It was bad luck","Someone else is to blame"],["قدر الله وما شاء فعل","سأفعل أفضل في المرة القادمة","إنه سوء حظ","غيري هو المسؤول"]],"x":["Sahih Muslim 2664.","«قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ»."],"s":[{"m":2664}]},
{"id":"HAD-3-20","l":"had","v":3,"q":["A man keeps telling the truth until he is recorded with Allah as what?","لا يزال الرجل يصدق حتى يُكتب عند الله..."],"o":[["A truthful one (siddiq)","A scholar","A king","A martyr"],["صديقا","عالما","ملكا","شهيدا"]],"x":["Sahih al-Bukhari 6094.","«وَإِنَّ الرَّجُلَ لَيَصْدُقُ حَتَّى يَكُونَ صِدِّيقًا»."],"s":[{"b":6094}]},
{"id":"HAD-3-21","l":"had","v":3,"q":["In Sahih al-Bukhari 71, after “Whoever Allah wants good for…”, the Prophet {saw} said: “I am only a distributor, and Allah is the one who…”","في صحيح البخاري 71، قال {saw}: «وَإِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ ...»"],"o":[["gives","judges","forgives","hears"],["يعطي","يحكم","يغفر","يسمع"]],"x":["Sahih al-Bukhari 71.","«وَإِنَّمَا أَنَا قَاسِمٌ وَاللَّهُ يُعْطِي»."],"s":[{"b":71}]},
{"id":"HAD-3-22","l":"had","v":3,"q":["“Every king has a protected sanctuary.” What is Allah’s sanctuary on His earth?","«أَلاَ وَإِنَّ لِكُلِّ مَلِكٍ حِمًى». ما حمى الله في أرضه؟"],"o":[["What He has forbidden","The mosques","The mountains","The seas"],["محارمه","المساجد","الجبال","البحار"]],"x":["Sahih al-Bukhari 52.","«أَلاَ إِنَّ حِمَى اللَّهِ فِي أَرْضِهِ مَحَارِمُهُ»."],"s":[{"b":52}]},
{"id":"HAD-4-02","l":"had","v":4,"q":["In the Hadith of Jibril, how many pillars of Iman are named?","في حديث جبريل، كم عدد أركان الإيمان المذكورة؟"],"o":[["Six","Five","Four","Seven"],["ستة","خمسة","أربعة","سبعة"]],"x":["Belief in Allah, His angels, His Books, His messengers, the Last Day, and qadar, its good and its bad.","الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر، والقدر خيره وشره."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-06","l":"had","v":4,"q":["In the cave, Abu Bakr {ra} feared the pursuers would see them. What did the Prophet {saw} say to him?","في الغار خشي أبو بكر {ra} أن يراهما المشركون، فماذا قال له النبي {saw}؟"],"o":[["“What do you think of two, the third of whom is Allah?”","“Let us leave before dawn.”","“Wait until the guide arrives.”","“Return to Makkah alone.”"],["«ما ظنك يا أبا بكر باثنين الله ثالثهما»","«لنخرج قبل الفجر»","«انتظر حتى يأتي الدليل»","«ارجع إلى مكة وحدك»"]],"x":["Narrated by Abu Bakr {ra} himself.","رواه أبو بكر {ra} نفسه."],"s":[{"b":3653,"m":2381}]},
{"id":"HAD-4-07","l":"had","v":4,"q":["Complete: “No one humbles himself for Allah except that Allah…”","أكمل: «وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلاَّ ...»"],"o":[["raises him","makes him rich","makes people love him","forgives him"],["رفعه الله","أغناه الله","حبّبه إلى الناس","غفر له"]],"x":["It is the end of the hadith that begins “Charity never decreases wealth.”","هو ختام الحديث الذي أوله: «مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ»."],"s":[{"m":2588,"ml":"muslim:2588"}]},
{"id":"HAD-4-08","l":"had","v":4,"q":["In the hadith “Purity is half of faith”, what is prayer described as?","في حديث «الطُّهُورُ شَطْرُ الإِيمَانِ»، بماذا وُصفت الصلاة؟"],"o":[["Light","Proof","Brightness","A shield"],["نور","برهان","ضياء","جُنّة"]],"x":["“Prayer is light, charity is proof, and patience is brightness.”","«وَالصَّلاَةُ نُورٌ وَالصَّدَقَةُ بُرْهَانٌ وَالصَّبْرُ ضِيَاءٌ»."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-4-09","l":"had","v":4,"q":["In the hadith listing everyday good deeds, what is every step taken towards the prayer described as?","في الحديث الذي عدّد أعمال الخير اليومية، بماذا وُصفت كل خطوةٍ يمشيها المرء إلى الصلاة؟"],"o":[["Charity","Light","A shield","A key"],["صدقة","نور","جُنّة","مفتاح"]],"x":["The same hadith counts a good word and removing harm from the road as charity too.","وعدّ الحديث نفسه الكلمة الطيبة وإماطة الأذى عن الطريق صدقة."],"s":[{"b":2989,"m":1009,"ml":"muslim:1009"}]},
{"id":"HAD-4-10","l":"had","v":4,"q":["Complete: “Whoever makes things easy for one in difficulty, Allah will make things easy for him…”","أكمل: «ومن يسّر على معسرٍ يسّر الله عليه...»"],"o":[["in this world and the Hereafter","in his wealth","on the Day of Judgement only","in his family"],["في الدنيا والآخرة","في ماله","يوم القيامة فقط","في أهله"]],"x":["From the same hadith as “Allah helps the servant as long as he helps his brother”.","قال {saw}: «وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالآخِرَةِ»."],"s":[{"m":2699}]},
{"id":"HAD-4-11","l":"had","v":4,"q":["Complete: “Whoever is held back by his deeds will not be hastened forward by his…”","أكمل: «ومن بطّأ به عمله لم يُسرع به...»"],"o":[["lineage","wealth","knowledge","friends"],["نسبه","ماله","علمه","أصحابه"]],"x":["Nobility of family does not make up for a lack of good deeds.","قال {saw}: «وَمَنْ بَطَّأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ»."],"s":[{"m":2699}]},
{"id":"HAD-4-12","l":"had","v":4,"q":["When people gather in a house of Allah to recite and study His Book, what descends upon them first, as the hadith lists?","إذا اجتمع قومٌ في بيتٍ من بيوت الله يتلون كتاب الله ويتدارسونه، فما أول ما ذكر الحديث أنه ينزل عليهم؟"],"o":[["Tranquillity (sakinah)","Rain","Wealth","Angels with gifts"],["السكينة","المطر","الرزق","ملائكة بالهدايا"]],"x":["Tranquillity descends, mercy covers them, the angels surround them, and Allah mentions them among those with Him.","قال {saw}: «وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ إِلاَّ نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ»."],"s":[{"m":2699}]},
{"id":"HAD-4-13","l":"had","v":4,"q":["Complete the Prophet’s {saw} words: “Be moderate and draw near, and know that…”","أكمل قوله {saw}: «سدّدوا وقاربوا، واعلموا أن...»"],"o":[["no one’s deeds alone will admit him to Paradise","every deed is written twice","the reward is doubled on Fridays","the night prayer is best"],["لن يدخل أحدكم عمله الجنة","كل عمل يُكتب مرتين","الأجر يُضاعف يوم الجمعة","صلاة الليل أفضل الأعمال"]],"x":["Entry to Paradise is by Allah’s mercy; the same hadith adds that the most beloved deeds are the most constant, even if little.","قال {saw}: «سَدِّدُوا وَقَارِبُوا، وَاعْلَمُوا أَنْ لَنْ يُدْخِلَ أَحَدَكُمْ عَمَلُهُ الْجَنَّةَ»."],"s":[{"b":6464}]},
{"id":"HAD-4-14","l":"had","v":4,"q":["In the Hadith of Jibril, how is the stranger who came described?","في حديث جبريل، كيف وُصف الرجل الذي طلع عليهم؟"],"o":[["Very white clothes and very black hair","Dusty from a long journey","Wearing armour","An old man with a white beard"],["شديد بياض الثياب شديد سواد الشعر","عليه غبار السفر","يلبس درعاً","شيخ أبيض اللحية"]],"x":["No sign of travel was seen on him, and none of them knew him.","«شَدِيدُ بَيَاضِ الثِّيَابِ شَدِيدُ سَوَادِ الشَّعَرِ لاَ يُرَى عَلَيْهِ أَثَرُ السَّفَرِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-15","l":"had","v":4,"q":["In the Hadith of Jibril, how did the stranger sit before the Prophet {saw}?","في حديث جبريل، كيف جلس الرجل أمام النبي {saw}؟"],"o":[["Knees to his knees, palms on his thighs","Cross-legged at a distance","Standing, leaning on a staff","Behind the Companions"],["أسند ركبتيه إلى ركبتيه ووضع كفيه على فخذيه","متربّعاً بعيداً عنه","واقفاً متكئاً على عصا","خلف الصحابة"]],"x":["He sat close, as a student sits before a teacher.","«فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},
{"id":"HAD-4-16","l":"had","v":4,"q":["When the Prophet {saw} told Ibn ʿUmar “Be in this world as though you were a stranger”, what did he take hold of?","حين قال النبي {saw} لابن عمر «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ»، بماذا أخذ؟"],"o":[["His shoulder","His hand","His cloak","His staff"],["بمنكبه","بيده","بردائه","بعصاه"]],"x":["Sahih al-Bukhari 6416.","«أَخَذَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِمَنْكِبِي»."],"s":[{"b":6416}]},
{"id":"HAD-4-17","l":"had","v":4,"q":["In the hadith qudsi, when Allah loves His servant, He becomes his hand with which he strikes and his foot with which he…","في الحديث القدسي: إذا أحبّ الله عبده كان يده التي يبطش بها ورجله التي..."],"o":[["walks","stands","runs","travels"],["يمشي بها","يقف بها","يجري بها","يسافر بها"]],"x":["Sahih al-Bukhari 6502.","«وَيَدَهُ الَّتِي يَبْطُشُ بِهَا وَرِجْلَهُ الَّتِي يَمْشِي بِهَا»."],"s":[{"b":6502}]},
{"id":"HAD-4-18","l":"had","v":4,"q":["In the hadith qudsi, what does Allah say if the servant He loves asks Him?","في الحديث القدسي، ماذا قال الله إن سأله عبده الذي أحبّه؟"],"o":[["I will surely give him","I will test him first","I will delay it","I will ask the angels"],["لأعطينه","لأبتلينه أولا","لأؤخرنه","لأسألن الملائكة"]],"x":["And if he seeks refuge in Me, I will surely grant him refuge.","«وَإِنْ سَأَلَنِي لأُعْطِيَنَّهُ، وَلَئِنِ اسْتَعَاذَنِي لأُعِيذَنَّهُ»."],"s":[{"b":6502}]},
{"id":"HAD-4-19","l":"had","v":4,"q":["In the hadith qudsi, if the servant comes to Allah walking, how does Allah come to him?","في الحديث القدسي، إن أتى العبد إلى الله يمشي، كيف يأتيه الله؟"],"o":[["Running","Walking","Slowly","Not at all"],["هرولة","مشيا","ببطء","لا يأتيه"]],"x":["Sahih al-Bukhari 7405.","«وَإِنْ أَتَانِي يَمْشِي أَتَيْتُهُ هَرْوَلَةً»."],"s":[{"b":7405}]},
{"id":"HAD-4-20","l":"had","v":4,"q":["Whoever falls into doubtful matters is like a shepherd grazing around a sanctuary, about to…","من وقع في الشبهات كراعٍ يرعى حول الحمى يوشك أن..."],"o":[["fall into it","leave it","guard it","sell it"],["يواقعه","يتركه","يحرسه","يبيعه"]],"x":["Sahih al-Bukhari 52.","«كَرَاعٍ يَرْعَى حَوْلَ الْحِمَى، يُوشِكُ أَنْ يُوَاقِعَهُ»."],"s":[{"b":52}]},
{"id":"HAD-4-21","l":"had","v":4,"q":["In Sahih al-Bukhari 2442, whoever relieves a Muslim of a hardship, Allah will relieve him of a hardship of…","في صحيح البخاري 2442، من فرّج عن مسلمٍ كربة فرّج الله عنه كربةً من..."],"o":[["the Day of Resurrection","this world only","his family","his wealth"],["كربات يوم القيامة","كرب الدنيا فقط","كرب أهله","كرب ماله"]],"x":["Sahih al-Bukhari 2442.","«وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ»."],"s":[{"b":2442}]},
{"id":"HAD-4-22","l":"had","v":4,"q":["Complete the advice: “Be keen on what…”","أكمل: «احْرِصْ عَلَى مَا ...»"],"o":[["benefits you","pleases people","is easy","is popular"],["ينفعك","يرضي الناس","يسهل عليك","يشتهر"]],"x":["Then: seek help from Allah and do not give up.","«احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجِزْ»."],"s":[{"m":2664}]},
{"id":"HAD-4-23","l":"had","v":4,"q":["After “Be keen on what benefits you and seek help from Allah”, what did the Prophet {saw} say?","بعد «احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ»، ماذا قال النبي {saw}؟"],"o":[["And do not give up (la taʿjiz)","And rest","And wait","And stay silent"],["ولا تعجز","واسترح","وانتظر","واسكت"]],"x":["Sahih Muslim 2664.","«وَاسْتَعِنْ بِاللَّهِ وَلاَ تَعْجِزْ»."],"s":[{"m":2664}]},

{"id":"HAD-4-25","l":"had","v":4,"q":["The believer’s affair is all good. For whom else is this true?","أمر المؤمن كله خير. لمن غيره يكون ذلك؟"],"o":[["For no one except the believer","For every person","For the wealthy","For the scholars"],["ليس ذاك لأحد إلا للمؤمن","لكل إنسان","للأغنياء","للعلماء"]],"x":["Sahih Muslim 2999.","«وَلَيْسَ ذَاكَ لأَحَدٍ إِلاَّ لِلْمُؤْمِنِ»."],"s":[{"m":2999,"ml":"muslim:2999"}]},
{"id":"HAD-4-26","l":"had","v":4,"q":["Among the three things that continue after death is knowledge that is…","من الثلاثة التي لا ينقطع أجرها بعد الموت: علمٌ..."],"o":[["benefited from","written in books only","kept secret","taught once"],["ينتفع به","مكتوب في الكتب فقط","محفوظ في السر","علم مرة"]],"x":["Sahih Muslim 1631.","«أَوْ عِلْمٍ يُنْتَفَعُ بِهِ»."],"s":[{"m":1631}]},
{"id":"HAD-5-01","l":"had","v":5,"q":["Which Companion narrated “Actions are only by intentions”?","من الصحابي الذي روى «إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ»؟"],"o":[["ʿUmar ibn al-Khattab","Abu Hurayrah","ʿAʾishah","Anas ibn Malik"],["عمر بن الخطاب","أبو هريرة","عائشة","أنس بن مالك"]],"x":["Imam al-Bukhari placed this hadith first in his Sahih.","جعله الإمام البخاري أول حديث في صحيحه."],"s":[{"b":1,"m":1907}]},
{"id":"HAD-5-02","l":"had","v":5,"q":["Which Companion narrated “Do not become angry”?","من الصحابي الذي روى حديث «لاَ تَغْضَبْ»؟"],"o":[["Abu Hurayrah","ʿUmar ibn al-Khattab","Anas ibn Malik","Ibn ʿAbbas"],["أبو هريرة","عمر بن الخطاب","أنس بن مالك","ابن عباس"]],"x":["Abu Hurayrah {ra} was the most prolific narrator of hadith among the Companions.","أبو هريرة {ra} أكثر الصحابة روايةً للحديث."],"s":[{"b":6116}]},
{"id":"HAD-5-03","l":"had","v":5,"q":["Which Companion narrated “The religion is sincere counsel”?","من الصحابي الذي روى حديث «الدِّينُ النَّصِيحَةُ»؟"],"o":[["Tamim ad-Dari","Abu Bakr","Muʿadh ibn Jabal","Salman al-Farisi"],["تميم الداري","أبو بكر","معاذ بن جبل","سلمان الفارسي"]],"x":["It is one of the hadith gathered in Imam an-Nawawi’s Forty Hadith.","وهو من الأحاديث التي جمعها الإمام النووي في الأربعين."],"s":[{"m":55,"ml":"bulugh/16/96"}]},
{"id":"HAD-5-04","l":"had","v":5,"q":["Which Companion narrated “Purity is half of faith”?","من الصحابي الذي روى حديث «الطُّهُورُ شَطْرُ الإِيمَانِ»؟"],"o":[["Abu Malik al-Ashʿari","Abu Dharr","Anas ibn Malik","Jabir ibn ʿAbdullah"],["أبو مالك الأشعري","أبو ذر","أنس بن مالك","جابر بن عبد الله"]],"x":["Imam Muslim opens his Book of Purification with this hadith.","افتتح الإمام مسلم به كتاب الطهارة في صحيحه."],"s":[{"m":223,"ml":"muslim:223"}]},
{"id":"HAD-5-05","l":"had","v":5,"q":["Which Companion narrated “None of you truly believes until he loves for his brother what he loves for himself”?","من الصحابي الذي روى «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»؟"],"o":[["Anas ibn Malik","Abu Hurayrah","Ibn ʿUmar","Jabir ibn ʿAbdullah"],["أنس بن مالك","أبو هريرة","ابن عمر","جابر بن عبد الله"]],"x":["Narrated by Anas {ra}, who served the Prophet {saw} for years.","رواه أنس {ra} خادم رسول الله {saw}."],"s":[{"b":13,"m":45}]},
{"id":"HAD-5-06","l":"had","v":5,"q":["Which Companion narrated “Make things easy and do not make them hard”?","من الصحابي الذي روى «يسّروا ولا تعسّروا»؟"],"o":[["Anas ibn Malik","ʿAʾishah","Muʿadh ibn Jabal","Abu Musa al-Ashʿari"],["أنس بن مالك","عائشة","معاذ بن جبل","أبو موسى الأشعري"]],"x":["Sahih al-Bukhari 69 is narrated by Anas {ra}.","رواه البخاري برقم 69 عن أنس {ra}."],"s":[{"b":69}]},
{"id":"HAD-5-07","l":"had","v":5,"q":["Which Companion narrated “The Muslim is the one from whose tongue and hand the Muslims are safe”?","من الصحابي الذي روى «المسلم من سلم المسلمون من لسانه ويده»؟"],"o":[["ʿAbdullah ibn ʿAmr","ʿAbdullah ibn ʿUmar","Abu Hurayrah","Anas ibn Malik"],["عبد الله بن عمرو","عبد الله بن عمر","أبو هريرة","أنس بن مالك"]],"x":["Sahih al-Bukhari 10 is narrated by ʿAbdullah ibn ʿAmr {ra}.","رواه البخاري برقم 10 عن عبد الله بن عمرو {ra}."],"s":[{"b":10}]},
{"id":"HAD-5-08","l":"had","v":5,"q":["Which Companion narrated “The upper hand is better than the lower hand” in Sahih al-Bukhari 1429?","من الصحابي الذي روى «اليد العليا خير من اليد السفلى» في صحيح البخاري برقم 1429؟"],"o":[["ʿAbdullah ibn ʿUmar","ʿAbdullah ibn ʿAmr","Abu Saʿid al-Khudri","Hakim ibn Hizam"],["عبد الله بن عمر","عبد الله بن عمرو","أبو سعيد الخدري","حكيم بن حزام"]],"x":["Ibn ʿUmar {ra} narrated it: the upper hand is the one that spends, the lower is the one that asks.","رواه ابن عمر {ra}: «فَالْيَدُ الْعُلْيَا هِيَ الْمُنْفِقَةُ، وَالسُّفْلَى هِيَ السَّائِلَةُ»."],"s":[{"b":1429}]},

{"id":"HAD-5-10","l":"had","v":5,"q":["Who narrated the hadith describing how revelation began, Sahih al-Bukhari 3?","مَن روى حديث بدء الوحي في صحيح البخاري برقم 3؟"],"o":[["ʿAʾishah","Khadijah","Ibn ʿAbbas","Abu Bakr"],["عائشة","خديجة","ابن عباس","أبو بكر"]],"x":["Narrated by ʿAʾishah {raf}, Mother of the Believers.","روته عائشة أم المؤمنين {raf}."],"s":[{"b":3}]},
{"id":"HAD-5-11","l":"had","v":5,"q":["In Sahih Muslim’s narration of the Hadith of Jibril, who is named as the first to speak about qadar in Basra?","في رواية مسلم لحديث جبريل، مَن أول من قال في القدر بالبصرة؟"],"o":[["Maʿbad al-Juhani","Yahya ibn Yaʿmar","Humayd ibn ʿAbd ar-Rahman","Al-Hasan al-Basri"],["معبد الجهني","يحيى بن يعمر","حميد بن عبد الرحمن","الحسن البصري"]],"x":["Yahya ibn Yaʿmar begins the narration by mentioning him, then relates the hadith from Ibn ʿUmar, from ʿUmar.","«كَانَ أَوَّلَ مَنْ قَالَ فِي الْقَدَرِ بِالْبَصْرَةِ مَعْبَدٌ الْجُهَنِيُّ»."],"s":[{"m":8,"ml":"nawawi40/2"}]},

{"id":"HAD-5-13","l":"had","v":5,"q":["Which Companion narrated “Whoever Allah wants good for, He gives him understanding of the religion” in Sahih al-Bukhari 71?","مَن الصحابي الذي روى «مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ» في صحيح البخاري 71؟"],"o":[["Muʿawiyah","Abu Hurayrah","Ibn Masʿud","Jabir"],["معاوية","أبو هريرة","ابن مسعود","جابر"]],"x":["He narrated it in a sermon.","«سَمِعْتُ مُعَاوِيَةَ، خَطِيبًا يَقُولُ»."],"s":[{"b":71}]},

const QT = {"1:1": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "1:2": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "1:3": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "1:4": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "1:5": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "1:6": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "1:7": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "2:1": "الٓمٓ", "2:2": "ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ فِيهِ هُدًى لِّلْمُتَّقِينَ", "2:29": "هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَٰوَٰتٍ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ", "2:30": "وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌ فِى ٱلْأَرْضِ خَلِيفَةً قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ", "2:31": "وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى ٱلْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِى بِأَسْمَآءِ هَٰٓؤُلَآءِ إِن كُنتُمْ صَٰدِقِينَ", "2:43": "وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَٱرْكَعُوا۟ مَعَ ٱلرَّٰكِعِينَ", "2:45": "وَٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلْخَٰشِعِينَ", "2:60": "وَإِذِ ٱسْتَسْقَىٰ مُوسَىٰ لِقَوْمِهِۦ فَقُلْنَا ٱضْرِب بِّعَصَاكَ ٱلْحَجَرَ فَٱنفَجَرَتْ مِنْهُ ٱثْنَتَا عَشْرَةَ عَيْنًا قَدْ عَلِمَ كُلُّ أُنَاسٍ مَّشْرَبَهُمْ كُلُوا۟ وَٱشْرَبُوا۟ مِن رِّزْقِ ٱللَّهِ وَلَا تَعْثَوْا۟ فِى ٱلْأَرْضِ مُفْسِدِينَ", "2:97": "قُلْ مَن كَانَ عَدُوًّا لِّجِبْرِيلَ فَإِنَّهُۥ نَزَّلَهُۥ عَلَىٰ قَلْبِكَ بِإِذْنِ ٱللَّهِ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَهُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ", "2:98": "مَن كَانَ عَدُوًّا لِّلَّهِ وَمَلَٰٓئِكَتِهِۦ وَرُسُلِهِۦ وَجِبْرِيلَ وَمِيكَىٰلَ فَإِنَّ ٱللَّهَ عَدُوٌّ لِّلْكَٰفِرِينَ", "2:102": "وَٱتَّبَعُوا۟ مَا تَتْلُوا۟ ٱلشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَ وَمَا كَفَرَ سُلَيْمَٰنُ وَلَٰكِنَّ ٱلشَّيَٰطِينَ كَفَرُوا۟ يُعَلِّمُونَ ٱلنَّاسَ ٱلسِّحْرَ وَمَآ أُنزِلَ عَلَى ٱلْمَلَكَيْنِ بِبَابِلَ هَٰرُوتَ وَمَٰرُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ ٱلْمَرْءِ وَزَوْجِهِۦ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنْ أَحَدٍ إِلَّا بِإِذْنِ ٱللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَلَقَدْ عَلِمُوا۟ لَمَنِ ٱشْتَرَىٰهُ مَا لَهُۥ فِى ٱلْـَٔاخِرَةِ مِنْ خَلَٰقٍ وَلَبِئْسَ مَا شَرَوْا۟ بِهِۦٓ أَنفُسَهُمْ لَوْ كَانُوا۟ يَعْلَمُونَ", "2:110": "وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ ٱللَّهِ إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ", "2:125": "وَإِذْ جَعَلْنَا ٱلْبَيْتَ مَثَابَةً لِّلنَّاسِ وَأَمْنًا وَٱتَّخِذُوا۟ مِن مَّقَامِ إِبْرَٰهِـۧمَ مُصَلًّى وَعَهِدْنَآ إِلَىٰٓ إِبْرَٰهِـۧمَ وَإِسْمَٰعِيلَ أَن طَهِّرَا بَيْتِىَ لِلطَّآئِفِينَ وَٱلْعَٰكِفِينَ وَٱلرُّكَّعِ ٱلسُّجُودِ", "2:127": "وَإِذْ يَرْفَعُ إِبْرَٰهِـۧمُ ٱلْقَوَاعِدَ مِنَ ٱلْبَيْتِ وَإِسْمَٰعِيلُ رَبَّنَا تَقَبَّلْ مِنَّآ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ", "2:128": "رَبَّنَا وَٱجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَآ إِنَّكَ أَنتَ ٱلتَّوَّابُ ٱلرَّحِيمُ", "2:142": "سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ", "2:143": "وَكَذَٰلِكَ جَعَلْنَٰكُمْ أُمَّةً وَسَطًا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًا وَمَا جَعَلْنَا ٱلْقِبْلَةَ ٱلَّتِى كُنتَ عَلَيْهَآ إِلَّا لِنَعْلَمَ مَن يَتَّبِعُ ٱلرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ وَإِن كَانَتْ لَكَبِيرَةً إِلَّا عَلَى ٱلَّذِينَ هَدَى ٱللَّهُ وَمَا كَانَ ٱللَّهُ لِيُضِيعَ إِيمَٰنَكُمْ إِنَّ ٱللَّهَ بِٱلنَّاسِ لَرَءُوفٌ رَّحِيمٌ", "2:144": "قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِى ٱلسَّمَآءِ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَىٰهَا فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ وَإِنَّ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ لَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا يَعْمَلُونَ", "2:152": "فَٱذْكُرُونِىٓ أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ", "2:155": "وَلَنَبْلُوَنَّكُم بِشَىْءٍ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ وَبَشِّرِ ٱلصَّٰبِرِينَ", "2:156": "ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ", "2:157": "أُو۟لَٰٓئِكَ عَلَيْهِمْ صَلَوَٰتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُهْتَدُونَ", "2:158": "إِنَّ ٱلصَّفَا وَٱلْمَرْوَةَ مِن شَعَآئِرِ ٱللَّهِ فَمَنْ حَجَّ ٱلْبَيْتَ أَوِ ٱعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَن يَطَّوَّفَ بِهِمَا وَمَن تَطَوَّعَ خَيْرًا فَإِنَّ ٱللَّهَ شَاكِرٌ عَلِيمٌ", "2:163": "وَإِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ", "2:183": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "2:184": "أَيَّامًا مَّعْدُودَٰتٍ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ وَعَلَى ٱلَّذِينَ يُطِيقُونَهُۥ فِدْيَةٌ طَعَامُ مِسْكِينٍ فَمَن تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَّهُۥ وَأَن تَصُومُوا۟ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ", "2:185": "شَهْرُ رَمَضَانَ ٱلَّذِىٓ أُنزِلَ فِيهِ ٱلْقُرْءَانُ هُدًى لِّلنَّاسِ وَبَيِّنَٰتٍ مِّنَ ٱلْهُدَىٰ وَٱلْفُرْقَانِ فَمَن شَهِدَ مِنكُمُ ٱلشَّهْرَ فَلْيَصُمْهُ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ يُرِيدُ ٱللَّهُ بِكُمُ ٱلْيُسْرَ وَلَا يُرِيدُ بِكُمُ ٱلْعُسْرَ وَلِتُكْمِلُوا۟ ٱلْعِدَّةَ وَلِتُكَبِّرُوا۟ ٱللَّهَ عَلَىٰ مَا هَدَىٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ", "2:186": "وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ فَلْيَسْتَجِيبُوا۟ لِى وَلْيُؤْمِنُوا۟ بِى لَعَلَّهُمْ يَرْشُدُونَ", "2:187": "أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ فَٱلْـَٰٔنَ بَٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ثُمَّ أَتِمُّوا۟ ٱلصِّيَامَ إِلَى ٱلَّيْلِ وَلَا تُبَٰشِرُوهُنَّ وَأَنتُمْ عَٰكِفُونَ فِى ٱلْمَسَٰجِدِ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَقْرَبُوهَا كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ", "2:196": "وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ فَإِنْ أُحْصِرْتُمْ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ وَلَا تَحْلِقُوا۟ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ ٱلْهَدْىُ مَحِلَّهُۥ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًى مِّن رَّأْسِهِۦ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِٱلْعُمْرَةِ إِلَى ٱلْحَجِّ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٍ فِى ٱلْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ تِلْكَ عَشَرَةٌ كَامِلَةٌ ذَٰلِكَ لِمَن لَّمْ يَكُنْ أَهْلُهُۥ حَاضِرِى ٱلْمَسْجِدِ ٱلْحَرَامِ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ", "2:197": "ٱلْحَجُّ أَشْهُرٌ مَّعْلُومَٰتٌ فَمَن فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍ يَعْلَمْهُ ٱللَّهُ وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ وَٱتَّقُونِ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ", "2:198": "لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا۟ فَضْلًا مِّن رَّبِّكُمْ فَإِذَآ أَفَضْتُم مِّنْ عَرَفَٰتٍ فَٱذْكُرُوا۟ ٱللَّهَ عِندَ ٱلْمَشْعَرِ ٱلْحَرَامِ وَٱذْكُرُوهُ كَمَا هَدَىٰكُمْ وَإِن كُنتُم مِّن قَبْلِهِۦ لَمِنَ ٱلضَّآلِّينَ", "2:201": "وَمِنْهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةً وَفِى ٱلْـَٔاخِرَةِ حَسَنَةً وَقِنَا عَذَابَ ٱلنَّارِ", "2:203": "وَٱذْكُرُوا۟ ٱللَّهَ فِىٓ أَيَّامٍ مَّعْدُودَٰتٍ فَمَن تَعَجَّلَ فِى يَوْمَيْنِ فَلَآ إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ فَلَآ إِثْمَ عَلَيْهِ لِمَنِ ٱتَّقَىٰ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ", "2:207": "وَمِنَ ٱلنَّاسِ مَن يَشْرِى نَفْسَهُ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ", "2:215": "يَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلْ مَآ أَنفَقْتُم مِّنْ خَيْرٍ فَلِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ", "2:218": "إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ أُو۟لَٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ وَٱللَّهُ غَفُورٌ رَّحِيمٌ", "2:219": "يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ قُلْ فِيهِمَآ إِثْمٌ كَبِيرٌ وَمَنَٰفِعُ لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْـَٔايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ", "2:238": "حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ", "2:239": "فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا فَإِذَآ أَمِنتُمْ فَٱذْكُرُوا۟ ٱللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ", "2:247": "وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ٱللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًا قَالُوٓا۟ أَنَّىٰ يَكُونُ لَهُ ٱلْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِٱلْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِّنَ ٱلْمَالِ قَالَ إِنَّ ٱللَّهَ ٱصْطَفَىٰهُ عَلَيْكُمْ وَزَادَهُۥ بَسْطَةً فِى ٱلْعِلْمِ وَٱلْجِسْمِ وَٱللَّهُ يُؤْتِى مُلْكَهُۥ مَن يَشَآءُ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ", "2:250": "وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "2:251": "فَهَزَمُوهُم بِإِذْنِ ٱللَّهِ وَقَتَلَ دَاوُۥدُ جَالُوتَ وَءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ وَٱلْحِكْمَةَ وَعَلَّمَهُۥ مِمَّا يَشَآءُ وَلَوْلَا دَفْعُ ٱللَّهِ ٱلنَّاسَ بَعْضَهُم بِبَعْضٍ لَّفَسَدَتِ ٱلْأَرْضُ وَلَٰكِنَّ ٱللَّهَ ذُو فَضْلٍ عَلَى ٱلْعَٰلَمِينَ", "2:255": "ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ", "2:256": "لَآ إِكْرَاهَ فِى ٱلدِّينِ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا وَٱللَّهُ سَمِيعٌ عَلِيمٌ", "2:259": "أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍ ثُمَّ بَعَثَهُۥ قَالَ كَمْ لَبِثْتَ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةً لِّلنَّاسِ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ", "2:260": "وَإِذْ قَالَ إِبْرَٰهِـۧمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ قَالَ أَوَلَمْ تُؤْمِن قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى قَالَ فَخُذْ أَرْبَعَةً مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍ مِّنْهُنَّ جُزْءًا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًا وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ", "2:264": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُبْطِلُوا۟ صَدَقَٰتِكُم بِٱلْمَنِّ وَٱلْأَذَىٰ كَٱلَّذِى يُنفِقُ مَالَهُۥ رِئَآءَ ٱلنَّاسِ وَلَا يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ فَمَثَلُهُۥ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌ فَأَصَابَهُۥ وَابِلٌ فَتَرَكَهُۥ صَلْدًا لَّا يَقْدِرُونَ عَلَىٰ شَىْءٍ مِّمَّا كَسَبُوا۟ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلْكَٰفِرِينَ", "2:267": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُوا۟ فِيهِ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ", "2:271": "إِن تُبْدُوا۟ ٱلصَّدَقَٰتِ فَنِعِمَّا هِىَ وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌ لَّكُمْ وَيُكَفِّرُ عَنكُم مِّن سَيِّـَٔاتِكُمْ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ", "2:282": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًٔا فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةً تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ وَلَا يُضَآرَّ كَاتِبٌ وَلَا شَهِيدٌ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ وَٱتَّقُوا۟ ٱللَّهَ وَيُعَلِّمُكُمُ ٱللَّهُ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌ", "2:285": "ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ", "2:286": "لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "3:8": "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ ٱلْوَهَّابُ", "3:16": "ٱلَّذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ ٱلنَّارِ", "3:19": "إِنَّ ٱلدِّينَ عِندَ ٱللَّهِ ٱلْإِسْلَٰمُ وَمَا ٱخْتَلَفَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْعِلْمُ بَغْيًۢا بَيْنَهُمْ وَمَن يَكْفُرْ بِـَٔايَٰتِ ٱللَّهِ فَإِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ", "3:26": "قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ بِيَدِكَ ٱلْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ", "3:37": "فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٍ وَأَنۢبَتَهَا نَبَاتًا حَسَنًا وَكَفَّلَهَا زَكَرِيَّا كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا ٱلْمِحْرَابَ وَجَدَ عِندَهَا رِزْقًا قَالَ يَٰمَرْيَمُ أَنَّىٰ لَكِ هَٰذَا قَالَتْ هُوَ مِنْ عِندِ ٱللَّهِ إِنَّ ٱللَّهَ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ", "3:38": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ ٱلدُّعَآءِ", "3:41": "قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةً قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ ٱلنَّاسَ ثَلَٰثَةَ أَيَّامٍ إِلَّا رَمْزًا وَٱذْكُر رَّبَّكَ كَثِيرًا وَسَبِّحْ بِٱلْعَشِىِّ وَٱلْإِبْكَٰرِ", "3:47": "قَالَتْ رَبِّ أَنَّىٰ يَكُونُ لِى وَلَدٌ وَلَمْ يَمْسَسْنِى بَشَرٌ قَالَ كَذَٰلِكِ ٱللَّهُ يَخْلُقُ مَا يَشَآءُ إِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ", "3:49": "وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ", "3:52": "فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ بِأَنَّا مُسْلِمُونَ", "3:53": "رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّٰهِدِينَ", "3:59": "إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ خَلَقَهُۥ مِن تُرَابٍ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ", "3:96": "إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِى بِبَكَّةَ مُبَارَكًا وَهُدًى لِّلْعَٰلَمِينَ", "3:97": "فِيهِ ءَايَٰتٌۢ بَيِّنَٰتٌ مَّقَامُ إِبْرَٰهِيمَ وَمَن دَخَلَهُۥ كَانَ ءَامِنًا وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًا وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَٰلَمِينَ", "3:103": "وَٱعْتَصِمُوا۟ بِحَبْلِ ٱللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا۟ وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَآءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًا وَكُنتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِّنَ ٱلنَّارِ فَأَنقَذَكُم مِّنْهَا كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَهْتَدُونَ", "3:110": "كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِٱلْمَعْرُوفِ وَتَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَتُؤْمِنُونَ بِٱللَّهِ وَلَوْ ءَامَنَ أَهْلُ ٱلْكِتَٰبِ لَكَانَ خَيْرًا لَّهُم مِّنْهُمُ ٱلْمُؤْمِنُونَ وَأَكْثَرُهُمُ ٱلْفَٰسِقُونَ", "3:121": "وَإِذْ غَدَوْتَ مِنْ أَهْلِكَ تُبَوِّئُ ٱلْمُؤْمِنِينَ مَقَٰعِدَ لِلْقِتَالِ وَٱللَّهُ سَمِيعٌ عَلِيمٌ", "3:122": "إِذْ هَمَّت طَّآئِفَتَانِ مِنكُمْ أَن تَفْشَلَا وَٱللَّهُ وَلِيُّهُمَا وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ", "3:123": "وَلَقَدْ نَصَرَكُمُ ٱللَّهُ بِبَدْرٍ وَأَنتُمْ أَذِلَّةٌ فَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تَشْكُرُونَ", "3:124": "إِذْ تَقُولُ لِلْمُؤْمِنِينَ أَلَن يَكْفِيَكُمْ أَن يُمِدَّكُمْ رَبُّكُم بِثَلَٰثَةِ ءَالَٰفٍ مِّنَ ٱلْمَلَٰٓئِكَةِ مُنزَلِينَ", "3:125": "بَلَىٰٓ إِن تَصْبِرُوا۟ وَتَتَّقُوا۟ وَيَأْتُوكُم مِّن فَوْرِهِمْ هَٰذَا يُمْدِدْكُمْ رَبُّكُم بِخَمْسَةِ ءَالَٰفٍ مِّنَ ٱلْمَلَٰٓئِكَةِ مُسَوِّمِينَ", "3:144": "وَمَا مُحَمَّدٌ إِلَّا رَس
