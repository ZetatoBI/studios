<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17222E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ice Crown</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ice Crown">

<meta name="description" content="Ice Crown: build your hold, raise heroes and break the frost. A fantasy strategy game by Zetato Studios.">
<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cinzel-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/cinzel-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/alegreya-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
:root{
 --bg:#E6EEF4; --panel:#F3F7FA; --panel2:#E2EBF2; --ink:#14263A; --muted:#5B6F84; --line:rgba(20,38,58,.16);
 --accent:#D9772B; --accent-ink:#FFF8F0; --frost:#2F7FD6; --gold:#C8921A; --lumber:#8C5A2E; --food:#5E8A2A;
 --bad:#B23A30; --good:#3E7D3A; --chip:#E3ECF3; --scrim:rgba(10,18,28,.62);
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --bg:#0C131B; --panel:#15202C; --panel2:#1E2B3A; --ink:#E8F0F7; --muted:#93A6B9; --line:rgba(232,240,247,.13);
 --accent:#F0914A; --accent-ink:#1C0F05; --frost:#7DB8F5; --gold:#F0C04E; --lumber:#D19A62; --food:#9DC85B;
 --bad:#F0736A; --good:#8BC46A; --chip:#1E2B3A; --scrim:rgba(4,8,14,.7);} }
:root[data-theme="dark"]{
 --bg:#0C131B; --panel:#15202C; --panel2:#1E2B3A; --ink:#E8F0F7; --muted:#93A6B9; --line:rgba(232,240,247,.13);
 --accent:#F0914A; --accent-ink:#1C0F05; --frost:#7DB8F5; --gold:#F0C04E; --lumber:#D19A62; --food:#9DC85B;
 --bad:#F0736A; --good:#8BC46A; --chip:#1E2B3A; --scrim:rgba(4,8,14,.7);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);position:relative;overflow:hidden}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.res{display:flex;align-items:center;gap:4px;padding:4px 9px 4px 5px;border-radius:999px;background:var(--chip);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.res svg{width:19px;height:19px;flex:none}
.res.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1.14)}100%{transform:scale(1)}}
#waveBadge{margin-left:auto;font-family:Cinzel,serif;font-weight:800;font-size:14px;white-space:nowrap;color:var(--frost)}
#menuBtn{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
#menuBtn svg{width:20px;height:20px}
#stage{flex:1;position:relative;overflow:hidden;background:#C9D8E4;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#quest{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:center;pointer-events:none}
#quest span{background:rgba(12,22,34,.78);color:#F2F7FB;font-weight:700;font-size:14px;padding:7px 12px;border-radius:12px;max-width:100%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#quest b{color:#FFC48A}
#bossBar{position:absolute;left:12px;right:12px;top:44px;pointer-events:none}
#bossBar .nm{font-family:Cinzel,serif;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;font-size:13px;text-align:center;margin-bottom:3px}
#bossBar .tr{height:9px;border-radius:5px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#bossBar i{display:block;height:100%;background:linear-gradient(90deg,#7FC4FF,#2F7FD6);width:100%;transition:width .15s}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.6s ease forwards}
#banner h3{margin:0 64px;font-family:Cinzel,serif;font-weight:800;font-size:clamp(22px,7.5vw,34px);color:#fff;text-shadow:0 2px 0 #0B1826,0 0 22px rgba(120,190,255,.8)}
#banner p{margin:4px 16px 0;font-weight:800;color:#FFD9B0;text-shadow:0 1px 3px #000;font-size:16px}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(12,22,34,.88);color:#F2F7FB;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:normal;text-align:center;width:max-content;max-width:88%;z-index:40}
#toast.show{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;z-index:5;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sheetHead{display:flex;align-items:center;padding:10px 12px 4px 16px}
.sheetHead h2{margin:0;font-family:Cinzel,serif;font-size:18px;flex:1}
#sheetClose{width:34px;height:34px;border-radius:10px;background:var(--chip);font-size:20px;font-weight:800}
#sheetBody{overflow-y:auto;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
.sec{font-weight:800;color:var(--muted);font-size:13px;margin:10px 2px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
.card{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel2);border-radius:14px;padding:6px 8px 6px 6px;min-height:70px;position:relative;border:1.5px solid transparent}
.card:active{transform:scale(.98)}
.card.dis{opacity:.55}
.card.hot{border-color:var(--accent)}
.card img,.card .ic{width:58px;height:46px;flex:none;border-radius:10px;background:rgba(127,160,190,.18);object-fit:contain}
.card .ic{display:grid;place-items:center;color:var(--frost)}
.card .ic svg{width:28px;height:28px}
.ct{display:flex;flex-direction:column;gap:1px;min-width:0}
.ct b{font-size:15px;line-height:1.1}
.ct small{font-size:12.5px;color:var(--muted);line-height:1.15}
.cost{display:flex;gap:6px;font-size:13px;font-weight:800;margin-top:2px}
.cost i{font-style:normal;display:flex;align-items:center;gap:3px}
.cost i::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.cost i.l::before{background:var(--lumber);border-radius:2px}
.cost i.f::before{background:var(--food);border-radius:2px}
.cost i.no{color:var(--bad)}
.badge{position:absolute;top:5px;right:6px;background:var(--frost);color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px}
.pips{display:flex;gap:3px;margin-top:3px}
.pips span{width:10px;height:5px;border-radius:2px;background:var(--line)}
.pips span.on{background:var(--frost)}
.wrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wchip{background:var(--panel2);padding:6px 10px;border-radius:10px;font-weight:800;font-size:14px}
.wbtn{background:var(--frost);color:#fff;padding:8px 12px;border-radius:10px;font-weight:800;font-size:14px}
.wbtn.alt{background:var(--panel2);color:var(--ink)}
.note{background:var(--panel2);padding:12px;border-radius:12px;font-size:14.5px;line-height:1.35}
.qline{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.qline i{display:block;height:100%;background:var(--frost)}
#tabs{display:flex;gap:6px;padding:7px 8px;background:var(--panel);border-top:1px solid var(--line);flex:none}
#tabs .tab{flex:1;height:40px;border-radius:12px;background:var(--chip);font-weight:800;font-size:15px}
#tabs .tab.on{background:var(--ink);color:var(--panel)}
#waveBtn{flex:1.8;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14.5px;line-height:1.05;padding:0 6px}
#waveBtn small{display:block;font-size:11.5px;font-weight:700;opacity:.9}
#waveBtn.busy{background:var(--panel2);color:var(--ink)}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,43,.0)}50%{box-shadow:0 0 0 4px rgba(217,119,43,.55)}}
#heroBar{display:flex;align-items:center;gap:8px;padding:8px 10px 10px;background:var(--panel);flex:none}
#heroRow{display:flex;gap:5px;flex:none}
.hp{width:44px;height:66px;border-radius:12px;background:var(--panel2);position:relative;overflow:hidden;touch-action:none;border:2px solid transparent}
.hp.on{border-color:var(--accent)}
.hp img{width:100%;height:50px;object-fit:contain;display:block;margin-top:2px;pointer-events:none}
.hp .lvl{position:absolute;top:2px;left:2px;background:var(--frost);color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:0 4px}
.hp .bar{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.hp .bar i{display:block;height:100%;background:#57C35E;width:100%}
.hp .rev{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,18,28,.62);color:#fff;font-weight:800;font-size:12px}
.hp.add{display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1;padding:2px}
.hp.add b{font-size:20px;display:block;color:var(--frost)}
#dragGhost{position:fixed;width:44px;height:52px;margin:-60px 0 0 -22px;pointer-events:none;z-index:40;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
#stageBtns{position:absolute;right:8px;top:86px;display:flex;flex-direction:column;gap:8px;z-index:3}
#stageBtns button{width:50px;height:50px;border-radius:14px;background:rgba(245,249,252,.94);color:#14263A;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#targetBtn svg{width:18px;height:18px;color:#B23A30}
#stanceBtn svg{width:19px;height:19px;color:#2F6FD0}
#stanceBtn b{font-size:9.5px;font-weight:800;line-height:1.05;text-align:center;max-width:46px}
.stic{width:48px;height:38px;flex:none;display:grid;place-items:center;color:#2F6FD0;background:rgba(127,160,190,.15);border-radius:8px}.stic svg{width:22px;height:22px}
#targetBtn span{display:none}
#targetBtn b{font-size:10.5px;font-weight:800}
#preview{position:absolute;left:8px;top:46px;display:flex;align-items:center;gap:4px;background:rgba(12,22,34,.78);color:#F2F7FB;border-radius:12px;padding:3px 8px 3px 4px;z-index:3;max-width:calc(100% - 76px);overflow:hidden}
#preview .pl{font-size:12px;font-weight:800;padding:0 4px;white-space:nowrap}
#preview .pc{display:flex;align-items:center;font-size:12px;font-weight:800;white-space:nowrap}
#preview .pc img{width:30px;height:24px;object-fit:contain}
#preview .pc.boss{color:#FFB070}
#pauseTag{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(12,22,34,.8);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:12px;pointer-events:none;z-index:3;white-space:nowrap}
#stage.tp #cv{filter:saturate(.55) brightness(.92)}
#speedBtn b{font-size:15px;font-weight:800}
#speedBtn.on{background:#F0914A!important;color:#1C0F05!important}
#pauseBtn.on{background:#F0914A!important;color:#1C0F05!important}
#pauseBtn svg{width:20px;height:20px}
.erow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.erow img{width:48px;height:38px;object-fit:contain;flex:none;background:rgba(127,160,190,.15);border-radius:8px}
.erow b{font-size:15px}.erow small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
#jobs{position:absolute;left:8px;right:66px;bottom:8px;display:flex;gap:6px;overflow-x:auto;z-index:3;scrollbar-width:none}
#jobs::-webkit-scrollbar{display:none}
.job{flex:none;display:flex;align-items:center;gap:5px;background:rgba(12,22,34,.82);color:#F2F7FB;border-radius:10px;padding:3px 8px 3px 3px;font-size:12px;font-weight:800}
.job img{width:26px;height:21px;object-fit:contain;background:rgba(255,255,255,.12);border-radius:6px}
.job .jb{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.job .jb i{display:block;height:100%;background:#6FB8FF}
.job.build .jb i{background:#FFC24A}
.job.rev .jb i{background:#FF8A80}
#toast{bottom:44px!important}
.ab.auto{box-shadow:inset 0 0 0 2px #FFD36A,0 0 12px rgba(255,211,106,.5)}
.ab .at{position:absolute;top:3px;right:4px;font-size:8.5px;font-weight:800;color:#1C0F05;background:#FFD36A;border-radius:4px;padding:0 3px;z-index:3;display:none}
.ab.auto .at{display:block}
#abil{display:flex;gap:7px;flex:1;justify-content:center}
.ab{width:62px;height:66px;border-radius:16px;background:linear-gradient(160deg,#27425F,#152536);color:#DCEBFA;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(160,205,255,.3)}
.ab svg{width:28px;height:28px}
.ab .nm{font-size:10.5px;font-weight:800;letter-spacing:.01em;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(5,10,18,.72) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
.ab .cdv{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;z-index:2;text-shadow:0 1px 3px #000}
.ab.lock{filter:grayscale(1);opacity:.55}
.ab.ready{box-shadow:inset 0 0 0 2px #8FD0FF,0 0 12px rgba(120,190,255,.45)}
.ab:active{transform:scale(.95)}
.ab.w{background:linear-gradient(160deg,#6A3A22,#3A1E12);color:#FFE2C8}
.ab.m{background:linear-gradient(160deg,#3B2F78,#1D1840);color:#E6E0FF}
.ab.r{background:linear-gradient(160deg,#2F5A36,#16301B);color:#DDF5DA}
#targetBtn{width:62px;height:66px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
#targetBtn svg{width:20px;height:20px;color:var(--bad)}
#targetBtn span{font-size:11px;color:var(--muted);font-weight:700}
#targetBtn b{font-size:13px}
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
#intro{background:linear-gradient(180deg,#F7F9FB,#DCE9F8);align-items:center;justify-content:center;z-index:30;transition:opacity .35s ease}
#intro.out{opacity:0;pointer-events:none}
.zlogo{display:flex;align-items:center;gap:14px;animation:zin .4s ease-out both}
.zlogo svg{width:min(19vw,92px);height:auto}
.zword{display:flex;flex-direction:column;font-family:Montserrat,'Segoe UI',Arial,sans-serif;line-height:1}
.zword b{font-weight:600;font-size:min(11vw,52px);letter-spacing:.06em;color:#1F3A68}
.zword span{font-weight:500;font-size:min(3.6vw,17px);letter-spacing:.62em;color:#1275EC;margin-top:6px}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#title{background:linear-gradient(180deg,rgba(8,16,26,.15) 0%,rgba(8,16,26,.35) 30%,rgba(8,16,26,.94) 62%);justify-content:flex-end;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));color:#EEF5FB}
#title h1{margin:0;text-align:center;font-family:Cinzel,serif;font-weight:800;font-size:clamp(44px,13vw,64px);line-height:.95;letter-spacing:.02em;color:#F4FAFF;text-shadow:0 2px 0 #0D2138,0 0 28px rgba(130,200,255,.85)}
#title .tag{text-align:center;margin:8px 0 16px;color:#BFD6EA;font-weight:700;font-size:16px}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
#maps .race{padding:9px 10px}#maps .race small{font-size:12px}
.mapc.soon{filter:grayscale(.75);opacity:.62}
.mapc .chk{position:absolute;top:6px;right:8px;background:#3E7D3A;color:#fff;font-weight:800;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mapc .prog{font-size:13px;font-weight:800;color:#FFE3A0}
.ctools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.ctools .wbtn.alt{background:rgba(255,255,255,.1);color:#EEF5FB}
.boons{display:flex;gap:4px;flex:1}.boons i{width:30px;height:30px;border-radius:9px;background:rgba(255,211,106,.16);color:#FFD36A;display:grid;place-items:center}.boons svg{width:18px;height:18px}
.boonrow{display:flex;flex-direction:column;gap:8px}.bcard{width:100%}
#preview .haz{color:#FFB070}.tw.haz{background:rgba(255,120,40,.14);color:#C2410C}
.chrcamp{font-family:Cinzel,serif;font-weight:800;margin:16px 2px 2px;font-size:17px;color:var(--frost)}
.race{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 10px;text-align:left;color:#EEF5FB;display:flex;flex-direction:column;gap:6px}
.race.on{border-color:#FFB070;background:rgba(255,160,90,.13)}
.race svg{width:40px;height:44px}
.race b{font-family:Cinzel,serif;font-size:15px;line-height:1.1}
.race small{font-size:13px;line-height:1.25;color:#C4D3E0}
.ver{text-align:center;margin-top:6px;font-size:12px;color:#7F97AE;font-weight:700}
#inst{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;background:rgba(245,249,252,.96);color:#14263A;border-radius:14px;padding:10px 8px 10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:instIn .35s ease-out both;z-index:2}
@keyframes instIn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
#inst .it{flex:1;display:flex;flex-direction:column;gap:1px;font-size:14px;line-height:1.3}
#inst .it b{font-size:15px}
#instGo{background:#F0914A;color:#1C0F05;font-weight:800;border-radius:10px;padding:9px 14px;font-size:15px}
#instX{width:34px;height:34px;border-radius:9px;font-size:22px;font-weight:800;color:#5B6F84;flex:none}
.bigbtn{margin-top:14px;height:52px;border-radius:14px;background:#F0914A;color:#1C0F05;font-weight:800;font-size:18px;width:100%}

function hit(src,t,amt,opt){
 if(!t||t.dead) return 0;
 if(t.buffs.immune) return 0;
 if(t.team==='p'&&src&&src.team==='e'){ t.hitBy=src; t.hitAt=S.time; }
 if(t.team==='p'&&t.kind!=='b'){ S.taken=(S.taken||0)+amt; if(!src) S.hazTaken=(S.hazTaken||0)+amt; }   // balance bot: share of damage taken from hazards
 let a=amt;
 if(t.buffs.mark) a*=1.4;

 const v=a.speed*slow*dt*(a.kind==='h'&&hasG(a,'mantle')?1+GEAR.mantle.speed:1)*(a.team==='p'&&a.type!=='worker'&&a.kind!=='b'&&hasBoon('drums')?1+BOONS.drums.speed:1); let ux=dx/d, uy=dy/d;

function updateFx(dt){

function massOf(a){
 if(a.team==='e') return a.boss?MASS.boss:(a.type==='troll'||a.type==='knight')?MASS.elite:MASS.enemy;
 let m=a.kind==='h'?MASS.hero:a.type==='heavy'?MASS.heavy:a.type==='wolfpet'?MASS.pet:a.type==='siege'?MASS.siege:MASS.soldier;
 if(S.stance==='hold'&&!a.moving&&!a.march&&a.anchor&&dist(a,a.anchor)<10) m*=MASS.stance.hold;       // braced in formation
 else if(S.stance==='charge'&&a.moving) m*=MASS.stance.charge;                                          // advancing

function separate(){

 const m=[]; S.units.forEach(u=>{if(!u.dead&&!u.hidden&&u.type!=='worker')m.push(u);}); S.heroes.forEach(h=>{if(!h.dead)m.push(h);}); S.enemies.forEach(e=>{if(!e.dead&&!e.fly)m.push(e);});
 for(let i=0;i<m.length;i++){const a=m[i];
  for(let j=i+1;j<m.length;j++){const b=m[j]; const dx=b.x-a.x, dy=b.y-a.y, md=(a.r+b.r)*.8; if(Math.abs(dx)>md||Math.abs(dy)>md) continue;
   const d=Math.hypot(dx,dy)||.01; if(d>=md) continue; const nx=dx/d, ny=dy/d, over=md-d;
   if(a.ghostT>0||b.ghostT>0) continue;
   if(a.team==='p'&&b.team==='p'){ if(busy(a)||busy(b)) continue; const p=over/2*MASS.idleSpread; a.x-=nx*p; a.y-=ny*p; b.x+=nx*p; b.y+=ny*p; continue; }
   const ma=massOf(a), mb=massOf(b), wa=mb/(ma+mb), wb=ma/(ma+mb); a.x-=nx*over*wa; a.y-=ny*over*wa; b.x+=nx*over*wb; b.y+=ny*over*wb; }
  if(!(a.ghostT>0)){
   for(const b of S.buildings){const d=dist(a,b), md=b.r*.75+a.r*.5; if(d<md&&d>0){a.x+=(a.x-b.x)/d*(md-d); a.y+=(a.y-b.y)/d*(md-d);}}
   theme().fires.forEach(([fx,fy])=>{ const d2=Math.hypot(a.x-fx,a.y-fy); if(d2<12&&d2>0){a.x+=(a.x-fx)/d2*(12-d2); a.y+=(a.y-fy)/d2*(12-d2);} });
   const dm=dist(a,MINE); if(dm<MINE.r&&dm>0){a.x+=(a.x-MINE.x)/dm*(MINE.r-dm); a.y+=(a.y-MINE.y)/dm*(MINE.r-dm);}
  }
  a.x=clamp(a.x,8,WW-8); a.y=clamp(a.y,30,WH-6);
 }
}

function mapTap(x,y){

 // candidates, each with distance; nearest wins, with a small bias toward enemies during combat

 S.enemies.forEach(en=>{ if(en.dead) return; const d=Math.hypot(en.x-x,en.y-visH(en)*.45-y)-en.r; C.push({d:d-4,k:'enemy',o:en}); });
 S.heroes.forEach(hh=>{ if(!hh.dead) C.push({d:Math.hypot(hh.x-x,hh.y-12-y)-8,k:'hero',o:hh}); });
 C.push({d:Math.hypot(x-MINE.x-6,y-MINE.y+8)-26,k:'mine'});
 TREES.forEach(t=>C.push({d:Math.hypot(t.x-x,t.y-14-y)-10,k:'trees',o:t}));
 S.buildings.forEach(b=>{ const dx=Math.max(0,Math.abs(x-b.x)-b.r*.85), dy=y>b.y+6?y-b.y-6:y<b.y-b.h?b.y-b.h-y:0; C.push({d:Math.hypot(dx,dy),k:'b',o:b}); });
 S.plots.forEach(p=>{ if(!p.b) C.push({d:Math.hypot(x-p.x,(y-p.y)*1.6)-22,k:'plot',o:p}); });
 C.sort((a,b)=>a.d-b.d); const c=C[0];
 if(c&&c.d<F){
  if(c.k==='enemy'){ if(h&&!h.dead){h.focus=c.o; h.moveTo=null; toast(`${h.name} targets ${ENEMIES[c.o.type].name}`); sfx('click');} return; }

}

const HOWTO=`<h2>How to play</h2><ul>
<li>Tap the <b>gold mine</b> or <b>pine trees</b> to send workers. Train more at the Town Center (tap it, or Build).</li>
<li>Tap an <b>empty plot</b> to build. Farms raise your food cap, which limits army size.</li>
<li>Recruit heroes and soldiers in <b>Army</b> once the Barracks is up. Heroes level up from nearby kills and unlock a third ability at level 3.</li>
<li>At levels 3, 6 and 9 a hero can learn a <b>talent</b>: tap the portrait with the gold <b>!</b> and pick one of two (tap twice). Talents last for the battle.</li>
<li>Drag the <b>banner</b> to move your army. It lines up facing the road: melee in front, ranged and healers behind, siege at the back, heroes at the ends of the front row. The <b>stance</b> button sets how they fight: <b>Hold the line</b> braces in formation (melee guard their spot), <b>Defend</b> fights freely once enemies enter the zone around the banner, <b>Charge</b> fights its way to the banner.</li>
<li>Bosses drop <b>gear</b> the first time you beat them. Equip it in the <b>Armory</b> (battle list or briefing): one item per hero.</li>
<li>Tap the ground to move your hero. Tap an enemy to focus it. <b>Target</b> switches between nearest, weakest and strongest for everyone.</li>
<li>Upgrade gear at the <b>Forge</b>. Upgrade the Town Center to a <b>Keep</b> (elite units, healers, forge 4-5), then a <b>Castle</b> (forge 6-8, siege engines and endless <b>Masterwork</b>: +4% damage and health each).</li>
<li>Workers cost no food: food is only for your army and heroes. Soldiers earn <b>ranks</b> from kills (gold chevrons: +12% health and damage each), so keep them alive.</li>
<li>The <b>Cleric</b> or <b>Witch Doctor</b> heals the most injured ally nearby. The <b>Trebuchet</b> or <b>Catapult</b> hurls stones at dense waves from the back rows, but can't hit anything closer than 60.</li>
<li>Maera's story cards can be switched off in this menu (Story: on/off) and re-read in the <b>Chronicle</b> on the battle list.</li>
<li>Each battle ends with a boss. Clearing a wave pays out; calling the next one early pays extra gold.</li><li>Your battle saves after every cleared wave. Continue from the title screen or the battle list.</li><li>Tap a built Watch Tower to turn it into a Frost Tower (slows) or a Ballista (ignores armor). Both need a Forge.</li><li>Earn up to three stars per battle. Stars unlock harder tiers and give Crowns for permanent upgrades in the War council.</li>

(function(){

 // Silent updates: the worker fetches the newest game page whenever online, so the next open is always current.
 if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){
   navigator.serviceWorker.register('sw.js').then(function(reg){
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update().catch(function(){}); });
   }).catch(function(){});
  });

 var KEY='icecrown.installHint', box=document.getElementById('inst'), msg=document.getElementById('instMsg'), go=document.getElementById('instGo'), deferred=null;
 function dismissed(){ try{return localStorage.getItem(KEY)==='1'}catch(e){return false} }
