<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c1230">
<title>Meow Mob</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meow Mob">
<meta name="description" content="Rally a mob of cats and chase the rat pack out of the house. Ad-free.">
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
:root{
  --night:#1c1230; --plum:#2a1b45; --plum2:#3a2760; --cream:#fff4e2; --muted:#c7b6e6;
  --lamp:#ffc85a; --lampdeep:#c9781c; --rose:#ff7aa2; --violet:#7d63ff; --violetdeep:#40309f;
  --line:rgba(255,244,226,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:#120b20;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#1c1230; --plum:#2a1b45; --cream:#fff4e2; } }
:root[data-theme="dark"]{ --night:#1c1230; --plum:#2a1b45; --cream:#fff4e2; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#120b20;color:var(--cream);font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;height:100%;width:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--night)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 18px;text-align:center;overflow-y:auto;touch-action:pan-y;
  background:radial-gradient(120% 80% at 50% 20%,rgba(42,27,69,.35),rgba(18,11,32,.9))}
.logo{margin:0;font-weight:700;line-height:.86;font-size:clamp(54px,17vw,84px);color:var(--lamp);
  -webkit-text-stroke:4px #3a1d5c;paint-order:stroke fill;transform:rotate(-4deg);
  text-shadow:0 6px 0 #3a1d5c,0 14px 30px rgba(255,140,90,.35)}
.logo .l2{display:block;color:var(--rose);transform:translateX(18px) rotate(2deg)}
.tag{margin:0;color:var(--muted);font-size:17px;font-weight:500;max-width:32ch}
.vs{display:flex;align-items:center;gap:6px;margin:2px 0}
.portrait{width:112px;height:112px;border-radius:30px;border:3px solid rgba(255,244,226,.16);
  background:radial-gradient(circle at 50% 38%,#5a4592,#2a1b45 72%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35)}
.portrait.bad{background:radial-gradient(circle at 50% 38%,#7a2f45,#2b1020 72%);transform:rotate(3deg)}
.portrait.good{transform:rotate(-3deg)}
.vs b{font-size:30px;font-weight:700;color:var(--cream);-webkit-text-stroke:3px #3a1d5c;paint-order:stroke fill}
.btn{font:inherit;font-weight:700;font-size:23px;border:0;border-radius:20px;padding:13px 30px;min-width:230px;cursor:pointer;color:#35163f;
  background:linear-gradient(#ffdb85,#ffb43a);box-shadow:0 6px 0 var(--lampdeep),0 12px 22px rgba(0,0,0,.35);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lampdeep),0 5px 10px rgba(0,0,0,.3)}
.btn.alt{color:#fff;background:linear-gradient(#9a88ff,#6c55ea);box-shadow:0 6px 0 var(--violetdeep),0 12px 22px rgba(0,0,0,.35)}
.btn.alt:active{box-shadow:0 2px 0 var(--violetdeep)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-size:17px;font-weight:600;min-width:0;padding:8px 14px}
.btn .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rose);margin-left:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(255,122,162,.3)}
.btn:focus-visible,.swb:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible,.buy:focus-visible,.lvsel button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{color:var(--muted);font-size:14px;line-height:1.4;max-width:34ch;margin:0}
.fishpill{display:inline-flex;align-items:center;gap:6px;background:rgba(18,11,32,.7);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;font-size:17px}
.fishpill b{color:var(--lamp)}
.topbar{position:absolute;top:12px;right:12px}
.lvsel{display:flex;align-items:center;gap:12px}
.lvsel span{font-size:20px;font-weight:600;min-width:110px}
.lvsel span small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.lvsel button{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:rgba(18,11,32,.6);color:var(--cream);font:700 22px/1 inherit;cursor:pointer}
.lvsel button:disabled{opacity:.3}

.panel{width:100%;max-width:420px;background:rgba(42,27,69,.94);border:2px solid var(--line);border-radius:26px;padding:8px 16px 14px;text-align:left}
.row{padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row h3{margin:0 0 9px;font-size:16px;font-weight:600;color:var(--cream)}
.row h3 small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.swb{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,244,226,.22);cursor:pointer;padding:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.swb.on{border-color:#fff;box-shadow:0 0 0 3px var(--lamp),inset 0 -4px 0 rgba(0,0,0,.2)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:15px;padding:10px 8px;border-radius:14px;border:2px solid var(--line);background:rgba(18,11,32,.5);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--lamp);color:#35163f;border-color:var(--lamp)}
h2.title{margin:0;font-size:34px;font-weight:700;color:var(--cream);-webkit-text-stroke:3px #3a1d5c;paint-order:stroke fill}

.up{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.up:last-child{border-bottom:0}
.up .ic{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:rgba(18,11,32,.55);border-radius:14px;flex:none}
.up .info{flex:1;min-width:0}
.up .info b{display:block;font-size:17px}
.up .info span{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:5px;border-radius:3px;background:rgba(255,244,226,.15)}
.pips i.on{background:var(--lamp)}
.buy{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;padding:10px 12px;min-width:86px;cursor:pointer;color:#35163f;background:linear-gradient(#ffdb85,#ffb43a);box-shadow:0 4px 0 var(--lampdeep)}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lampdeep)}
.buy:disabled{background:rgba(18,11,32,.6);color:var(--muted);box-shadow:none;cursor:default}

.stars{display:flex;gap:6px;font-size:46px;line-height:1}
.stars span{color:#4a3a6a;-webkit-text-stroke:3px #2a1b45;paint-order:stroke fill;transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--lamp);transform:scale(1)}
.stat{display:flex;gap:8px}
.stat div{background:rgba(42,27,69,.9);border:2px solid var(--line);border-radius:18px;padding:9px 10px;min-width:92px}
.stat b{display:block;font-size:26px;color:var(--cream)}
.stat span{font-size:13px;color:var(--muted)}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
.icon-btn{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:15px;border:2px solid rgba(255,244,226,.2);background:rgba(28,18,48,.78);color:var(--cream);font:700 17px/1 'Fredoka',system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
#levelInfo{flex:1;min-width:0}
#levelName,#bossName{font-size:14px;font-weight:600;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.5);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog,#bossBar{position:relative;height:12px;border-radius:8px;background:rgba(18,11,32,.72);border:2px solid rgba(255,244,226,.18)}
#bossBar{height:14px;border-color:rgba(255,122,162,.5)}
#progFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--lamp))}
#bossFill{position:absolute;inset:0 auto 0 0;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#ff4d6d,#ff9a5a);transition:width .1s}
#bossLag{position:absolute;inset:0 auto 0 0;height:100%;width:100%;border-radius:6px;background:#fff4e2;opacity:.75;transition:width .5s ease .35s}
#bossBar.enraged{border-color:#ff4d6d;box-shadow:0 0 12px rgba(255,77,109,.8)}
#progDot{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:var(--lamp);border:3px solid #35163f}
#progFlag{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-size:15px}
#weapon{position:absolute;left:12px;bottom:12px;background:rgba(28,18,48,.82);border:2px solid rgba(255,244,226,.18);border-radius:14px;padding:6px 11px;font-size:14px;font-weight:600;pointer-events:none}
#weapon small{display:block;color:var(--lamp);letter-spacing:2px;font-size:12px}
#card{position:absolute;left:50%;top:22%;transform:translate(-50%,0);text-align:center;pointer-events:none;opacity:0;width:90%}
#card.show{animation:card 2.8s ease forwards}
#cardLv{font-size:46px;font-weight:700;color:var(--lamp);-webkit-text-stroke:4px #3a1d5c;paint-order:stroke fill}
#cardBoss{font-size:20px;font-weight:600;margin-top:2px;text-shadow:0 2px 0 #3a1d5c}
#cardHp{font-size:15px;color:#ffd0dc;margin-top:4px;text-shadow:0 2px 0 #3a1d5c}
@keyframes card{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.league-badge{display:flex;flex-direction:column;align-items:center;gap:5px}
.lb{background:var(--lc);color:var(--lf);border:2px solid var(--lb);font-weight:700;font-size:16px;padding:4px 16px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.lp{font-size:14px;color:var(--muted)}
.btn small{display:block;font-size:14px;font-weight:600;opacity:.75;margin-top:2px}
.row2{display:flex;gap:10px;width:100%;max-width:300px}
.btn.half{min-width:0;flex:1;font-size:19px;padding:12px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.tab{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:7px 13px;border:2px solid var(--lb);background:rgba(18,11,32,.6);color:var(--cream);cursor:pointer}
.tab.on{background:var(--lc);color:var(--lf)}
.tab:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:400px}
.lv{font:inherit;aspect-ratio:1;border-radius:16px;border:2px solid var(--lb);background:rgba(18,11,32,.72);color:var(--cream);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv b{font-size:19px;line-height:1}
.lv span{font-size:10px;color:var(--lamp);letter-spacing:1px}
.lv i{font-style:normal;font-size:11px;line-height:1}
.lv.cur{background:var(--lc);color:var(--lf);box-shadow:0 0 0 3px #fff}
.lv.cur span{color:var(--lf)}
.lv:disabled{border-color:rgba(255,244,226,.1);color:rgba(255,244,226,.28);cursor:default}
.lv:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
#zoomWrap{margin-top:5px;height:7px;border-radius:5px;background:rgba(18,11,32,.72);border:1.5px solid rgba(255,155,224,.4);overflow:hidden}
#zoomFill{height:100%;width:0;background:linear-gradient(90deg,#ff9be0,#9be7ff)}
#zoomWrap.on{border-color:#ff9be0;box-shadow:0 0 10px rgba(255,155,224,.7)}
.btn.pink{background:linear-gradient(#ff9bc8,#e8568f);box-shadow:0 6px 0 #9a2a5a,0 12px 22px rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(#6fe0c4,#23a58a);box-shadow:0 6px 0 #11614f,0 12px 22px rgba(0,0,0,.35)}
.btn .badge{display:inline-block;background:var(--rose);color:#fff;font-size:12px;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.cafe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.cafe .card{background:rgba(42,27,69,.92);border:2px solid var(--line);border-radius:18px;padding:8px 6px 10px;text-align:center}
.cafe .card canvas{width:64px;height:64px;display:block;margin:0 auto 4px}
.cafe .card b{display:block;font-size:15px}
.cafe .card span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.cafe .card.lock b{color:var(--muted)}
.moment{display:flex;align-items:center;gap:12px;background:rgba(255,244,226,.96);color:#35163f;border-radius:20px;padding:10px 14px;max-width:400px;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.25);transform:rotate(-1deg)}
.moment canvas{width:84px;height:84px;flex:none;border-radius:16px;background:#ffe6ee}
.moment b{display:block;font-size:17px}
.moment span{display:block;font-size:14px;line-height:1.35;margin-top:2px}
.up .info em{display:block;font-style:normal;font-size:12px;color:#9d8cc0;margin-top:1px}
.dl p{margin:6px 0;font-size:16px}.dl b{color:var(--lamp)}
@media (prefers-reduced-motion: reduce){ .stars span{transition:none} #card.show{animation-duration:2.8s;animation-timing-function:steps(1)} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Meow Mob game"></canvas>

  <div id="hud" class="hidden">
    <button id="pauseBtn" class="icon-btn" aria-label="Pause">II</button>
    <div id="levelInfo">
      <div id="progWrap"><div id="levelName"></div><div id="prog"><div id="progFill"></div><div id="progDot"></div><div id="progFlag">👑</div></div></div>
      <div id="bossWrap" class="hidden"><div id="bossName"></div><div id="bossBar"><div id="bossLag"></div><div id="bossFill"></div></div></div>
      <div id="zoomWrap" title="Zoomies meter"><div id="zoomFill"></div></div>
    </div>
    <button id="muteBtn" class="icon-btn" aria-label="Sound on or off">♪</button>
  </div>
  <div id="weapon" class="hidden"><span id="wName"></span><small id="wPips"></small></div>
  <div id="card"><div id="cardLv"></div><div id="cardBoss"></div><div id="cardHp"></div></div>

  <div id="menu" class="screen">
    <div class="topbar"><span class="fishpill">🐟 <b id="menuFish">0</b></span></div>
    <h1 class="logo">Meow<span class="l2">Mob</span></h1>
    <div class="vs"><canvas id="pHero" class="portrait good" width="112" height="112"></canvas><b>vs</b><canvas id="pVillain" class="portrait bad" width="112" height="112"></canvas></div>
    <div class="league-badge" id="menuLeague"></div>
    <button class="btn" id="playBtn">Continue</button>
    <div class="row2"><button class="btn alt half" id="levelsBtn">Levels</button><button class="btn alt half" id="shopBtn">Upgrades</button></div>
    <div class="row2"><button class="btn alt half pink" id="dailyBtn">Daily</button><button class="btn alt half teal" id="cafeBtn">Cat Café</button></div>
    <button class="btn ghost" id="customBtn">Customize your mob</button>
    <p class="hint">Drag to steer. Shoot gates to power them up, grow your mob, and beat the boss at the end.</p>
  </div>

  <div id="levels" class="screen hidden">
    <h2 class="title">Levels</h2>
    <div class="tabs" id="leagueTabs"></div>
    <p class="tag" id="leagueInfo"></p>
    <div class="grid" id="levelGrid"></div>
    <button class="btn" id="levelsBack">Back</button>
  </div>

  <div id="shop" class="screen hidden">
    <h2 class="title">Upgrades</h2>
    <span class="fishpill">🐟 <b id="shopFish">0</b></span>
    <div class="seg" id="shopTabs" style="width:100%;max-width:420px"><button data-t="up" class="on">Upgrades</button><button data-t="hats">Hats</button></div>
    <div class="panel" id="shopRows"></div>
    <button class="btn" id="shopBack">Done</button>
  </div>

  <div id="cafe" class="screen hidden">
    <h2 class="title">Cat Café</h2>
    <p class="tag" id="cafeInfo"></p>
    <div class="cafe" id="cafeGrid"></div>
    <button class="btn" id="cafeBack">Back</button>
  </div>

  <div id="dailyS" class="screen hidden">
    <h2 class="title">Daily challenge</h2>
    <p class="tag" id="dailyDate"></p>
    <div class="panel" id="dailyInfo"></div>
    <button class="btn" id="dailyGo">Play</button>
    <button class="btn ghost" id="dailyBack">Back</button>
  </div>

  <div id="custom" class="screen hidden">
    <h2 class="title">Your mob</h2>
    <div class="vs"><canvas id="cHero" class="portrait good" width="112" height="112"></canvas><b>vs</b><canvas id="cVillain" class="portrait bad" width="112" height="112"></canvas></div>
    <div class="panel" id="customRows"></div>
    <button class="btn ghost hapBtn">Vibration: on</button>
    <button class="btn ghost gfxBtn">Graphics: Auto</button>
    <button class="btn" id="doneBtn">Done</button>
  </div>

  <div id="pause" class="screen hidden">
    <h2 class="title">Paused</h2>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn alt" id="restartBtn">Restart level</button>
    <button class="btn ghost hapBtn">Vibration: on</button>
    <button class="btn ghost gfxBtn">Graphics: Auto</button>
    <button class="btn ghost" id="quitBtn">Back to menu</button>
  </div>

  <div id="result" class="screen hidden">
    <h2 class="title" id="resTitle"></h2>
    <div class="stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <p class="tag" id="resSub"></p>
    <div id="resMoment" class="moment hidden"><canvas id="momentArt" width="96" height="96"></canvas><div><b id="momentTitle"></b><span id="momentText"></span></div></div>
    <div class="stat"><div><b id="resArmy">0</b><span>cats left</span></div><div><b id="resKills">0</b><span>mice beaten</span></div><div><b id="resFish">0</b><span>🐟 earned</span></div></div>
    <button class="btn" id="againBtn">Play again</button>
    <button class="btn alt" id="resShopBtn">Upgrades</button>
    <button class="btn ghost" id="menuBtn">Back to menu</button>
  </div>
</div>

<script>
(() => {
'use strict';
/* =========================================================
   CONFIG — every tuning value lives here
   ========================================================= */
const CONFIG = {
  worldW: 400,
  playerY: 0.74,          // lead cat's screen position (0 top, 1 bottom)
  runSpeed: 135,          // brisk pace; full-screen shot range keeps the firing window
  steerSens: 1.25,
  leadMin: 46, leadMax: 354,
  catSpacing: 10.5,
  maxDrawCats: 240,
  baseStartArmy: 5,
  fireRatePerCat: 2.0,
  catDamage: 1,
  maxBulletsPerSec: 34,   // visual cap; damage per bullet scales above it
  bulletSpeed: 560,
  mouseSpeed: 32,
  fireSpread: 0.35,       // how much the mob's width spreads shots (0 = single column)
  fireSpreadMax: 34,      // max half-width of the shot column
  knockback: 5,
  zoomKills: 28,          // kills to fill the Zoomies meter
  zoomTime: 6,
  mouseHoming: 0.7,
  gateHitGain: 0.34,      // + per bullet on an add gate (≈3 hits per +1)
  gateAddMax: 30,
  divBreakHits: 40,       // ÷ gate breaks into ×2
  mulUpgradeHits: 70,     // hits per multiplier step (×2→×3 = 70, ×3→×4 = 140 …)
  gateCapK: 2.6,          // an add gate can be shot up to 2.6× its printed size (min 30)
  rows: 6, rowGap: 640, firstRow: 620,
  bossBaseSpeed: 15,
  bombEvery: 2.6,
  bombRadius: 26,
  bossTouchEat: 12,       // cats eaten per second if the boss reaches you
};

const WEAPONS = [

function rr(g,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,amt){ let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join(''); const n=parseInt(c,16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const f=amt<0?0:255, p=Math.abs(amt)/100;
  r=Math.round(r+(f-r)*p); g=Math.round(g+(f-g)*p); b=Math.round(b+(f-b)*p); return `rgb(${r},${g},${b})`; }

/* ---- cat, seen from behind while running ---- */
function drawCatBack(g,fur,collar,f,lead){
  const t=f/CAT_FR*TAU, bob=Math.sin(t*2)*0.7, la=Math.sin(t)*2, lb=-la, sw=Math.sin(t)*0.35;
  g.lineJoin='round'; g.lineCap='round';
  g.fillStyle='rgba(12,6,22,.32)'; ell(g,0,12,10,3.4); g.fill();
  const pawBack=fur.bib||fur.dark, pawFront=fur.bib||fur.base;
  g.fillStyle=pawBack; ell(g,-4.6,10+la*0.6,3,2.3); g.fill(); ell(g,4.6,10+lb*0.6,3,2.3); g.fill();
  g.fillStyle=pawFront; ell(g,-7,-1.5+lb*0.7,2.4,2.2); g.fill(); ell(g,7,-1.5+la*0.7,2.4,2.2); g.fill();
  g.strokeStyle=rgba('#000000',.25); g.lineWidth=0.6; ell(g,-7,-1.5+lb*0.7,2.4,2.2); g.stroke(); ell(g,7,-1.5+la*0.7,2.4,2.2); g.stroke();
  // body
  const by=2+bob;
  let gr=g.createRadialGradient(-2.5,by-5,0.5,0,by,11); gr.addColorStop(0,fur.light); gr.addColorStop(0.45,fur.base); gr.addColorStop(1,fur.dark);
  g.fillStyle=gr; ell(g,0,by,8.6,8.8); g.fill();

/* =========================================================
   LEVEL GENERATION — difficulty rises every level
   ========================================================= */
function diffHp(d,base){ return base*(1+(d-1)*DIFF.kLin)*Math.pow(DIFF.kExp,d-1); }
function applyGate([op,v],n){ return op==='add'?n+v:op==='mul'?n*v:Math.ceil(n/v); }
function genLevel(d,mods){
  mods=mods||{};
  const rng=mulberry(9001+d*7919+(mods.seed||0)), pick=a=>a[(rng()*a.length)|0], lo=leagueOf(d);
  const gates=[], waves=[], crates=[]; let E=CONFIG.baseStartArmy;
  for(let r=0;r<CONFIG.rows;r++){
    const z=CONFIG.firstRow+r*CONFIG.rowGap, a=Math.round(5+d*1.2+r*3);
    const hardP=d<6?0:Math.min(0.45,0.12+d*0.004);
    const pool=mods.mulOnly?['mulNeg','divAdd','mul3Div','mulMul']:r===0?['addNeg']:d<3?['addMul','mulNeg','divAdd','addMul']:rng()<hardP?['bothBad','divNeg','bothBad']:['addMul','mulNeg','divAdd','mul3Div','mulNeg','addAdd2'];
    let A,B;
    switch(pick(pool)){
      case 'addNeg': A=['add',a]; B=['add',-Math.ceil(a*0.6)]; break;
      case 'addMul': A=['add',a]; B=['mul',2]; break;
      case 'mulNeg': A=['mul',2]; B=['add',-a]; break;
      case 'divAdd': A=['div',2]; B=['add',Math.round(a*0.7)]; break;
      case 'mul3Div':A=['mul',3]; B=['div',2]; break;
      case 'mulMul': A=['mul',2]; B=['div',3]; break;
      case 'bothBad': A=['add',-a]; B=['div',2]; break;
      case 'divNeg': A=['div',3]; B=['add',-Math.round(a*1.5)]; break;
      default:       A=['add',a*2]; B=['add',-a];
    }
    if(rng()<0.5) [A,B]=[B,A];
    const mv=d>=15&&rng()<Math.min(0.6,0.2+(d-15)*0.02)?Math.min(70,22+d*0.45):0;
    gates.push([z,A,B,mv,Math.max(30,Math.round(a*CONFIG.gateCapK)),d<10?3:d<40?4:5]); E=Math.max(applyGate(A,E),applyGate(B,E));
    const cnt=Math.min(DIFF.countCap,Math.round((5+d*0.8)*(1+r*0.35))), hp=Math.max(1,Math.round(diffHp(d,2+r*0.6)*(mods.hpK||1)));
    const cx=120+rng()*160, wz=z+CONFIG.rowGap*0.5;
    waves.push([wz,cnt,hp,r,cx]);
    // weapon crates sit right behind a pack: you have to chew through it
    if(r===1||(d>=3&&r===4)) crates.push({z:wz+95,x:clamp(cx,70,330),hp:Math.round(diffHp(d,12)*(1+r*0.25)*1.6)});
  }
  const final=lo.endless?lo.local%10===0:lo.local===lo.L.n, king=final;
  const hp=Math.round(E*CONFIG.fireRatePerCat*DIFF.bossK*(1+(d-1)*0.03)*Math.pow(DIFF.kExp,d-1)*(king?1.2:1)*(final?DIFF.finalK:1)*(mods.bossK||1)*(d<=10?0.55+0.045*d:1));
  const RB=roomOf(lo.li).boss, sp=CONFIG.bossBaseSpeed+Math.min(30,d*0.3);
  return {d,li:lo.li,lg:lo.L,local:lo.local,endless:!!lo.endless,final,gates,waves,crates,length:CONFIG.firstRow+CONFIG.rows*CONFIG.rowGap,E,mods,
    boss:king?{type:'king',name:final&&!lo.endless?`The Rat King of the ${roomOf(lo.li).name}`:'The Rat King',hat:null,atk:RB.atk.concat(['lob']),hp,speed:sp}
             :{type:'brute',name:RB.name,hat:RB.hat,atk:RB.atk,hp,speed:sp}};
}

function clearWorld(){ Object.assign(G,{cats:[],bullets:[],enemies:[],gates:[],crates:[],bombs:[],sludge:[],parts:[],texts:[],decor:[],decorZ:-400,army:0,shown:0,
  boss:null,phase:'run',camZ:0,leadX:200,targetX:200,fireAcc:0,shake:0,peak:0,kills:0,fishRun:0,endT:0,runK:1,hitstop:0,flash:null,big:null,tier:0,zoom:0,zoomT:0,combo:0,comboT:0}); }

function startLevel(d,mods){
  const L=genLevel(d,mods); clearWorld(); G.level=L; G.rng=mulberry(77+d*31+((mods&&mods.seed)||0)); G.daily=!!(mods&&mods.daily);
  for(const [z,a,b,mv,cap,mm] of L.gates) G.gates.push({z,passed:false,fade:0,chosen:-1,split:200,mv:mv||0,ph:Math.random()*6,sides:[mkSide(a,24,196,cap,mm),mkSide(b,204,376,cap,mm)]});
  for(const [z,n,hp,r,cx] of L.waves) spawnWave(z,n,hp,r,d,cx);
  for(const c of L.crates) G.crates.push({...c,max:c.hp,flash:0,dead:false});
  G.tier=Math.min(S.up.arsenal,WEAPONS.length-1);
  setArmy(startArmy()*(L.mods.glass?3:1)); G.shown=G.army;
  const LG=L.lg; $('levelName').textContent=G.daily?`Daily challenge  ·  ${L.mods.label}`:LG.endless?`Endless  ·  Level ${L.local}`:`${LG.name} League  ·  Level ${L.local}`;
  $('progWrap').classList.remove('hidden'); $('bossWrap').classList.add('hidden');
  G.state='play'; showScreen(null); $('hud').classList.remove('hidden'); $('weapon').classList.remove('hidden'); updateWeaponUI();
  $('cardLv').textContent=G.daily?'Daily':`${LG.name} ${L.local}`; $('cardLv').style.color=LG===LEAGUES[5]?'#e8e0f5':G.daily?'#ff9be0':LG.c; $('cardBoss').textContent=`${roomOf(L.li).name}  ·  ${L.final?'League boss':'Boss'}: ${L.boss.name}`; $('cardHp').textContent=`${fmt(L.boss.hp)} HP. Grow your mob to beat it.`;
  const card=$('card'); card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
  Sfx.meow(1.1);
}
function mkSide([op,val],x0,x1,cap,mm){ return {op,val,x0,x1,cap:cap||30,mulMax:mm||3,hits:0,steps:0,bump:0,flash:0}; }
function spawnWave(z,count,hp,r,d,cx){
  const rng=G.rng, cols=Math.min(7,Math.max(3,Math.ceil(Math.sqrt(count*1.4)))), M=G.level.mods, nFat=d>=3?Math.min(6,1+Math.floor(d/10)):0;
  for(let i=0;i<count;i++){ const row=(i/cols)|0, c=i%cols; const u=rng();
    let type='mouse'; if(M.allShield) type=i%5===0?'fat':'shield'; else if(i<nFat) type='fat'; else if(d>=2&&u<0.18) type='shield'; else if(d>=1&&r>=1&&u<0.42) type='runner';
    const T=ETYPES[type], x=cx+(c-(cols-1)/2)*24+(row%2?11:0)+(rng()-.5)*6;
    const h=Math.max(1,Math.round(hp*T.hpK));
    G.enemies.push({id:G.uid++,type,x:clamp(x,48,352),z:z+row*26+(rng()-.5)*8+(type==='runner'?120:0),hp:h,max:h,sh:T.shield?h*T.shield:0,shMax:T.shield?h*T.shield:0,
      sp:CONFIG.mouseSpeed*T.sp*(0.85+rng()*0.3)*(M.fast?1.5:1),ph:rng()*10,flash:0,active:false,wn:count}); }
  if(d>=5&&r>=3){ const h=Math.round(diffHp(d,2)*30); G.enemies.push({id:G.uid++,type:'elite',x:clamp(cx,70,330),z:z+Math.ceil(count/cols)*26+40,hp:h,max:h,sh:0,shMax:0,sp:CONFIG.mouseSpeed*ETYPES.elite.sp,ph:rng()*10,flash:0,active:false,wn:5}); }
}
function spawnDecor(){
  const top=G.camZ+PSY+80;
  while(G.decorZ<top){ G.decorZ+=90+Math.random()*170; const left=Math.random()<0.5;
    G.decor.push({x:left?14+Math.random()*6:386-Math.random()*6,z:G.decorZ,s:(Math.random()*getDecor(curRoomIdx()).length)|0,r:(Math.random()-.5)*0.6}); }
  const bottom=G.camZ-(VIEW_H-PSY)-60; while(G.decor.length&&G.decor[0].z<bottom) G.decor.shift();
}

/* =========================================================
   UPDATE
   ========================================================= */
const keys={};
function update(rdt){
  if(G.state==='paused'||G.state==='result') return;
  let dt=rdt; if(G.hitstop>0){ G.hitstop-=rdt; dt=rdt*0.12; }
  G.time+=dt;
  const playing=G.state==='play', menu=G.state==='menu', won=G.state==='won';
  if(G.state==='lost'){ G.runK=Math.max(0,G.runK-rdt*1.5); G.endT+=rdt; if(G.endT>1.4){ showResult(false); return; } }
  if(won){ G.endT+=rdt; if(G.endT>2){ showResult(true); return; } }
  if(G.phase==='boss') G.runK=Math.max(0,G.runK-dt*1.3);
  const mk=G.state==='lost'?G.runK:1;

  // steering
  if(menu) G.targetX=200+Math.sin(G.time*0.7)*90;
  if(playing){ if(keys.left) G.targetX-=280*rdt; if(keys.right) G.targetX+=280*rdt; }
  G.targetX=clamp(G.targetX,CONFIG.leadMin,CONFIG.leadMax);
  G.leadX+=(G.targetX-G.leadX)*Math.min(1,rdt*14);
  G.camZ+=CONFIG.runSpeed*dt*G.runK*(menu?0.6:1)*(G.zoomT>0?1.15:1);
  if(G.zoomT>0){ G.zoomT-=dt; if(G.zoomT<=0) $('zoomWrap').classList.remove('on'); }
  if(G.comboT>0){ G.comboT-=rdt; if(G.comboT<=0) G.combo=0; }
  spawnDecor();

  // cats
  for(let i=0;i<G.cats.length;i++){ const c=G.cats[i];
    if(i===0){ c.x=G.leadX; c.rz=0; continue; }
    const s=slot(i), k=Math.min(1,rdt*(11-Math.min(7,Math.sqrt(i)*0.7)));
    c.x+=(G.leadX+s.x+Math.sin(G.time*5+c.ph*9)*0.6-c.x)*k; c.x=clamp(c.x,26,374);
    c.rz+=(s.z-c.rz)*Math.min(1,rdt*6);
    if(c.spawn<1) c.spawn=Math.min(1,c.spawn+rdt*3.5);
  }

  // firing
  if((playing||menu||won)&&G.army>0){
    const zm=G.zoomT>0?2:1, W=WEAPONS[G.tier], want=G.army*CONFIG.fireRatePerCat*(menu?1:rateMult())*zm, rate=Math.min(want,Q().shots*(zm>1?1.5:1));
    const dmg=want*CONFIG.catDamage*(menu?1:dmgMult())*W.mult/rate;
    G.fireAcc+=rate*dt; if(!menu) G.dpsNow=want*CONFIG.catDamage*dmgMult()*W.mult/zm;
    while(G.fireAcc>=1){ G.fireAcc-=1; const c=G.cats[(Math.random()*G.cats.length)|0];
      const bx=G.leadX+clamp((c.x-G.leadX)*CONFIG.fireSpread,-CONFIG.fireSpreadMax,CONFIG.fireSpreadMax)+(Math.random()-.5)*3;
      G.bullets.push({x:bx,z:G.camZ+10+c.rz*0.15,d:dmg,t:G.tier,p:W.pierce,hit:null}); }
    if(playing) Sfx.shoot(G.tier);
  }

  // bullets
  const topZ=G.camZ+PSY+30;
  for(let i=G.bullets.length-1;i>=0;i--){ const b=G.bullets[i], W=WEAPONS[b.t], pz=b.z; b.z+=CONFIG.bulletSpeed*W.spd*dt;
    let dead=false;
    for(const gt of G.gates){ if(gt.passed||gt.z<=pz||gt.z>b.z) continue;
      const s=b.x<gt.split?gt.sides[0]:gt.sides[1]; if(b.x>=s.x0&&b.x<=s.x1){ hitGate(s,b); dead=true; break; } }
    if(!dead) for(const c of G.crates){ if(c.dead) continue;
      if(c.z>pz-12&&c.z<b.z+12&&Math.abs(c.x-b.x)<16){ c.hp-=b.d; c.flash=1; sparks(b.x,c.z-6,'#ffe7a3',2); Sfx.thud(); if(c.hp<=0) openCrate(c); dead=true; break; } }
    const B=G.boss;
    if(!dead&&B&&!B.dead&&!(B.hidden>0)&&B.z>pz-B.r&&B.z<b.z+B.r&&Math.abs(B.x-b.x)<B.r){ hitBoss(b.d,b.x,B.z-B.r*0.5); dead=true; }
    if(!dead) for(let j=G.enemies.length-1;j>=0;j--){ const e=G.enemies[j]; if(!e.active) continue; const T=ETYPES[e.type];
      if(b.hit&&b.hit.includes(e.id)) continue;
      if(e.z>pz-T.r&&e.z<b.z+T.r&&Math.abs(e.x-b.x)<T.r){
        const ex=e.x, ez=e.z, eid=e.id; damageEnemy(j,b.d);
        if(W.splash) splash(ex,ez,W.splash,b.d*0.6,eid);
        if(b.p>0){ b.p--; (b.hit||(b.hit=[])).push(eid); } else dead=true;
        break; } }
    if(dead||b.z>topZ) G.bullets.splice(i,1);
  }

  // gates
  for(let i=G.gates.length-1;i>=0;i--){ const gt=G.gates[i];
    if(gt.mv&&!gt.passed){ gt.split=200+Math.sin(G.time*0.9+gt.ph)*gt.mv; gt.sides[0].x1=gt.split-4; gt.sides[1].x0=gt.split+4; }
    for(const s of gt.sides){ s.bump=Math.max(0,s.bump-rdt*6); s.flash=Math.max(0,s.flash-rdt*2.5); }
    if(!gt.passed&&playing&&G.camZ>=gt.z) passGate(gt);
    if(gt.passed) gt.fade+=rdt;
    if(gt.z<G.camZ-(VIEW_H-PSY)-80) G.gates.splice(i,1);
  }
  // crates
  for(const c of G.crates){ c.flash=Math.max(0,c.flash-rdt*8); if(!c.dead&&playing&&G.camZ>=c.z){ c.dead=true; poof(c.x,c.z,'#c8914f',8); } }
  G.crates=G.crates.filter(c=>!c.dead);

  // enemies
  const rb=blobR()+4, cz=blobCZ();
  for(let i=G.enemies.length-1;i>=0;i--){ const e=G.enemies[i], T=ETYPES[e.type], rel=e.z-G.camZ;
    if(!e.active){ if(rel<PSY+70){ e.active=true;
        if(G.level&&G.dpsNow){ const fl=G.dpsNow*waveT(G.level.d)*(e.type==='elite'?0.35:T.hpK/Math.max(4,e.wn||10)); if(fl>e.hp){ e.hp=e.max=Math.round(fl); if(e.shMax){ e.sh=e.shMax=Math.round(fl*T.shield); } } }
        if(e.type==='elite'){ worldText(e.x,e.z-30,'Elite!','#ff9ab0',0.9); Sfx.roar(); } } else continue; }
    if(!e.charge&&(e.type==='mouse'||e.type==='fat'||e.type==='elite')&&rel<200&&G.phase==='run'){ e.charge=true; e.cT=0.6; e.sp*=1.9; if(Math.random()<0.3) Sfx.squeak(); }
    if(e.cT>0) e.cT-=rdt;
    e.z-=e.sp*dt*mk;
    if(rel<320){ const dx=G.leadX-e.x; e.x+=Math.sign(dx)*Math.min(Math.abs(dx),40)*CONFIG.mouseHoming*dt*mk; }
    e.x+=Math.sin(G.time*5+e.ph)*6*dt*mk; e.x=clamp(e.x,30,370); e.flash=Math.max(0,e.flash-rdt*8);
    if(playing&&G.army>0){ const dx=e.x-G.leadX, dz=(e.z-G.camZ-cz)/0.62, rr2=rb+T.r-8, lz=e.z-G.camZ, lr=T.r+9;
      if(dx*dx+dz*dz<rr2*rr2||dx*dx+lz*lz<lr*lr){ G.enemies.splice(i,1); poof(e.x,e.z,VILLAINS[S.villain].body,6); Sfx.lost(); G.shake=Math.max(G.shake,3);
        const bite=catsLost(T.bite*(G.level.mods.glass?2:1)); if(bite<T.bite) popText(e.x,10,'Blocked!','#bfe9ff',0.6); setArmy(G.army-bite); if(bite>1) popText(e.x,10,'−'+bite,'#ff8a9a',0.8); buzz(12,'bite'); if(G.army<=0) lose(); continue; } }
    if(rel<-(VIEW_H-PSY)-40) G.enemies.splice(i,1);
  }

  // boss
  if(playing&&G.phase==='run'&&G.level&&G.camZ>=G.level.length) startBoss();
  const B=G.boss;
  if(B&&!B.dead&&playing){ B.t+=dt; B.flash=Math.max(0,B.flash-rdt*8);
    const dist=B.z-G.camZ, rest=PSY-VIEW_H*0.27, touch=B.r*0.7+16;
    if(!B.enraged&&B.t>B.enrageT){ B.enraged=true; showBig('Enraged!','It\'s coming for you. Finish it!','#ff4d6d',1); Sfx.roar(); G.shake=10; buzz([100,50,100]); $('bossBar').classList.add('enraged'); }
    if(!B.angry&&B.hp<B.max*0.5){ B.angry=true; worldText(B.x,B.z+B.r,'It\'s angry!','#ff9ab0',1); Sfx.roar(); G.shake=8; }
    if(B.chg){ const c=B.chg; c.t-=dt;
      if(c.ph==='tele'){ B.x+=(c.x-B.x)*Math.min(1,dt*6); if(c.t<=0){ c.ph='dash'; Sfx.roar(); } }
      else if(c.ph==='dash'){ B.z-=520*dt; B.x=c.x; if(B.z-G.camZ<=10){ B.z=G.camZ+10; c.ph='back'; G.shake=12; Sfx.boom(); buzz([60,40,90]); if(playing) killCatsAt(B.x,G.camZ-10,B.r*1.15); poof(B.x,G.camZ,'#8a5a32',18); } }
      else { B.z+=230*dt; if(B.z-G.camZ>=rest){ B.z=G.camZ+rest; B.chg=null; B.bx=clamp(B.x,110,290); B.t0=B.t; } } }
    else if(dist>rest) B.z-=Math.max(B.speed,140)*dt;
    else if(!B.enraged) B.z=G.camZ+rest;
    else if(dist>touch) B.z-=Math.max(40,B.speed)*dt;
    else { B.eatAcc+=CONFIG.bossTouchEat*dt; G.shake=Math.max(G.shake,3);
      if(B.enraged) B.eatAcc+=Math.max(0,G.army*0.08-CONFIG.bossTouchEat)*dt; while(B.eatAcc>=1&&G.army>0){ B.eatAcc-=1; if(catsLost(1)) setArmy(G.army-1); Sfx.lost(); buzz(15,'eat'); } if(G.army<=0) lose(); }
    if(!B.chg) B.x=B.bx+Math.sin(B.t*0.55)*(B.type==='king'?60:Math.min(80,B.bx-60,340-B.bx)); if(B.type==='king') B.rot+=dt*0.7;
    if(B.hidden>0){ B.hidden-=dt; if(B.hidden<=0) bossSurface(B); }
    B.bombT-=dt;
    if(B.bombT<=0&&dist<=rest+5&&!(B.hidden>0)&&!B.chg){ B.bombT=CONFIG.bombEvery*(0.85+Math.random()*0.3)*(G.level.d>=50?0.85:1)*(B.angry?0.8:1)*(B.enraged?0.7:1)*(G.level.d<=5?1.25:1); bossAttack(B); }
    B.lag+=(B.hp-B.lag)*Math.min(1,rdt*2.5);
    if(B.dn>0&&G.time-B.dnT>0.22){ B.dnT=G.time; G.texts.push({x:B.x+(Math.random()-.5)*30,z:B.z+B.r*0.6,txt:fmt(B.dn),col:'#ffe07a',size:0.62,life:0.6,world:true}); B.dn=0; }
    if(B.splits.length&&B.hp/B.max<B.splits[0]){ B.splits.shift(); Sfx.roar(); G.shake=9;
      const n=4+Math.ceil(G.level.d*0.8), hp=Math.round(2+G.level.d*0.6);
      for(let k=0;k<n;k++){ const a=k/n*TAU; G.enemies.push({id:G.uid++,type:k%3===0?'runner':'mouse',x:clamp(B.x+Math.cos(a)*B.r,40,360),z:B.z+Math.sin(a)*B.r*0.6,hp,max:hp,sh:0,shMax:0,sp:CONFIG.mouseSpeed*(k%3===0?2:1.1),ph:Math.random()*10,flash:0,active:true}); }
      worldText(B.x,B.z+B.r,'Split!','#ff8a9a',1); }
  }
  for(let i=G.sludge.length-1;i>=0;i--){ const w=G.sludge[i]; w.z-=w.sp*dt;
    if(!w.hit&&w.z<=G.camZ+4){ w.hit=true; Sfx.boom(); G.shake=Math.max(G.shake,6);
      if(playing) killCatsWhere((cx)=>Math.abs(cx-w.gx)>w.gw/2&&Math.random()<0.6,w.gx); }
    if(w.z<G.camZ-(VIEW_H-PSY)-40) G.sludge.splice(i,1); }
  for(let i=G.bombs.length-1;i>=0;i--){ const bm=G.bombs[i]; bm.t+=dt;
    if(bm.t>=bm.dur){ G.bombs.splice(i,1); Sfx.boom(); poof(bm.x,bm.z,'#ffd23f',14); addPart({k:'ring',x:bm.x,z:bm.z,life:0.4,max:0.4,c:'#ffec9a',s:CONFIG.bombRadius*1.6});
      if(playing) killCatsAt(bm.x,bm.z,CONFIG.bombRadius); buzz(40,'bomb'); } }

  // fx

  $('menuFish').textContent=fmt(S.fish); const n=curLevel(), lo=leagueOf(n);
  if(lo.endless) $('menuLeague').innerHTML=`<span class="lb" style="${lvVars(ENDLESS)}">Endless mode</span><span class="lp">Best: level ${S.level-1-MAX_LEVEL>0?S.level-1-MAX_LEVEL:0}  ·  ★ ${totalStars()}</span>`;
  else $('menuLeague').innerHTML=`<span class="lb" style="${lvVars(lo.L)}">${lo.L.name} League</span><span class="lp">${roomOf(lo.li).name}  ·  ${lo.local-1} of ${lo.L.n} cleared  ·  ★ ${totalStars()}</span>`;
  $('playBtn').innerHTML=`Continue<small>${lo.endless?'Endless '+lo.local:lo.L.name+' '+lo.local}${(lo.endless?lo.local%10===0:lo.local===lo.L.n)?'  ·  League boss':''}</small>`;
  $('shopBtn').innerHTML='Upgrades'+(canAfford()?'<span class="dot"></span>':'');
  $('dailyBtn').innerHTML='Daily'+(dailyDone()?' ✓':'<span class="dot"></span>');
  $('cafeBtn').innerHTML=`Cat Café<span class="badge">${S.rescued.length}/${STRAYS.length}</span>`;
}
function toMenu(){ clearWorld(); G.level=null; G.daily=false; G.state='menu'; setArmy(9); $('hud').classList.add('hidden'); $('weapon').classList.add('hidden'); $('card').classList.remove('show'); refreshMenu(); showScreen('menu'); }
function sizeCanvas(c,css){ const d=Math.min(2,window.devicePixelRatio||1); c.width=css*d; c.height=css*d; const g=c.getContext('2d'); g.setTransform(c.width/100,0,0,c.height/100,0,0); return g; }
function showMoment(kind,title,text,li,stray){
  $('resMoment').classList.remove('hidden'); $('momentTitle').textContent=title; $('momentText').textContent=text;
  const g=sizeCanvas($('momentArt'),84); g.clearRect(0,0,100,100);
  if(kind==='stray'){ g.save(); g.translate(4,4); g.scale(0.92,0.92); drawCatFace(g,FURS[stray.fur],EYES[stray.eyes].c,COLLARS[stray.collar].c,0); g.restore(); drawHeart(g,86,16,1.6,'#ff5a7e'); }
  else drawThanksArt(g,li);
}
function showResult(won){
  if(G.state==='result') return; G.state='result'; $('hud').classList.add('hidden'); $('weapon').classList.add('hidden'); $('resMoment').classList.add('hidden');
  const L=G.level, d=L.d, LG=L.lg; let st=0, bonus=0;
  if(won&&!G.daily){ const keep=G.army/Math.max(1,G.peak); st=keep>=0.7?3:keep>=0.4?2:1; G.fishRun+=15+4*d+st*(3+Math.round(d*0.5));
    S.stars[d]=Math.max(S.stars[d]||0,st); if(d>=S.level) S.level=d+1; }
  if(won&&G.daily){ G.fishRun+=15+4*d; if(!dailyDone()){ const ds=dailySetup(); bonus=ds.bonus; S.daily.streak=(S.daily.last===prevDayKey()?(S.daily.streak||0):0)+1; S.daily.last=ds.key; S.daily.done=ds.key; bonus=Math.round(bonus*(1+Math.min(6,S.daily.streak-1)*0.15)); } }
  const leagueDone=won&&L.final&&!G.daily;
  // stray rescue and thank-you moments (not every level)
  let moment=null;
  if(won&&!G.daily){ const stray=STRAYS.find(x=>x.lvl===d&&!S.rescued.includes(x.name));
    if(stray){ S.rescued.push(stray.name); moment=['stray',`You rescued ${stray.name}!`,`Found ${stray.where}. ${stray.desc}, forever.`,L.li,stray]; }
    else if(leagueDone){ const k=Math.round(30+d*2); bonus+=k*2; S.thanks++; moment=['thanks',`A letter from ${roomOf(L.li).human.name}`,LEAGUE_LETTER[L.li%6]+`  (+${k*2} 🐟)`,L.li]; }
    else if(d>=2&&Math.random()<0.28){ const k=Math.round(8+d*1.5); bonus+=k; S.thanks++; const lines=THANKS[L.li%6];
      moment=['thanks',`${roomOf(L.li).human.name} says thank you`,lines[(Math.random()*lines.length)|0].replace('{k}',G.kills)+`  (+${k} 🐟)`,L.li]; } }
  const fish=Math.round(G.fishRun*fishMult())+bonus; S.fish+=fish; saveStore();
  $('resTitle').textContent=G.daily?(won?'Daily cleared!':'Daily failed'):leagueDone?(L.endless?`Endless ${L.local} cleared!`:`${LG.name} League complete!`):won?(L.endless?`Endless ${L.local} cleared!`:`${LG.name} ${L.local} cleared!`):'The rat pack won';
  let sub;
  if(G.daily) sub=won?(bonus?`Daily bonus +${fmt(bonus)} 🐟  ·  ${S.daily.streak}-day streak`:'Already claimed today. Come back tomorrow for a new one.'):'The daily resets at midnight. You can retry as often as you like.';
  else if(leagueDone&&!L.endless) sub=L.li<LEAGUES.length-1?`${LEAGUES[L.li+1].name} League unlocked: the ${roomOf(L.li+1).name}.`:'You beat every league. Endless mode and the Cat Tower are open.';
  else if(won) sub=st===3?'Flawless. You kept most of your mob.':`Keep ${st===1?'40':'70'}% of your biggest mob to earn the next star.`;
  else if(G.phase==='boss'&&G.boss){ const left=Math.round(Math.max(0,G.boss.hp)/G.boss.max*100); sub=`The boss had ${left}% HP left. ${left>50?'Try Sharp claws or Boss hunter.':'So close. One more upgrade should do it.'}`; }
  else { const pct=Math.round(clamp(G.camZ/L.length,0,1)*100); const tips=['Park under a red gate and shoot it. It turns blue once it goes above zero.','Shoot a ×2 gate long enough and it becomes ×3.','The weapon crate sits behind the pack. Push through it.','Thick fur saves cats from bites, cheese and sludge.','Quick paws also make gates charge faster.'];
    sub=`You made it ${pct}% of the way. ${tips[(G.time*7|0)%tips.length]}`; }
  $('resSub').textContent=sub;
  $('resArmy').textContent=fmt(G.army); $('resKills').textContent=fmt(G.kills); $('resFish').textContent='+'+fmt(fish);
  const spans=$('resStars').children; for(let i=0;i<3;i++){ spans[i].classList.remove('on'); if(i<st) setTimeout(()=>spans[i].classList.add('on'),250+i*220); }
  $('resStars').style.display=won&&!G.daily?'flex':'none';
  $('againBtn').textContent=G.daily?'Play daily again':won?(leagueDone&&!L.endless&&L.li<LEAGUES.length-1?`Start ${LEAGUES[L.li+1].name} League`:'Next level'):'Try again';
  $('againBtn').dataset.next=G.daily?'daily':String(won?d+1:d);
  $('resShopBtn').innerHTML='Upgrades'+(canAfford()?'<span class="dot"></span>':'');
  if(moment) showMoment(...moment);
  if(won) buzz([30,60,30]);
  showScreen('result');
}
function prevDayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
let shopTab='up';
function buildShop(){
  $('shopFish').textContent=fmt(S.fish);
  [...$('shopTabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===shopTab));
  if(shopTab==='hats'){
    $('shopRows').innerHTML=HATS.map(h=>{ const own=S.hats.includes(h.key), on=S.hat===h.key;
      return `<div class="up"><div class="ic">${HAT_ICON[h.key]}</div><div class="info"><b>${h.name}</b><span>${own?(on?'Wearing it':'Owned'):'Your leader wears it into battle'}</span></div>
        <button class="buy" data-h="${h.key}" ${on||(!own&&S.fish<h.cost)?'disabled':''}>${on?'On':own?'Wear':'🐟 '+fmt(h.cost)}</button></div>`; }).join('');
    return; }
  const endless=S.level>MAX_LEVEL;
  $('shopRows').innerHTML=UPGRADES.filter(u=>!u.endless||endless).map(u=>{ const l=S.up[u.key], maxed=l>=u.max, cost=upCost(u);
    const pips=u.max<=30?`<div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>`:`<em>Level ${l}</em>`;
    return `<div class="up"><div class="ic">${u.icon}</div><div class="info"><b>${u.name}</b><span>${maxed?u.eff(l):u.eff(l)+' → '+u.eff(l+1)}</span><em>${u.tip}</em>${pips}</div>
      <button class="buy" data-k="${u.key}" ${maxed||S.fish<cost?'disabled':''}>${maxed?'Max':'🐟 '+fmt(cost)}</button></div>`; }).join('');
}
$('shopTabs').onclick=e=>{ const b=e.target.closest&&e.target.closest('button[data-t]'); if(!b) return; shopTab=b.dataset.t; buildShop(); };
$('shopRows').onclick=e=>{ const b=e.target.closest&&e.target.closest('button[data-k],button[data-h]'); if(!b||b.disabled) return; Sfx.init();
  if(b.dataset.h){ const h=HATS.find(x=>x.key===b.dataset.h); if(!S.hats.includes(h.key)){ if(S.fish<h.cost) return; S.fish-=h.cost; S.hats.push(h.key); }
    S.hat=h.key; saveStore(); buildSprites(); Sfx.coin(); Sfx.meow(1.2); buildShop(); return; }
  const u=UPGRADES.find(x=>x.key===b.dataset.k), cost=upCost(u); if(S.fish<cost||S.up[u.key]>=u.max) return;
  S.fish-=cost; S.up[u.key]++; saveStore(); Sfx.coin(); buzz(15); buildShop(); };
function buildCafe(){
  $('cafeInfo').textContent=`${S.rescued.length} of ${STRAYS.length} strays rescued  ·  ${S.thanks} thank-you notes from the humans`;
  const host=$('cafeGrid'); host.innerHTML='';
  for(const s of STRAYS){ const got=S.rescued.includes(s.name), lo=leagueOf(s.lvl);
    const card=document.createElement('div'); card.className='card'+(got?'':' lock');
    const c=document.createElement('canvas'); card.appendChild(c);
    const b=document.createElement('b'); b.textContent=got?s.name:'???'; card.appendChild(b);
    const sp=document.createElement('span'); sp.textContent=got?s.desc:`Clear ${lo.L.name} ${lo.local}`; card.appendChild(sp);
    host.appendChild(card);
    const g=sizeCanvas(c,64); drawCatFace(g,FURS[s.fur],EYES[s.eyes].c,COLLARS[s.collar].c,0);
    if(!got){ g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(30,18,52,.94)'; g.fillRect(0,0,100,100); g.globalCompositeOperation='source-over'; g.fillStyle='#c7b6e6'; g.font=`700 34px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('?',50,58); } }
}
function buildDaily(){ const ds=dailySetup(), lo=leagueOf(ds.d);
  $('dailyDate').textContent=`Today's challenge  ·  ${ds.key}`;
  $('dailyInfo').innerHTML=`<div class="dl"><p><b>${ds.mods.label}</b></p><p>${ds.mods.desc}</p><p>Difficulty: ${lo.endless?'Endless '+lo.local:lo.L.name+' '+lo.local}  ·  ${roomOf(lo.li).name}</p>
    <p>Reward: <b>1.5× fish</b> plus a <b>${fmt(ds.bonus)} 🐟</b> first-clear bonus${S.daily.streak?`  ·  streak ${S.daily.streak}`:''}</p><p>${dailyDone()?'✓ Claimed today. Replays still pay 1.5× fish.':'Keep a streak going for up to +90% bonus.'}</p></div>`; }
function buildCustomize(){
  const host=$('customRows'); host.innerHTML='';
  const rows=[
    ['fur','Fur',FURS,k=>{const f=FURS[k]; return f.patches?`conic-gradient(${f.base} 0 50%,${f.patches[0]} 0 75%,${f.patches[1]} 0)`:f.bib?`linear-gradient(135deg,${f.base} 55%,${f.bib} 0)`:f.stripe?`repeating-linear-gradient(135deg,${f.base} 0 7px,${f.stripe} 7px 10px)`:`radial-gradient(circle at 35% 30%,${f.light},${f.base} 55%,${f.dark})`;}],
    ['eyes','Eyes',EYES,k=>`radial-gradient(circle,#140d1a 0 18%,${EYES[k].c} 20%)`],
    ['collar','Team color',COLLARS,k=>COLLARS[k].c],
    ['villain','Rat pack',VILLAINS,k=>{const v=VILLAINS[k]; return `radial-gradient(circle at 36% 45%,${v.eye} 0 10%,transparent 12%),radial-gradient(circle at 64% 45%,${v.eye} 0 10%,transparent 12%),${v.body}`;}],
  ];
  for(const [key,label,map,bg] of rows){
    const row=document.createElement('div'); row.className='row';
    const h=document.createElement('h3'); const sm=document.createElement('small'); h.textContent=label; sm.textContent=map[S[key]].name; h.appendChild(sm); row.appendChild(h);
    const sw=document.createElement('div'); sw.className='sw';
    for(const k of Object.keys(map)){ const b=document.createElement('button'); b.className='swb'+(S[key]===k?' on':''); b.style.background=bg(k); b.setAttribute('aria-label',`${label}: ${map[k].name}`); b.title=map[k].name;
      b.onclick=()=>{ S[key]=k; saveStore(); sm.textContent=map[k].name; [...sw.children].forEach(x=>x.classList.toggle('on',x===b)); buildSprites(); refreshFurs(); Sfx.init(); if(key==='villain') Sfx.squeak(); else Sfx.meow(1+Math.random()*0.15); };
      sw.appendChild(b); }
    row.appendChild(sw); host.appendChild(row);
  }
  const row=document.createElement('div'); row.className='row'; row.innerHTML='<h3>Mob look</h3>';
  const seg=document.createElement('div'); seg.className='seg';
  for(const [k,t] of [['mixed','Mixed strays'],['match','All match me']]){ const b=document.createElement('button'); b.textContent=t; if(S.armyLook===k) b.classList.add('on');
    b.onclick=()=>{ S.armyLook=k; saveStore(); [...seg.children].forEach(x=>x.classList.toggle('on',x===b)); refreshFurs(); }; seg.appendChild(b); }
  row.appendChild(seg); host.appendChild(row);
}

function setMuteUI(){ $('muteBtn').textContent=S.muted?'✕':'♪'; $('muteBtn').setAttribute('aria-pressed',String(S.muted)); }
$('playBtn').onclick=()=>{ Sfx.init(); startLevel(curLevel()); };
let viewLeague=0;
function buildLevels(){
  const endlessOk=S.level>MAX_LEVEL;
  $('leagueTabs').innerHTML=LEAGUES.map((X,i)=>{ const ok=leagueStart(i)<=S.level; return `<button class="tab${i===viewLeague?' on':''}" data-li="${i}" style="${lvVars(X)}" ${ok?'':'disabled'}>${ok?'':'🔒 '}${X.name}</button>`; }).join('')
    +`<button class="tab${viewLeague===6?' on':''}" data-li="6" style="${lvVars(ENDLESS)}" ${endlessOk?'':'disabled'}>${endlessOk?'':'🔒 '}Endless ∞</button>`;
  let h='';
  if(viewLeague===6){ const top=S.level-MAX_LEVEL, from=Math.max(1,top-19);
    $('leagueInfo').textContent=`Infinite levels. Every 10th is a Rat King. Best: ${Math.max(0,top-1)}`;
    for(let k=from;k<=top;k++){ const g=MAX_LEVEL+k, s=S.stars[g]||0; h+=`<button class="lv${g===curLevel()?' cur':''}" data-g="${g}" style="${lvVars(ENDLESS)}"><b>${k}</b>${k%10===0?'<i>👑</i>':''}<span>${'★'.repeat(s)+'☆'.repeat(3-s)}</span></button>`; }
    $('levelGrid').innerHTML=h; return; }
  const L=LEAGUES[viewLeague], start=leagueStart(viewLeague);
  let st=0; for(let k=0;k<L.n;k++) st+=S.stars[start+k]||0;
  $('leagueInfo').textContent=`${roomOf(viewLeague).name}  ·  ${L.n} levels  ·  ★ ${st} of ${L.n*3}`;
  for(let k=1;k<=L.n;k++){ const g=start+k-1, ok=g<=S.level, s=S.stars[g]||0, stray=STRAYS.find(x=>x.lvl===g&&!S.rescued.includes(x.name));
    h+=`<button class="lv${g===curLevel()?' cur':''}" data-g="${g}" style="${lvVars(L)}" ${ok?'':'disabled'} aria-label="${L.name} level ${k}${ok?'':' locked'}"><b>${k}</b>${k===L.n?'<i>👑</i>':stray?'<i>🐱</i>':''}<span>${ok?'★'.repeat(s)+'☆'.repeat(3-s):'🔒'}</span></button>`; }
  $('levelGrid').innerHTML=h;
}
$('levelsBtn').onclick=()=>{ Sfx.init(); const lo=leagueOf(curLevel()); viewLeague=lo.endless?6:lo.li; buildLevels(); showScreen('levels'); };
$('levelsBack').onclick=()=>{ refreshMenu(); showScreen('menu'); };
$('leagueTabs').onclick=e=>{ const b=e.target.closest&&e.target.closest('button[data-li]'); if(!b||b.disabled) return; viewLeague=+b.dataset.li; buildLevels(); };
$('levelGrid').onclick=e=>{ const b=e.target.closest&&e.target.closest('button[data-g]'); if(!b||b.disabled) return; Sfx.init(); startLevel(+b.dataset.g); };
$('shopBtn').onclick=()=>{ Sfx.init(); shopReturn='menu'; shopTab='up'; buildShop(); showScreen('shop'); };
$('resShopBtn').onclick=()=>{ shopReturn='result'; buildShop(); showScreen('shop'); };
$('shopBack').onclick=()=>{ if(shopReturn==='menu'){ refreshMenu(); showScreen('menu'); } else { $('resShopBtn').innerHTML='Upgrades'+(canAfford()?'<span class="dot"></span>':''); showScreen('result'); } };
$('customBtn').onclick=()=>{ Sfx.init(); buildCustomize(); showScreen('custom'); };
$('doneBtn').onclick=()=>showScreen('menu');
$('pauseBtn').onclick=()=>pause();
$('resumeBtn').onclick=()=>{ G.state='play'; showScreen(null); $('hud').classList.remove('hidden'); lastT=performance.now(); };
$('restartBtn').onclick=()=>startLevel(G.level?G.level.d:curLevel(),G.level&&G.level.mods.daily?G.level.mods:undefined);
$('quitBtn').onclick=toMenu;
$('againBtn').onclick=()=>{ Sfx.init(); const n=$('againBtn').dataset.next; if(n==='daily'){ const ds=dailySetup(); startLevel(ds.d,ds.mods); } else startLevel(parseInt(n,10)||1); };
$('dailyBtn').onclick=()=>{ Sfx.init(); buildDaily(); showScreen('dailyS'); };
$('dailyGo').onclick=()=>{ const ds=dailySetup(); startLevel(ds.d,ds.mods); };
$('dailyBack').onclick=()=>{ refreshMenu(); showScreen('menu'); };
$('cafeBtn').onclick=()=>{ Sfx.init(); showScreen('cafe'); buildCafe(); };
$('cafeBack').onclick=()=>{ refreshMenu(); showScreen('menu'); };
function setGfxUI(){ document.querySelectorAll('.gfxBtn').forEach(b=>b.textContent=`Graphics: ${S.gfx==='auto'?`Auto (${Q().name})`:S.gfx==='high'?'High':S.gfx==='medium'?'Medium':'Battery saver'}`); }
document.querySelectorAll('.gfxBtn').forEach(b=>b.onclick=()=>{ const order=['auto','high','medium','low']; S.gfx=order[(order.indexOf(S.gfx)+1)%order.length]; saveStore(); setQuality(S.gfx==='low'?2:S.gfx==='medium'?1:0); setGfxUI(); });
function setHapUI(){ document.querySelectorAll('.hapBtn').forEach(b=>b.textContent=`Vibration: ${S.haptics?'on':'off'}`); }
document.querySelectorAll('.hapBtn').forEach(b=>b.onclick=()=>{ S.haptics=!S.haptics; saveStore(); setHapUI(); buzz(30); });
$('menuBtn').onclick=toMenu;
$('muteBtn').onclick=()=>{ S.muted=!S.muted; saveStore(); Sfx.init(); Sfx.setMuted(S.muted); setMuteUI(); };
function pause(){ if(G.state!=='play') return; G.state='paused'; showScreen('pause'); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });

let dragging=false, lastX=0;
cv.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; try{cv.setPointerCapture(e.pointerId);}catch(_){} Sfx.init(); });
cv.addEventListener('pointermove',e=>{ if(!dragging||G.state!=='play'){ lastX=e.clientX; return; } G.targetX+=(e.clientX-lastX)/SCALE*CONFIG.steerSens; lastX=e.clientX; });
const endDrag=()=>{ dragging=false; }; cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a') keys.left=true; if(e.key==='ArrowRight'||e.key==='d') keys.right=true; if(e.key==='Escape'||e.key==='p') pause(); });
window.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='a') keys.left=false; if(e.key==='ArrowRight'||e.key==='d') keys.right=false; });
window.addEventListener('resize',resize);

/* =========================================================
   BOOT
   ========================================================= */
let lastT=performance.now();
let errCount=0;
function frame(now){ requestAnimationFrame(frame); watchPerf(now-lastT); const dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now;
  try{ update(dt); render(); drawPortraits(); errCount=0; }
  catch(e){ console.error(e); errCount++; try{ ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }catch(_){} if(errCount>90&&G.state==='play'){ errCount=0; toMenu(); } } }
resize(); sizePortraits(); setMuteUI(); setHapUI(); setGfxUI(); toMenu();
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
