<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e9fb8">
<title>SailorNana</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SailorNana">
<meta name="description" content="Sail an endless island sea, dodge sharks and nets, and stay ahead of the megalodon.">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Fredoka';src:url('fonts/fredoka.woff2') format('woff2');font-weight:300 700;font-display:swap}
:root{
  --lagoon:#2fd0cf; --deep:#0b3a6b; --coral:#ff6f7d; --gold:#ffb547; --foam:#f6fffb; --palm:#3bb273; --ink:#123047;
  --font:'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:#0b3a6b;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:var(--foam)}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ===== HUD ===== */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:none}
#hud.on{display:block}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start}
.dist{font-weight:700;font-size:34px;line-height:1;letter-spacing:.5px;text-shadow:0 3px 0 rgba(11,58,107,.55),0 0 14px rgba(11,40,70,.45)}
.dist small{font-size:18px;font-weight:600;margin-left:2px;opacity:.9}
.bestline{margin-top:3px;font-size:13px;font-weight:600;opacity:.85;text-shadow:0 1px 2px rgba(11,40,70,.8)}
.bestline:empty{display:none}
.bestline.near{color:#ffd27a;opacity:1}
.bestline.beat{color:#ffd27a;opacity:1}
.pearls{margin-top:6px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:20px;text-shadow:0 2px 0 rgba(11,58,107,.45)}
.pearl-dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 22%,#f4ecff 40%,#c9b6ea 100%);box-shadow:0 0 8px rgba(255,255,255,.7)}
.wind{margin-top:8px;width:132px}
.wind-label{font-size:13px;font-weight:600;display:flex;justify-content:space-between;text-shadow:0 1px 2px rgba(11,40,70,.8),0 0 6px rgba(11,40,70,.5)}
.wind-bar{margin-top:3px;height:11px;border-radius:8px;background:rgba(11,58,107,.45);border:2px solid rgba(246,255,251,.85);overflow:hidden}
.wind-fill{height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#9ff7ff,#ffffff);transform-origin:left center;transition:background .3s}
.wind-fill.low{background:linear-gradient(90deg,#ff6f7d,#ffb547)}
.wind-fill.full{background:linear-gradient(90deg,#ffe29a,#fff)}
.iconbtn{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:3px solid rgba(246,255,251,.9);background:rgba(11,58,107,.35);color:var(--foam);font-size:18px;font-weight:700;display:grid;place-items:center;backdrop-filter:blur(4px)}
#combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);font-weight:700;font-size:22px;color:#fff6c8;text-shadow:0 3px 0 rgba(160,60,40,.5);opacity:0;transition:opacity .25s}

/* ===== Overlays (temporary for chunk 1) ===== */
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center}
.overlay.on{display:flex}
.title{font-weight:700;font-size:clamp(46px,14vw,74px);line-height:.9;color:#fff;text-shadow:0 5px 0 #ff6f7d,0 10px 0 rgba(11,58,107,.35),0 0 24px rgba(11,40,70,.35)}
.title span{display:block;color:#ffd27a;font-size:.72em;margin-top:.08em;text-shadow:0 4px 0 #0b6f8a,0 8px 0 rgba(11,58,107,.35),0 0 18px rgba(11,40,70,.45)}
.bigbtn{margin-top:28px;border:none;border-radius:999px;padding:16px 44px;font-size:24px;font-weight:700;color:#5a2410;background:linear-gradient(#ffd27a,#ffb547);box-shadow:0 6px 0 #d9822b,0 12px 20px rgba(11,58,107,.35)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9822b}
.panel{background:rgba(11,58,107,.72);border:3px solid rgba(246,255,251,.85);border-radius:28px;padding:22px 26px;min-width:260px;backdrop-filter:blur(6px)}
.panel h2{margin:0 0 6px;font-size:28px}
.panel p{margin:4px 0;font-size:18px;opacity:.95}
.hint{margin-top:18px;font-size:15px;opacity:.85}
#pups{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.pup{align-items:center;gap:6px}
.pup img{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(11,40,70,.6))}
.pbar{width:90px;height:7px;border-radius:6px;background:rgba(11,58,107,.45);border:1.5px solid rgba(246,255,251,.85);overflow:hidden}
.pfill{height:100%;background:#fff6c8;transform-origin:left center}
#banner{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0}
#banner span{display:block;font-size:16px;font-weight:600;color:#fff6c8;text-shadow:0 2px 0 rgba(11,40,70,.5)}
#banner b{display:block;font-size:clamp(30px,9vw,46px);font-weight:700;color:#fff;text-shadow:0 4px 0 #ff6f7d,0 8px 12px rgba(11,40,70,.4)}
#banner.show{animation:bn 2.6s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translateY(-14px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes bnr{0%,85%{opacity:1}100%{opacity:0}}
.toggles{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.tgl{border:2px solid rgba(246,255,251,.85);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}

#scrStart{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 8vh)}
#scrStart .hint{margin-top:14px}
.portrait{display:block;width:clamp(96px,16vh,136px);height:clamp(96px,16vh,136px);margin:14px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff6c8 0,#ffc99a 55%,#ff9aa8 100%);border:4px solid #fff;box-shadow:0 6px 0 rgba(11,58,107,.25),0 10px 24px rgba(11,58,107,.25)}
.portrait.sm{width:100px;height:100px;margin:-66px auto 8px}
#scrOver .panel{margin-top:40px}
.btn2{margin-top:14px;border:2.5px solid rgba(246,255,251,.9);background:rgba(11,58,107,.4);color:#fff;border-radius:999px;padding:11px 26px;font-size:18px;font-weight:600;backdrop-filter:blur(4px)}
.btn2:active{transform:translateY(2px)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.best{margin:16px 0 0;font-size:18px;font-weight:600;background:rgba(11,58,107,.5);padding:5px 16px;border-radius:999px;backdrop-filter:blur(4px)}
.ver{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 14px);font-size:12px;opacity:.7}
.settings{width:min(92vw,380px);text-align:left;display:flex;flex-direction:column;gap:8px}
.settings h2{text-align:center;margin-bottom:6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.08);border:2px solid rgba(246,255,251,.35);border-radius:16px;padding:10px 14px;color:#fff;font-size:17px;font-weight:600}
.slider{flex-direction:column;align-items:stretch;gap:6px}
.slider label{display:block}
.slider input[type=range]{width:100%;accent-color:#ffd27a;height:28px;margin:0}
.settings{max-height:calc(100vh - 150px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.quick{display:flex;gap:8px;margin-top:14px}
.set.mini{padding:8px 12px;font-size:15px}
#musicStyle b{min-width:auto;background:#2fd0cf;color:#06303a}
.set small{display:block;font-size:12.5px;font-weight:400;opacity:.8;margin-top:2px}
.set b{flex:none;min-width:52px;text-align:center;border-radius:999px;padding:4px 10px;font-size:14px;background:#ffd27a;color:#5a2410}
.set[aria-pressed="false"] b{background:rgba(255,255,255,.2);color:#fff}
.installhint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:min(92vw,400px);display:flex;align-items:center;gap:10px;background:rgba(11,58,107,.82);border:2px solid rgba(246,255,251,.7);border-radius:18px;padding:10px 12px;font-size:15px;text-align:left;backdrop-filter:blur(6px)}
.installhint[hidden]{display:none}
.installhint span{flex:1}
.ihbtn{border:none;border-radius:999px;background:#ffd27a;color:#5a2410;font-weight:700;font-size:15px;padding:8px 14px}
.ihbtn[hidden]{display:none}
.ihx{border:none;background:none;color:#fff;font-size:24px;line-height:1;padding:2px 6px}
#updToast{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;display:flex;align-items:center;gap:12px;background:#0b3a6b;border:2px solid #ffd27a;border-radius:999px;padding:8px 8px 8px 16px;font-size:15px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#updToast[hidden]{display:none}
#updToast button{border:none;border-radius:999px;background:#ffd27a;color:#5a2410;font-weight:700;font-size:15px;padding:7px 14px}
@media (prefers-reduced-motion:reduce){#banner.show{animation-name:bnr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="SailorNana game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div>
      <div class="dist" id="hDist">0<small>m</small></div>
      <div class="bestline" id="hBest"></div>
      <div class="pearls"><span class="pearl-dot"></span><span id="hPearls">0</span></div>
      <div class="wind"><div class="wind-label"><span>Wind</span><span id="hWindTag"></span></div><div class="wind-bar"><div class="wind-fill" id="hWind"></div></div></div>
      <div id="pups"></div>
    </div>
    <button class="iconbtn" id="btnPause" aria-label="Pause">II</button>
  </div>
  <div id="combo"></div>
</div>
<div id="banner" aria-live="polite"><span></span><b></b></div>

<div class="overlay on" id="scrStart">
  <div class="title">Sailor<span>Nana</span></div>
  <canvas class="portrait" id="nanaHome" aria-label="Nana waving"></canvas>
  <p class="best" id="homeBest"></p>
  <button class="bigbtn" id="btnPlay">Set sail</button>
  <button class="btn2" data-open="settings">Settings</button>
  <div class="hint">Swipe to steer, hop and duck. Arrow keys work too.</div>
  <div class="installhint" id="installHint" hidden><span id="ihText"></span><button class="ihbtn" id="ihBtn" hidden>Install</button><button class="ihx" id="ihClose" aria-label="Dismiss">&times;</button></div>
  <div class="ver" id="ver"></div>
</div>
<div id="updToast" hidden><span>New version ready</span><button id="updBtn">Update</button></div>

<div class="overlay" id="scrOver">
  <div class="panel">
    <canvas class="portrait sm" id="nanaOver" aria-hidden="true"></canvas>
    <h2 id="oTitle">Chomped!</h2>
    <p id="oDist"></p>
    <p id="oPearls"></p>
  </div>
  <button class="bigbtn" id="btnAgain">Sail again</button>
  <button class="btn2" id="btnHomeOver">Home</button>
</div>

<div class="overlay" id="scrPause">
  <div class="panel"><h2>Paused</h2><p>The megalodon is waiting too.</p>
    <div class="quick"><button class="set tgl mini" data-k="music"><span>Music</span><b></b></button><button class="set tgl mini" data-k="sfx"><span>Sounds</span><b></b></button></div></div>
  <button class="bigbtn" id="btnResume">Resume</button>
  <div class="btnrow"><button class="btn2" data-open="settings">Settings</button><button class="btn2" id="btnHomePause">Home</button></div>
</div>

<div class="overlay" id="scrSettings">
  <div class="panel settings" role="group" aria-labelledby="setTitle">
    <h2 id="setTitle">Settings</h2>
    <button class="set tgl" data-k="music"><span>Music</span><b></b></button>
    <button class="set" id="musicStyle"><span>Music style<small>Tap to switch between three soundtracks.</small></span><b id="musicStyleName"></b></button>
    <button class="set tgl" data-k="sfx"><span>Sound effects</span><b></b></button>
    <div class="set slider"><label for="volMusic">Music volume</label><input type="range" id="volMusic" data-v="volMusic" min="0" max="100" step="5"></div>
    <div class="set slider"><label for="volSfx">Effects volume</label><input type="range" id="volSfx" data-v="volSfx" min="0" max="100" step="5"></div>
    <div class="set slider"><label for="volAmb">Ocean ambience<small>Soft waves in the background.</small></label><input type="range" id="volAmb" data-v="volAmb" min="0" max="100" step="5"></div>
    <button class="set tgl" data-k="haptics"><span>Vibration<small>Android only. iPhones don't allow it for web games.</small></span><b></b></button>
    <button class="set tgl" data-k="shake"><span>Screen shake</span><b></b></button>
    <button class="set tgl" data-k="hitboxes"><span>Show hitboxes<small>Red: steer around. Orange: jump. Blue: duck. The green diamond is you.</small></span><b></b></button>
  </div>
  <button class="bigbtn" id="btnCloseSettings">Done</button>
</div>

<script>
'use strict';
// ===================================================================
// === SECTION: config ===
// ===================================================================
const HEADLESS = (typeof window === 'undefined') || !!window.__HEADLESS__;
const CFG = {
  step: 1/120,
  v0: 16, vAdd: 20, vTau: 3200,        // speed = v0 + vAdd*(1-exp(-d/vTau))
  gap0: 1.25, gap1: 0.70, diffDist: 6000, // seconds between obstacle rows, easy -> hard
  jumpH: 2.0, jumpT: 0.62, slam: 34,
  duckT: 0.58, turnT: 0.12, jumpBuf: 0.18,
  windDrain0: 2.4, windDrain1: 3.8, gust: 24, gustEvery0: 4.2, gustEvery1: 5.2,
  megHold: 8, windEmptyLimit: 6, invuln: 1.3,
  intro: { rock: 0, debris: 220, wall: 380, rope: 520, shark: 820, whirl: 3000 },
  powerStart: 380, powerEvery0: 11, powerEvery1: 15, boostMul: 1.45,
  dur: { turtle: 14, magnet: 10, wave: 4, kite: 6 },
};
const LW = 3, CB = 13, ZMAX = 150, PZB = -0.3, PZF = 0.6;

// ===================================================================
// === SECTION: utils ===
// ===================================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function hex(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(c, a){ return a === undefined ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function mix(a, b, t){ return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

// ===================================================================
// === SECTION: zones & palettes ===
// ===================================================================
const ZONES = [
  { name:'Sunrise Lagoon', at:0,    c:{skyTop:'#ff8fa3',skyMid:'#ffb88a',skyHor:'#ffe3a3',sun:'#fff6c8',seaHor:'#9ff0e6',seaMid:'#2fd0cf',seaNear:'#0e9fb8',lane:'#c9fff6',rockA:'#8a6f86',rockB:'#c7a2ae',isle:'#3d8f8a',cloud:'#fff0e6'}, night:0, glow:0, rain:0 },
  { name:'Coral Reef',     at:800,  c:{skyTop:'#4fc3ff',skyMid:'#8fe0ff',skyHor:'#e8fbff',sun:'#fffbe0',seaHor:'#8ff7e4',seaMid:'#1fd6c4',seaNear:'#0aa7b5',lane:'#d6fff6',rockA:'#e8577a',rockB:'#ffab9e',isle:'#2f9a6a',cloud:'#ffffff'}, night:0, glow:0, rain:0 },
  { name:'Open Ocean',     at:1800, c:{skyTop:'#2b7fe0',skyMid:'#6fb6ff',skyHor:'#d4ecff',sun:'#ffffff',seaHor:'#5ab4ee',seaMid:'#1a6fc4',seaNear:'#0b4a94',lane:'#a9dcff',rockA:'#4b5a78',rockB:'#8193b4',isle:'#2a5f8a',cloud:'#ffffff'}, night:0, glow:0, rain:0 },
  { name:'Stormy Seas',    at:3000, c:{skyTop:'#353a58',skyMid:'#575c7e',skyHor:'#9095b0',sun:'#cfd3e6',seaHor:'#7890a6',seaMid:'#3a5a78',seaNear:'#1f3650',lane:'#b3c8dc',rockA:'#3b3d4f',rockB:'#666a84',isle:'#2b3346',cloud:'#8a8fa8'}, night:0, glow:0, rain:1 },
  { name:'Glowing Night Sea', at:4500, c:{skyTop:'#070b26',skyMid:'#171c52',skyHor:'#3a2f72',sun:'#eef3ff',seaHor:'#1d2c70',seaMid:'#0c1a48',seaNear:'#050c2a',lane:'#3ff5e0',rockA:'#1c2140',rockB:'#34427a',isle:'#0f1636',cloud:'#2a2f60'}, night:1, glow:1, rain:0 },
];
const LOOP = 6000;
ZONES.forEach(z => { z.rgb = {}; for (const k in z.c) z.rgb[k] = hex(z.c[k]); });
const PAL = { night:0, glow:0, rain:0 };
function zoneInfo(dist){
  const voyage = Math.floor(dist / LOOP) + 1;
  const d = dist % LOOP;
  let i = 0; for (let k = 0; k < ZONES.length; k++) if (d >= ZONES[k].at) i = k;
  return { i, voyage, d };
}
function updatePalette(dist){
  const { i, voyage, d } = zoneInfo(dist);
  const cur = ZONES[i];
  const prev = i > 0 ? ZONES[i - 1] : (voyage > 1 ? ZONES[ZONES.length - 1] : ZONES[0]);
  const t = clamp((d - cur.at) / 160, 0, 1);
  for (const k in cur.rgb) PAL[k] = mix(prev.rgb[k], cur.rgb[k], t);
  PAL.night = lerp(prev.night, cur.night, t); PAL.glow = lerp(prev.glow, cur.glow, t); PAL.rain = lerp(prev.rain, cur.rain, t);
  PAL.zone = i;
}

// ===================================================================
// === SECTION: state ===
// ===================================================================
const S = {};
let RNG = Math.random;
const PU_KINDS = ['turtle','magnet','wave','kite'];
const PU_KEY = { turtle:'shield', magnet:'magnet', wave:'boost', kite:'kite' };
function newRun(opts = {}){
  RNG = opts.seed != null ? mulberry32(opts.seed) : Math.random;
  for (const k in S) delete S[k];
  Object.assign(S, {
    mode: 'run', t: 0, dist: 0, speed: CFG.v0, diff: 0,
    lane: 0, prevLane: 0, x: 0, xFrom: 0, laneT: 1, lean: 0, tug: 0,
    y: 0, vy: 0, air: false, slam: false, duckT: -1, jumpBuf: 0,
    wind: 100, megT: 0, windEmptyT: 0, invuln: 0, graceT: 0, hits: 0,
    shield: 0, magnet: 0, boost: 0, kite: 0,
    laneAt: -9, jumpAt: -9, duckAt: -9, pstreak: 0, lastPearlT: -9,
    pearls: 0, combo: 0, bestCombo: 0,
    objs: [], q: [],
    genZ: 70, nextGust: 140, nextPower: CFG.powerStart, wallUntil: { '-1': -1, '0': -1, '1': -1 },
    stats: { sharks:0, debris:0, ropes:0, rocks:0, gusts:0, dodges:0, close:0, powers:0, kites:0, whirls:0 },
    zoneIdx: 0, voyage: 1, best: opts.best || 0, newBest: false,
    ev: [], caughtT: 0, why: '',
    boat: Object.assign({ turn: CFG.turnT, speedMul: 1 }, opts.boat || {}),
    mods: Object.assign({ durMul: 1, magnetMul: 1, headStart: 0 }, opts.mods || {}),
  });
  if (S.best > 150) addObj({ kind:'bestbuoy', lane: 1.95, wz: S.best, len: 0, deco: true });
  if (S.mods.headStart > 0){ S.boost = S.mods.headStart / (CFG.v0 * CFG.boostMul); S.headStart = true; }
}

// ===================================================================
// === SECTION: input ===
// ===================================================================
function act(a){ if (S.mode === 'run') S.q.push(a); }
function processInput(){
  while (S.q.length){
    const a = S.q.shift();
    if (a === 'left' || a === 'right'){
      const nl = clamp(S.lane + (a === 'left' ? -1 : 1), -1, 1);
      if (nl !== S.lane){
        S.prevLane = S.lane; S.xFrom = S.x; S.lane = nl; S.laneT = 0; S.laneAt = S.t;

}

// ---- sky ----
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: hash(i + 11) , y: 0.25 + hash(i + 31) * 0.55, w: 0.5 + hash(i + 51) * 0.7, sp: 0.004 + hash(i + 71) * 0.008 }));

      c.fillStyle = rgb(PAL.sun, 0.05 * ra); c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a - wd) * len, Math.sin(a - wd) * len); c.lineTo(Math.cos(a + wd) * len, Math.sin(a + wd) * len); c.fill(); }

    c.beginPath(); c.ellipse(x + w * 0.04, y + w * 0.06, w * 1.02, w * 0.2, 0, 0, 7); c.fill();
    c.fillStyle = rgb(PAL.cloud, 0.8 - PAL.night * 0.4);
    c.beginPath(); c.ellipse(x, y, w, w * 0.22, 0, 0, 7); c.ellipse(x - w * 0.35, y - w * 0.12, w * 0.4, w * 0.24, 0, 0, 7); c.ellipse(x + w * 0.25, y - w * 0.16, w * 0.46, w * 0.28, 0, 0, 7); c.ellipse(x + w * 0.62, y - w * 0.04, w * 0.26, w * 0.15, 0, 0, 7); c.fill();
    c.fillStyle = `rgba(255,255,255,${0.4 * (1 - PAL.night)})`;
    c.beginPath(); c.ellipse(x + w * 0.18, y - w * 0.3, w * 0.28, w * 0.09, -0.1, 0, 7); c.ellipse(x - w * 0.42, y - w * 0.24, w * 0.18, w * 0.07, -0.1, 0, 7); c.fill();

    c.beginPath(); c.moveTo(cx0 - w, HY + 1); c.quadraticCurveTo(cx0 - w * 0.3, HY - h * 2, cx0, HY - h); c.quadraticCurveTo(cx0 + w * 0.4, HY - h * 1.6, cx0 + w, HY + 1); c.fill();

function drawPalmFlat(c, x, y, h, col){

}

// ---- sea ----
function drawSea(c){
  const g = c.createLinearGradient(0, HY, 0, H);
  g.addColorStop(0, rgb(PAL.seaHor)); g.addColorStop(0.3, rgb(PAL.seaMid)); g.addColorStop(1, rgb(PAL.seaNear));
  c.fillStyle = g; c.fillRect(-20, HY, W + 40, H - HY + 20);
  // horizon haze
  const hz = c.createLinearGradient(0, HY - 6, 0, HY + H * 0.05); hz.addColorStop(0, rgb(PAL.skyHor, 0.8)); hz.addColorStop(1, rgb(PAL.skyHor, 0));
  c.fillStyle = hz; c.fillRect(-20, HY - 6, W + 40, H * 0.05 + 6);
  const dist = S.dist || 0;
  // lane channel tint
  quad(c, -1.5 * LW, 1.5 * LW, -CB + 0.5, ZMAX, rgb(PAL.lane, 0.13));
  // foam streaks moving toward the camera
  const band = 5, first = Math.ceil(dist / band);
  const t = performance.now() / 1000;
  for (let i = 0; i < ZMAX / band + 2; i++){
    const idx = first + i - 2, z = idx * band - dist; if (z > ZMAX) break; if (z < -CB + 0.6) continue;
    const a = fog(z) * (0.10 + 0.22 * (1 - z / ZMAX));
    for (let k = 0; k < 6; k++){
      const h = hash(idx * 13 + k * 101);
      const x0 = (h - 0.5) * 34, len = 1.2 + hash(idx * 7 + k) * 3.2;
      proj(x0, 0, z); const ax = P.x, ay = P.y, s = P.s;
      proj(x0 + len, 0, z);
      c.strokeStyle = rgb(k % 3 === 0 ? PAL.lane : [255,255,255], a); c.lineWidth = Math.max(1, s * 0.09);
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(P.x, P.y); c.stroke();
      if (PAL.glow > 0.1 && k < 2){ c.fillStyle = `rgba(80,255,230,${0.7 * PAL.glow * fog(z)})`; c.beginPath(); c.arc(ax, ay, Math.max(1, s * 0.07), 0, 7); c.fill(); }
      else if (PAL.night < 0.5 && k === 5 && z > 30){ const tw = 0.5 + 0.5 * Math.sin(t * 6 + idx); c.fillStyle = `rgba(255,255,240,${0.8 * tw * fog(z)})`; c.fillRect(ax, ay - 1, 2, 2); }
    }
  }
  // glittering sun / moon path on the water
  { const gx = CX + GW * 0.2 - CAM.x * 2, bright = (1 - PAL.rain * 0.7) * (PAL.glow > 0.5 ? 0.7 : 1);
    const col = PAL.night > 0.5 ? [215, 232, 255] : PAL.sun;
    for (let i = 0; i < 80; i++){
      const u = hash(i * 7 + 3), z = lerp(ZMAX * 0.95, 12, Math.pow(u, 0.55));
      const tw = hash(i * 13 + Math.floor(t * 6 + i * 0.37)); if (tw < 0.45) continue;
      proj(0, 0, z); const sc = P.s, yy = P.y, spread = (0.5 + (1 - z / ZMAX) * 4.5) * sc;
      const xx = gx + (hash(i * 31) - 0.5) * 2 * spread, w = Math.max(2, 0.55 * sc * (0.4 + tw));
      c.fillStyle = rgb(col, Math.min(0.9, bright * (tw - 0.45) * 1.8 * fog(z))); c.fillRect(xx - w / 2, yy - 1, w, Math.max(1.5, 0.05 * sc));
    }
    c.fillStyle = rgb(PAL.sun, 0.35 * (1 - PAL.rain)); c.fillRect(-20, HY - 1, W + 40, 1.5);
  }
  // lane dividers
  const seg = 7, f2 = Math.floor(dist / seg);
  for (let i = -1; i < ZMAX / seg + 1; i++){
    const z0 = (f2 + i) * seg - dist, z1 = z0 + 3.2; if (z1 < -CB + 0.6) continue;
    const a = fog(z0) * 0.5;
    for (const lx of [-0.5 * LW, 0.5 * LW]) quad(c, lx - 0.07, lx + 0.07, Math.max(z0, -CB + 0.6), z1, rgb(PAL.lane, a));
  }
  for (const lx of [-1.5 * LW, 1.5 * LW]) quad(c, lx - 0.1, lx + 0.1, -CB + 0.6, ZMAX, rgb(PAL.lane, 0.28));
}
function quad(c, x0, x1, z0, z1, col){
  proj(x0, 0, z0); const ax = P.x, ay = P.y; proj(x1, 0, z0); const bx = P.x;
  proj(x1, 0, z1); const cx2 = P.x, cy = P.y; proj(x0, 0, z1); const dx = P.x;
  c.fillStyle = col; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, ay); c.lineTo(cx2, cy); c.lineTo(dx, cy); c.closePath(); c.fill();
}
function drawLaneGlow(c){
  if (S.mode !== 'run' || S.kite > 0) return;
  const x0 = S.lane * LW - LW / 2 + 0.2, x1 = S.lane * LW + LW / 2 - 0.2;
  proj(x0, 0, -1.5); const ax = P.x, ay = P.y; proj(x1, 0, -1.5); const bx = P.x;
  proj(x1, 0, 40); const cx2 = P.x, cy = P.y; proj(x0, 0, 40); const dx = P.x;
  const g = c.createLinearGradient(0, ay, 0, cy);
  g.addColorStop(0, rgb(PAL.lane, 0.2)); g.addColorStop(0.6, rgb(PAL.lane, 0.06)); g.addColorStop(1, rgb(PAL.lane, 0));
  c.fillStyle = g; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, ay); c.lineTo(cx2, cy); c.lineTo(dx, cy); c.closePath(); c.fill();
}
function outlineQuad(c, x0, x1, z0, z1, col){
  const pts = [[x0, z0], [x1, z0], [x1, z1], [x0, z1]].map(([x, z]) => { proj(x, 0.05, Math.max(z, -CB + 0.7)); return [P.x, P.y]; });
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath();
  c.globalAlpha = 0.18; c.fillStyle = col; c.fill(); c.globalAlpha = 1; c.strokeStyle = col; c.lineWidth = 2; c.stroke();
}
function drawHitboxes(c){
  if (!SAVE.hitboxes || S.mode !== 'run') return;
  for (const o of S.objs){
    if (o.done || o.deco || o.ghost || o.flung) continue;
    if (!['rock','wall','debris','rope','shark','whirl'].includes(o.kind)) continue;
    const z = o.wz - S.dist; if (z > 70 || z < -4) continue;
    let x0, x1, col;
    if (o.kind === 'rope'){ x0 = (o.a - HB.rope) * LW; x1 = (o.b + HB.rope) * LW; col = '#5ab4ff'; }
    else {
      const k = BLOCK[o.kind] ? HB.block : o.kind === 'whirl' ? HB.whirl : HB.other;
      x0 = (o.lane - k) * LW; x1 = (o.lane + k) * LW;
      col = BLOCK[o.kind] ? '#ff5a6e' : (o.kind === 'debris' || o.kind === 'whirl') ? '#ffb547' : '#5ab4ff';
    }
    outlineQuad(c, x0, x1, z - o.len / 2 - PZF, z + o.len / 2 - PZB, col);
  }

  proj(S.x * LW, 0.05, 0); const s = P.s;
  c.fillStyle = '#3dff8a'; c.strokeStyle = '#0b3a2a'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(P.x, P.y - 0.25 * s); c.lineTo(P.x + 0.25 * s, P.y); c.lineTo(P.x, P.y + 0.25 * s); c.lineTo(P.x - 0.25 * s, P.y); c.closePath(); c.fill(); c.stroke();
}
// ---- side scenery ----
function sceneryItems(list){
  const step = 20, dist = S.dist || 0, f = Math.floor(dist / step);
  for (let i = 0; i < ZMAX / step + 1; i++){
    const idx = f + i, z = idx * step - dist; if (z < -CB + 1 || z > ZMAX) continue;
    const h = hash(idx * 31 + 7); if (h < 0.3) continue;
    const side = hash(idx * 17) < 0.5 ? -1 : 1;
    list.push({ z, sc: true, idx, side, h, x: side * (LW * 1.5 + 3.5 + hash(idx * 5) * 9) });
  }
}
function drawScenery(c, it){
  const a = fog(it.z); if (a <= 0) return;
  c.globalAlpha = a;
  proj(it.x, 0, it.z); const x = P.x, y = P.y, s = P.s;
  const zone = PAL.zone, typ = it.h;
  if (zone === 1 && typ < 0.7){ // coral heads
    c.fillStyle = rgb(PAL.rockA); c.beginPath(); c.ellipse(x, y, 1.6 * s, 0.5 * s, 0, Math.PI, 0); c.fill();
    c.strokeStyle = rgb(PAL.rockB); c.lineWidth = Math.max(1, 0.18 * s); c.lineCap = 'round';
    for (let k = 0; k < 4; k++){ const bx = x + (k - 1.5) * 0.7 * s; c.beginPath(); c.moveTo(bx, y - 0.3 * s); c.quadraticCurveTo(bx - 0.3 * s, y - 1.2 * s, bx + 0.2 * s, y - (1.4 + hash(it.idx + k) * 0.8) * s); c.stroke(); }
  } else if (typ < 0.55 && zone !== 4){ // sandbar with palms
    c.fillStyle = zone === 3 ? '#8a8472' : '#ffe2a8'; c.beginPath(); c.ellipse(x, y, 3.2 * s, 0.7 * s, 0, Math.PI, 0); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x, y, 3.4 * s, 0.25 * s, 0, 0, Math.PI); c.fill();
    drawPalm(c, x - 0.6 * s * it.side, y - 0.4 * s, 5.2 * s, it.side, it.idx);
    if (typ > 0.42) drawPalm(c, x + 1.1 * s * it.side, y - 0.3 * s, 3.8 * s, -it.side, it.idx + 3);
  } else if (typ < 0.8){ // marker buoy
    const bob = Math.sin(performance.now() / 400 + it.idx) * 0.12 * s;
    c.fillStyle = '#ff6f7d'; c.fillRect(x - 0.25 * s, y - 1.6 * s + bob, 0.5 * s, 1.4 * s);
    c.fillStyle = '#fff'; c.fillRect(x - 0.25 * s, y - 1.1 * s + bob, 0.5 * s, 0.35 * s);
    c.fillStyle = PAL.night > 0.5 ? '#7ffff0' : '#ffe27a'; c.beginPath(); c.arc(x, y - 1.8 * s + bob, 0.2 * s, 0, 7); c.fill();
    c.fillStyle = '#ff6f7d'; c.beginPath(); c.ellipse(x, y - 0.1 * s + bob, 0.6 * s, 0.3 * s, 0, 0, 7); c.fill();
  } else { // small rock islet
    c.fillStyle = rgb(PAL.rockA); c.beginPath(); c.moveTo(x - 1.8 * s, y); c.quadraticCurveTo(x - 1.2 * s, y - 2.4 * s, x, y - 2.6 * s); c.quadraticCurveTo(x + 1.4 * s, y - 2 * s, x + 1.9 * s, y); c.fill();
    c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(x, y, 2.1 * s, 0.25 * s, 0, 0, Math.PI); c.fill();
  }
  c.globalAlpha = 1;
}
function drawPalm(c, x, y, h, lean, seed){
  const tx = x + lean * h * 0.28, ty = y - h;
  c.strokeStyle = PAL.night > 0.5 ? '#3a2f58' : '#9a6b43'; c.lineWidth = Math.max(1.5, h * 0.07); c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * h * 0.02, y - h * 0.6, tx, ty); c.stroke();
  const t = performance.now() / 900 + seed;
  c.fillStyle = PAL.night > 0.5 ? '#1f5f5a' : PAL.zone === 3 ? '#3d6b52' : '#34b36b';
  for (let k = 0; k < 6; k++){
    const a = -Math.PI / 2 + (k - 2.5) * 0.55 + Math.sin(t + k) * 0.05;
    c.save(); c.translate(tx, ty); c.rotate(a); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(h * 0.25, -h * 0.1, h * 0.46, h * 0.1); c.quadraticCurveTo(h * 0.24, h * 0.02, 0, 0); c.fill(); c.restore();
  }
  c.fillStyle = '#7a4d2a'; c.beginPath(); c.arc(tx, ty + h * 0.03, h * 0.04, 0, 7); c.fill();
}

// ---- obstacles & pickups ----
function drawObj(c, o, z){
  const a = fog(z); if (a <= 0) return;
  c.globalAlpha = a;
  const lx = o.lane * LW;
  switch (o.kind){
    case 'rock': drawRock(c, lx, z, 2.5, o.h, o.seed); break;
    case 'stack': drawRock(c, lx, z, 2.7, o.h, o.seed); break;
    case 'debris': drawDebris(c, lx, z, o); break;
    case 'rope': drawRope(c, o, z); break;
    case 'shark': drawShark(c, o, z); break;
    case 'pearl': {
      proj(lx, o.y + Math.sin(performance.now() / 300 + o.wz) * 0.08, z);
      if (o.y > 3){
        const hr = 1.2 * P.s, hg = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, hr);
        hg.addColorStop(0, 'rgba(255,240,190,.75)'); hg.addColorStop(1, 'rgba(255,240,190,0)');
        c.fillStyle = hg; c.beginPath(); c.arc(P.x, P.y, hr, 0, 7); c.fill();
        const r = 0.7 * P.s; c.drawImage(pearlSprite, P.x - r, P.y - r, r * 2, r * 2);
      } else { const r = 0.55 * P.s; c.drawImage(pearlSprite, P.x - r, P.y - r, r * 2, r * 2); }
      if (hash(Math.floor(performance.now() / 220) + Math.floor(o.wz * 7)) > 0.82 && P.s > 5){
        const r2 = 0.34 * P.s, sx2 = P.x + r2 * 0.7, sy2 = P.y - r2 * 0.8;
        c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = Math.max(1, 0.05 * P.s); c.lineCap = 'round';
        c.beginPath(); c.moveTo(sx2, sy2 - r2 * 0.6); c.lineTo(sx2, sy2 + r2 * 0.6); c.moveTo(sx2 - r2 * 0.6, sy2); c.lineTo(sx2 + r2 * 0.6, sy2); c.stroke();
      }
      break; }
    case 'gust': drawGust(c, lx, z); break;
    case 'power': drawPower(c, lx, z, o); break;
    case 'whirl': drawWhirl(c, lx, z, o); break;
    case 'bestbuoy': drawBestBuoy(c, lx, z); break;
  }
  c.globalAlpha = 1;
}
function drawRock(c, x, z, w, h, seed){
  proj(x, 0, z); const bx = P.x, by = P.y, s = P.s;
  const hw = w / 2 * s, hh = h * s;
  const g = c.createLinearGradient(0, by - hh, 0, by);
  g.addColorStop(0, rgb(PAL.rockB)); g.addColorStop(1, rgb(PAL.rockA));
  c.fillStyle = g; c.beginPath(); c.moveTo(bx - hw, by);
  const n = 7;

    c.lineTo(bx + Math.cos(ang) * hw * r, by - Math.sin(ang) * hh * r * (0.75 + 0.25 * Math.sin(t * Math.PI)));
  }
  c.lineTo(bx + hw, by); c.closePath(); c.fill();

const VERSION = '0.6 test';
const PWA = true;
const SAVE = { best: 0, music: true, sfx: true, haptics: true, shake: true, hitboxes: false, musicStyle: 'island', volMusic: 70, volSfx: 80, volAmb: 40 };
function loadSave(){ try { const d = JSON.parse(localStorage.getItem('sailornana_v1') || '{}'); Object.assign(SAVE, d); } catch (e) {} }
function writeSave(){ try { localStorage.setItem('sailornana_v1', JSON.stringify(SAVE)); } catch (e) {} }

// ===================================================================
// === SECTION: HUD & screens (browser) ===
// ===================================================================
const UI = {};
let lastHud = {};
function hud(){
  const d = Math.floor(S.dist), p = S.pearls, w = Math.round(S.wind);
  if (d !== lastHud.d){
    UI.dist.firstChild.nodeValue = d.toLocaleString(); lastHud.d = d;
    let txt = '', cls = 'bestline';
    if (S.best > 0){
      const rem = S.best - d;
      if (rem <= 0){ txt = 'New best!'; cls += ' beat'; }
      else if (rem <= 250){ txt = `Best in ${rem.toLocaleString()} m`; cls += ' near'; }
      else txt = `Best ${S.best.toLocaleString()} m`;
    }
    if (txt !== lastHud.bt){ UI.best.textContent = txt; UI.best.className = cls; lastHud.bt = txt; }
  }
  if (p !== lastHud.p){ UI.pearls.textContent = p; lastHud.p = p; }
  if (w !== lastHud.w){ UI.wind.style.transform = `scaleX(${w / 100})`; UI.wind.className = 'wind-fill' + (w < 25 ? ' low' : w >= 70 ? ' full' : ''); UI.windTag.textContent = w >= 70 ? 'Full sail ×2' : w < 25 ? 'Low!' : ''; lastHud.w = w; }
  const cb = S.combo >= 5 ? `Combo ${S.combo}` : '';
  if (cb !== lastHud.cb){ UI.combo.textContent = cb; UI.combo.style.opacity = cb ? 1 : 0; lastHud.cb = cb; }
  for (const sub of PU_KINDS){
    const rem = S[PU_KEY[sub]], el = UI.pups[sub];
    const on = rem > 0;
    if (on !== el.on){ el.box.style.display = on ? 'flex' : 'none'; el.on = on; }
    if (on) el.fill.style.transform = `scaleX(${clamp(rem / (CFG.dur[sub] * S.mods.durMul), 0, 1)})`;
  }
}
let bannerTimer = 0;
function showBanner(name, sub){
  const b = UI.banner; b.querySelector('b').textContent = name; b.querySelector('span').textContent = sub || 'Now entering';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
let curScreen = 'scrStart';
function show(id){ curScreen = id; for (const s of document.querySelectorAll('.overlay')) s.classList.toggle('on', s.id === id); }
function startRun(){
  AU.init(); AU.resume(); AU.sfx('click');
  newRun({ best: SAVE.best }); installFx(); PARTS.length = 0; TEXTS.length = 0; CONF.length = 0; REACT.t = 0; reactPos = null; nanaReact('determined', 1.5, 1); megVis = 0; lastHud = {};
  show(null); UI.hud.classList.add('on');
}
function pauseGame(){ if (S.mode !== 'run') return; S.mode = 'paused'; show('scrPause'); syncToggles(); AU.pauseMode(true); }
function resumeGame(){ if (S.mode !== 'paused') return; S.mode = 'run'; show(null); acc = 0; AU.pauseMode(false); }
function endRun(){
  UI.hud.classList.remove('on');
  const d = Math.floor(S.dist);
  const nb = d > SAVE.best;
  if (nb){ SAVE.best = d; writeSave(); }
  document.getElementById('oDist').textContent = `${d.toLocaleString()} m sailed${nb ? ' · new best!' : ''}`;
  document.getElementById('oPearls').textContent = `${S.pearls} pearls · best combo ${S.bestCombo}`;
  document.getElementById('oTitle').textContent = S.why === 'wind' ? 'Out of wind, and the megalodon caught up' : 'Chomped by the megalodon!';
  OVERFACE.expr = nb ? 'joy' : S.why === 'wind' ? 'sad' : 'dizzy'; OVERFACE.pose = nb ? 'cheer' : 'none';
  if (nb) confetti(90);
  show('scrOver'); S.mode = 'over'; megVis = 0; S.objs = [];
}
function syncToggles(){
  for (const r of document.querySelectorAll('input[data-v]')) r.value = SAVE[r.dataset.v];
  const ms = document.getElementById('musicStyle'); if (ms) document.getElementById('musicStyleName').textContent = AU.STYLES[SAVE.musicStyle] ? AU.STYLES[SAVE.musicStyle].name : AU.STYLES.island.name;
  for (const b of document.querySelectorAll('.tgl')){
    const on = !!SAVE[b.dataset.k];
    b.setAttribute('aria-pressed', on); b.querySelector('b').textContent = on ? 'On' : 'Off';
  }
}
let settingsFrom = 'scrStart';
function openSettings(){ settingsFrom = S.mode === 'paused' ? 'scrPause' : 'scrStart'; syncToggles(); show('scrSettings'); }
function closeSettings(){ show(settingsFrom); }
function updateHome(){
  document.getElementById('homeBest').textContent = SAVE.best > 0 ? `Best: ${SAVE.best.toLocaleString()} m` : 'Your first voyage awaits';
  document.getElementById('ver').textContent = `v${VERSION}`;
}
function goHome(){
  if (S.mode === 'paused' && Math.floor(S.dist) > SAVE.best){ SAVE.best = Math.floor(S.dist); writeSave(); }
  UI.hud.classList.remove('on');
  newRun(); S.mode = 'home'; S.objs = []; megVis = 0; cloudA = 0; PARTS.length = 0; TEXTS.length = 0;
  updateHome(); show('scrStart'); AU.pauseMode(false);
}
// ===================================================================
// === SECTION: controls (browser) ===
// ===================================================================
function installControls(){
  let sx = 0, sy = 0, fired = false, tid = null;
  const TH = 22;
  const start = (x, y, id) => { sx = x; sy = y; fired = false; tid = id; };
  const move = (x, y) => {
    if (fired) return;
    const dx = x - sx, dy = y - sy;
    if (Math.abs(dx) < TH && Math.abs(dy) < TH) return;
    fired = true;
    if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right'); else act(dy < 0 ? 'up' : 'down');
  };
  cv.addEventListener('touchstart', e => { AU.resume(); const t = e.changedTouches[0]; start(t.clientX, t.clientY, t.identifier); e.preventDefault(); }, { passive:false });
  cv.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === tid) move(t.clientX, t.clientY); e.preventDefault(); }, { passive:false });
  cv.addEventListener('touchend', e => { e.preventDefault(); }, { passive:false });
  let md = false;
  cv.addEventListener('mousedown', e => { md = true; start(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (md) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { md = false; });
  window.addEventListener('keydown', e => {
    const k = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', a:'left', d:'right', w:'up', s:'down', ' ':'up' }[e.key];
    if (k){ act(k); e.preventDefault(); }
    if (document.getElementById('scrSettings').classList.contains('on')){ if (e.key === 'Escape') closeSettings(); return; }
    if (e.key === 'Escape' || e.key === 'p') (S.mode === 'paused' ? resumeGame : pauseGame)();
    if (e.key === 'm'){ const v = !(SAVE.music || SAVE.sfx); AU.setOn('music', v); AU.setOn('sfx', v); syncToggles(); }
  });
}

// ===================================================================
// === SECTION: installable app (service worker, install hint, updates) ===
// ===================================================================
function setupPWA(){
  if (!PWA) return;
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && window.isSecureContext){
    let accepted = false, waiting = null;
    const toast = document.getElementById('updToast');
    const offer = w => { waiting = w; };
    setInterval(() => { if (waiting && !accepted && S.mode !== 'run' && S.mode !== 'caught') toast.hidden = false; }, 1000);
    document.getElementById('updBtn').onclick = () => { accepted = true; toast.hidden = true; if (waiting) waiting.postMessage('skip'); };
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (accepted) location.reload(); });
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
  if (standalone || SAVE.hideInstall) return;
  const hint = document.getElementById('installHint'), txt = document.getElementById('ihText'), btn = document.getElementById('ihBtn');
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  const showHint = (text, withBtn) => { txt.textContent = text; btn.hidden = !withBtn; hint.hidden = false; };
  if (ios) showHint(/crios|fxios|edgios/i.test(ua) ? 'For the full app, open this page in Safari, tap Share, then Add to Home Screen.' : 'Play it like an app: tap Share, then Add to Home Screen.', false);
  else {
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; showHint('Install SailorNana as an app for full screen play.', true); });
    if (/android/i.test(ua)) setTimeout(() => { if (!deferred) showHint('Play it like an app: open the Chrome menu, then Install app.', false); }, 3000);
  }
  btn.onclick = async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; hint.hidden = true; };
  document.getElementById('ihClose').onclick = () => { SAVE.hideInstall = true; writeSave(); hint.hidden = true; };
  window.addEventListener('appinstalled', () => { hint.hidden = true; });
}

// ===================================================================
// === SECTION: boot & loop (browser) ===
// ===================================================================
let acc = 0, lastTs = 0;
function frame(ts){
  requestAnimationFrame(frame);
  let dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
  if (dt > 0.1) dt = 0.1;
  if (S.mode === 'run' || S.mode === 'caught'){
    acc += dt; let n = 0;
    while (acc >= CFG.step && n < 12){ step(CFG.step); acc -= CFG.step; n++; }
    if (S.mode === 'run') hud();
    if (S.mode === 'caught' && S.caughtT > 3.0) endRun();
  } else if (S.mode === 'home' || S.mode === 'over'){
    S.dist += 9 * dt; S.t += dt;
  }
  render(dt);
  drawPortraits();
}
function boot(){
  loadSave();
  cv = document.getElementById('game'); ctx = cv.getContext('2d');
  FONT = getComputedStyle(document.documentElement).getPropertyValue('--font').trim() || 'sans-serif';
  UI.hud = document.getElementById('hud'); UI.dist = document.getElementById('hDist'); UI.pearls = document.getElementById('hPearls');
  UI.wind = document.getElementById('hWind'); UI.windTag = document.getElementById('hWindTag'); UI.combo = document.getElementById('combo');
  UI.banner = document.getElementById('banner'); UI.best = document.getElementById('hBest'); UI.nanaHome = document.getElementById('nanaHome'); UI.nanaOver = document.getElementById('nanaOver'); UI.pauseBtn = document.getElementById('btnPause');
  window.addEventListener('resize', () => { reactPos = null; });
  layout(); makeSprites(); makeIcons(); installFx(); installControls();
  UI.pups = {};
  const wrap = document.getElementById('pups');
  for (const sub of PU_KINDS){
    const box = document.createElement('div'); box.className = 'pup'; box.style.display = 'none';
    const img = document.createElement('img'); img.src = ICONS[sub].toDataURL(); img.alt = '';
    const bar = document.createElement('div'); bar.className = 'pbar'; const fill = document.createElement('div'); fill.className = 'pfill'; bar.appendChild(fill);
    box.append(img, bar); wrap.appendChild(box); UI.pups[sub] = { box, fill, on: false };
  }
  window.addEventListener('resize', layout);
  document.addEventListener('visibilitychange', () => { if (document.hidden){ pauseGame(); AU.suspend(); } else AU.resume(); });
  window.addEventListener('pointerdown', () => { AU.init(); AU.resume(); }, { once: true });
  document.getElementById('btnPlay').onclick = startRun;
  document.getElementById('btnAgain').onclick = startRun;
  document.getElementById('btnPause').onclick = pauseGame;
  document.getElementById('btnResume').onclick = resumeGame;
  for (const b of document.querySelectorAll('.tgl')) b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'music' || k === 'sfx') AU.setOn(k, !SAVE[k]); else { SAVE[k] = !SAVE[k]; writeSave(); }
    if (k === 'haptics' && SAVE.haptics) vib(20);
    syncToggles(); AU.sfx('click');
  };
  for (const b of document.querySelectorAll('[data-open="settings"]')) b.onclick = () => { AU.init(); AU.sfx('click'); openSettings(); };
  document.getElementById('musicStyle').onclick = () => {
    const order = ['island', 'steel', 'chill'], i = order.indexOf(SAVE.musicStyle);
    SAVE.musicStyle = order[(i + 1) % order.length]; writeSave();
    AU.init(); AU.resume(); AU.motifTheme = -1; AU.bar = 0; AU.step = 0;
    if (!SAVE.music){ AU.setOn('music', true); }
    AU.sfx('click'); syncToggles();
  };
  for (const r of document.querySelectorAll('input[data-v]')){
    r.oninput = () => {
      const k = r.dataset.v; SAVE[k] = +r.value;
      if (k === 'volMusic' && SAVE[k] > 0 && !SAVE.music) SAVE.music = true;
      if (k === 'volSfx' && SAVE[k] > 0 && !SAVE.sfx) SAVE.sfx = true;
      AU.init(); AU.resume(); AU.applyGains(); syncToggles();
    };
    r.onchange = () => { writeSave(); if (r.dataset.v === 'volSfx') AU.sfx('pearl', 3); };
  }
  document.getElementById('btnCloseSettings').onclick = () => { AU.sfx('click'); closeSettings(); };
  document.getElementById('btnHomePause').onclick = () => { AU.sfx('click'); goHome(); };
  document.getElementById('btnHomeOver').onclick = () => { AU.sfx('click'); goHome(); };
  updateHome();
  setupPWA();
  syncToggles();
  newRun(); S.mode = 'home'; S.objs = [];
  requestAnimationFrame(frame);
}
if (!HEADLESS) boot();

</script>
